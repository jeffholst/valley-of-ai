<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <!-- Golden-hour sky gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d2340"/>
      <stop offset="55%" stop-color="#2d6094"/>
      <stop offset="100%" stop-color="#f9c784"/>
    </linearGradient>
    <!-- Golden-hour ground: warm sand to deep umber -->
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4a46b"/>
      <stop offset="28%" stop-color="#8b6347"/>
      <stop offset="100%" stop-color="#2c1a0a"/>
    </linearGradient>
    <!-- Sun bloom -->
    <radialGradient id="sunBloom" cx="72%" cy="48%" r="14%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="rgba(255,218,95,0.30)"/>
      <stop offset="40%" stop-color="rgba(255,170,50,0.13)"/>
      <stop offset="100%" stop-color="rgba(255,100,10,0)"/>
    </radialGradient>
    <!-- Sun disc -->
    <radialGradient id="sunDisc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffcd2"/>
      <stop offset="45%" stop-color="#ffd246"/>
      <stop offset="100%" stop-color="rgba(255,165,30,0)"/>
    </radialGradient>
    <!-- Near square gradient: warm sand top, deep shadow bottom (golden-hour light) -->
    <linearGradient id="sqGrad" gradientUnits="userSpaceOnUse" x1="350" y1="140" x2="350" y2="236">
      <stop offset="0%" stop-color="#f5c97a"/>
      <stop offset="100%" stop-color="#7a3b12"/>
    </linearGradient>
    <!-- Mid triangle gradient: warm peach top, deep umber bottom -->
    <linearGradient id="triGrad" gradientUnits="userSpaceOnUse" x1="435" y1="172" x2="435" y2="214">
      <stop offset="0%" stop-color="#f4a870"/>
      <stop offset="100%" stop-color="#7a2c08"/>
    </linearGradient>
    <!-- Left wing primary feathers -->
    <linearGradient id="lwPri" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3d1505"/>
      <stop offset="55%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#a35215"/>
    </linearGradient>
    <!-- Left wing secondary feathers -->
    <linearGradient id="lwSec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5c2108"/>
      <stop offset="100%" stop-color="#c2620a"/>
    </linearGradient>
    <!-- Right wing primary feathers -->
    <linearGradient id="rwPri" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#3d1505"/>
      <stop offset="55%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#a35215"/>
    </linearGradient>
    <!-- Right wing secondary feathers -->
    <linearGradient id="rwSec" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#5c2108"/>
      <stop offset="100%" stop-color="#c2620a"/>
    </linearGradient>
    <!-- Beak gradient -->
    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c84a"/>
      <stop offset="100%" stop-color="#c49a10"/>
    </linearGradient>
    <!-- Shape glow filter -->
    <filter id="sglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Wing highlight filter -->
    <filter id="wglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.44)"/>
    </radialGradient>
    <!-- HUD panel -->
    <linearGradient id="hudpanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0,0,0,0.65)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.4)"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="800" height="225" fill="url(#sky)"/>

  <!-- Sun bloom -->
  <rect x="0" y="0" width="800" height="225" fill="url(#sunBloom)"/>

  <!-- Sun disc (at ~72% x, just above horizon) -->
  <circle cx="576" cy="215" r="18" fill="url(#sunDisc)"/>

  <!-- Lens-flare streaks (subtle) -->
  <g opacity="0.32" stroke="rgba(255,228,140,1)" stroke-linecap="round">
    <line x1="576" y1="215" x2="628" y2="214" stroke-width="1.4"/>
    <line x1="576" y1="215" x2="612" y2="197" stroke-width="1.0"/>
    <line x1="576" y1="215" x2="599" y2="230" stroke-width="0.7"/>
  </g>

  <!-- Cloud bands -->
  <g opacity="0.10" fill="white">
    <ellipse cx="100" cy="44" rx="68" ry="13"/>
    <ellipse cx="330" cy="44" rx="60" ry="13"/>
    <ellipse cx="730" cy="44" rx="52" ry="13"/>
  </g>
  <g opacity="0.08" fill="white">
    <ellipse cx="55"  cy="100" rx="52" ry="9"/>
    <ellipse cx="240" cy="100" rx="65" ry="9"/>
    <ellipse cx="655" cy="100" rx="70" ry="9"/>
  </g>

  <!-- Horizon line (warm gold) -->
  <line x1="0" y1="225" x2="800" y2="225" stroke="#f9c784" stroke-width="1" opacity="0.45"/>

  <!-- Ground -->
  <rect x="0" y="225" width="800" height="225" fill="url(#ground)"/>

  <!-- Perspective grid -->
  <g stroke="rgba(0,0,0,0.17)" stroke-width="0.8">
    <line x1="0" y1="286" x2="800" y2="286"/>
    <line x1="0" y1="310" x2="800" y2="310"/>
    <line x1="0" y1="344" x2="800" y2="344"/>
    <line x1="0" y1="388" x2="800" y2="388"/>
    <line x1="0"   y1="450" x2="400" y2="225"/>
    <line x1="135" y1="450" x2="400" y2="225"/>
    <line x1="270" y1="450" x2="400" y2="225"/>
    <line x1="400" y1="450" x2="400" y2="225"/>
    <line x1="530" y1="450" x2="400" y2="225"/>
    <line x1="665" y1="450" x2="400" y2="225"/>
    <line x1="800" y1="450" x2="400" y2="225"/>
  </g>

  <!-- Far ring (fogged to warm horizon color) -->
  <circle cx="388" cy="217" r="10" fill="none" stroke="#d4ac78" stroke-width="3" opacity="0.28"/>

  <!-- Mid triangle (warm peach tones, gradient fill) -->
  <g filter="url(#sglow)" opacity="0.72">
    <path d="M 435,172 L 459,214 L 411,214 Z M 435,187 L 447,207 L 423,207 Z"
          fill="url(#triGrad)" fill-rule="evenodd"/>
    <line x1="435" y1="172" x2="459" y2="214" stroke="#f8dfc0" stroke-width="1.5" opacity="0.55"/>
    <line x1="435" y1="172" x2="411" y2="214" stroke="#f8dfc0" stroke-width="1.5" opacity="0.55"/>
  </g>

  <!-- Near square (golden warm tones, gradient fill) -->
  <g filter="url(#sglow)">
    <path d="M 398,140 L 398,236 L 302,236 L 302,140 Z M 373,165 L 373,211 L 327,211 L 327,165 Z"
          fill="url(#sqGrad)" fill-rule="evenodd"/>
    <line x1="302" y1="140" x2="398" y2="140" stroke="#fde8c0" stroke-width="2.5" opacity="0.60"/>
    <rect x="327" y="165" width="46" height="46"
          fill="none" stroke="rgba(245,201,122,0.18)" stroke-width="6"/>
  </g>

  <!-- Pass particles -->
  <g opacity="0.88">
    <circle cx="302" cy="152" r="4" fill="#f5c97a"/>
    <circle cx="290" cy="168" r="3" fill="#f5c97a"/>
    <circle cx="309" cy="141" r="2" fill="#fff8e0"/>
    <circle cx="398" cy="155" r="4" fill="#f5c97a"/>
    <circle cx="410" cy="170" r="3" fill="#f5c97a"/>
    <circle cx="386" cy="144" r="2" fill="#fff8e0"/>
    <circle cx="350" cy="112" r="4" fill="#f5c97a"/>
    <circle cx="340" cy="102" r="3" fill="#fbbf24"/>
  </g>

  <!-- Motion blur streak -->
  <ellipse cx="622" cy="367" rx="36" ry="11" fill="#92400e" opacity="0.22" transform="rotate(8, 622, 367)"/>

  <!-- LEFT WING -->
  <g filter="url(#wglow)">
    <path d="M 30 445  C 48 406 145 368 298 342  C 328 372 300 400 258 418  Z"
          fill="url(#lwPri)"/>
    <path d="M 88 445  C 108 412 190 380 308 358  C 326 380 308 400 278 414  Z"
          fill="url(#lwSec)" opacity="0.82"/>
    <path d="M 160 445  C 175 420 234 396 280 388  C 274 408 240 426 180 440  Z"
          fill="#d97706" opacity="0.48"/>
  </g>

  <!-- RIGHT WING -->
  <g filter="url(#wglow)">
    <path d="M 770 445  C 752 400 650 358 502 342  C 472 376 504 408 548 422  Z"
          fill="url(#rwPri)"/>
    <path d="M 712 445  C 692 408 610 374 492 356  C 474 380 494 406 524 420  Z"
          fill="url(#rwSec)" opacity="0.82"/>
    <path d="M 640 445  C 625 416 566 392 520 384  C 526 406 560 428 620 442  Z"
          fill="#d97706" opacity="0.48"/>
  </g>

  <!-- BEAK -->
  <path d="M 400 420  C 391 428 387 437 392 443  C 396 447 404 447 408 443  C 413 437 409 428 400 420  Z"
        fill="url(#beak)" opacity="0.82"/>
  <path d="M 388 436  C 394 433 406 433 412 436" fill="none" stroke="#9a6e06" stroke-width="1.2" opacity="0.42"/>

  <!-- Vignette overlay -->
  <rect x="0" y="0" width="800" height="450" fill="url(#vignette)"/>

  <!-- HUD panel -->
  <rect x="10" y="10" width="155" height="58" rx="8" fill="url(#hudpanel)"/>
  <text x="20" y="33" font-family="system-ui,sans-serif" font-weight="700" font-size="18" fill="#fbbf24">Score: 140</text>
  <text x="20" y="54" font-family="system-ui,sans-serif" font-size="12" fill="#fca5a5">Misses: 1</text>

  <!-- Momentum bar -->
  <text x="638" y="24" font-family="system-ui,sans-serif" font-size="11" fill="#cbd5e1" text-anchor="end">Momentum</text>
  <rect x="642" y="14" width="146" height="10" rx="5" fill="rgba(0,0,0,0.5)"/>
  <rect x="642" y="14" width="112" height="10" rx="5" fill="#34d399"/>

  <!-- Title hint -->
  <text x="400" y="444" font-family="system-ui,sans-serif" font-size="13" fill="rgba(255,255,255,0.25)" text-anchor="middle">Duck Flight</text>
</svg>
