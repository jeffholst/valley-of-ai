<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0d1433"/>
      <stop offset="100%" stop-color="#040610"/>
    </radialGradient>

    <!-- Arena outer glow -->
    <radialGradient id="arenaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#0044aa" stop-opacity="0.3"/>
    </radialGradient>

    <!-- Center spawn glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ccff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00ccff" stop-opacity="0"/>
    </radialGradient>

    <!-- Arm cyan gradient -->
    <linearGradient id="armCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#00ffff" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Arm magenta gradient -->
    <linearGradient id="armMag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff00ff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ff00ff"/>
      <stop offset="100%" stop-color="#ff00ff" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Arm green gradient -->
    <linearGradient id="armGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Glow filter for arms -->
    <filter id="armGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glow filter for balls -->
    <filter id="ballGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Title glow filter -->
    <filter id="titleGlow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft shadow for HUD -->
    <filter id="hudGlow" x="-5%" y="-20%" width="110%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Full background -->
  <rect x="0" y="0" width="800" height="450" fill="url(#bgGrad)"/>

  <!-- Corner accent lines (top-left) -->
  <line x1="0" y1="0" x2="60" y2="0" stroke="#00ffff" stroke-width="2" opacity="0.4"/>
  <line x1="0" y1="0" x2="0" y2="60" stroke="#00ffff" stroke-width="2" opacity="0.4"/>

  <!-- Corner accent lines (top-right) -->
  <line x1="800" y1="0" x2="740" y2="0" stroke="#00ffff" stroke-width="2" opacity="0.4"/>
  <line x1="800" y1="0" x2="800" y2="60" stroke="#00ffff" stroke-width="2" opacity="0.4"/>

  <!-- Corner accent lines (bottom-left) -->
  <line x1="0" y1="450" x2="60" y2="450" stroke="#00ffff" stroke-width="2" opacity="0.4"/>
  <line x1="0" y1="450" x2="0" y2="390" stroke="#00ffff" stroke-width="2" opacity="0.4"/>

  <!-- Corner accent lines (bottom-right) -->
  <line x1="800" y1="450" x2="740" y2="450" stroke="#00ffff" stroke-width="2" opacity="0.4"/>
  <line x1="800" y1="450" x2="800" y2="390" stroke="#00ffff" stroke-width="2" opacity="0.4"/>

  <!-- Arena circle: outer faint ring -->
  <circle cx="400" cy="225" r="185" fill="none" stroke="#1a3060" stroke-width="2"/>
  <!-- Arena glow ring -->
  <circle cx="400" cy="225" r="185" fill="none" stroke="#0055cc" stroke-width="8" opacity="0.35"
    filter="url(#armGlow)"/>
  <!-- Inner guide ring -->
  <circle cx="400" cy="225" r="92" fill="none" stroke="#0d2040" stroke-width="1"/>

  <!-- Center spawn area glow -->
  <circle cx="400" cy="225" r="30" fill="url(#centerGlow)"/>

  <!-- Center dot -->
  <circle cx="400" cy="225" r="5" fill="#00ddff" filter="url(#ballGlow)"/>

  <!-- ARM 1 (cyan) — at ~15 degrees from horizontal -->
  <!-- x1 = 400 + cos(15°)*155 = 400 + 0.966*155 = 549.7, y1 = 225 + sin(15°)*155 = 225 + 40.1 = 265.1 -->
  <!-- x2 = 400 - 155*cos(15°) = 250.3, y2 = 225 - 40.1 = 184.9 -->
  <line x1="550" y1="265" x2="250" y2="185"
    stroke="#00ffff" stroke-width="22" stroke-linecap="round"
    opacity="0.22" filter="url(#armGlow)"/>
  <line x1="550" y1="265" x2="250" y2="185"
    stroke="url(#armCyan)" stroke-width="16" stroke-linecap="round"
    filter="url(#armGlow)"/>
  <line x1="550" y1="265" x2="250" y2="185"
    stroke="rgba(255,255,255,0.55)" stroke-width="3" stroke-linecap="round"/>

  <!-- ARM 2 (magenta) — at ~75 degrees (arm 1 + 60 degrees) -->
  <!-- x1 = 400 + cos(75°)*155 = 400 + 40.1 = 440.1, y1 = 225 + sin(75°)*155 = 225 + 149.7 = 374.7 -->
  <!-- x2 = 400 - 40.1 = 359.9, y2 = 225 - 149.7 = 75.3 -->
  <line x1="440" y1="375" x2="360" y2="75"
    stroke="#ff00ff" stroke-width="22" stroke-linecap="round"
    opacity="0.22" filter="url(#armGlow)"/>
  <line x1="440" y1="375" x2="360" y2="75"
    stroke="url(#armMag)" stroke-width="16" stroke-linecap="round"
    filter="url(#armGlow)"/>
  <line x1="440" y1="375" x2="360" y2="75"
    stroke="rgba(255,255,255,0.55)" stroke-width="3" stroke-linecap="round"/>

  <!-- ARM 3 (green) — at ~135 degrees -->
  <!-- x1 = 400 + cos(135°)*155 = 400 - 109.6 = 290.4, y1 = 225 + sin(135°)*155 = 225 + 109.6 = 334.6 -->
  <!-- x2 = 400 + 109.6 = 509.6, y2 = 225 - 109.6 = 115.4 -->
  <line x1="290" y1="335" x2="510" y2="115"
    stroke="#00ff88" stroke-width="22" stroke-linecap="round"
    opacity="0.22" filter="url(#armGlow)"/>
  <line x1="290" y1="335" x2="510" y2="115"
    stroke="url(#armGreen)" stroke-width="16" stroke-linecap="round"
    filter="url(#armGlow)"/>
  <line x1="290" y1="335" x2="510" y2="115"
    stroke="rgba(255,255,255,0.55)" stroke-width="3" stroke-linecap="round"/>

  <!-- Ball 1 (yellow-orange) — mid-arena, angle ~40deg from center -->
  <!-- pos ~= 400 + cos(40)*110 = 484, 225 + sin(40)*110 = 296 -->
  <circle cx="484" cy="296" r="10" fill="#ffaa00" filter="url(#ballGlow)"/>
  <circle cx="484" cy="296" r="4" fill="rgba(255,255,255,0.7)"/>

  <!-- Ball 2 (pink) — upper right sector -->
  <!-- pos ~= 400 + cos(-30)*130 = 513, 225 + sin(-30)*130 = 160 -->
  <circle cx="513" cy="160" r="10" fill="#ff66cc" filter="url(#ballGlow)"/>
  <circle cx="513" cy="160" r="4" fill="rgba(255,255,255,0.7)"/>

  <!-- Ball 3 (blue) — left sector -->
  <!-- pos ~= 400 + cos(200)*90 = 315, 225 + sin(200)*90 = 194 -->
  <circle cx="315" cy="194" r="10" fill="#44aaff" filter="url(#ballGlow)"/>
  <circle cx="315" cy="194" r="4" fill="rgba(255,255,255,0.7)"/>

  <!-- Particle burst (catch event near arm 1, at ~540,258) -->
  <!-- 8 particles radiating outward -->
  <circle cx="548" cy="258" r="4" fill="#00ffff" opacity="0.9" filter="url(#ballGlow)"/>
  <circle cx="558" cy="250" r="3" fill="#00ffff" opacity="0.75"/>
  <circle cx="562" cy="263" r="3" fill="#00ffff" opacity="0.65"/>
  <circle cx="540" cy="270" r="3" fill="#00ffff" opacity="0.7"/>
  <circle cx="538" cy="248" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="556" cy="272" r="2" fill="#00ffff" opacity="0.6"/>
  <circle cx="566" cy="255" r="2" fill="#00eeff" opacity="0.55"/>
  <circle cx="542" cy="278" r="2" fill="#00ffff" opacity="0.5"/>
  <circle cx="530" cy="244" r="2" fill="#00ffff" opacity="0.45"/>

  <!-- HUD: score top-left of arena -->
  <text x="240" y="116" font-family="Courier New, monospace" font-size="22" font-weight="bold"
    fill="#e0f0ff" filter="url(#hudGlow)">350</text>

  <!-- HUD: level top-center of arena -->
  <text x="400" y="116" font-family="Courier New, monospace" font-size="22" font-weight="bold"
    fill="#ffcc00" text-anchor="middle" filter="url(#hudGlow)">LVL 4</text>

  <!-- HUD: lives top-right of arena -->
  <text x="558" y="116" font-family="Courier New, monospace" font-size="22" font-weight="bold"
    fill="#ff4466" filter="url(#hudGlow)">&#x2665;&#x2665;&#x2665;</text>

  <!-- Title -->
  <text x="400" y="418" font-family="Courier New, monospace" font-size="38" font-weight="900"
    fill="#00ffff" text-anchor="middle" letter-spacing="8"
    filter="url(#titleGlow)">SIMMOTION</text>

  <!-- Subtitle tagline -->
  <text x="400" y="440" font-family="Courier New, monospace" font-size="13"
    fill="#4488aa" text-anchor="middle" letter-spacing="2">SPIN THE ARMS — CATCH THE BALLS</text>
</svg>
