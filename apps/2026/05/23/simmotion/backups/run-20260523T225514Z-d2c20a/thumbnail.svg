<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="trackGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <radialGradient id="ballGrad" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <linearGradient id="paddleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="titleGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="trackGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="ballGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="paddleGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="450" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="800" height="450" fill="url(#grid)"/>
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="transparent"/>
    <stop offset="100%" stop-color="rgba(0,0,0,0.4)"/>
  </radialGradient>
  <rect x="0" y="0" width="800" height="450" fill="url(#vignette)"/>

  <!-- ── TRACK (4-exit layout scaled to thumbnail) ── -->
  <!-- Entry drop -->
  <line x1="400" y1="40" x2="400" y2="95" stroke="rgba(56,189,248,0.3)" stroke-width="12" stroke-linecap="round" filter="url(#trackGlow)"/>
  <line x1="400" y1="40" x2="400" y2="95" stroke="url(#trackGrad)" stroke-width="4" stroke-linecap="round"/>

  <!-- J0 left/right ramps -->
  <line x1="400" y1="95" x2="260" y2="160" stroke="rgba(56,189,248,0.3)" stroke-width="10" stroke-linecap="round"/>
  <line x1="400" y1="95" x2="260" y2="160" stroke="url(#trackGrad)" stroke-width="4" stroke-linecap="round"/>
  <line x1="400" y1="95" x2="540" y2="160" stroke="rgba(56,189,248,0.3)" stroke-width="10" stroke-linecap="round"/>
  <line x1="400" y1="95" x2="540" y2="160" stroke="url(#trackGrad)" stroke-width="4" stroke-linecap="round"/>

  <!-- J1 sub-branches -->
  <line x1="260" y1="160" x2="195" y2="220" stroke="rgba(56,189,248,0.3)" stroke-width="10" stroke-linecap="round"/>
  <line x1="260" y1="160" x2="195" y2="220" stroke="url(#trackGrad)" stroke-width="4" stroke-linecap="round"/>
  <line x1="260" y1="160" x2="400" y2="210" stroke="rgba(56,189,248,0.25)" stroke-width="8" stroke-linecap="round"/>
  <line x1="260" y1="160" x2="400" y2="210" stroke="url(#trackGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- J2 sub-branches -->
  <line x1="540" y1="160" x2="400" y2="210" stroke="rgba(56,189,248,0.25)" stroke-width="8" stroke-linecap="round"/>
  <line x1="540" y1="160" x2="400" y2="210" stroke="url(#trackGrad)" stroke-width="3" stroke-linecap="round"/>
  <line x1="540" y1="160" x2="600" y2="220" stroke="rgba(56,189,248,0.3)" stroke-width="10" stroke-linecap="round"/>
  <line x1="540" y1="160" x2="600" y2="220" stroke="url(#trackGrad)" stroke-width="4" stroke-linecap="round"/>

  <!-- Merge to J3 -->
  <line x1="195" y1="220" x2="400" y2="280" stroke="rgba(56,189,248,0.3)" stroke-width="10" stroke-linecap="round"/>
  <line x1="195" y1="220" x2="400" y2="280" stroke="url(#trackGrad)" stroke-width="4" stroke-linecap="round"/>
  <line x1="400" y1="210" x2="400" y2="280" stroke="rgba(56,189,248,0.25)" stroke-width="8" stroke-linecap="round"/>
  <line x1="400" y1="210" x2="400" y2="280" stroke="url(#trackGrad)" stroke-width="3" stroke-linecap="round"/>
  <line x1="600" y1="220" x2="400" y2="280" stroke="rgba(56,189,248,0.3)" stroke-width="10" stroke-linecap="round"/>
  <line x1="600" y1="220" x2="400" y2="280" stroke="url(#trackGrad)" stroke-width="4" stroke-linecap="round"/>

  <!-- J4 branches to J5 / J6 -->
  <line x1="400" y1="280" x2="295" y2="340" stroke="rgba(56,189,248,0.3)" stroke-width="10" stroke-linecap="round"/>
  <line x1="400" y1="280" x2="295" y2="340" stroke="url(#trackGrad)" stroke-width="4" stroke-linecap="round"/>
  <line x1="400" y1="280" x2="505" y2="340" stroke="rgba(56,189,248,0.3)" stroke-width="10" stroke-linecap="round"/>
  <line x1="400" y1="280" x2="505" y2="340" stroke="url(#trackGrad)" stroke-width="4" stroke-linecap="round"/>

  <!-- 4 final exits: far-left, center-left, center-right, far-right -->
  <line x1="295" y1="340" x2="260" y2="405" stroke="rgba(56,189,248,0.3)" stroke-width="10" stroke-linecap="round"/>
  <line x1="295" y1="340" x2="260" y2="405" stroke="url(#trackGrad)" stroke-width="4" stroke-linecap="round"/>
  <line x1="295" y1="340" x2="330" y2="405" stroke="rgba(56,189,248,0.25)" stroke-width="8" stroke-linecap="round"/>
  <line x1="295" y1="340" x2="330" y2="405" stroke="url(#trackGrad)" stroke-width="3" stroke-linecap="round"/>
  <line x1="505" y1="340" x2="470" y2="405" stroke="rgba(56,189,248,0.25)" stroke-width="8" stroke-linecap="round"/>
  <line x1="505" y1="340" x2="470" y2="405" stroke="url(#trackGrad)" stroke-width="3" stroke-linecap="round"/>
  <line x1="505" y1="340" x2="540" y2="405" stroke="rgba(56,189,248,0.3)" stroke-width="10" stroke-linecap="round"/>
  <line x1="505" y1="340" x2="540" y2="405" stroke="url(#trackGrad)" stroke-width="4" stroke-linecap="round"/>

  <!-- ── GATES — all shown as neutral gray (hidden state) except one near ball ── -->
  <!-- Gate 0: gray hidden -->
  <circle cx="400" cy="95" r="6" fill="rgba(148,163,184,0.45)"/>
  <!-- Gate 1: near ball — show orange -->
  <g filter="url(#trackGlow)">
    <line x1="249" y1="155" x2="271" y2="165" stroke="#f97316" stroke-width="4" stroke-linecap="round"/>
    <circle cx="260" cy="160" r="6" fill="#f97316"/>
  </g>
  <!-- Gate 2: gray hidden -->
  <circle cx="540" cy="160" r="6" fill="rgba(148,163,184,0.45)"/>
  <!-- Gate 3: gray hidden -->
  <circle cx="400" cy="280" r="6" fill="rgba(148,163,184,0.45)"/>
  <!-- Gate 4: near ball — show green -->
  <g filter="url(#trackGlow)">
    <line x1="389" y1="275" x2="411" y2="285" stroke="#4ade80" stroke-width="4" stroke-linecap="round"/>
    <circle cx="400" cy="280" r="6" fill="#4ade80"/>
  </g>
  <!-- Gate 5: gray hidden -->
  <circle cx="295" cy="340" r="5" fill="rgba(148,163,184,0.45)"/>
  <!-- Gate 6: gray hidden -->
  <circle cx="505" cy="340" r="5" fill="rgba(148,163,184,0.45)"/>

  <!-- ── BALLS (3 balls in flight — multi-ball gameplay) ── -->
  <!-- Ball 1: between J0 and J1 (near gate 1, triggering reveal) -->
  <g filter="url(#ballGlow)">
    <circle cx="294" cy="148" r="11" fill="url(#ballGrad)"/>
    <circle cx="290" cy="144" r="4" fill="rgba(255,255,255,0.55)"/>
  </g>

  <!-- Ball 2: approaching J4 (near gate 4, triggering reveal) -->
  <g filter="url(#ballGlow)">
    <circle cx="403" cy="263" r="11" fill="url(#ballGrad)"/>
    <circle cx="399" cy="259" r="4" fill="rgba(255,255,255,0.55)"/>
  </g>

  <!-- Ball 3 (speed trail): free-falling toward paddle -->
  <ellipse cx="450" cy="385" rx="7" ry="12" fill="rgba(251,191,36,0.25)"/>
  <g filter="url(#ballGlow)">
    <circle cx="450" cy="394" r="10" fill="url(#ballGrad)"/>
    <circle cx="446" cy="390" r="3" fill="rgba(255,255,255,0.55)"/>
  </g>

  <!-- ── PADDLE (narrower — shrunk from 2 misses) ── -->
  <g filter="url(#paddleGlow)">
    <rect x="395" y="420" width="80" height="14" rx="7" fill="url(#paddleGrad)"/>
    <rect x="403" y="422" width="40" height="4" rx="2" fill="rgba(255,255,255,0.3)"/>
  </g>

  <!-- ── HUD strip ── -->
  <rect x="0" y="0" width="800" height="32" fill="rgba(15,23,42,0.88)"/>
  <text x="16" y="21" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ef4444">❤️ ❤️</text>
  <text x="400" y="21" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f9fafb" text-anchor="middle">⏱ 00:47</text>
  <text x="784" y="21" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#4ade80" text-anchor="end">✓ 4  ✗ 2</text>

  <!-- Ball spawn entry arrow -->
  <line x1="400" y1="6" x2="400" y2="30" stroke="rgba(56,189,248,0.55)" stroke-width="2" stroke-dasharray="4 3"/>
  <polygon points="400,32 395,25 405,25" fill="rgba(56,189,248,0.55)"/>

  <!-- ── TITLE ── -->
  <rect x="0" y="0" width="800" height="450" fill="none" stroke="rgba(56,189,248,0.15)" stroke-width="3"/>

  <text
    x="660"
    y="200"
    font-family="'Segoe UI', system-ui, sans-serif"
    font-size="50"
    font-weight="900"
    letter-spacing="4"
    fill="#38bdf8"
    text-anchor="middle"
    filter="url(#titleGlow)"
  >SIMMOTION</text>

  <text
    x="660"
    y="232"
    font-family="'Segoe UI', system-ui, sans-serif"
    font-size="15"
    font-weight="500"
    letter-spacing="3"
    fill="rgba(56,189,248,0.65)"
    text-anchor="middle"
  >ROLLER COASTER GATE GAME</text>

  <!-- Info card -->
  <rect x="572" y="262" width="188" height="80" rx="8" fill="rgba(30,41,59,0.75)" stroke="rgba(56,189,248,0.2)" stroke-width="1"/>
  <circle cx="584" cy="279" r="4" fill="#fbbf24"/>
  <text x="594" y="283" font-family="system-ui" font-size="12" fill="rgba(255,255,255,0.6)">3 balls · more every 15s</text>
  <circle cx="584" cy="299" r="4" fill="rgba(148,163,184,0.6)"/>
  <text x="594" y="303" font-family="system-ui" font-size="12" fill="rgba(255,255,255,0.6)">Gates hidden until close</text>
  <circle cx="584" cy="319" r="4" fill="#a78bfa"/>
  <text x="594" y="323" font-family="system-ui" font-size="12" fill="rgba(255,255,255,0.6)">Paddle shrinks on miss</text>
  <circle cx="584" cy="339" r="4" fill="#f97316"/>
  <text x="594" y="343" font-family="system-ui" font-size="12" fill="rgba(255,255,255,0.6)">4 exits — predict nothing</text>
</svg>
