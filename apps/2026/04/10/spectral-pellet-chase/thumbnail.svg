<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Spectral Pellet Chase thumbnail</title>
  <desc id="desc">A mid-game maze scene with player, ghosts, pellets, and live score HUD.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061125" />
      <stop offset="55%" stop-color="#0e2347" />
      <stop offset="100%" stop-color="#050b1a" />
    </linearGradient>
    <linearGradient id="mazeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3e8cff" />
      <stop offset="100%" stop-color="#1a4fa0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="760" height="410" rx="24" fill="#081428" stroke="#2a4a7f" stroke-width="2" />

  <rect x="44" y="42" width="712" height="54" rx="14" fill="#12284b" stroke="#315992" />
  <text x="68" y="76" font-size="28" font-family="Trebuchet MS, Segoe UI, sans-serif" fill="#f1f7ff" font-weight="700">
    Spectral Pellet Chase
  </text>
  <text x="530" y="74" font-size="20" font-family="Trebuchet MS, Segoe UI, sans-serif" fill="#ffe356">
    Score 1470  Lives 2
  </text>

  <rect x="54" y="110" width="692" height="300" rx="16" fill="#030917" stroke="#1f3f6f" />

  <!-- Maze blocks -->
  <g fill="url(#mazeGrad)">
    <rect x="84" y="136" width="580" height="16" rx="6" />
    <rect x="84" y="362" width="580" height="16" rx="6" />
    <rect x="84" y="152" width="16" height="210" rx="6" />
    <rect x="648" y="152" width="16" height="210" rx="6" />
    <rect x="174" y="172" width="16" height="164" rx="6" />
    <rect x="558" y="172" width="16" height="164" rx="6" />
    <rect x="254" y="172" width="240" height="16" rx="6" />
    <rect x="254" y="320" width="240" height="16" rx="6" />
    <rect x="334" y="208" width="16" height="96" rx="6" />
    <rect x="398" y="208" width="16" height="96" rx="6" />
  </g>

  <!-- Pellets -->
  <g fill="#ffd447">
    <circle cx="124" cy="190" r="4" />
    <circle cx="152" cy="190" r="4" />
    <circle cx="206" cy="214" r="4" />
    <circle cx="236" cy="214" r="4" />
    <circle cx="266" cy="214" r="4" />
    <circle cx="486" cy="214" r="4" />
    <circle cx="516" cy="214" r="4" />
    <circle cx="546" cy="214" r="4" />
    <circle cx="594" cy="190" r="4" />
    <circle cx="622" cy="190" r="4" />
    <circle cx="124" cy="302" r="4" />
    <circle cx="152" cy="302" r="4" />
    <circle cx="594" cy="302" r="4" />
    <circle cx="622" cy="302" r="4" />
  </g>

  <!-- Power pellets -->
  <g fill="#ffd783" filter="url(#glow)">
    <circle cx="112" cy="170" r="9" />
    <circle cx="636" cy="170" r="9" />
    <circle cx="112" cy="322" r="9" />
    <circle cx="636" cy="322" r="9" />
  </g>

  <!-- Player -->
  <path
    d="M310 260 A20 20 0 1 1 310 220 L310 240 Z"
    fill="#ffe356"
    filter="url(#glow)"
  />

  <!-- Ghosts -->
  <g>
    <path d="M446 238 Q446 218 466 218 Q486 218 486 238 L486 262 L478 254 L470 262 L462 254 L454 262 Z" fill="#ff6262" />
    <circle cx="462" cy="234" r="4" fill="#fff" />
    <circle cx="474" cy="234" r="4" fill="#fff" />
    <circle cx="462" cy="234" r="2" fill="#111" />
    <circle cx="474" cy="234" r="2" fill="#111" />

    <path d="M516 286 Q516 266 536 266 Q556 266 556 286 L556 310 L548 302 L540 310 L532 302 L524 310 Z" fill="#7ff8ff" />
    <circle cx="532" cy="282" r="4" fill="#fff" />
    <circle cx="544" cy="282" r="4" fill="#fff" />
    <circle cx="532" cy="282" r="2" fill="#111" />
    <circle cx="544" cy="282" r="2" fill="#111" />

    <path d="M252 286 Q252 266 272 266 Q292 266 292 286 L292 310 L284 302 L276 310 L268 302 L260 310 Z" fill="#ffae66" />
    <circle cx="268" cy="282" r="4" fill="#fff" />
    <circle cx="280" cy="282" r="4" fill="#fff" />
    <circle cx="268" cy="282" r="2" fill="#111" />
    <circle cx="280" cy="282" r="2" fill="#111" />

    <path d="M446 304 Q446 284 466 284 Q486 284 486 304 L486 328 L478 320 L470 328 L462 320 L454 328 Z" fill="#446fff" />
    <circle cx="462" cy="300" r="4" fill="#fff" />
    <circle cx="474" cy="300" r="4" fill="#fff" />
    <circle cx="462" cy="300" r="2" fill="#111" />
    <circle cx="474" cy="300" r="2" fill="#111" />
  </g>

  <text x="66" y="418" font-size="18" font-family="Trebuchet MS, Segoe UI, sans-serif" fill="#9ee7ff">
    Mid-chase snapshot: 14 pellets left, ghosts in mixed pursuit.
  </text>
</svg>
