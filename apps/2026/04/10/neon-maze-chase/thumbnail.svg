<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Neon Maze Chase thumbnail</title>
  <desc id="desc">A high-contrast neon maze scene with a glowing player and spectral ghosts.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050a14" />
      <stop offset="100%" stop-color="#0d1626" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="url(#bgGrad)" />
  
  <!-- Game Screen Frame -->
  <rect x="100" y="50" width="600" height="350" rx="20" fill="#000" stroke="#00ffcc" stroke-width="4" filter="url(#neonGlow)" />
  
  <!-- Maze Walls -->
  <g stroke="#00ffcc" stroke-width="6" fill="none" filter="url(#neonGlow)">
    <path d="M150 100 h400 v250 h-400 z" />
    <path d="M250 100 v250 M350 100 v250 M450 100 v250 M550 100 v250" />
    <path d="M150 200 h400 M150 300 h400" />
  </g>

  <!-- Pellets -->
  <g fill="#fff">
    <circle cx="200" cy="150" r="4" />
    <circle cx="300" cy="150" r="4" />
    <circle cx="400" cy="150" r="4" />
    <circle cx="200" cy="250" r="4" />
    <circle cx="300" cy="250" r="4" />
    <circle cx="400" cy="250" r="4" />
  </g>

  <!-- Player -->
  <circle cx="200" cy="120" r="15" fill="#00ffcc" filter="url(#neonGlow)" />

  <!-- Ghosts -->
  <path d="M400 120 a15 15 0 1 1 0 30 l0 10 l-5 -5 l-5 5 l-5 -5 l-5 5 l-5 -5 z" fill="#ff0055" filter="url(#neonGlow)" />
  <path d="M500 220 a15 15 0 1 1 0 30 l0 10 l-5 -5 l-5 5 l-5 -5 l-5 5 l-5 -5 z" fill="#ffb8ff" filter="url(#neonGlow)" />
  <path d="M300 320 a15 15 0 1 1 0 30 l0 10 l-5 -5 l-5 5 l-5 -5 l-5 5 l-5 -5 z" fill="#00ffff" filter="url(#neonGlow)" />
  <path d="M450 320 a15 15 0 1 1 0 30 l0 10 l-5 -5 l-5 5 l-5 -5 l-5 5 l-5 -5 z" fill="#ffb855" filter="url(#neonGlow)" />

  <!-- Title -->
  <text x="400" y="430" text-anchor="middle" font-size="42" font-family="Arial, sans-serif" fill="#00ffcc" font-weight="bold" filter="url(#neonGlow)">
    NEON MAZE CHASE
  </text>
</svg>
