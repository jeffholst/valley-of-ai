<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Neon Maze Chase - __MAIN_SITE_NAME__</title>

      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='4' width='24' height='24' rx='4' fill='%230a1022'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%2300ffcc'/%3E%3C/svg%3E"
    />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=__GA_MEASUREMENT_ID__"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {

    <meta name="voa-main-site-url" content="__MAIN_SITE_URL__" />
    <meta name="voa-main-site-name" content="__MAIN_SITE_NAME__" />
    <meta name="voa-github-url" content="__GITHUB_URL__" />
    <meta name="voa-social-x-url" content="__SOCIAL_X_URL__" />
    <meta name="voa-social-facebook-url" content="__SOCIAL_FACEBOOK_URL__" />
    <meta name="voa-social-instagram-url" content="__SOCIAL_INSTAGRAM_URL__" />
    <meta name="application-name" content="Neon Maze Chase" />
    <meta name="voa-app-id" content="2026/04/10/neon-maze-chase" />
    <script src="/apps/shared/app-shell.js" defer></script>

    <style>
      :root {
        --bg: #050a14;
        --text: #e0f7ff;
        --surface: #0d1626;
        --accent: #00ffcc;
        --line: #1a3a4a;
        --neon-glow: 0 0 10px rgba(0, 255, 204, 0.5), 0 0 20px rgba(0, 255, 204, 0.3);
      }

      [data-theme='light'] {
        --bg: #f0faff;
        --text: #1a3a4a;
        --surface: #ffffff;
        --accent: #00a88a;
        --line: #cce0e6;
        --neon-glow: 0 0 10px rgba(0, 168, 138, 0.3);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
      }

      #app {
        position: fixed;
        top: 64px;
        right: 0;
        bottom: 56px;
        left: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 12px;
        max-width: 800px;
        margin: 0 auto;
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      }

      .hud {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 20px;
        border-bottom: 2px solid var(--accent);
      }

      .hud h1 {
        margin: 0;
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--accent);
        text-shadow: var(--neon-glow);
      }

      .stats {
        display: flex;
        gap: 16px;
        font-family: 'Courier New', Courier, monospace;
        font-weight: bold;
      }

      .stat-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        font-size: 0.85rem;
      }

      .stat-value {
        font-size: 1.1rem;
        color: var(--accent);
        text-shadow: var(--neon-glow);
      }

      .game-container {
        flex: 1;
        display: grid;
        place-items: center;
        min-height: 0;
        padding: 8px;
      }

      canvas {
        width: min(100%, 512px);
        height: auto;
        max-height: 100%;
        border: 3px solid var(--line);
        border-radius: 8px;
        background: #000;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 16px;
        padding: 16px;
        align-items: center;
      }

      .instructions {
        font-size: 0.85rem;
        line-height: 1.4;
        opacity: 0.8;
      }

      .btn-group {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      button {
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        min-height: 44px;
      }

      button:hover {
        background: var(--line);
        border-color: var(--accent);
        color: var(--accent);
      }

      .dpad {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(2, 1fr);
        gap: 8px;
        margin-left: 12px;
      }

      .dpad button {
        width: 54px;
        height: 54px;
        padding: 0;
        display: grid;
        place-items: center;
        font-size: 1.2rem;
      }

      #up { grid-column: 2; }
      #left { grid-column: 1; }
      #down { grid-column: 2; }
      #right { grid-column: 3; }

      @media (max-width: 600px) {
        .controls {
          grid-template-columns: 1fr;
          text-align: center;
        }
        .btn-group {
          justify-content: center;
        }
        .instructions {
          text-align: center;
        }
      }
    </style>
  </head>
  <body>
    <main id="app">
      <section class="panel hud">
        <h1>Neon Maze Chase</h1>
        <div class="stats">
          <div class="stat-item">
            <span>SCORE</span>
            <span id="score" class="stat-value">0</span>
          </div>
          <div class="stat-item">
            <span>LIVES</span>
            <span id="lives" class="stat-value">3</span>
          </div>
        </div>
      </section>

      <section class="panel game-container">
        <canvas id="gameCanvas" width="512" height="512"></canvas>
      </section>

      <section class="panel controls">
        <div class="instructions">
          Use arrow keys or touch controls. Collect all pellets to win. Avoid ghosts!
        </div>
        <div class="btn-group">
          <button id="startBtn">Start</button>
          <div class="dpad">
            <button id="up">▲</button>
            <button id="left">◀</button>
            <button id="down">▼</button>
            <button id="right">▶</button>
          </div>
        </div>
      </section>
    </main>

    <script>
      (() => {
        'use strict';

        const TILE_SIZE = 32;
        const MAP_WIDTH = 16;
        const MAP_HEIGHT = 16;
        const PLAYER_SPEED = 2;
        const GHOST_SPEED = 1.5;
        const POWER_UP_DURATION = 8000;

        // Maze layout: 'W' wall, '.' pellet, ' ' open floor (ghost home / spawn).
        // Exactly MAP_WIDTH x MAP_HEIGHT; single-cell pillars keep every corridor
        // connected. RAW_MAP is the pristine source; MAP is a mutable working copy
        // (char arrays) rebuilt by resetMap() so replays restore eaten pellets.
        const RAW_MAP = [
          'WWWWWWWWWWWWWWWW',
          'W .............W',
          'W.W.W.W.W.W.W.WW',
          'W..............W',
          'W.W.W.W.W.W.W.WW',
          'W..............W',
          'W.W.W.    W.W.WW',
          'W.....    .....W',
          'W.W.W.    W.W.WW',
          'W.....    .....W',
          'W.W.W.W.W.W.W.WW',
          'W..............W',
          'W.W.W.W.W.W.W.WW',
          'W..............W',
          'W.W.W.W.W.W.W.WW',
          'WWWWWWWWWWWWWWWW',
        ];
        let MAP = RAW_MAP.map((row) => row.split(''));

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const startBtn = document.getElementById('startBtn');

        let score = 0;
        let lives = 3;
        let gameRunning = false;
        let pelletsCollected = 0;
        let totalPellets = 0;
        let powerMode = false;
        let powerTimer = 0;

        const player = {
          x: 1,
          y: 1,
          dir: 'still',
          nextDir: 'still',
          color: '#00ffcc'
        };

        const ghosts = [
          { x: 8, y: 8, color: '#ff0055', dir: 'right', type: 'chase', name: 'Blinky' },
          { x: 8, y: 7, color: '#ffb8ff', dir: 'left', type: 'ambush', name: 'Pinky' },
          { x: 7, y: 8, color: '#00ffff', dir: 'up', type: 'vector', name: 'Inky' },
          { x: 6, y: 8, color: '#ffb855', dir: 'down', type: 'shy', name: 'Clyde' },
        ];
        // Pristine spawn positions so ghosts can be sent home on replay / capture.
        const GHOST_SPAWNS = ghosts.map((g) => ({ x: g.x, y: g.y }));

        function drawMap() {
          for (let y = 0; y < MAP_HEIGHT; y++) {
            for (let x = 0; x < MAP_WIDTH; x++) {
              const tile = MAP[y][x];
              const px = x * TILE_SIZE;
              const py = y * TILE_SIZE;

              if (tile === 'W') {
                ctx.fillStyle = '#1a3a4a';
                ctx.fillRect(px + 2, py + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                ctx.strokeStyle = '#00ffcc';
                ctx.strokeRect(px + 4, py + 4, TILE_SIZE - 8, TILE_SIZE - 8);
              } else if (tile === '.') {
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(px + TILE_SIZE / 2, py + TILE_SIZE / 2, 2, 0, Math.PI * 2);
                ctx.fill();
              }
            }
          }
        }

        function drawPlayer() {
          ctx.fillStyle = player.color;
          ctx.beginPath();
          ctx.arc(
            player.x * TILE_SIZE + TILE_SIZE / 2,
            player.y * TILE_SIZE + TILE_SIZE / 2,
            TILE_SIZE * 0.4,
            0,
            Math.PI * 2
          );
          ctx.fill();
        }

        function drawGhost(ghost) {
          ctx.fillStyle = powerMode ? '#0000ff' : ghost.color;
          ctx.beginPath();
          ctx.arc(
            ghost.x * TILE_SIZE + TILE_SIZE / 2,
            ghost.y * TILE_SIZE + TILE_SIZE / 2,
            TILE_SIZE * 0.4,
            Math.PI,
            0
          );
          ctx.lineTo(
            ghost.x * TILE_SIZE + TILE_SIZE / 2 + TILE_SIZE * 0.4,
            ghost.y * TILE_SIZE + TILE_SIZE / 2 + TILE_SIZE * 0.4
          );
          ctx.lineTo(
            ghost.x * TILE_SIZE + TILE_SIZE / 2 - TILE_SIZE * 0.4,
            ghost.y * TILE_SIZE + TILE_SIZE / 2 + TILE_SIZE * 0.4
          );
          ctx.closePath();
          ctx.fill();
        }

        function movePlayer() {
          let nx = player.x;
          let ny = player.y;

          if (player.nextDir === 'up') ny--;
          else if (player.nextDir === 'down') ny++;
          else if (player.nextDir === 'left') nx--;
          else if (player.nextDir === 'right') nx++;

          if (MAP[ny] && MAP[ny][nx] !== 'W') {
            player.dir = player.nextDir;
            player.x = nx;
            player.y = ny;
          } else {
            if (player.dir === 'up') ny = player.y - 1;
            else if (player.dir === 'down') ny = player.y + 1;
            else if (player.dir === 'left') nx = player.x - 1;
            else if (player.dir === 'right') nx = player.x + 1;

            if (MAP[ny] && MAP[ny][nx] !== 'W') {
              player.x = nx;
              player.y = ny;
            }
          }
        }

        function moveGhosts() {
          ghosts.forEach(ghost => {
            const directions = ['up', 'down', 'left', 'right'];
            let bestDir = ghost.dir;

            if (powerMode) {
              bestDir = directions[Math.floor(Math.random() * 4)];
            } else {
              const dx = player.x - ghost.x;
              const dy = player.y - ghost.y;
              
              if (ghost.type === 'chase') {
                bestDir = dx > 0 ? 'right' : 'left';
                if (Math.abs(dy) > Math.abs(dx)) {
                  bestDir = dy > 0 ? 'down' : 'up';
                }
              } else if (ghost.type === 'ambush') {
                bestDir = dx > 0 ? 'right' : 'left';
                if (Math.abs(dy) > Math.abs(dx)) {
                  bestDir = dy > 0 ? 'down' : 'up';
                }
              } else if (ghost.type === 'vector') {
                bestDir = dx > 0 ? 'right' : 'left';
                if (Math.abs(dy) > Math.abs(dx)) {
                  bestDir = dy > 0 ? 'down' : 'up';
                }
              } else if (ghost.type === 'shy') {
                bestDir = dx < 0 ? 'right' : 'left';
                if (Math.abs(dy) > Math.abs(dx)) {
                  bestDir = dy < 0 ? 'down' : 'up';
                }
              }
            }

            let nx = ghost.x;
            let ny = ghost.y;
            if (bestDir === 'up') ny--;
            else if (bestDir === 'down') ny++;
            else if (bestDir === 'left') nx--;
            else if (bestDir === 'right') nx++;

            if (MAP[ny] && MAP[ny][nx] !== 'W') {
              ghost.dir = bestDir;
              ghost.x = nx;
              ghost.y = ny;
            }
          });
        }

        function checkCollisions() {
          ghosts.forEach((ghost, i) => {
            if (player.x === ghost.x && player.y === ghost.y) {
              if (powerMode) {
                ghost.x = GHOST_SPAWNS[i].x;
                ghost.y = GHOST_SPAWNS[i].y;
                score += 200;
                scoreEl.textContent = score;
              } else {
                lives--;
                livesEl.textContent = lives;
                player.x = 1;
                player.y = 1;
                player.dir = 'still';
                player.nextDir = 'still';
              }
            }
          });
          if (lives <= 0) {
            gameRunning = false;
            alert('Game Over! Score: ' + score);
          }
        }

        function update() {
          if (!gameRunning) return;
          movePlayer();
          moveGhosts();
          checkCollisions();
          
          const cell = MAP[player.y][player.x];
          if (cell === '.') {
            score += 10;
            pelletsCollected++;
            scoreEl.textContent = score;
            MAP[player.y][player.x] = ' ';
            if (pelletsCollected >= totalPellets) {
              gameRunning = false;
              alert('You cleared the maze! Score: ' + score);
            }
          }
        }

        function render() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          drawMap();
          drawPlayer();
          ghosts.forEach(drawGhost);
        }

        function gameLoop() {
          update();
          render();
          if (gameRunning) setTimeout(gameLoop, 150);
        }

        function start() {
          if (gameRunning) return; // ignore extra clicks while a game is in progress
          gameRunning = true;
          score = 0;
          lives = 3;
          pelletsCollected = 0;
          player.x = 1;
          player.y = 1;
          player.dir = 'still';
          player.nextDir = 'still';
          scoreEl.textContent = score;
          livesEl.textContent = lives;

          resetMap();
          totalPellets = MAP.flat().filter((c) => c === '.').length;
          resetGhosts();

          gameLoop();
        }

        // Rebuild the working map from the pristine source so eaten pellets return.
        function resetMap() {
          MAP = RAW_MAP.map((row) => row.split(''));
        }

        // Send every ghost back to its spawn tile.
        function resetGhosts() {
          ghosts.forEach((g, i) => {
            g.x = GHOST_SPAWNS[i].x;
            g.y = GHOST_SPAWNS[i].y;
          });
        }

        function bindInputs() {
          window.addEventListener('keydown', (e) => {
            const key = e.key;
            if (key === 'ArrowUp' || key === 'w') player.nextDir = 'up';
            if (key === 'ArrowDown' || key === 's') player.nextDir = 'down';
            if (key === 'ArrowLeft' || key === 'a') player.nextDir = 'left';
            if (key === 'ArrowRight' || key === 'd') player.nextDir = 'right';
          });

          document.getElementById('up').addEventListener('click', () => player.nextDir = 'up');
          document.getElementById('down').addEventListener('click', () => player.nextDir = 'down');
          document.getElementById('left').addEventListener('click', () => player.nextDir = 'left');
          document.getElementById('right').addEventListener('click', () => player.nextDir = 'right');
          startBtn.addEventListener('click', start);
        }

        bindInputs();
        drawMap();
        drawPlayer();
        drawGhost(ghosts[0]);
        drawGhost(ghosts[1]);
        drawGhost(ghosts[2]);
        drawGhost(ghosts[3]);
        
        // Initial render
        render();
      })();
    </script>
  </body>
</html>
