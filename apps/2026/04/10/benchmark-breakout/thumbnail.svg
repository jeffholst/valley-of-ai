<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Benchmark Breakout game thumbnail">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1f" />
      <stop offset="50%" stop-color="#111b33" />
      <stop offset="100%" stop-color="#0b1226" />
    </linearGradient>
    <linearGradient id="paddleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5be3ff" />
      <stop offset="100%" stop-color="#7df28a" />
    </linearGradient>
    <linearGradient id="brickGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7ad8ff" />
      <stop offset="100%" stop-color="#3fa0ff" />
    </linearGradient>
    <linearGradient id="brickGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe" />
      <stop offset="100%" stop-color="#a855f7" />
