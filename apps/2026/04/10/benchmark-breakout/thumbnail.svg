<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Benchmark Breakout mid-game screenshot">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b18"/>
      <stop offset="100%" stop-color="#0e1a35"/>
    </linearGradient>
    <linearGradient id="paddle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="hud" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="br1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="br2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="br3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="br4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="br5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="ballFill" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>
    <radialGradient id="spark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="ballglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="1" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.06" stroke="#60a5fa" stroke-width="1">
    <line x1="0" y1="112" x2="800" y2="112"/>
    <line x1="0" y1="224" x2="800" y2="224"/>
    <line x1="0" y1="336" x2="800" y2="336"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
  </g>

  <!-- HUD bar -->
  <rect x="16" y="10" width="768" height="40" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <rect x="16" y="48" width="768" height="3" rx="1" fill="url(#hud)" opacity="0.6"/>
  <text x="32" y="36" fill="#94a3b8" font-family="monospace" font-size="13">SCORE</text>
  <text x="90" y="36" fill="#38bdf8" font-family="monospace" font-size="15" font-weight="700">24,880</text>
  <text x="210" y="36" fill="#94a3b8" font-family="monospace" font-size="13">LVL</text>
  <text x="244" y="36" fill="#a78bfa" font-family="monospace" font-size="15" font-weight="700">3</text>
  <text x="300" y="36" fill="#94a3b8" font-family="monospace" font-size="13">COMBO</text>
  <text x="364" y="36" fill="#fb923c" font-family="monospace" font-size="15" font-weight="700">x5</text>
  <text x="430" y="36" fill="#94a3b8" font-family="monospace" font-size="13">SPEED</text>
  <text x="492" y="36" fill="#4ade80" font-family="monospace" font-size="15" font-weight="700">1.4x</text>
  <text x="590" y="36" fill="#94a3b8" font-family="monospace" font-size="13">LIVES</text>
  <circle cx="648" cy="30" r="6" fill="#f472b6" filter="url(#glow)"/>
  <circle cx="664" cy="30" r="6" fill="#f472b6" filter="url(#glow)"/>
  <circle cx="680" cy="30" r="6" fill="#f472b6" filter="url(#glow)"/>

  <!-- Bricks: 8 cols, brick w=78 gap=12, left=46. 5 rows, brick h=22 gap=10, top=62 -->
  <!-- Row 1 (orange-red): positions 0,1,2,4,6 present -->
  <g filter="url(#soft)">
    <rect x="46" y="62" width="78" height="22" rx="4" fill="url(#br1)"/>
    <rect x="136" y="62" width="78" height="22" rx="4" fill="url(#br1)"/>
    <rect x="226" y="62" width="78" height="22" rx="4" fill="url(#br1)"/>
    <rect x="406" y="62" width="78" height="22" rx="4" fill="url(#br1)"/>
    <rect x="586" y="62" width="78" height="22" rx="4" fill="url(#br1)"/>
  </g>

  <!-- Row 2 (yellow-orange): positions 0,2,3,5,7 present -->
  <g filter="url(#soft)">
    <rect x="46" y="96" width="78" height="22" rx="4" fill="url(#br2)"/>
    <rect x="226" y="96" width="78" height="22" rx="4" fill="url(#br2)"/>
    <rect x="316" y="96" width="78" height="22" rx="4" fill="url(#br2)"/>
    <rect x="496" y="96" width="78" height="22" rx="4" fill="url(#br2)"/>
    <rect x="676" y="96" width="78" height="22" rx="4" fill="url(#br2)"/>
  </g>

  <!-- Row 3 (green): positions 0,1,3,4,6,7 present -->
  <g filter="url(#soft)">
    <rect x="46" y="130" width="78" height="22" rx="4" fill="url(#br3)"/>
    <rect x="136" y="130" width="78" height="22" rx="4" fill="url(#br3)"/>
    <rect x="316" y="130" width="78" height="22" rx="4" fill="url(#br3)"/>
    <rect x="406" y="130" width="78" height="22" rx="4" fill="url(#br3)"/>
    <rect x="586" y="130" width="78" height="22" rx="4" fill="url(#br3)"/>
    <rect x="676" y="130" width="78" height="22" rx="4" fill="url(#br3)"/>
  </g>

  <!-- Row 4 (blue): positions 1,2,4,5,6,7 present -->
  <g filter="url(#soft)">
    <rect x="136" y="164" width="78" height="22" rx="4" fill="url(#br4)"/>
    <rect x="226" y="164" width="78" height="22" rx="4" fill="url(#br4)"/>
    <rect x="406" y="164" width="78" height="22" rx="4" fill="url(#br4)"/>
    <rect x="496" y="164" width="78" height="22" rx="4" fill="url(#br4)"/>
    <rect x="586" y="164" width="78" height="22" rx="4" fill="url(#br4)"/>
    <rect x="676" y="164" width="78" height="22" rx="4" fill="url(#br4)"/>
  </g>

  <!-- Row 5 (purple): all 8 intact -->
  <g filter="url(#soft)">
    <rect x="46" y="198" width="78" height="22" rx="4" fill="url(#br5)"/>
    <rect x="136" y="198" width="78" height="22" rx="4" fill="url(#br5)"/>
    <rect x="226" y="198" width="78" height="22" rx="4" fill="url(#br5)"/>
    <rect x="316" y="198" width="78" height="22" rx="4" fill="url(#br5)"/>
    <rect x="406" y="198" width="78" height="22" rx="4" fill="url(#br5)"/>
    <rect x="496" y="198" width="78" height="22" rx="4" fill="url(#br5)"/>
    <rect x="586" y="198" width="78" height="22" rx="4" fill="url(#br5)"/>
    <rect x="676" y="198" width="78" height="22" rx="4" fill="url(#br5)"/>
  </g>

  <!-- Brick hit sparks near position 316,62 (recently destroyed brick) -->
  <circle cx="355" cy="72" r="18" fill="url(#spark)" opacity="0.7"/>
  <line x1="340" y1="58" x2="330" y2="46" stroke="#fde68a" stroke-width="1.5" opacity="0.6"/>
  <line x1="360" y1="56" x2="362" y2="43" stroke="#fde68a" stroke-width="1.5" opacity="0.5"/>
  <line x1="375" y1="62" x2="388" y2="54" stroke="#fb923c" stroke-width="1.5" opacity="0.6"/>
  <circle cx="332" cy="52" r="2" fill="#fde68a" opacity="0.8"/>
  <circle cx="364" cy="44" r="2" fill="#fde68a" opacity="0.7"/>
  <circle cx="386" cy="56" r="2" fill="#fb923c" opacity="0.7"/>

  <!-- Combo score popup -->
  <text x="320" y="50" fill="#fb923c" font-family="monospace" font-size="18" font-weight="700" opacity="0.9">+500 x5</text>

  <!-- Ball trail (fading dots showing trajectory) -->
  <circle cx="280" cy="328" r="4" fill="#38bdf8" opacity="0.15"/>
  <circle cx="300" cy="310" r="5" fill="#38bdf8" opacity="0.22"/>
  <circle cx="322" cy="290" r="6" fill="#7dd3fc" opacity="0.32"/>
  <circle cx="345" cy="268" r="8" fill="#bae6fd" opacity="0.45"/>

  <!-- Ball -->
  <circle cx="365" cy="248" r="13" fill="url(#ballFill)" filter="url(#ballglow)"/>

  <!-- Power-up pickup (wide paddle) -->
  <rect x="510" y="262" width="28" height="28" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="2" filter="url(#glow)"/>
  <text x="516" y="281" fill="#fbbf24" font-family="monospace" font-size="16" font-weight="700">W</text>

  <!-- Paddle -->
  <rect x="296" y="400" width="196" height="20" rx="10" fill="url(#paddle)" filter="url(#glow)"/>
  <!-- Paddle inner highlight -->
  <rect x="306" y="403" width="176" height="6" rx="3" fill="rgba(255,255,255,0.25)"/>

  <!-- Progress bar at bottom -->
  <rect x="46" y="432" width="708" height="8" rx="4" fill="rgba(255,255,255,0.07)"/>
  <rect x="46" y="432" width="354" height="8" rx="4" fill="url(#hud)" opacity="0.65"/>
  <text x="46" y="448" fill="#64748b" font-family="monospace" font-size="11">PROGRESS</text>
  <text x="694" y="448" fill="#64748b" font-family="monospace" font-size="11">50%</text>
</svg>
