    <style>
      :root {
        --bg: #090c22;
        --text: #f8fafc;
        --surface: #151a3a;
        --surface-soft: #20285a;
        --accent: #f97316;
        --accent-2: #22d3ee;
        --good: #34d399;
        --muted: #a5b4fc;
        --border: rgba(165, 180, 252, 0.35);
      }

      [data-theme='light'] {
        --bg: #f3f6ff;
        --text: #1e293b;
        --surface: #ffffff;
        --surface-soft: #e8eeff;
        --accent: #ea580c;
        --accent-2: #0284c7;
        --good: #059669;
        --muted: #4338ca;
        --border: rgba(67, 56, 202, 0.25);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 15% 15%, rgba(34, 211, 238, 0.18), transparent 40%),
          radial-gradient(circle at 85% 20%, rgba(249, 115, 22, 0.16), transparent 42%),
          linear-gradient(160deg, var(--bg), #10173a 65%);
      }

      main {
        width: min(900px, 100% - 1.2rem);
        margin: 0 auto;
        padding: 1rem 0 1.25rem;
        display: grid;
        gap: 0.9rem;
      }

      .card {
        background: color-mix(in oklab, var(--surface), transparent 12%);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 0.9rem;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.22);
      }

      h1 {
        font-size: clamp(1.2rem, 3.2vw, 1.7rem);
        margin: 0;
      }

      .sub {
        margin-top: 0.3rem;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .grid {
        display: grid;
        gap: 0.7rem;
      }

      .inputs {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      label {
        font-size: 0.85rem;
        color: var(--muted);
        display: grid;
        gap: 0.35rem;
      }

      input,
      select,
      button {
        min-height: 44px;
        border-radius: 12px;
        border: 1px solid var(--border);
        font: inherit;
      }

      input,
      select {
        background: var(--surface-soft);
        color: var(--text);
        padding: 0.55rem 0.65rem;
      }

      .actions {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      button {
        cursor: pointer;
        font-weight: 700;
        padding: 0.55rem 0.7rem;
      }

      .primary {
        background: linear-gradient(120deg, var(--accent), #fb923c);
        color: #fff;
      }

      .secondary {
        background: linear-gradient(120deg, var(--accent-2), #0ea5e9);
        color: #fff;
      }

      .hud {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.6rem;
      }

      .pill {
        background: color-mix(in oklab, var(--surface-soft), transparent 15%);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 0.5rem 0.55rem;
        text-align: center;
      }

      .pill span {
        display: block;
        font-size: 0.76rem;
        color: var(--muted);
      }

      .pill strong {
        display: block;
        margin-top: 0.2rem;
        font-size: 1rem;
      }

      .balls {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.6rem;
      }

      .ball {
        aspect-ratio: 1;
        border-radius: 999px;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: clamp(1.2rem, 5vw, 1.6rem);
        color: #fff;
        background:
          radial-gradient(circle at 28% 28%, rgba(255, 255, 255, 0.55), transparent 35%),
          linear-gradient(145deg, var(--accent-2), #6366f1);
        box-shadow:
          inset 0 -10px 16px rgba(0, 0, 0, 0.2),
          0 10px 20px rgba(14, 165, 233, 0.32);
        transition: transform 180ms ease;
      }

      .ball.pop {
        transform: scale(1.08);
      }

      .note {
        margin-top: 0.4rem;
        font-size: 0.88rem;
        color: var(--muted);
      }

      .good {
        color: var(--good);
        font-weight: 700;
      }

      @media (min-width: 760px) {
        main {
          grid-template-columns: 1.05fr 1fr;
          align-items: start;
        }

        .header-card {
          grid-column: 1 / -1;
        }

        .balls {
          grid-template-columns: repeat(6, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card header-card" aria-label="App intro">
        <h1>🎉 Birthday Luck Mixer</h1>
        <p class="sub">Turn dates into lucky picks. Mix your birthday, event date, and style, then save your hot combo.</p>
      </section>

      <section class="card" aria-label="Mixer controls">
        <div class="grid inputs">
          <label>
            Birthday
            <input id="birthday" type="date" />
          </label>
          <label>
            Event Date
            <input id="eventDate" type="date" />
          </label>
          <label>
            Style
            <select id="style">
              <option value="balanced">Balanced</option>
              <option value="risk">High Risk</option>
              <option value="steady">Steady</option>
            </select>
          </label>
          <label>
            Lucky Color
            <select id="color">
              <option value="sunrise">Sunrise</option>
              <option value="ocean">Ocean</option>
              <option value="violet">Violet</option>
            </select>
          </label>
        </div>

        <div class="grid actions" style="margin-top: 0.75rem">
          <button id="mixBtn" class="primary">Mix Numbers</button>
          <button id="rerollBtn" class="secondary">Reroll Bonus</button>
        </div>

        <p id="status" class="note" role="status" aria-live="polite">Ready to mix your first lucky set.</p>
      </section>

      <section class="card" aria-label="Lucky output board">
        <div class="hud">
          <div class="pill"><span>Mix Count</span><strong id="mixCount">0</strong></div>
          <div class="pill"><span>Luck Score</span><strong id="luckScore">--</strong></div>
          <div class="pill"><span>Best Streak</span><strong id="bestStreak">0</strong></div>
        </div>

        <div class="balls" id="ballGrid" style="margin-top: 0.8rem"></div>
        <p class="note">Numbers are in 1-49 range. Bonus number appears as <span class="good">green-highlight score boost</span>.</p>
      </section>
    </main>

    <script>
      /**
       * Birthday Luck Mixer
       * Creates deterministic-ish random numbers from two dates + preference inputs.
       * Supports keyboard usage through native controls and button activation.
       */
      const birthdayInput = document.getElementById('birthday');
      const eventDateInput = document.getElementById('eventDate');
      const styleSelect = document.getElementById('style');
      const colorSelect = document.getElementById('color');
      const mixBtn = document.getElementById('mixBtn');
      const rerollBtn = document.getElementById('rerollBtn');
      const status = document.getElementById('status');
      const ballGrid = document.getElementById('ballGrid');
      const mixCountEl = document.getElementById('mixCount');
      const luckScoreEl = document.getElementById('luckScore');
      const bestStreakEl = document.getElementById('bestStreak');

      let mixCount = 0;
      let bestStreak = 0;
      let currentScore = 0;
      let numbers = [7, 14, 21, 28, 35, 42];

      /** Small xorshift-like PRNG from integer seed. */
      function seeded(seed) {
        let x = (seed || 1) >>> 0;
        return () => {
          x ^= x << 13;
          x ^= x >>> 17;
          x ^= x << 5;
          return (x >>> 0) / 4294967296;
        };
      }

      /** Convert date string to numeric chunks that can seed RNG. */
      function toDateValue(dateStr) {
        if (!dateStr) return 11111;
        const digits = dateStr.replaceAll('-', '');
        return Number(digits) || 11111;
      }

      /**
       * Build six unique values 1..49 from mixed inputs.
       */
      function buildNumbers(withReroll = false) {
        const b = toDateValue(birthdayInput.value);
        const e = toDateValue(eventDateInput.value || new Date().toISOString().slice(0, 10));

        const styleBias = { balanced: 17, risk: 71, steady: 31 }[styleSelect.value];
        const colorBias = { sunrise: 29, ocean: 53, violet: 89 }[colorSelect.value];

        const baseSeed = b ^ (e * 3) ^ styleBias ^ colorBias ^ (withReroll ? Date.now() : 0) ^ mixCount;
        const rand = seeded(baseSeed);
        const set = new Set();

        while (set.size < 6) {
          set.add(Math.floor(rand() * 49) + 1);
        }

        numbers = [...set].sort((a, bVal) => a - bVal);
        const spread = numbers[5] - numbers[0];
        currentScore = Math.min(99, Math.round((spread + (numbers[2] % 11) * 2 + styleBias % 13) * 0.9));
        bestStreak = Math.max(bestStreak, currentScore > 70 ? bestStreak + 1 : 0);
      }

      /** Render number balls and animated pop effect. */
      function renderBalls() {
        ballGrid.innerHTML = '';
        numbers.forEach((num, index) => {
          const ball = document.createElement('div');
          ball.className = 'ball';
          ball.textContent = String(num);
          ball.setAttribute('aria-label', `Lucky number ${num}`);
          ballGrid.append(ball);
          requestAnimationFrame(() => {
            setTimeout(() => ball.classList.add('pop'), index * 45);
            setTimeout(() => ball.classList.remove('pop'), 280 + index * 45);
          });
        });
      }

      function refreshHud(message) {
        mixCountEl.textContent = String(mixCount);
        luckScoreEl.textContent = String(currentScore);
        bestStreakEl.textContent = String(bestStreak);
        status.textContent = message;
      }

      mixBtn.addEventListener('click', () => {
        mixCount += 1;
        buildNumbers(false);
        renderBalls();
        refreshHud(`Mix #${mixCount} ready. Luck score ${currentScore}.`);
      });

      rerollBtn.addEventListener('click', () => {
        if (mixCount === 0) {
          mixCount = 1;
        }
        buildNumbers(true);
        renderBalls();
        refreshHud(`Bonus reroll complete. New luck score ${currentScore}.`);
      });

      [birthdayInput, eventDateInput, styleSelect, colorSelect].forEach((el) => {
        el.addEventListener('change', () => {
          if (mixCount === 0) return;
          buildNumbers(false);
          renderBalls();
          refreshHud('Inputs updated and numbers remixed.');
        });
      });

      // Immediate usable first render.
      buildNumbers(false);
      renderBalls();
      refreshHud('Ready to mix your first lucky set.');
    </script>
  </body>
</html>
