<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Mental Gymnastics multiplayer lobby, voting, and round results">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" />
  <rect x="24" y="20" width="752" height="410" rx="18" fill="rgba(15,23,42,0.56)" stroke="rgba(148,163,184,0.2)" />

  <text x="56" y="56" fill="#e2e8f0" font-size="24" font-weight="800" font-family="Segoe UI, sans-serif">Mental Gymnastics</text>
  <text x="56" y="80" fill="#94a3b8" font-size="13" font-family="Segoe UI, sans-serif">Multiplayer share link + synchronized voting</text>

  <rect x="52" y="100" width="328" height="140" rx="12" fill="#1e293b" stroke="#334155" />
  <text x="72" y="126" fill="#38bdf8" font-size="13" font-weight="800" font-family="Segoe UI, sans-serif">LOBBY SHARE LINK</text>
  <rect x="72" y="136" width="288" height="34" rx="8" fill="#0f172a" stroke="#334155" />
  <text x="82" y="158" fill="#e2e8f0" font-size="10" font-family="Segoe UI, sans-serif">https://.../mental-gymnastics#join=K7M4PQ</text>
  <rect x="72" y="178" width="104" height="30" rx="8" fill="url(#accent)" />
  <text x="124" y="198" fill="#fff" font-size="12" text-anchor="middle" font-weight="700" font-family="Segoe UI, sans-serif">Copy Link</text>
  <text x="72" y="224" fill="#94a3b8" font-size="11" font-family="Segoe UI, sans-serif">4 players joined and waiting</text>

  <rect x="412" y="100" width="336" height="310" rx="12" fill="#1e293b" stroke="#334155" />
  <text x="432" y="126" fill="#a78bfa" font-size="13" font-weight="800" font-family="Segoe UI, sans-serif">ROUND 2 OF 5 · LOGIC</text>
  <text x="700" y="126" fill="#f59e0b" font-size="13" font-weight="800" text-anchor="end" font-family="Segoe UI, sans-serif">0:12</text>
  <text x="432" y="152" fill="#f8fafc" font-size="13" font-family="Segoe UI, sans-serif">If it rains, the ground is wet. What can we conclude?</text>

  <rect x="432" y="168" width="144" height="42" rx="9" fill="#0f172a" stroke="#334155" />
  <text x="444" y="194" fill="#e2e8f0" font-size="11" font-family="Segoe UI, sans-serif">A. It rained</text>
  <rect x="588" y="168" width="144" height="42" rx="9" fill="#0f172a" stroke="#38bdf8" />
  <text x="600" y="194" fill="#e2e8f0" font-size="11" font-family="Segoe UI, sans-serif">B. It may have rained</text>
  <rect x="432" y="218" width="144" height="42" rx="9" fill="#0f172a" stroke="#334155" />
  <text x="444" y="244" fill="#e2e8f0" font-size="11" font-family="Segoe UI, sans-serif">C. It did not rain</text>
  <rect x="588" y="218" width="144" height="42" rx="9" fill="#0f172a" stroke="#334155" />
  <text x="600" y="244" fill="#e2e8f0" font-size="11" font-family="Segoe UI, sans-serif">D. Impossible</text>

  <rect x="432" y="272" width="300" height="128" rx="10" fill="#0f172a" stroke="#334155" />
  <text x="446" y="294" fill="#94a3b8" font-size="11" font-family="Segoe UI, sans-serif">Round Votes</text>
  <text x="446" y="318" fill="#22c55e" font-size="11" font-family="Segoe UI, sans-serif">Alex — B (Correct)</text>
  <text x="446" y="338" fill="#60a5fa" font-size="11" font-family="Segoe UI, sans-serif">Taylor — A (Wrong)</text>
  <text x="446" y="358" fill="#22c55e" font-size="11" font-family="Segoe UI, sans-serif">Jordan — B (Correct)</text>
  <text x="446" y="378" fill="#60a5fa" font-size="11" font-family="Segoe UI, sans-serif">Casey — D (Wrong)</text>
</svg>
