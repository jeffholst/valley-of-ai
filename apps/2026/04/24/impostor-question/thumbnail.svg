<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">The Impostor Question thumbnail</title>
  <desc id="desc">A Zoom-style hidden-role game with a shared topic card, vague question, simultaneous answers, and a unified player grid used for both status tracking and vote casting.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827" />
      <stop offset="0.48" stop-color="#172033" />
      <stop offset="1" stop-color="#0b1120" />
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf" />
      <stop offset="1" stop-color="#99f6e4" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24" />
      <stop offset="1" stop-color="#fde68a" />
    </linearGradient>
    <radialGradient id="dangerGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#fb7185" stop-opacity="0.75" />
      <stop offset="1" stop-color="#fb7185" stop-opacity="0" />
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur" />
      <feOffset dx="0" dy="10" result="offset" />
      <feMerge>
        <feMergeNode in="offset" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="titleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="800" height="450" fill="url(#bg)" />
  <circle cx="116" cy="56" r="160" fill="#2dd4bf" opacity="0.13" />
  <circle cx="700" cy="38" r="150" fill="#fbbf24" opacity="0.12" />
  <path d="M0 358 C160 312 256 410 420 354 C566 304 662 328 800 286 L800 450 L0 450 Z" fill="#0b1120" opacity="0.45" />

  <text x="42" y="62" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="34" font-weight="900" filter="url(#titleGlow)">The Impostor Question</text>
  <text x="44" y="91" fill="#aab8d3" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700">One shared topic. One player bluffing. Everyone votes.</text>
  <rect x="622" y="34" width="132" height="36" rx="18" fill="url(#teal)" />
  <text x="648" y="58" fill="#08111f" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="900">ROOM G7K2Q</text>

  <!-- Main card: role + question + vote prompt -->
  <g filter="url(#softShadow)">
    <rect x="42" y="112" width="436" height="298" rx="18" fill="#172033" stroke="#40506f" />

    <!-- Role card -->
    <rect x="62" y="132" width="192" height="86" rx="14" fill="#22304a" stroke="#2dd4bf" />
    <text x="82" y="158" fill="#aab8d3" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="900">YOUR SHARED TOPIC</text>
    <text x="82" y="196" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="32" font-weight="900">Coffee</text>

    <!-- Question card -->
    <rect x="268" y="132" width="190" height="86" rx="14" fill="#22304a" stroke="#fbbf24" />
    <text x="286" y="158" fill="#aab8d3" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="900">QUESTION</text>
    <text x="286" y="186" fill="#fbbf24" font-family="Inter, Segoe UI, sans-serif" font-size="19" font-weight="900">What's your</text>
    <text x="286" y="208" fill="#fbbf24" font-family="Inter, Segoe UI, sans-serif" font-size="19" font-weight="900">favorite start?</text>

    <!-- Vote heading and instruction -->
    <text x="62" y="252" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="900">Who is the impostor?</text>
    <text x="62" y="274" fill="#aab8d3" font-family="Inter, Segoe UI, sans-serif" font-size="13">Select a player in the grid to cast your vote.</text>

    <!-- Impostor wait card -->
    <rect x="62" y="290" width="396" height="88" rx="14" fill="#22304a" stroke="#40506f" />
    <text x="260" y="320" fill="#aab8d3" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="900" text-anchor="middle">YOU ARE THE IMPOSTOR</text>
    <text x="260" y="342" fill="#aab8d3" font-family="Inter, Segoe UI, sans-serif" font-size="13" text-anchor="middle">Stay quiet — wait while others vote.</text>
    <text x="260" y="360" fill="#2dd4bf" font-family="Inter, Segoe UI, sans-serif" font-size="12" text-anchor="middle">3 of 4 votes cast.</text>
    <rect x="180" y="367" width="160" height="2" rx="2" fill="#40506f" />
  </g>

  <!-- Aside: unified player grid for Room board / voting -->
  <g filter="url(#softShadow)">
    <rect x="506" y="112" width="256" height="298" rx="18" fill="#172033" stroke="#40506f" />
    <text x="530" y="148" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="900">Room board</text>

    <!-- Player card: Maya — voted-for (gold) -->
    <rect x="522" y="160" width="110" height="80" rx="12" fill="#22304a" stroke="#fbbf24" />
    <rect x="522" y="160" width="110" height="80" rx="12" fill="url(#gold)" opacity="0.08" />
    <text x="534" y="183" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="900">Maya</text>
    <text x="534" y="200" fill="#aab8d3" font-family="Inter, Segoe UI, sans-serif" font-size="11">2 pts · voted</text>
    <text x="534" y="217" fill="#aab8d3" font-family="Inter, Segoe UI, sans-serif" font-size="11">"Warm ritual..."</text>
    <text x="534" y="232" fill="#fbbf24" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="900">← your vote</text>

    <!-- Player card: Lee — votable (teal hover) -->
    <rect x="642" y="160" width="110" height="80" rx="12" fill="#22304a" stroke="rgba(45,212,191,0.4)" />
    <text x="654" y="183" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="900">Lee</text>
    <text x="654" y="200" fill="#aab8d3" font-family="Inter, Segoe UI, sans-serif" font-size="11">2 pts · voted</text>
    <text x="654" y="217" fill="#aab8d3" font-family="Inter, Segoe UI, sans-serif" font-size="11">"Always first..."</text>

    <!-- Player card: Jordan — me (teal border) -->
    <rect x="522" y="252" width="110" height="80" rx="12" fill="#22304a" stroke="#2dd4bf" />
    <text x="534" y="275" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="900">Jordan</text>
    <text x="534" y="292" fill="#aab8d3" font-family="Inter, Segoe UI, sans-serif" font-size="11">4 pts · voted</text>
    <text x="534" y="309" fill="#aab8d3" font-family="Inter, Segoe UI, sans-serif" font-size="11">"Something..."</text>
    <text x="534" y="324" fill="#2dd4bf" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="800">(you)</text>

    <!-- Player card: Sam — impostor (red), waiting -->
    <rect x="642" y="252" width="110" height="80" rx="12" fill="#22304a" stroke="#fb7185" />
    <circle cx="670" cy="268" r="14" fill="url(#dangerGlow)" />
    <text x="654" y="275" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="900">Sam</text>
    <text x="654" y="292" fill="#aab8d3" font-family="Inter, Segoe UI, sans-serif" font-size="11">0 pts · waiting</text>
    <text x="654" y="309" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="800">impostor</text>

    <!-- Moderator reveal button -->
    <rect x="522" y="348" width="230" height="40" rx="12" fill="url(#gold)" />
    <text x="637" y="373" fill="#201400" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="900" text-anchor="middle">Reveal votes</text>
  </g>
</svg>
