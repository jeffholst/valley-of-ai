<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feOffset dx="0" dy="4" result="offsetblur" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="450" fill="url(#bgGrad)" />
  
  <!-- Decorative Grid -->
  <path d="M0 100 L800 100 M0 200 L800 200 M0 300 L800 300 M100 0 L100 450 M200 0 L200 450 M300 0 L300 450 M400 0 L400 450 M500 0 L500 450 M600 0 L600 450 M700 0 L700 450" 
        stroke="#334155" stroke-width="1" opacity="0.3" />

  <!-- App Interface Mockup -->
  <rect x="150" y="100" width="500" height="250" rx="20" fill="#1e293b" filter="url(#dropShadow)" />
  
  <!-- Palette Swatches -->
  <rect x="170" y="140" width="80" height="120" rx="8" fill="#38bdf8" filter="url(#glow)" />
  <rect x="260" y="140" width="80" height="120" rx="8" fill="#818cf8" filter="url(#glow)" />
  <rect x="350" y="140" width="80" height="120" rx="8" fill="#c084fc" filter="url(#glow)" />
  <rect x="440" y="140" width="80" height="120" rx="8" fill="#fb7185" filter="url(#glow)" />
  <rect x="530" y="140" width="80" height="120" rx="8" fill="#fbbf24" filter="url(#glow)" />

  <!-- Mock Controls -->
  <rect x="200" y="280" width="120" height="40" rx="8" fill="#38bdf8" filter="url(#dropShadow)" />
  <text x="260" y="305" text-anchor="middle" fill="white" font-family="sans-serif" font-weight="bold" font-size="14">Generate</text>
  
  <rect x="340" y="280" width="120" height="40" rx="8" fill="#334155" filter="url(#dropShadow)" />
  <text x="400" y="305" text-anchor="middle" fill="#f9fafb" font-family="sans-serif" font-size="14">Harmony</text>
  
  <rect x="480" y="280" width="120" height="40" rx="8" fill="#334155" filter="url(#dropShadow)" />
  <text x="540" y="305" text-anchor="middle" fill="#f9fafb" font-family="sans-serif" font-size="14">Copy CSS</text>

  <!-- App Title -->
  <text x="400" y="70" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-weight="900" font-size="42" filter="url(#glow)">CHROMA PALETTE PRO</text>
  <text x="400" y="100" text-anchor="middle" fill="#f9fafb" font-family="sans-serif" font-size="18" opacity="0.7">Generative Harmony &amp; CSS Architect</text>

  <!-- Corner Accents -->
  <circle cx="0" cy="0" r="100" fill="#38bdf8" opacity="0.1" filter="blur(40px)" />
  <circle cx="800" cy="450" r="150" fill="#c084fc" opacity="0.1" filter="blur(60px)" />
</svg>
