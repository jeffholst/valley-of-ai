<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Fortune Streak Studio thumbnail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#130f26" />
      <stop offset="55%" stop-color="#26124d" />
      <stop offset="100%" stop-color="#3b1b63" />
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#31245c" />
      <stop offset="100%" stop-color="#231a42" />
    </linearGradient>
    <linearGradient id="buttonGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffbe62" />
      <stop offset="100%" stop-color="#ffde93" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="url(#bg)" />
  <circle cx="95" cy="80" r="120" fill="#4a2f7a" opacity="0.22" />
  <circle cx="715" cy="60" r="130" fill="#5b2b83" opacity="0.2" />

  <rect x="36" y="26" width="728" height="398" rx="24" fill="url(#panel)" stroke="#76e4f7" stroke-opacity="0.35" />

  <text x="62" y="76" font-size="40" font-family="Trebuchet MS, Segoe UI, sans-serif" fill="#f9f5ff" filter="url(#glow)">
    Fortune Streak Studio
  </text>
  <text x="62" y="104" font-size="18" font-family="Trebuchet MS, Segoe UI, sans-serif" fill="#c6b8f0">
    Spin for ritual, mood, and lucky symbol
  </text>

  <rect x="542" y="50" width="96" height="44" rx="22" fill="#3d2c72" stroke="#76e4f7" stroke-opacity="0.4" />
  <text x="590" y="78" text-anchor="middle" font-size="18" font-family="Trebuchet MS, Segoe UI, sans-serif" fill="#f9f5ff">🔥 5</text>
  <rect x="652" y="50" width="96" height="44" rx="22" fill="#3d2c72" stroke="#76e4f7" stroke-opacity="0.4" />
  <text x="700" y="78" text-anchor="middle" font-size="18" font-family="Trebuchet MS, Segoe UI, sans-serif" fill="#f9f5ff">🎰 17</text>

  <rect x="62" y="126" width="210" height="120" rx="16" fill="#2d2057" stroke="#ffbe62" stroke-opacity="0.55" />
  <rect x="295" y="126" width="210" height="120" rx="16" fill="#2d2057" stroke="#ffbe62" stroke-opacity="0.55" />
  <rect x="528" y="126" width="210" height="120" rx="16" fill="#2d2057" stroke="#ffbe62" stroke-opacity="0.55" />

  <text x="167" y="194" text-anchor="middle" font-size="30" font-weight="700" font-family="Trebuchet MS, Segoe UI, sans-serif" fill="#f9f5ff">Ship a Draft</text>
  <text x="400" y="194" text-anchor="middle" font-size="30" font-weight="700" font-family="Trebuchet MS, Segoe UI, sans-serif" fill="#f9f5ff">Champion</text>
  <text x="633" y="194" text-anchor="middle" font-size="30" font-weight="700" font-family="Trebuchet MS, Segoe UI, sans-serif" fill="#f9f5ff">🍀 Clover</text>

  <rect x="62" y="272" width="676" height="56" rx="14" fill="#231a42" stroke="#76e4f7" stroke-opacity="0.45" />
  <text x="78" y="306" font-size="24" font-family="Trebuchet MS, Segoe UI, sans-serif" fill="#7ef0a9">
    Today's cue: Fearless energy unlocks luck when you ship a draft today.
  </text>

  <rect x="62" y="344" width="440" height="54" rx="14" fill="url(#buttonGrad)" />
  <text x="282" y="378" text-anchor="middle" font-size="24" font-weight="700" font-family="Trebuchet MS, Segoe UI, sans-serif" fill="#2a1632">
    Spin Fortune
  </text>

  <rect x="518" y="344" width="220" height="54" rx="14" fill="#3a2b6b" stroke="#ffbe62" stroke-opacity="0.6" />
  <text x="628" y="378" text-anchor="middle" font-size="22" font-family="Trebuchet MS, Segoe UI, sans-serif" fill="#f9f5ff">
    Energy: Bold
  </text>
