<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fortune Streak Studio - __MAIN_SITE_NAME__</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=__GA_MEASUREMENT_ID__"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', '__GA_MEASUREMENT_ID__');
    </script>

    <meta name="voa-main-site-url" content="__MAIN_SITE_URL__" />
    <meta name="voa-main-site-name" content="__MAIN_SITE_NAME__" />
    <meta name="voa-github-url" content="__GITHUB_URL__" />
    <meta name="voa-social-x-url" content="__SOCIAL_X_URL__" />
    <meta name="voa-social-facebook-url" content="__SOCIAL_FACEBOOK_URL__" />
    <meta name="voa-social-instagram-url" content="__SOCIAL_INSTAGRAM_URL__" />
    <meta name="application-name" content="Fortune Streak Studio" />
    <meta name="voa-app-id" content="2026/04/03/fortune-streak-studio" />
    <script src="/apps/shared/app-shell.js" defer></script>
    <link rel="icon" type="image/svg+xml" href="thumbnail.svg" />
    <style>
      :root {
        --bg: #130f26;
        --text: #f9f5ff;
        --surface: #231a42;
        --surface-strong: #31245c;
        --accent: #ffbe62;
        --accent-2: #76e4f7;
        --good: #7ef0a9;
        --muted: #c6b8f0;
      }

      [data-theme='light'] {
        --bg: #f8f3ff;
        --text: #2b1f4a;
        --surface: #ffffff;
        --surface-strong: #efe4ff;
        --accent: #d68621;
        --accent-2: #1f9bb2;
        --good: #1f9a5f;
        --muted: #6f5a9a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
        background:
          radial-gradient(circle at 10% 20%, #26124d 0, transparent 45%),
          radial-gradient(circle at 90% 10%, #3b1b63 0, transparent 40%), var(--bg);
        color: var(--text);
      }

      main {
        width: min(900px, 100%);
        margin: 0 auto;
        padding: 16px 14px 20px;
      }

      .card {
        background: linear-gradient(145deg, color-mix(in srgb, var(--surface), #fff 4%), var(--surface));
        border: 1px solid color-mix(in srgb, var(--accent-2), transparent 70%);
        border-radius: 18px;
        padding: 14px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.25);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.4rem, 5vw, 2rem);
      }

      .subtitle {
        color: var(--muted);
        margin-top: 4px;
        margin-bottom: 12px;
      }

      .top-row {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .chip {
        min-height: 44px;
        padding: 10px 12px;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        background: color-mix(in srgb, var(--surface-strong), #fff 8%);
        color: var(--text);
      }

      .studio {
        margin-top: 12px;
        display: grid;
        gap: 12px;
      }

      .reels {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .reel {
        min-height: 96px;
        border-radius: 14px;
        border: 1px solid color-mix(in srgb, var(--accent), transparent 50%);
        background: color-mix(in srgb, var(--surface-strong), #000 10%);
        display: grid;
        place-items: center;
        text-align: center;
        font-size: clamp(0.9rem, 3.7vw, 1.1rem);
        font-weight: 700;
        padding: 8px;
        transition: transform 220ms ease, box-shadow 220ms ease;
      }

      .reel.spin {
        animation: pulseSpin 420ms ease;
        box-shadow: 0 0 18px color-mix(in srgb, var(--accent-2), transparent 50%);
      }

      @keyframes pulseSpin {
        0% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px) scale(1.03);
        }
        100% {
          transform: translateY(0);
        }
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
      }

      button,
      select {
        min-height: 46px;
        border-radius: 12px;
        border: 1px solid color-mix(in srgb, var(--accent), transparent 50%);
        background: var(--surface);
        color: var(--text);
        padding: 10px 12px;
        font-size: 1rem;
      }

      button {
        font-weight: 700;
        cursor: pointer;
        background: linear-gradient(120deg, var(--accent), #ffde93);
        color: #2a1632;
      }

      button:focus-visible,
      select:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--accent-2), white 20%);
        outline-offset: 2px;
      }

      .fortune {
        margin-top: 12px;
        border-left: 4px solid var(--accent-2);
        padding-left: 10px;
        min-height: 64px;
      }

      .fortune strong {
        color: var(--good);
      }

      .history {
        margin-top: 12px;
        display: grid;
        gap: 8px;
      }

      .history-item {
        border-radius: 12px;
        border: 1px solid color-mix(in srgb, var(--accent-2), transparent 65%);
        padding: 10px;
        background: color-mix(in srgb, var(--surface), #fff 5%);
        font-size: 0.95rem;
      }

      @media (min-width: 700px) {
        .top-row {
          grid-template-columns: 1fr auto;
          align-items: center;
        }

        .controls {
          grid-template-columns: 1fr auto;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-label="Fortune generator studio">
        <div class="top-row">
          <div>
            <h1>Fortune Streak Studio</h1>
            <p class="subtitle">Spin for a daily ritual, mood focus, and lucky symbol.</p>
          </div>
          <div class="chips" aria-live="polite">
            <div class="chip" id="streakChip">🔥 Streak: 0</div>
            <div class="chip" id="spinsChip">🎰 Spins: 0</div>
          </div>
        </div>

        <div class="studio">
          <div class="reels" aria-label="Fortune reels">
            <div class="reel" id="reelRitual">Breathe + Stretch</div>
            <div class="reel" id="reelMood">Calm Focus</div>
            <div class="reel" id="reelSymbol">🌙 Moon</div>
          </div>

          <div class="controls">
            <label>
              Energy level
              <select id="energySelect" aria-label="Choose energy level">
                <option value="soft">Soft</option>
                <option value="steady" selected>Steady</option>
                <option value="bold">Bold</option>
              </select>
            </label>
            <button id="spinBtn" type="button">Spin Fortune (Space)</button>
          </div>
        </div>

        <div class="fortune" id="fortuneText" aria-live="polite">
          <strong>Today's cue:</strong> Your next win starts with one tiny action.
        </div>

        <div class="history" id="historyList" aria-label="Recent fortunes"></div>
      </section>
    </main>

    <script>
      /**
       * Fortune Streak Studio - single-page interactive ritual generator.
       * Features:
       * - Keyboard and touch accessible spin control
       * - LocalStorage streak + spin count persistence
       * - Themed reel outputs based on selected energy level
       */
      (() => {
        const reels = {
          ritual: document.getElementById('reelRitual'),
          mood: document.getElementById('reelMood'),
          symbol: document.getElementById('reelSymbol'),
        };
        const spinBtn = document.getElementById('spinBtn');
        const energySelect = document.getElementById('energySelect');
        const streakChip = document.getElementById('streakChip');
        const spinsChip = document.getElementById('spinsChip');
        const fortuneText = document.getElementById('fortuneText');
        const historyList = document.getElementById('historyList');

        const pools = {
          soft: {
            ritual: ['Tea + Journal', 'Breathe + Stretch', 'Walk 10 Minutes', 'Declutter One Spot'],
            mood: ['Calm Focus', 'Gentle Momentum', 'Quiet Confidence', 'Open Curiosity'],
          },
          steady: {
            ritual: ['Plan 3 Priorities', 'Inbox Zero Sprint', 'Hydrate + Reset', 'Practice 20 Minutes'],
            mood: ['Grounded Drive', 'Clear Presence', 'Steady Courage', 'Practical Optimism'],
          },
          bold: {
            ritual: ['Pitch the Idea', 'Ship a Draft Today', 'Cold Outreach x3', 'Try the Hard Task'],
            mood: ['Fearless Energy', 'Playful Audacity', 'High-Voltage Clarity', 'Champion Focus'],
          },
          symbol: ['🌙 Moon', '⭐ Star', '🧿 Charm', '🍀 Clover', '🪙 Coin', '🕯️ Candle'],
        };

        const state = {
          streak: Number(localStorage.getItem('fortuneStreak') || 0),
          spins: Number(localStorage.getItem('fortuneSpins') || 0),
          lastSpinDate: localStorage.getItem('fortuneLastSpinDate') || '',
          history: JSON.parse(localStorage.getItem('fortuneHistory') || '[]'),
        };

        const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

        function updateBadges() {
          streakChip.textContent = `🔥 Streak: ${state.streak}`;
          spinsChip.textContent = `🎰 Spins: ${state.spins}`;
        }

        function renderHistory() {
          historyList.innerHTML = '';
          state.history.slice(0, 3).forEach((item) => {
            const entry = document.createElement('article');
            entry.className = 'history-item';
            entry.textContent = `${item.date}: ${item.ritual} • ${item.mood} • ${item.symbol}`;
            historyList.appendChild(entry);
          });
        }

        function persist() {
          localStorage.setItem('fortuneStreak', String(state.streak));
          localStorage.setItem('fortuneSpins', String(state.spins));
          localStorage.setItem('fortuneLastSpinDate', state.lastSpinDate);
          localStorage.setItem('fortuneHistory', JSON.stringify(state.history.slice(0, 8)));
        }

        function animateReels() {
          Object.values(reels).forEach((el) => {
            el.classList.remove('spin');
            void el.offsetWidth;
            el.classList.add('spin');
          });
        }

        function spin() {
          const energy = energySelect.value;
          const ritual = pick(pools[energy].ritual);
          const mood = pick(pools[energy].mood);
          const symbol = pick(pools.symbol);

          reels.ritual.textContent = ritual;
          reels.mood.textContent = mood;
          reels.symbol.textContent = symbol;

          animateReels();

          const now = new Date();
          const today = now.toISOString().slice(0, 10);
          if (state.lastSpinDate !== today) {
            const prev = new Date(state.lastSpinDate);
            const diffDays = Number.isFinite(prev.getTime())
              ? Math.round((now - prev) / (1000 * 60 * 60 * 24))
              : null;
            state.streak = diffDays === 1 ? state.streak + 1 : 1;
            state.lastSpinDate = today;
          }

          state.spins += 1;
          state.history.unshift({ date: today, ritual, mood, symbol });

          fortuneText.innerHTML = `<strong>Today's cue:</strong> ${mood} unlocks luck when you ${ritual.toLowerCase()}. Carry ${symbol} energy into your next move.`;

          updateBadges();
          renderHistory();
          persist();
        }

        spinBtn.addEventListener('click', spin);
        document.addEventListener('keydown', (event) => {
          if (event.code === 'Space') {
            event.preventDefault();
            spin();
          }
        });

        updateBadges();
        renderHistory();
      })();
    </script>
  </body>
</html>
