<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="textShadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="black" />
    </filter>
  </defs>
  
  <rect x="0" y="0" width="800" height="450" fill="url(#bgGrad)" />
  
  <!-- Decorative background elements -->
  <circle cx="700" cy="100" r="50" fill="var(--primary)" opacity="0.1" />
  <circle cx="100" cy="350" r="80" fill="var(--primary)" opacity="0.05" />

  <!-- The Wheel -->
  <g transform="translate(400, 230)">
    <!-- Wheel Glow -->
    <circle r="160" fill="#f59e0b" opacity="0.2" filter="url(#glow)" />
    
    <!-- Wheel Body -->
    <circle r="150" fill="#1e293b" stroke="#334155" stroke-width="12" />
    
    <!-- Slices (Example mid-spin state) -->
    <g id="slices">
      <!-- Pizza -->
      <path d="M 0 0 L 0 -150 A 150 150 0 0 1 130 -50 Z" fill="#ef4444" stroke="rgba(0,0,0,0.2)" stroke-width="2" />
      <!-- Sushi -->
      <path d="M 0 0 L 130 -50 A 150 150 0 0 1 100 80 Z" fill="#3b82f6" stroke="rgba(0,0,0,0.2)" stroke-width="2" />
      <!-- Tacos -->
      <path d="M 0 0 L 100 80 A 150 150 0 0 1 -50 110 Z" fill="#10b981" stroke="rgba(0,0,0,0.2)" stroke-width="2" />
      <!-- Salad -->
      <path d="M 0 0 L -50 110 A 150 150 0 0 1 -130 50 Z" fill="#f59e0b" stroke="rgba(0,0,0,0.2)" stroke-width="2" />
      <!-- Burger -->
      <path d="M 0 0 L -130 50 A 150 150 0 0 1 -100 -80 Z" fill="#8b5cf6" stroke="rgba(0,0,0,0.2)" stroke-width="2" />
      <!-- Pasta -->
      <path d="M 0 0 L -100 -80 A 150 150 0 0 1 0 -150 Z" fill="#ec4899" stroke="rgba(0,0,0,0.2)" stroke-width="2" />
    </g>
    
    <!-- Center Hub -->
    <circle r="30" fill="#334155" stroke="white" stroke-width="4" />
    
    <!-- Pointer -->
    <path d="M -20 -160 L 0 -130 L 20 -160 Z" fill="#ef4444" filter="url(#glow)" />
  </g>

  <!-- App Title -->
  <text x="400" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="48" fill="#f59e0b" filter="url(#textShadow)">
    FORTUNE WHEEL DELUXE
  </text>
  
  <!-- Subtitle/UI Hint -->
  <text x="400" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#94a3b8">
    Who decides your fate today?
  </text>
</svg>
