    <style>
        :root {
            --bg: #0f172a;
            --text: #f9fafb;
            --surface: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #7dd3fc;
            --danger: #ef4444;
            --border: #334155;
        }

        [data-theme='light'] {
            --bg: #f8fafc;
            --text: #0f172a;
            --surface: #ffffff;
            --accent: #0284c7;
            --accent-hover: #0369a1;
            --danger: #dc2626;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh;
        }

        #appWrapper {
            position: fixed;
            top: 64px;
            bottom: 56px;
            left: 0;
            right: 0;
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 16px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .title-group h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .title-group p {
            margin: 4px 0 0 0;
            font-size: 0.875rem;
            opacity: 0.7;
        }

        .canvas-container {
            flex: 1;
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            cursor: crosshair;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .controls-panel {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            align-items: end;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            opacity: 0.6;
            letter-spacing: 0.05em;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        input[type="color"] {
            width: 100%;
            height: 40px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: none;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 16px;
            height: 40px;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            user-select: none;
        }

        .btn-primary {
            background-color: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-danger {
            background-color: transparent;
            border-color: var(--danger);
            color: var(--danger);
        }

        .btn-danger:hover {
            background-color: var(--danger);
            color: white;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .stats-overlay {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 8px 12px;
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            border-radius: 8px;
            color: white;
            font-size: 0.75rem;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <div id="appWrapper">
        <div class="header-area">
            <div class="title-group">
                <h1>Chroma Flow Designer</h1>
                <p>Create generative fluid patterns</p>
            </div>
        </div>

        <div class="canvas-container" id="container">
            <div class="stats-overlay" id="stats">Particles: 0</div>
            <canvas id="canvas"></canvas>
        </div>

        <div class="controls-panel">
            <div class="control-group">
                <label>Base Color</label>
                <input type="color" id="colorPicker" value="#38bdf8">
            </div>
            <div class="control-group">
                <label>Flow Speed</label>
                <input type="range" id="speedRange" min="0.1" max="5" step="0.1" value="1.0">
            </div>
            <div class="control-group">
                <label>Particle Size</label>
                <input type="range" id="sizeRange" min="1" max="10" step="0.5" value="2">
            </div>
            <div class="control-group" style="flex-direction: row; gap: 8px;">
                <button class="btn btn-primary" id="saveBtn">Export</button>
                <button class="btn btn-danger" id="clearBtn">Reset</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * Chroma Flow Designer
         * Generative art app using a flow field (Simplex-like) 
         * for fluid particle movement.
         */
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('container');
        const statsEl = document.getElementById('stats');
        
        const colorPicker = document.getElementById('colorPicker');
        const speedRange = document.getElementById('speedRange');
        const sizeRange = document.getElementById('sizeRange');
        const clearBtn = document.getElementById('clearBtn');
        const saveBtn = document.getElementById('saveBtn');

        let width, height;
        let particles = [];
        let flowField = [];
        let resolution = 20;
        let cols, rows;
        let zOffset = 0;

        class Particle {
            constructor() {
                this.init();
            }

            init() {
                this.pos = { x: Math.random() * width, y: Math.random() * height };
                this.vel = { x: 0, y: 0 };
                this.acc = { x: 0, y: 0 };
                this.maxSpeed = 2;
                this.prevPos = { ...this.pos };
                this.life = Math.random() * 100 + 100;
            }

            update() {
                this.prevPos = { ...this.pos };
                
                // Get flow field vector
                const x = Math.floor(this.pos.x / resolution);
                const y = Math.floor(this.pos.y / resolution);
                
                if (x >= 0 && x < cols && y >= 0 && y < rows) {
                    const index = x + y * cols;
                    const force = flowField[index];
                    this.applyForce(force);
                }

                this.vel.x += this.acc.x;
                this.vel.y += this.acc.y;
                
                const speed = Math.sqrt(this.vel.x**2 + this.vel.y**2);
                if (speed > this.maxSpeed) {
                    this.vel.x = (this.vel.x / speed) * this.maxSpeed;
                    this.vel.y = (this.vel.y / speed) * this.maxSpeed;
                }

                this.pos.x += this.vel.x;
                this.pos.y += this.vel.y;
                this.acc = { x: 0, y: 0 };
                this.life--;

                if (this.pos.x < 0 || this.pos.x > width || this.pos.y < 0 || this.pos.y > height || this.life <= 0) {
                    this.init();
                }
            }

            applyForce(force) {
                this.acc.x += force.x;
                this.acc.y += force.y;
            }

            draw() {
                ctx.beginPath();
                ctx.moveTo(this.prevPos.x, this.prevPos.y);
                ctx.lineTo(this.pos.x, this.pos.y);
                ctx.stroke();
            }
        }

        function initCanvas() {
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width;
            canvas.height = height;
            
            cols = Math.floor(width / resolution) + 1;
            rows = Math.floor(height / resolution) + 1;
            
            // Create initial particles
            particles = [];
            for (let i = 0; i < 1000; i++) {
                particles.push(new Particle());
            }
            
            // Clear canvas for a fresh start
            ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--bg');
            ctx.fillRect(0, 0, width, height);
        }

        function updateFlowField() {
            flowField = [];
            const speedMult = parseFloat(speedRange.value);
            
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    // Simple trigonometric noise approximation
                    const angle = (Math.sin(x * 0.1) + Math.cos(y * 0.1) + Math.sin(zOffset)) * Math.PI;
                    flowField.push({
                        x: Math.cos(angle) * speedMult * 0.1,
                        y: Math.sin(angle) * speedMult * 0.1
                    });
                }
            }
            zOffset += 0.005;
        }

        function animate() {
            // Semi-transparent overlay for trail effect
            ctx.fillStyle = `rgba(${hexToRgb(colorPicker.value)}, 0.05)`;
            ctx.fillRect(0, 0, width, height);
            
            updateFlowField();
            
            ctx.strokeStyle = colorPicker.value;
            ctx.lineWidth = parseFloat(sizeRange.value);
            ctx.lineCap = 'round';

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            statsEl.innerText = `Particles: ${particles.length}`;
            requestAnimationFrame(animate);
        }

        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            // Since we want the background to be a dark version of the base color for the trail
            return `${Math.floor(r*0.1)}, ${Math.floor(g*0.1)}, ${Math.floor(b*0.1)}`;
        }

        // Interaction
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // Spawn particles at click
            for(let i=0; i<50; i++) {
                const p = new Particle();
                p.pos = { x, y };
                p.prevPos = { x, y };
                particles.push(p);
            }
            if (particles.length > 3000) particles.splice(0, 50);
        });

        clearBtn.addEventListener('click', () => {
            initCanvas();
        });

        saveBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'chroma-flow-art.png';
            link.href = canvas.toDataURL();
            link.click();
        });

        window.addEventListener('resize', initCanvas);

        // Start
        initCanvas();
        animate();
    </script>
</body>
