<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <radialGradient id="plasmaP" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </radialGradient>
    <radialGradient id="plasmaPink" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </radialGradient>
    <radialGradient id="plasmaBlue" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </radialGradient>
    <radialGradient id="plasmaGold" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </radialGradient>
    <radialGradient id="plasmaOrange" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>
    <radialGradient id="explosionGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="titleGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="hudGrad" x1="0" y1="0" x2="800" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="shockGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="450" fill="url(#bgGrad)"/>

  <!-- Stars -->
  <circle cx="45" cy="30" r="1" fill="#e2e8f0" opacity="0.7"/>
  <circle cx="120" cy="80" r="1.5" fill="#e2e8f0" opacity="0.5"/>
  <circle cx="210" cy="45" r="0.8" fill="#e2e8f0" opacity="0.8"/>
  <circle cx="340" cy="25" r="1.2" fill="#e2e8f0" opacity="0.6"/>
  <circle cx="480" cy="55" r="1" fill="#e2e8f0" opacity="0.7"/>
  <circle cx="580" cy="35" r="1.5" fill="#e2e8f0" opacity="0.5"/>
  <circle cx="700" cy="60" r="0.8" fill="#e2e8f0" opacity="0.9"/>
  <circle cx="750" cy="20" r="1.2" fill="#e2e8f0" opacity="0.6"/>
  <circle cx="90" cy="160" r="1" fill="#e2e8f0" opacity="0.5"/>
  <circle cx="650" cy="140" r="1.3" fill="#e2e8f0" opacity="0.4"/>
  <circle cx="300" cy="400" r="1" fill="#e2e8f0" opacity="0.6"/>
  <circle cx="500" cy="380" r="0.8" fill="#e2e8f0" opacity="0.5"/>
  <circle cx="150" cy="350" r="1.2" fill="#e2e8f0" opacity="0.7"/>
  <circle cx="720" cy="320" r="1" fill="#e2e8f0" opacity="0.4"/>
  <circle cx="400" cy="120" r="0.7" fill="#e2e8f0" opacity="0.8"/>

  <!-- Main explosion effect (mid-chain) -->
  <circle cx="380" cy="240" r="90" fill="url(#explosionGrad)" filter="url(#glow)"/>

  <!-- Shockwave rings -->
  <circle cx="380" cy="240" r="110" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.4"/>
  <circle cx="380" cy="240" r="140" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.2"/>

  <!-- Secondary explosion -->
  <circle cx="550" cy="180" r="55" fill="url(#explosionGrad)" opacity="0.6"/>
  <circle cx="550" cy="180" r="70" fill="none" stroke="#ec4899" stroke-width="1" opacity="0.3"/>

  <!-- Plasma balls scattered (mid-game state) -->
  <circle cx="180" cy="150" r="20" fill="url(#plasmaP)" filter="url(#glow)"/>
  <circle cx="640" cy="280" r="22" fill="url(#plasmaP)" filter="url(#glow)"/>
  <circle cx="280" cy="340" r="18" fill="url(#plasmaPink)" filter="url(#glow)"/>
  <circle cx="710" cy="160" r="19" fill="url(#plasmaBlue)" filter="url(#glow)"/>
  <circle cx="120" cy="290" r="16" fill="url(#plasmaGold)" filter="url(#glow)"/>
  <circle cx="500" cy="320" r="21" fill="url(#plasmaP)" filter="url(#glow)"/>
  <circle cx="320" cy="170" r="17" fill="url(#plasmaOrange)" filter="url(#glow)"/>

  <!-- Ball labels -->
  <text x="280" y="345" text-anchor="middle" fill="#fff" font-size="12" font-family="sans-serif" opacity="0.9">&#x2726;</text>
  <text x="710" y="165" text-anchor="middle" fill="#fff" font-size="12" font-family="sans-serif" opacity="0.9">&#x1f6e1;</text>
  <text x="120" y="295" text-anchor="middle" fill="#fff" font-size="12" font-family="sans-serif" opacity="0.9">&#x2605;</text>
  <text x="320" y="175" text-anchor="middle" fill="#fff" font-size="12" font-family="sans-serif" opacity="0.9">&#x229b;</text>

  <!-- Particles from chain (scattered dots) -->
  <circle cx="350" cy="200" r="3" fill="#c084fc" opacity="0.8"/>
  <circle cx="410" cy="210" r="2.5" fill="#f472b6" opacity="0.7"/>
  <circle cx="370" cy="270" r="2" fill="#a855f7" opacity="0.6"/>
  <circle cx="395" cy="195" r="2.8" fill="#ec4899" opacity="0.9"/>
  <circle cx="340" cy="250" r="1.8" fill="#c084fc" opacity="0.5"/>
  <circle cx="420" cy="260" r="2.2" fill="#f472b6" opacity="0.7"/>
  <circle cx="530" cy="160" r="2" fill="#ec4899" opacity="0.6"/>
  <circle cx="560" cy="200" r="1.5" fill="#a855f7" opacity="0.5"/>

  <!-- HUD bar at top -->
  <rect x="0" y="0" width="800" height="40" fill="url(#hudGrad)" opacity="0.9"/>
  <rect x="0" y="40" width="800" height="1" fill="#334155"/>

  <!-- HUD text -->
  <text x="30" y="16" fill="#94a3b8" font-size="9" font-family="sans-serif" text-transform="uppercase" letter-spacing="0.5">LEVEL</text>
  <text x="30" y="32" fill="#a855f7" font-size="16" font-weight="bold" font-family="sans-serif">4</text>

  <text x="120" y="16" fill="#94a3b8" font-size="9" font-family="sans-serif">SCORE</text>
  <text x="120" y="32" fill="#a855f7" font-size="16" font-weight="bold" font-family="sans-serif">1,280</text>

  <text x="230" y="16" fill="#94a3b8" font-size="9" font-family="sans-serif">TAPS</text>
  <text x="230" y="32" fill="#a855f7" font-size="16" font-weight="bold" font-family="sans-serif">3</text>

  <text x="310" y="16" fill="#94a3b8" font-size="9" font-family="sans-serif">GOAL</text>
  <text x="310" y="32" fill="#a855f7" font-size="16" font-weight="bold" font-family="sans-serif">8/12</text>

  <!-- Upgrade pills -->
  <rect x="440" y="10" width="70" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="475" y="25" text-anchor="middle" fill="#f9fafb" font-size="10" font-family="sans-serif">&#x1f4a5; x2</text>

  <rect x="520" y="10" width="80" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="560" y="25" text-anchor="middle" fill="#f9fafb" font-size="10" font-family="sans-serif">&#x1f9f2; Magnet</text>

  <rect x="610" y="10" width="70" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="645" y="25" text-anchor="middle" fill="#f9fafb" font-size="10" font-family="sans-serif">&#x2744;&#xfe0f; Freeze</text>

  <!-- Title -->
  <text x="400" y="430" text-anchor="middle" fill="#a855f7" font-size="24" font-weight="bold" font-family="'Segoe UI', system-ui, sans-serif" filter="url(#titleGlow)">Plasma Chain Reaction</text>

  <!-- Corner accents -->
  <rect x="0" y="0" width="4" height="40" fill="#a855f7" opacity="0.6"/>
  <rect x="796" y="0" width="4" height="40" fill="#a855f7" opacity="0.6"/>
  <rect x="0" y="440" width="800" height="10" fill="#a855f7" opacity="0.08"/>
</svg>
