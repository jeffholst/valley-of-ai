  <style>
    :root {
      --bg: #fdfbf7;
      --text: #4a4a4a;
      --surface: #ffffff;
      --accent: #a8d5ba;
      --accent-dark: #8eb8a0;
      --muted: #e5e7eb;
      --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme='dark'] {
      --bg: #1a1a1a;
      --text: #e5e7eb;
      --surface: #262626;
      --accent: #4a6b5a;
      --accent-dark: #3a5a4a;
      --muted: #333333;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      overflow: hidden; /* Handled by wrapper */
      transition: background-color var(--transition);
    }

    #appWrapper {
      position: fixed;
      top: 64px;
      bottom: 56px;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1;
    }

    .canvas-container {
      position: relative;
      width: 100%;
      max-width: 500px;
      aspect-ratio: 1;
      background: var(--surface);
      border-radius: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      touch-action: none;
      border: 1px solid var(--muted);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    .controls {
      margin-top: 24px;
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    button {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 500;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      background-color: var(--surface);
      color: var(--text);
      border: 1px solid var(--muted);
      min-width: 44px;
      min-height: 44px;
    }

    button:active {
      transform: scale(0.95);
    }

    button.primary {
      background-color: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    button.primary:hover {
      background-color: var(--accent-dark);
    }

    .instruction {
      margin-bottom: 20px;
      text-align: center;
      font-size: 18px;
      opacity: 0.8;
      font-weight: 300;
      max-width: 80%;
    }

    .palette-info {
      position: absolute;
      top: 16px;
      left: 16px;
      pointer-events: none;
      font-size: 12px;
      font-family: monospace;
      background: rgba(255,255,255,0.7);
      padding: 4px 8px;
      border-radius: 4px;
      color: #666;
    }
    [data-theme='dark'] .palette-info {
      background: rgba(0,0,0,0.4);
      color: #aaa;
    }
  </style>
</head>
<body>

  <div id="appWrapper">
    <div class="instruction">Gently draw to flow colors into existence.</div>
    
    <div class="canvas-container">
      <div class="palette-info" id="paletteDisplay">Palette: Calming Sage</div>
      <canvas id="flowCanvas"></canvas>
    </div>

    <div class="controls">
      <button id="clearBtn">Reset</button>
      <button id="paletteBtn" class="primary">Shift Mood</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('flowCanvas');
    const ctx = canvas.getContext('2d');
    const paletteBtn = document.getElementById('paletteBtn');
    const clearBtn = document.getElementById('clearBtn');
    const paletteDisplay = document.getElementById('paletteDisplay');

    let width, height;
    let isDrawing = false;
    let particles = [];
    let currentPalette = 0;

    const palettes = [
      { name: "Calming Sage", colors: ["#a8d5ba", "#d4e4bc", "#f1f8e9", "#8eb8a0"] },
      { name: "Sunset Glow", colors: ["#ff9e80", "#ffccbc", "#fff3e0", "#ff7043"] },
      { name: "Deep Ocean", colors: ["#81d4fa", "#b3e5fc", "#e1f5fe", "#0288d1"] },
      { name: "Amethyst Mist", colors: ["#ce93d8", "#e1bee7", "#f3e5f5", "#8e24aa"] },
      { name: "Golden Hour", colors: ["#ffe082", "#fff59d", "#fffde7", "#fbc02d"] }
    ];

    function resize() {
      const size = canvas.parentElement.clientWidth;
      width = canvas.width = size;
      height = canvas.height = size;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
    }

    window.addEventListener('resize', resize);
    resize();

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.size = Math.random() * 15 + 5;
        this.vx = (Math.random() - 0.5) * 2;
        this.vy = (Math.random() - 0.5) * 2;
        this.life = 1.0;
        this.decay = Math.random() * 0.02 + 0.005;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= this.decay;
      }

      draw() {
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function startDrawing(e) {
      isDrawing = true;
      addParticle(e);
    }

    function stopDrawing() {
      isDrawing = false;
    }

    function moveDrawing(e) {
      if (!isDrawing) return;
      addParticle(e);
    }

    function addParticle(e) {
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX || e.touches[0].clientX) - rect.left;
      const y = (e.clientY || e.touches[0].clientY) - rect.top;
      
      const colors = palettes[currentPalette].colors;
      const color = colors[Math.floor(Math.random() * colors.length)];
      
      particles.push(new Particle(x, y, color));
    }

    function animate() {
      // Semi-transparent clear for trail effect
      ctx.globalAlpha = 0.1;
      ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--surface');
      ctx.fillRect(0, 0, width, height);
      ctx.globalAlpha = 1.0;

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw();
        if (p.life <= 0) particles.splice(i, 1);
      }

      requestAnimationFrame(animate);
    }

    paletteBtn.addEventListener('click', () => {
      currentPalette = (currentPalette + 1) % palettes.length;
      paletteDisplay.innerText = `Palette: ${palettes[currentPalette].name}`;
    });

    clearBtn.addEventListener('click', () => {
      particles = [];
      ctx.clearRect(0, 0, width, height);
    });

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', moveDrawing);
    window.addEventListener('mouseup', stopDrawing);

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      startDrawing(e);
    }, { passive: false });
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      moveDrawing(e);
    }, { passive: false });
    window.addEventListener('touchend', stopDrawing);

    animate();
  </script>
</body>
</html>
