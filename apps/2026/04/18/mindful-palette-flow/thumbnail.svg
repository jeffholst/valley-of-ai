<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fdfbf7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5f0e6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feOffset dx="0" dy="4" result="offsetblur" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="450" fill="url(#bgGrad)" />

  <!-- App Canvas Mockup -->
  <rect x="200" y="50" width="400" height="320" rx="24" fill="#ffffff" filter="url(#shadow)" stroke="#e5e7eb" stroke-width="2" />
  
  <!-- Particles/Flow -->
  <circle cx="300" cy="150" r="12" fill="#a8d5ba" filter="url(#glow)" />
  <circle cx="320" cy="170" r="18" fill="#d4e4bc" opacity="0.7" />
  <circle cx="340" cy="140" r="15" fill="#8eb8a0" opacity="0.8" />
  <circle cx="360" cy="180" r="10" fill="#f1f8e9" />
  <circle cx="380" cy="160" r="20" fill="#a8d5ba" opacity="0.6" />
  
  <!-- Palette Label -->
  <rect x="220" y="70" width="100" height="20" rx="4" fill="rgba(255,255,255,0.7)" />
  <text x="225" y="84" font-family="monospace" font-size="10" fill="#666">Palette: Calming Sage</text>

  <!-- UI Buttons -->
  <rect x="320" y="390" width="80" height="40" rx="12" fill="#ffffff" stroke="#e5e7eb" filter="url(#shadow)" />
  <text x="338" y="415" font-family="sans-serif" font-size="14" fill="#4a4a4a">Reset</text>
  
  <rect x="420" y="390" width="120" height="40" rx="12" fill="#a8d5ba" filter="url(#shadow)" />
  <text x="440" y="415" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold">Shift Mood</text>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="sans-serif" font-size="32" fill="#4a4a4a" font-weight="bold" filter="url(#glow)">Mindful Palette Flow</text>
</svg>
