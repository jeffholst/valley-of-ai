<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Sudoku Sprint thumbnail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2f58"/>
      <stop offset="100%" stop-color="#081229"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b3260"/>
      <stop offset="100%" stop-color="#142447"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="24" y="24" width="752" height="402" rx="24" fill="none" stroke="#5ce1e6" stroke-opacity=".35"/>
  <text x="42" y="70" fill="#e6ecff" font-size="40" font-family="Inter,Segoe UI,sans-serif" font-weight="800" filter="url(#glow)">Sudoku Sprint</text>
  <g transform="translate(48 98)">
    <rect width="430" height="320" rx="18" fill="url(#panel)" stroke="#7e7cf9" stroke-opacity=".5"/>
    <g transform="translate(24 20)">
      <rect width="270" height="270" fill="#0f1e3f" stroke="#e6ecff" stroke-width="3"/>
      <g fill="#e6ecff" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="700" text-anchor="middle" dominant-baseline="middle">
        <text x="45" y="45">5</text><text x="75" y="45">3</text><text x="135" y="45">7</text>
        <text x="15" y="75">6</text><text x="105" y="75">1</text><text x="135" y="75">9</text><text x="165" y="75">5</text>
        <text x="75" y="105">9</text><text x="105" y="105">8</text><text x="225" y="105">6</text>
      </g>
      <rect x="120" y="120" width="30" height="30" fill="#7e7cf9" fill-opacity=".45"/>
      <text x="135" y="136" fill="#e6ecff" font-size="22" text-anchor="middle" dominant-baseline="middle" font-weight="700">4</text>
      <rect x="180" y="180" width="30" height="30" fill="#ff6b8a" fill-opacity=".4"/>
      <text x="195" y="196" fill="#ffffff" font-size="22" text-anchor="middle" dominant-baseline="middle" font-weight="700">2</text>
      <g stroke="#e6ecff" stroke-opacity=".7">
        <line x1="90" y1="0" x2="90" y2="270" stroke-width="2"/>
        <line x1="180" y1="0" x2="180" y2="270" stroke-width="2"/>
        <line x1="0" y1="90" x2="270" y2="90" stroke-width="2"/>
        <line x1="0" y1="180" x2="270" y2="180" stroke-width="2"/>
      </g>
      <g stroke="#e6ecff" stroke-opacity=".45">
        <line x1="30" y1="0" x2="30" y2="270"/><line x1="60" y1="0" x2="60" y2="270"/><line x1="120" y1="0" x2="120" y2="270"/><line x1="150" y1="0" x2="150" y2="270"/><line x1="210" y1="0" x2="210" y2="270"/><line x1="240" y1="0" x2="240" y2="270"/>
        <line x1="0" y1="30" x2="270" y2="30"/><line x1="0" y1="60" x2="270" y2="60"/><line x1="0" y1="120" x2="270" y2="120"/><line x1="0" y1="150" x2="270" y2="150"/><line x1="0" y1="210" x2="270" y2="210"/><line x1="0" y1="240" x2="270" y2="240"/>
      </g>
    </g>
  </g>
  <g transform="translate(500 110)" font-family="Inter,Segoe UI,sans-serif" fill="#e6ecff">
    <rect width="250" height="68" rx="14" fill="#142447" stroke="#5ce1e6" stroke-opacity=".55"/>
    <text x="20" y="30" font-size="18" opacity=".9">⏱ Time</text><text x="20" y="52" font-size="24" font-weight="800" fill="#5ce1e6">02:47</text>
    <rect y="82" width="250" height="68" rx="14" fill="#142447" stroke="#ff6b8a" stroke-opacity=".55"/>
    <text x="20" y="112" font-size="18" opacity=".9">❌ Mistakes</text><text x="20" y="134" font-size="24" font-weight="800" fill="#ff6b8a">1/3</text>
    <rect y="164" width="250" height="68" rx="14" fill="#142447" stroke="#3ee28d" stroke-opacity=".55"/>
    <text x="20" y="194" font-size="18" opacity=".9">✅ Filled</text><text x="20" y="216" font-size="24" font-weight="800" fill="#3ee28d">61/81</text>
    <rect y="252" width="250" height="64" rx="12" fill="#1b3260"/>
    <text x="20" y="289" font-size="20" font-weight="700">Tap 1-9 or keyboard</text>
  </g>
</svg>
