<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raffle Night Caller - __MAIN_SITE_NAME__</title>

    <script async src="https://www.googletagmanager.com/gtag/js?id=__GA_MEASUREMENT_ID__"></script>

    <meta name="voa-main-site-name" content="__MAIN_SITE_NAME__" />

    <meta name="voa-social-facebook-url" content="__SOCIAL_FACEBOOK_URL__" />
    <meta name="voa-social-instagram-url" content="__SOCIAL_INSTAGRAM_URL__" />
    <meta name="application-name" content="Raffle Night Caller" />
    <meta name="voa-app-id" content="2026/03/26/raffle-night-caller" />
    <script src="/apps/shared/app-shell.js" defer></script>
    <link rel="icon" href="./thumbnail.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: #0b1020;
        --text: #ecfeff;
        --surface: #161d34;
        --surface-2: #243154;
        --accent: #06b6d4;
        --accent-2: #f59e0b;
        --good: #22c55e;
        --danger: #ef4444;
      }
      [data-theme='light'] {
        --bg: #f8fafc;
        --text: #0f172a;
        --surface: #ffffff;
        --surface-2: #e2e8f0;
        --accent: #0891b2;
        --accent-2: #d97706;
        --good: #15803d;
        --danger: #dc2626;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: 'Inter', system-ui, sans-serif;
        background: radial-gradient(circle at 15% 20%, #1e3a8a 0%, var(--bg) 55%);
        color: var(--text);
      }
      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 1rem;
      }
      .app {
        display: grid;
        gap: 0.9rem;
        grid-template-columns: 1fr;
      }
      .card {
        background: linear-gradient(155deg, var(--surface), var(--surface-2));
        border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
        border-radius: 16px;
        padding: 1rem;
        box-shadow: 0 12px 28px rgba(0,0,0,0.22);
      }
      h1 { margin: 0 0 .4rem; font-size: clamp(1.35rem, 4vw, 2rem); }
      .row { display: grid; gap: .7rem; }
      label { font-weight: 600; font-size: .92rem; }
      input {
        width: 100%; min-height: 44px; border-radius: 10px; border: 1px solid var(--surface-2);
        background: color-mix(in srgb, var(--surface) 78%, black); color: var(--text); padding: .65rem .75rem;
      }
      .controls { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: .6rem; }
      button {
        min-height: 46px; border-radius: 12px; border: none; cursor: pointer; font-weight: 700;
        transition: transform .15s ease, filter .2s ease;
      }
      button:active { transform: translateY(1px) scale(.99); }
      .draw { background: linear-gradient(135deg, var(--accent), #38bdf8); color: #04111f; }
      .reset { background: linear-gradient(135deg, var(--accent-2), #fbbf24); color: #2b1600; }
      .draw[disabled] { filter: grayscale(.6); cursor: not-allowed; }
      .ball {
        aspect-ratio: 1/1;
        width: min(220px, 62vw);
        margin: .5rem auto;
        border-radius: 50%;
        border: 3px solid color-mix(in srgb, var(--accent) 65%, white);
        display: grid;
        place-items: center;
        font-size: clamp(2rem, 11vw, 4rem);
        font-weight: 800;
        background: radial-gradient(circle at 28% 28%, #ffffff88, transparent 35%),
          linear-gradient(165deg, color-mix(in srgb, var(--accent) 80%, black), #1e293b);
        box-shadow: 0 0 22px color-mix(in srgb, var(--accent) 60%, transparent);
      }
      .ball.spinning { animation: wobble .5s linear infinite; }
      @keyframes wobble {
        0% { transform: rotate(0deg) scale(1); }
        25% { transform: rotate(8deg) scale(1.03); }
        50% { transform: rotate(-8deg) scale(.97); }
        100% { transform: rotate(0deg) scale(1); }
      }
      .status { text-align: center; font-weight: 600; min-height: 1.4rem; }
      .good { color: var(--good); }
      .danger { color: var(--danger); }
      .history { display: flex; flex-wrap: wrap; gap: .45rem; }
      .chip {
        padding: .38rem .6rem;
        border-radius: 999px;
        border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
        background: color-mix(in srgb, var(--surface) 76%, black);
        font-size: .88rem;
      }
      .hint { opacity: .86; font-size: .9rem; }
      @media (min-width: 760px) {
        .app { grid-template-columns: 1.1fr .9fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="app" aria-label="Raffle Night Caller app">
        <article class="card">
          <h1>🎟️ Raffle Night Caller</h1>
          <p class="hint">Set ticket range, then draw winners. Works with click, tap, Enter, and Space.</p>
          <div class="row">
            <label for="minNum">Minimum Ticket Number</label>
            <input id="minNum" type="number" min="1" value="1" />
          </div>
          <div class="row">
            <label for="maxNum">Maximum Ticket Number</label>
            <input id="maxNum" type="number" min="2" value="75" />
          </div>
          <div class="controls">
            <button id="drawBtn" class="draw" type="button">Draw Winner</button>
            <button id="resetBtn" class="reset" type="button">Reset Round</button>
          </div>
          <p id="status" class="status" role="status" aria-live="polite">Ready to draw.</p>
        </article>

        <article class="card">
          <div id="ball" class="ball" aria-label="Current winning number">--</div>
          <p class="hint"><strong>Drawn:</strong> <span id="count">0</span> / <span id="total">75</span></p>
          <div id="history" class="history" aria-label="Draw history"></div>
        </article>
      </section>
    </main>

    <script>
      const minInput = document.getElementById('minNum');
      const maxInput = document.getElementById('maxNum');
      const drawBtn = document.getElementById('drawBtn');
      const resetBtn = document.getElementById('resetBtn');
      const ball = document.getElementById('ball');
      const statusEl = document.getElementById('status');
      const historyEl = document.getElementById('history');
      const countEl = document.getElementById('count');
      const totalEl = document.getElementById('total');

      let available = [];
      let drawn = [];

      function setStatus(text, cls = '') {
        statusEl.textContent = text;
        statusEl.className = `status ${cls}`;
      }

      function buildRange() {
        const min = Number(minInput.value);
        const max = Number(maxInput.value);
        if (!Number.isInteger(min) || !Number.isInteger(max) || min < 1 || max <= min) {
          drawBtn.disabled = true;
          setStatus('Use valid whole numbers (max must be greater than min).', 'danger');
          return;
        }

        available = Array.from({ length: max - min + 1 }, (_, i) => i + min);
        drawn = [];
        countEl.textContent = '0';
        totalEl.textContent = String(available.length);
        historyEl.innerHTML = '';
        ball.textContent = '--';
        drawBtn.disabled = false;
        setStatus('Ready to draw.', 'good');
      }

      function drawWinner() {
        if (!available.length) {
          drawBtn.disabled = true;
          setStatus('All tickets have been drawn. Reset round to start again.', 'danger');
          return;
        }

        drawBtn.disabled = true;
        ball.classList.add('spinning');
        setStatus('Mixing the raffle drum...');

        setTimeout(() => {
          const i = Math.floor(Math.random() * available.length);
          const winner = available.splice(i, 1)[0];
          drawn.push(winner);
          ball.classList.remove('spinning');
          ball.textContent = winner;
          countEl.textContent = String(drawn.length);

          const chip = document.createElement('span');
          chip.className = 'chip';
          chip.textContent = `#${winner}`;
          historyEl.prepend(chip);

          drawBtn.disabled = false;
          if (!available.length) {
            setStatus('Final ticket drawn. Round complete!', 'good');
          } else {
            setStatus(`Ticket #${winner} wins!`, 'good');
          }
        }, 700);
      }

      [minInput, maxInput].forEach((el) => {
        el.addEventListener('change', buildRange);
        el.addEventListener('input', () => {
          if (drawBtn.disabled) buildRange();
        });
      });

      drawBtn.addEventListener('click', drawWinner);
      resetBtn.addEventListener('click', buildRange);

      [drawBtn, resetBtn].forEach((btn) => {
        btn.addEventListener('keydown', (e) => {
          if (e.key === ' ' || e.key === 'Enter') {
            e.preventDefault();
            btn.click();
          }
        });
      });

      let touchStartX = 0;
      document.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].clientX;
      }, { passive: true });
      document.addEventListener('touchend', (e) => {
        const deltaX = e.changedTouches[0].clientX - touchStartX;
        if (deltaX > 70) drawWinner();
        if (deltaX < -70) buildRange();
      }, { passive: true });

      buildRange();
    </script>
  </body>
</html>
