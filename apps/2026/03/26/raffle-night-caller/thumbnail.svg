    <rect x="78" y="256" width="86" height="38" rx="19" fill="#0f172a" stroke="#06b6d4" /><text x="121" y="282" text-anchor="middle">#18</text>
    <rect x="176" y="256" width="86" height="38" rx="19" fill="#0f172a" stroke="#06b6d4" /><text x="219" y="282" text-anchor="middle">#55</text>
