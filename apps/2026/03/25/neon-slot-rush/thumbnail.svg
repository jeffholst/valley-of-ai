  <!-- PL9 [1,2,1,0,1] zigzag up -->
  <polyline points="81,246 179,326 277,246 375,166 473,246" stroke="#60a5fa" stroke-width="2.5" fill="none" opacity="0.85" stroke-linecap="round" stroke-linejoin="round"/>
