<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Story Beat Remixer thumbnail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#192f62" />
      <stop offset="60%" stop-color="#080f1f" />
      <stop offset="100%" stop-color="#131e36" />
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58ffd8" />
      <stop offset="100%" stop-color="#ff7dd0" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="url(#bg)" />
  <rect x="18" y="18" width="764" height="414" rx="24" fill="none" stroke="#395189" stroke-width="3" opacity="0.9" />

  <text x="44" y="72" fill="#f8fafc" font-size="36" font-family="Inter, Segoe UI, sans-serif" font-weight="700" filter="url(#softGlow)">Story Beat Remixer</text>
  <text x="46" y="102" fill="#86f9a8" font-size="18" font-family="Inter, Segoe UI, sans-serif">Drafts created: 27</text>

  <g transform="translate(42 124)">
    <rect x="0" y="0" width="232" height="188" rx="16" fill="#131e36" stroke="#395189" />
    <text x="16" y="30" fill="#c7d8ff" font-size="16" font-family="Inter, Segoe UI, sans-serif">Setup</text>
    <text x="16" y="64" fill="#f8fafc" font-size="18" font-family="Inter, Segoe UI, sans-serif">Three siblings inherit</text>
    <text x="16" y="88" fill="#f8fafc" font-size="18" font-family="Inter, Segoe UI, sans-serif">a haunted motel.</text>
    <rect x="16" y="132" width="92" height="38" rx="10" fill="#1a2b4f" stroke="#395189" />
    <text x="32" y="156" fill="#f8fafc" font-size="15" font-family="Inter, Segoe UI, sans-serif">Shuffle</text>
    <rect x="122" y="132" width="92" height="38" rx="10" fill="#1a2b4f" stroke="#ff7dd0" />
    <text x="151" y="156" fill="#ff7dd0" font-size="15" font-family="Inter, Segoe UI, sans-serif">Locked</text>
  </g>

  <g transform="translate(284 124)">
    <rect x="0" y="0" width="232" height="188" rx="16" fill="#131e36" stroke="#395189" />
    <text x="16" y="30" fill="#c7d8ff" font-size="16" font-family="Inter, Segoe UI, sans-serif">Conflict</text>
    <text x="16" y="64" fill="#f8fafc" font-size="18" font-family="Inter, Segoe UI, sans-serif">An AI narrator rewrites</text>
    <text x="16" y="88" fill="#f8fafc" font-size="18" font-family="Inter, Segoe UI, sans-serif">everyone's motives.</text>
    <rect x="16" y="132" width="92" height="38" rx="10" fill="#1a2b4f" stroke="#395189" />
    <text x="32" y="156" fill="#f8fafc" font-size="15" font-family="Inter, Segoe UI, sans-serif">Shuffle</text>
    <rect x="122" y="132" width="92" height="38" rx="10" fill="#1a2b4f" stroke="#395189" />
    <text x="153" y="156" fill="#f8fafc" font-size="15" font-family="Inter, Segoe UI, sans-serif">Lock</text>
  </g>

  <g transform="translate(526 124)">
    <rect x="0" y="0" width="232" height="188" rx="16" fill="#131e36" stroke="#395189" />
    <text x="16" y="30" fill="#c7d8ff" font-size="16" font-family="Inter, Segoe UI, sans-serif">Twist</text>
    <text x="16" y="64" fill="#f8fafc" font-size="18" font-family="Inter, Segoe UI, sans-serif">The sidekick secretly</text>
    <text x="16" y="88" fill="#f8fafc" font-size="18" font-family="Inter, Segoe UI, sans-serif">protects the villain.</text>
    <rect x="16" y="132" width="92" height="38" rx="10" fill="#1a2b4f" stroke="#395189" />
    <text x="32" y="156" fill="#f8fafc" font-size="15" font-family="Inter, Segoe UI, sans-serif">Shuffle</text>
    <rect x="122" y="132" width="92" height="38" rx="10" fill="#1a2b4f" stroke="#395189" />
    <text x="153" y="156" fill="#f8fafc" font-size="15" font-family="Inter, Segoe UI, sans-serif">Lock</text>
  </g>

  <rect x="42" y="328" width="716" height="86" rx="14" fill="#131e36" stroke="#395189" />
  <text x="60" y="360" fill="#f8fafc" font-size="24" font-family="Inter, Segoe UI, sans-serif" font-weight="700">Siblings Protocol</text>
  <text x="60" y="388" fill="#d7e4ff" font-size="18" font-family="Inter, Segoe UI, sans-serif">Then, the city itself is a giant film set with no way out.</text>
  <rect x="566" y="344" width="172" height="52" rx="12" fill="url(#cta)" filter="url(#softGlow)" />
  <text x="594" y="376" fill="#0b1222" font-size="20" font-family="Inter, Segoe UI, sans-serif" font-weight="700">Remix Story</text>
</svg>
