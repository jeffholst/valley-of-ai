<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Decision Spinner thumbnail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="585" cy="80" r="120" fill="#22d3ee" opacity="0.12"/>
  <circle cx="120" cy="380" r="160" fill="#f59e0b" opacity="0.15"/>

  <g filter="url(#shadow)">
    <rect x="42" y="56" width="330" height="338" rx="26" fill="#1e293b" stroke="#334155"/>
    <rect x="62" y="96" width="290" height="170" rx="12" fill="#0b1220" stroke="#334155"/>
    <text x="72" y="126" fill="#94a3b8" font-size="20" font-family="Trebuchet MS, Avenir Next, sans-serif">Coffee</text>
    <text x="72" y="162" fill="#94a3b8" font-size="20" font-family="Trebuchet MS, Avenir Next, sans-serif">Tea</text>
    <text x="72" y="198" fill="#94a3b8" font-size="20" font-family="Trebuchet MS, Avenir Next, sans-serif">Matcha</text>
    <text x="72" y="234" fill="#94a3b8" font-size="20" font-family="Trebuchet MS, Avenir Next, sans-serif">Water | 2</text>

    <rect x="62" y="292" width="132" height="44" rx="22" fill="#22d3ee"/>
    <text x="98" y="321" fill="#041019" font-size="20" font-weight="700" font-family="Trebuchet MS, Avenir Next, sans-serif">Spin</text>

    <rect x="206" y="292" width="146" height="44" rx="22" fill="#334155" stroke="#475569"/>
    <text x="236" y="321" fill="#e2e8f0" font-size="20" font-family="Trebuchet MS, Avenir Next, sans-serif">Shuffle</text>
  </g>

  <g transform="translate(560 230)" filter="url(#shadow)">
    <polygon points="0,-170 14,-136 -14,-136" fill="#f59e0b"/>
    <circle cx="0" cy="0" r="132" fill="#0b1220" stroke="#475569" stroke-width="7"/>
    <path d="M0 0 L0 -120 A120 120 0 0 1 114 -39 Z" fill="#06b6d4"/>
    <path d="M0 0 L114 -39 A120 120 0 0 1 73 95 Z" fill="#10b981"/>
    <path d="M0 0 L73 95 A120 120 0 0 1 -73 95 Z" fill="#f59e0b"/>
    <path d="M0 0 L-73 95 A120 120 0 0 1 -114 -39 Z" fill="#8b5cf6"/>
    <path d="M0 0 L-114 -39 A120 120 0 0 1 0 -120 Z" fill="#ef4444"/>
    <circle cx="0" cy="0" r="20" fill="#e2e8f0"/>
  </g>

  <text x="44" y="42" fill="#e2e8f0" font-size="32" font-weight="700" font-family="Trebuchet MS, Avenir Next, sans-serif">Decision Spinner</text>
  <text x="44" y="422" fill="#94a3b8" font-size="20" font-family="Trebuchet MS, Avenir Next, sans-serif">Weighted choices with fairness history</text>
