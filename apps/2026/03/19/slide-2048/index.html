    <style>

        --text: #f9fafb;

        --border: #243b55;
        --accent: #00f5ff;
        --accent2: #7c3aed;
        --shadow-glow: rgba(0, 245, 255, 0.3);

      [data-theme='light'] {
        --bg: #f0f4ff;
        --text: #1f2937;
        --surface: #e2e8f0;
        --grid-bg: #d1dbe8;
        --cell-empty: #c8d5e4;
        --border: #94a3b8;
        --accent: #0891b2;
        --accent2: #7c3aed;
        --shadow-glow: rgba(8, 145, 178, 0.3);

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          'Segoe UI',
          system-ui,
          -apple-system,
          sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0 12px 40px;
        transition:
          background 0.3s,
          color 0.3s;
        touch-action: none;
        user-select: none;
      }

      .game-wrapper {
        width: 100%;
        max-width: 420px;
        padding-top: 16px;
      }

      /* Score bar */
      .score-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 14px;
      }

      .game-title {
        font-size: 1.8rem;
        font-weight: 900;
        letter-spacing: -1px;
        color: var(--accent);
        text-shadow: 0 0 16px var(--shadow-glow);
        flex-shrink: 0;
      }

      .scores {
        display: flex;
        gap: 8px;
      }

      .score-box {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 6px 14px;
        text-align: center;
        min-width: 70px;
      }

      .score-label {
        font-size: 0.6rem;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--accent);
        opacity: 0.8;
      }

      .score-value {
        font-size: 1.1rem;
        font-weight: 800;
        color: var(--text);
        line-height: 1.2;
      }

      /* Controls row */
      .controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        gap: 8px;
      }

      .hint {
        font-size: 0.72rem;
        color: var(--text);
        opacity: 0.5;
        flex: 1;
      }

      .btn {
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 16px;
        font-size: 0.8rem;
        font-weight: 700;
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.15s,
          transform 0.1s;
        letter-spacing: 0.5px;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .btn:hover {
        background: var(--border);
        border-color: var(--accent);
      }

      .btn:active {
        transform: scale(0.96);
      }

      .btn-primary {
        background: var(--accent2);
        border-color: var(--accent2);
        color: #fff;
        box-shadow: 0 0 12px rgba(124, 58, 237, 0.4);
      }

      .btn-primary:hover {
        background: #6d28d9;
        border-color: #6d28d9;
      }

      /* Grid */
      .grid-container {
        background: var(--grid-bg);
        border: 2px solid var(--border);
        border-radius: 14px;
        padding: 10px;
        box-shadow:
          0 0 30px rgba(0, 245, 255, 0.08),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
        position: relative;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(4, 1fr);
        gap: 10px;
        position: relative;
      }

      .cell-bg {
        border-radius: 8px;
        background: var(--cell-empty);
        aspect-ratio: 1;
      }

      /* Tiles layer */
      .tiles-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .tile {
        position: absolute;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        transition:
          top 0.12s ease,
          left 0.12s ease,
          transform 0.12s ease,
          opacity 0.12s ease;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      }

      .tile.new-tile {
        animation: pop-in 0.15s ease forwards;
      }

      .tile.merged {
        animation: merge-pop 0.18s ease forwards;
      }

      @keyframes pop-in {
        0% {
          transform: scale(0.4);
          opacity: 0;
        }
        80% {
          transform: scale(1.08);
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }

      @keyframes merge-pop {
        0% {
          transform: scale(1);
        }
        40% {
          transform: scale(1.18);
        }
        100% {
          transform: scale(1);
        }
      }

  <body>
    <div class="game-wrapper">
      <!-- Score bar -->
      <div class="score-bar">
        <div class="game-title">2048</div>
        <div class="scores">
          <div class="score-box">
            <div class="score-label">Score</div>
            <div class="score-value" id="score">0</div>
          </div>
          <div class="score-box">
            <div class="score-label">Best</div>
            <div class="score-value" id="best">0</div>
          </div>
        </div>
      </div>

      <!-- Controls -->
      <div class="controls">
        <div class="hint">Swipe or use arrow keys to merge tiles</div>
        <button class="btn btn-primary" id="newGameBtn">New Game</button>
      </div>

      <!-- Grid -->
      <div class="grid-container">
        <div class="grid" id="grid" role="grid" aria-label="2048 game grid">
          <!-- 16 background cells -->
          <div class="cell-bg" role="gridcell"></div>
          <div class="cell-bg" role="gridcell"></div>
          <div class="cell-bg" role="gridcell"></div>
          <div class="cell-bg" role="gridcell"></div>
          <div class="cell-bg" role="gridcell"></div>
          <div class="cell-bg" role="gridcell"></div>
          <div class="cell-bg" role="gridcell"></div>
          <div class="cell-bg" role="gridcell"></div>
          <div class="cell-bg" role="gridcell"></div>
          <div class="cell-bg" role="gridcell"></div>
          <div class="cell-bg" role="gridcell"></div>
          <div class="cell-bg" role="gridcell"></div>
          <div class="cell-bg" role="gridcell"></div>
          <div class="cell-bg" role="gridcell"></div>
          <div class="cell-bg" role="gridcell"></div>
          <div class="cell-bg" role="gridcell"></div>
        </div>

        <!-- Tiles layer (positioned absolutely over grid) -->
        <div class="tiles-layer" id="tilesLayer" aria-hidden="true"></div>

        <!-- Game over / win overlay -->
        <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-live="polite">
          <div class="overlay-title" id="overlayTitle">Game Over</div>
          <div class="overlay-sub" id="overlaySub">No more moves available.</div>
          <div class="overlay-actions">
            <button class="btn btn-primary" id="overlayNewBtn">Play Again</button>
            <button class="btn" id="overlayContinueBtn" style="display:none">Keep Going</button>
          </div>
        </div>
      </div>

      <!-- How to play -->
      <div class="how-to">
        <strong>How to play:</strong> Use <strong>arrow keys</strong>, <strong>WASD</strong>, or
        <strong>swipe</strong> to slide tiles. When two tiles with the same number collide, they
        merge into one. Reach <strong>2048</strong> to win!
      </div>
    </div>

    <script>
      (() => {
        'use strict';

        const GRID_SIZE = 4;
        const WIN_VALUE = 2048;

        let board = [];
        let score = 0;
        let bestScore = parseInt(localStorage.getItem('slide2048Best') || '0', 10);
        let won = false;
        let continueAfterWin = false;
        let gameOver = false;
        let animating = false;

        // Tile size/position helpers — computed dynamically
        let cellSize = 0;
        let gap = 0;
        let padding = 0;

        const gridEl = document.getElementById('grid');
        const tilesLayer = document.getElementById('tilesLayer');
        const scoreEl = document.getElementById('score');
        const bestEl = document.getElementById('best');
        const newGameBtn = document.getElementById('newGameBtn');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlaySub = document.getElementById('overlaySub');
        const overlayNewBtn = document.getElementById('overlayNewBtn');
        const overlayContinueBtn = document.getElementById('overlayContinueBtn');

        // --- Layout measurement ---
        function measureGrid() {
          const gridRect = gridEl.getBoundingClientRect();
          const firstCell = gridEl.querySelector('.cell-bg');
          const cellRect = firstCell.getBoundingClientRect();
          cellSize = cellRect.width;
          gap = 10; // matches CSS gap
          padding = 10; // matches CSS padding on .grid-container
          return { cellSize, gap, padding };
        }

        function cellPosition(row, col) {
          // Position relative to .tiles-layer (inside grid-container, so offset by padding from grid-container)
          // grid starts at padding px inside grid-container
          const x = padding + col * (cellSize + gap);
          const y = padding + row * (cellSize + gap);
          return { x, y };
        }

        // --- Board logic ---
        function emptyBoard() {
          return Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(0));
        }

        function emptyCells(b) {
          const cells = [];
          for (let r = 0; r < GRID_SIZE; r++)
            for (let c = 0; c < GRID_SIZE; c++) if (b[r][c] === 0) cells.push([r, c]);
          return cells;
        }

        function addRandomTile(b) {
          const cells = emptyCells(b);
          if (!cells.length) return null;
          const [r, c] = cells[Math.floor(Math.random() * cells.length)];
          b[r][c] = Math.random() < 0.9 ? 2 : 4;
          return [r, c];
        }

        function canMove(b) {
          for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
              if (b[r][c] === 0) return true;
              if (c + 1 < GRID_SIZE && b[r][c] === b[r][c + 1]) return true;
              if (r + 1 < GRID_SIZE && b[r][c] === b[r + 1][c]) return true;
            }
          }
          return false;
        }

        function cloneBoard(b) {
          return b.map(row => [...row]);
        }

        // Slide a single row left, return { row, score, mergedCols }
        function slideRowLeft(row) {
          let merged = 0;
          let mergedCols = [];
          const filtered = row.filter(v => v !== 0);
          const result = [];
          let i = 0;
          while (i < filtered.length) {
            if (i + 1 < filtered.length && filtered[i] === filtered[i + 1]) {
              const val = filtered[i] * 2;
              result.push(val);
              mergedCols.push(result.length - 1);
              merged += val;
              i += 2;
            } else {
              result.push(filtered[i]);
              i++;
            }
          }
          while (result.length < GRID_SIZE) result.push(0);
          return { row: result, score: merged, mergedCols };
        }

        // Move board in direction, return { newBoard, scoreDelta, moved, mergeInfo }
        // mergeInfo: array of { row, col } for merged destinations
        function move(b, dir) {
          let newBoard = cloneBoard(b);
          let totalScore = 0;
          let moved = false;
          let mergePositions = [];

          function processRows() {
            for (let r = 0; r < GRID_SIZE; r++) {
              const { row, score: s, mergedCols } = slideRowLeft(newBoard[r]);
              for (let c = 0; c < GRID_SIZE; c++) {
                if (newBoard[r][c] !== row[c]) moved = true;
              }
              newBoard[r] = row;
              totalScore += s;
              mergedCols.forEach(c => mergePositions.push({ r, c }));
            }
          }

          function rotateRight(mat) {
            const n = mat.length;
            return Array.from({ length: n }, (_, r) =>
              Array.from({ length: n }, (_, c) => mat[n - 1 - c][r])
            );
          }

          function rotateLeft(mat) {
            const n = mat.length;
            return Array.from({ length: n }, (_, r) =>
              Array.from({ length: n }, (_, c) => mat[c][n - 1 - r])
            );
          }

          function rotatePositions(positions, times) {
            // Rotate the (r,c) positions by 'times' clockwise rotations (each 90°)
            let ps = positions;
            for (let t = 0; t < times; t++) {
              ps = ps.map(({ r, c }) => ({ r: c, c: GRID_SIZE - 1 - r }));
            }
            return ps;
          }

          if (dir === 'left') {
            processRows();
          } else if (dir === 'right') {
            // rotate 180, slide left, rotate 180 back
            newBoard = newBoard.map(row => [...row].reverse());
            for (let r = 0; r < GRID_SIZE; r++) {
              const { row, score: s, mergedCols } = slideRowLeft(newBoard[r]);
              for (let c = 0; c < GRID_SIZE; c++) {
                if (newBoard[r][c] !== row[c]) moved = true;
              }
              newBoard[r] = row;
              totalScore += s;
              mergedCols.forEach(c => mergePositions.push({ r, c }));
            }
            newBoard = newBoard.map(row => [...row].reverse());
            mergePositions = mergePositions.map(({ r, c }) => ({ r, c: GRID_SIZE - 1 - c }));
          } else if (dir === 'up') {
            // transpose, slide left, transpose back
            newBoard = rotateLeft(newBoard);
            for (let r = 0; r < GRID_SIZE; r++) {
              const { row, score: s, mergedCols } = slideRowLeft(newBoard[r]);
              for (let c = 0; c < GRID_SIZE; c++) {
                if (newBoard[r][c] !== row[c]) moved = true;
              }
              newBoard[r] = row;
              totalScore += s;
              mergedCols.forEach(c => mergePositions.push({ r, c }));
            }
            newBoard = rotateRight(newBoard);
            // un-rotate merge positions
            mergePositions = mergePositions.map(({ r, c }) => ({ r: c, c: GRID_SIZE - 1 - r }));
          } else if (dir === 'down') {
            newBoard = rotateRight(newBoard);
            for (let r = 0; r < GRID_SIZE; r++) {
              const { row, score: s, mergedCols } = slideRowLeft(newBoard[r]);
              for (let c = 0; c < GRID_SIZE; c++) {
                if (newBoard[r][c] !== row[c]) moved = true;
              }
              newBoard[r] = row;
              totalScore += s;
              mergedCols.forEach(c => mergePositions.push({ r, c }));
            }
            newBoard = rotateLeft(newBoard);
            // un-rotate merge positions (rotateRight then rotateLeft means: pos was rotated right 1x)
            mergePositions = mergePositions.map(({ r, c }) => ({ r: GRID_SIZE - 1 - c, c: r }));
          }

          return { newBoard, scoreDelta: totalScore, moved, mergePositions };
        }

        // --- Tile class (DOM representation) ---
        class Tile {
          constructor(value, row, col, isNew = false, isMerged = false) {
            this.value = value;
            this.row = row;
            this.col = col;
            this.el = document.createElement('div');
            this.el.className = `tile ${this.colorClass()} ${isNew ? 'new-tile' : ''} ${isMerged ? 'merged' : ''}`;
            this.el.textContent = value >= 100000 ? `${Math.round(value / 1000)}K` : value;
            this.el.setAttribute('aria-label', `Tile ${value}`);
            this.updatePosition();
            tilesLayer.appendChild(this.el);
          }

          colorClass() {
            if (this.value >= 4096) return 't-super';
            if (this.value === 2048) return 't-2048';
            return `t-${this.value}`;
          }

          updatePosition() {
            const { x, y } = cellPosition(this.row, this.col);
            this.el.style.left = `${x}px`;
            this.el.style.top = `${y}px`;
            this.el.style.width = `${cellSize}px`;
            this.el.style.height = `${cellSize}px`;
            const fontSize = cellSize < 70 ? '1rem' : cellSize < 85 ? '1.3rem' : '1.6rem';
            this.el.style.fontSize =
              this.value >= 10000
                ? `calc(${fontSize} * 0.7)`
                : this.value >= 1000
                  ? `calc(${fontSize} * 0.85)`
                  : fontSize;
          }

          moveTo(row, col) {
            this.row = row;
            this.col = col;
            this.updatePosition();
          }

          remove() {
            this.el.remove();
          }
        }

        let tiles = []; // current tiles on DOM

        // --- Rendering ---
        function syncTiles(oldBoard, newBoard, mergePositions) {
          measureGrid();
          const mergeSet = new Set(mergePositions.map(({ r, c }) => `${r},${c}`));

          // Build map of old positions to tile objects
          // We'll match tiles by position
          const oldTiles = tiles.slice();
          const newTiles = [];

          // For each cell in newBoard, figure out if it's a merge, move, or new
          for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
              if (newBoard[r][c] === 0) continue;
              const isMerge = mergeSet.has(`${r},${c}`);
              const isNew =
                oldBoard[r][c] === 0 && newBoard[r][c] !== 0 && !isMerge
                  ? true
                  : oldBoard[r][c] === 0 && !isMerge;

              const t = new Tile(newBoard[r][c], r, c, isNew, isMerge);
              newTiles.push(t);
            }
          }

          // Remove old tiles
          oldTiles.forEach(t => t.remove());
          tiles = newTiles;
        }

        function initialRender() {
          measureGrid();
          // Clear
          tiles.forEach(t => t.remove());
          tiles = [];
          for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
              if (board[r][c]) {
                const t = new Tile(board[r][c], r, c, true, false);
                tiles.push(t);
              }
            }
          }
        }

        function updateScoreDisplay() {
          scoreEl.textContent = score;
          bestEl.textContent = bestScore;
        }

        // --- Game flow ---
        function initGame() {
          board = emptyBoard();
          score = 0;
          won = false;
          continueAfterWin = false;
          gameOver = false;
          overlay.classList.remove('visible');
          addRandomTile(board);
          addRandomTile(board);
          updateScoreDisplay();
          // Delay render so layout is stable
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              initialRender();
            });
          });
        }

        function showOverlay(type) {
          if (type === 'win') {
            overlayTitle.textContent = '🎉 You Win!';
            overlayTitle.className = 'overlay-title win';
            overlaySub.textContent = `You reached 2048! Score: ${score}`;
            overlayContinueBtn.style.display = '';
          } else {
            overlayTitle.textContent = 'Game Over';
            overlayTitle.className = 'overlay-title';
            overlaySub.textContent = 'No more moves available.';
            overlayContinueBtn.style.display = 'none';
          }
          overlay.classList.add('visible');
        }

        function handleMove(dir) {
          if (gameOver || animating) return;
          if (won && !continueAfterWin) return;

          const { newBoard, scoreDelta, moved, mergePositions } = move(board, dir);
          if (!moved) return;

          animating = true;
          const oldBoard = cloneBoard(board);
          board = newBoard;
          score += scoreDelta;
          if (score > bestScore) {
            bestScore = score;
            localStorage.setItem('slide2048Best', bestScore);
          }
          updateScoreDisplay();

          syncTiles(oldBoard, board, mergePositions);

          // Add new tile after animation
          setTimeout(() => {
            const newCell = addRandomTile(board);
            if (newCell) {
              measureGrid();
              const [r, c] = newCell;
              const t = new Tile(board[r][c], r, c, true, false);
              tiles.push(t);
            }
            animating = false;

            // Check win
            if (!won && !continueAfterWin) {
              for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                  if (board[r][c] >= WIN_VALUE) {
                    won = true;
                    showOverlay('win');
                    return;
                  }
                }
              }
            }

            // Check game over
            if (!canMove(board)) {
              gameOver = true;
              showOverlay('gameover');
            }
          }, 130);
        }

        // --- Input handling ---

        // Keyboard
        document.addEventListener('keydown', e => {
          const map = {
            ArrowLeft: 'left',
            ArrowRight: 'right',
            ArrowUp: 'up',
            ArrowDown: 'down',
            a: 'left',
            d: 'right',
            w: 'up',
            s: 'down',
            A: 'left',
            D: 'right',
            W: 'up',
            S: 'down',
          };
          if (map[e.key]) {
            e.preventDefault();
            handleMove(map[e.key]);
          }
        });

        // Touch / swipe
        let touchStartX = 0;
        let touchStartY = 0;
        const MIN_SWIPE = 30;

        document.addEventListener(
          'touchstart',
          e => {
            if (e.target.closest('button')) return;
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
          },
          { passive: true }
        );

        document.addEventListener(
          'touchend',
          e => {
            if (e.target.closest('button')) return;
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            if (Math.abs(dx) < MIN_SWIPE && Math.abs(dy) < MIN_SWIPE) return;
            if (Math.abs(dx) > Math.abs(dy)) {
              handleMove(dx > 0 ? 'right' : 'left');
            } else {
              handleMove(dy > 0 ? 'down' : 'up');
            }
          },
          { passive: true }
        );

        // Buttons
        newGameBtn.addEventListener('click', initGame);
        overlayNewBtn.addEventListener('click', initGame);
        overlayContinueBtn.addEventListener('click', () => {
          continueAfterWin = true;
          won = false;
          overlay.classList.remove('visible');
        });

        // Re-measure on resize
        let resizeTimer;
        window.addEventListener('resize', () => {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(() => {
            measureGrid();
            tiles.forEach(t => t.updatePosition());
          }, 100);
        });

        // --- Start ---
        // Wait for DOM to be painted so measureGrid works
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', initGame);
        } else {
          requestAnimationFrame(() => requestAnimationFrame(initGame));
        }
      })();
    </script>
  </body>
</html>
