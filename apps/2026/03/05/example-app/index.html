<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example App - __MAIN_SITE_NAME__</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎉%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --surface: white;
      --text: #1f2937;
      --text-muted: #6b7280;
      --accent: #667eea;
    ;--shadow:rgba(0, 0, 0, 0.35);}
    [data-theme="dark"] {
      --bg: linear-gradient(135deg, #1e1e2e 0%, #2d1b4e 100%);
      --surface: #1f2937;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #a78bfa;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: linear-gradient(135deg, #1e1e2e 0%, #2d1b4e 100%);
        --surface: #1f2937;
        --text: #f3f4f6;
        --text-muted: #9ca3af;
        --accent: #a78bfa;
      }
    }
    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      background: var(--surface);
      border: 1px solid var(--text-muted);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 1.3rem;
      cursor: pointer;
      z-index: 100;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: var(--surface);
      border-radius: 16px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      text-align: center;
    }
    h1 {
      color: var(--text);
      margin-bottom: 16px;
      font-size: 2rem;
    }
    p {
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .counter {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 24px;
    }
    .count {
      font-size: 3rem;
      font-weight: bold;
      color: var(--accent);
      min-width: 80px;
    }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1.25rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -10px rgba(102, 126, 234, 0.5);
    }
    button:active {
      transform: translateY(0);
    }
    .badge {
      display: inline-block;
      background: var(--text-muted);
      color: var(--accent);
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 500;
      margin-top: 20px;
    }
  [data-theme='light']{--bg:#eef4ff;--surface:#ffffff;--text:#1f2f52;--accent:#0891b2;--shadow:rgba(31, 47, 82, 0.12);}
</style>
  <meta name="voa-main-site-url" content="__MAIN_SITE_URL__">
  <meta name="voa-main-site-name" content="__MAIN_SITE_NAME__">
    <meta name="voa-social-x-url" content="__SOCIAL_X_URL__">
  <meta name="voa-social-facebook-url" content="__SOCIAL_FACEBOOK_URL__">
  <meta name="voa-social-instagram-url" content="__SOCIAL_INSTAGRAM_URL__">
  <script src="/apps/shared/app-shell.js" defer></script>
</head>
<body>
  <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">🌙</button>
  <div class="container">
    <h1>🎉 Example App</h1>
    <p>This is a demonstration app generated by AI to showcase the Valley of AI gallery system.</p>
    <div class="counter">
      <button onclick="decrement()">−</button>
      <span class="count" id="count">0</span>
      <button onclick="increment()">+</button>
    </div>
    <p>Click the buttons to interact with this simple counter.</p>
    <span class="badge">Generated by AI</span>
  </div>
  <script>
    let count = 0;
    const countEl = document.getElementById('count');
    
    function increment() {
      count++;
      countEl.textContent = count;
    }
    
    function decrement() {
      count--;
      countEl.textContent = count;
    }

    function getPreferredTheme() {
      const stored = localStorage.getItem('theme');
      if (stored) return stored;
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      document.querySelector('.theme-toggle').textContent = theme === 'dark' ? '☀️' : '🌙';
    }
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', next);
      applyTheme(next);
    }
    applyTheme(getPreferredTheme());
  </script>
  <footer style="text-align: center; padding: 20px; margin-top: 20px; opacity: 0.7;">
    <a href="https://www.valleyofai.com" target="_blank" rel="noopener" style="color: var(--accent, #3b82f6); text-decoration: none;">← Back to Valley of AI</a>
  </footer>
</body>
</html>
