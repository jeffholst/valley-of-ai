<script>
// Theme Management
var storedTheme = localStorage.getItem('theme') ||
  (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
document.documentElement.setAttribute('data-theme', storedTheme);

var c = document.getElementById('game'), x = c.getContext('2d');

// Canvas colors (canvas doesn't support CSS variables)
var colors = {
  enemy: '#f43f5e',
  player: '#4ade80',
  bullet: '#fef08a',
  primary: '#22d3ee'
};

// Row-specific enemy colors for visual variety (dark / light theme pairs)
var rowColorsDark = ['#f43f5e', '#fb923c', '#facc15', '#34d399', '#60a5fa'];
var rowColorsLight = ['#be123c', '#c2410c', '#a16207', '#059669', '#2563eb'];

function updateColors() {
  var isDark = document.documentElement.getAttribute('data-theme') !== 'light';
  colors.enemy = isDark ? '#f43f5e' : '#be123c';
  colors.player = isDark ? '#4ade80' : '#15803d';
  colors.bullet = isDark ? '#fef08a' : '#b45309';
  colors.primary = isDark ? '#22d3ee' : '#0891b2';
}
updateColors();

// Listen for theme changes from the app shell
var observer = new MutationObserver(function() { updateColors(); });
observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

/** Returns the row color for an enemy based on current theme */
function getRowColor(row) {
  var isDark = document.documentElement.getAttribute('data-theme') !== 'light';
  var palette = isDark ? rowColorsDark : rowColorsLight;
  return palette[row % palette.length];
}

// ---- Game State ----
var S = {
  run: false, score: 0, lives: 3, wave: 1,
  gameOver: false,
  keys: {},
  player: { x: 380, y: 530, w: 44, h: 18, cool: 0 },
  bullets: [], enemyBullets: [], enemies: [],
  barriers: [],
  dir: 1, speed: 0.55, drop: 18, lastShot: 0,
  animFrame: 0, animTimer: 0,
  // Ship explosion state
  exploding: false, explosionTimer: 0, explosionDuration: 90,
  particles: []
};

var ui = function(id) { return document.getElementById(id); };

/** Update HUD pills */
function u(state) {
  ui('score').textContent = 'Score: ' + S.score;
  ui('lives').textContent = 'Lives: ' + S.lives;
  ui('wave').textContent = 'Wave: ' + S.wave;
  if (state !== undefined) ui('state').textContent = 'State: ' + state;
}

/** Show game over overlay with final stats */
function showGameOver(title, subtitle) {
  S.gameOver = true;
  var overlay = ui('gameOverOverlay');
  ui('goTitle').textContent = title;
  ui('goSub').textContent = subtitle;
  ui('goScore').textContent = S.score;
  ui('goWave').textContent = S.wave;
  overlay.classList.add('visible');
}

/** Hide game over overlay */
function hideGameOver() {
  S.gameOver = false;
  ui('gameOverOverlay').classList.remove('visible');
}

/** Create enemy formation for current wave.
 *  Each successive wave starts enemies slightly lower on screen. */
function mkWave() {
  S.enemies = [];
  var rows = 5, cols = 10, gx = 58, spx = 58, spy = 44;
  // Each wave enemies start 12px lower (capped so they dont overlap barriers)
  var baseY = 48 + Math.min((S.wave - 1) * 12, 96);
  for (var r = 0; r < rows; r++) {
    for (var col = 0; col < cols; col++) {
      S.enemies.push({
        x: gx + col * spx, y: baseY + r * spy,
        w: 34, h: 24, alive: true, row: r
      });
    }
  }
  S.dir = 1;
  // Base speed increases with wave
  S.speed = 0.5 + (S.wave - 1) * 0.09;
}

/** Create destructible barriers above the player.
 *  Each barrier is a grid of small blocks destroyed individually. */
function mkBarriers() {
  S.barriers = [];
  var barrierCount = 4;
  var bw = 60, bh = 36, blockSize = 6;
  var spacing = (c.width - barrierCount * bw) / (barrierCount + 1);
  for (var b = 0; b < barrierCount; b++) {
    var bx = spacing + b * (bw + spacing);
    var by = 460;
    var rowCount = bh / blockSize;
    var colCount = bw / blockSize;
    for (var row = 0; row < rowCount; row++) {
      for (var col = 0; col < colCount; col++) {
        // Skip bottom corners to give an arch shape
        var isBottomCorner =
          row >= rowCount - 2 && (col <= 1 || col >= colCount - 2);
        if (!isBottomCorner) {
          S.barriers.push({
            x: bx + col * blockSize,
            y: by + row * blockSize,
            w: blockSize, h: blockSize,
            alive: true
          });
        }
      }
    }
  }
}

/** Reset game state */
function reset(all) {
  if (all) { S.score = 0; S.lives = 3; S.wave = 1; }
  S.player.x = 380; S.player.cool = 0;
  S.bullets = []; S.enemyBullets = [];
  S.animFrame = 0; S.animTimer = 0;
  S.exploding = false; S.explosionTimer = 0; S.particles = [];
  hideGameOver();
  mkWave();
  mkBarriers();
  u('Ready');
  draw();
}

/** Player shoot */
function shoot() {
  var now = performance.now();
  if (now - S.lastShot < 220) return;
  S.lastShot = now;
  S.bullets.push({ x: S.player.x, y: S.player.y - 12, v: -7 });
}

/** Random enemy fires a bullet */
function enemyShoot() {
  var alive = S.enemies.filter(function(e) { return e.alive; });
  if (!alive.length) return;
  var pick = alive[Math.floor(Math.random() * alive.length)];
  S.enemyBullets.push({ x: pick.x + pick.w / 2, y: pick.y + pick.h, v: 3.2 + Math.random() * 1.5 });
}

/** Trigger ship explosion — creates debris particles from the ship position */
function explodeShip() {
  S.exploding = true;
  S.explosionTimer = 0;
  S.particles = [];
  var px = S.player.x, py = S.player.y;
  // Create debris pieces from the ship body
  for (var i = 0; i < 16; i++) {
    var angle = (Math.PI * 2 / 16) * i + (Math.random() - 0.5) * 0.4;
    var speed = 1.5 + Math.random() * 3;
    S.particles.push({
      x: px + (Math.random() - 0.5) * S.player.w,
      y: py + (Math.random() - 0.5) * S.player.h,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 1,
      size: 3 + Math.random() * 5,
      life: 1,
      decay: 0.008 + Math.random() * 0.008,
      color: Math.random() < 0.5 ? colors.player : colors.bullet
    });
  }
  // Clear enemy bullets so player isn't hit again during respawn
  S.enemyBullets = [];
}

/** Update explosion particles and handle respawn after explosion ends */
function updateExplosion() {
  S.explosionTimer++;
  for (var i = 0; i < S.particles.length; i++) {
    var p = S.particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.04; // slight gravity
    p.life -= p.decay;
  }
  S.particles = S.particles.filter(function(p) { return p.life > 0; });
  // Explosion finished — respawn or game over
  if (S.explosionTimer >= S.explosionDuration) {
    S.exploding = false;
    S.particles = [];
    if (S.lives <= 0) {
      S.run = false;
      u('Game Over');
      showGameOver('Game Over', 'Your ship was destroyed!');
    } else {
      // Respawn player at center
      S.player.x = 380;
      S.player.cool = 0;
      u('Running');
    }
  }
}

/** Draw explosion particles */
function drawExplosion() {
  for (var i = 0; i < S.particles.length; i++) {
    var p = S.particles[i];
    x.globalAlpha = Math.max(0, p.life);
    x.fillStyle = p.color;
    x.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  x.globalAlpha = 1;
}

/** Axis-aligned bounding box collision check */
function rectHit(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

/** Calculate dynamic speed boost based on how many enemies remain.
 *  As enemies are destroyed, survivors move faster (classic Space Invaders).
 *  Extra aggressive boost when 5 or fewer enemies remain. */
function getDynamicSpeed() {
  var total = S.enemies.length;
  var alive = S.enemies.filter(function(e) { return e.alive; }).length;
  if (alive === 0) return S.speed;
  var ratio = 1 - (alive / total);
  // Stronger multiplier: up to 3x speed, plus extra burst for last few
  var multiplier = 1 + ratio * 3;
  if (alive <= 5) multiplier += 1.5;
  if (alive <= 2) multiplier += 2;
  return S.speed * multiplier;
}

/** Main update loop */
function upd() {
  if (!S.run) return;

  // During explosion, only update particles — game is paused
  if (S.exploding) { updateExplosion(); return; }

  var p = S.player;

  // Player movement (keyboard + touch)
  if (S.keys.ArrowLeft || S.keys.a || S.keys._touchLeft) p.x -= 5;
  if (S.keys.ArrowRight || S.keys.d || S.keys._touchRight) p.x += 5;
  p.x = Math.max(26, Math.min(c.width - 26, p.x));

  // Player shooting (keyboard + touch)
  if ((S.keys[' '] || S.keys.Spacebar || S.keys._touchFire) && p.cool <= 0) { shoot(); p.cool = 8; }
  if (p.cool > 0) p.cool--;

  // Move player bullets
  S.bullets.forEach(function(b) { b.y += b.v; });
  S.bullets = S.bullets.filter(function(b) { return b.y > -20; });

  // Dance animation timer: toggle frame every ~500ms
  S.animTimer++;
  if (S.animTimer >= 30) { S.animFrame = 1 - S.animFrame; S.animTimer = 0; }

  // Move enemies with dynamic speed
  var currentSpeed = getDynamicSpeed();
  var hitEdge = false;
  S.enemies.forEach(function(e) {
    if (!e.alive) return;
    e.x += S.dir * currentSpeed;
    if (e.x < 16 || e.x + e.w > c.width - 16) hitEdge = true;
  });
  if (hitEdge) {
    S.dir *= -1;
    S.enemies.forEach(function(e) { e.y += S.drop; });
  }

  // Move enemy bullets
  S.enemyBullets.forEach(function(b) { b.y += b.v; });
  S.enemyBullets = S.enemyBullets.filter(function(b) { return b.y < c.height + 10; });

  // Enemy shooting chance
  if (Math.random() < 0.03 + S.wave * 0.003) enemyShoot();

  // Player bullets hit enemies
  var bi, ei;
  for (bi = 0; bi < S.bullets.length; bi++) {
    var pb = S.bullets[bi];
    for (ei = 0; ei < S.enemies.length; ei++) {
      var en = S.enemies[ei];
      if (en.alive && rectHit({ x: pb.x - 3, y: pb.y, w: 6, h: 12 }, en)) {
        en.alive = false;
        pb.y = -999;
        S.score += 10 + (4 - en.row) * 2;
        break;
      }
    }
  }

  // Player bullets hit barriers (friendly fire destroys barrier blocks)
  for (bi = 0; bi < S.bullets.length; bi++) {
    var pb2 = S.bullets[bi];
    for (var ki = 0; ki < S.barriers.length; ki++) {
      var blk = S.barriers[ki];
      if (blk.alive && rectHit({ x: pb2.x - 3, y: pb2.y, w: 6, h: 12 }, blk)) {
        blk.alive = false;
        pb2.y = -999;
        break;
      }
    }
  }

  // Enemy bullets hit barriers
  for (bi = 0; bi < S.enemyBullets.length; bi++) {
    var eb = S.enemyBullets[bi];
    for (var bki = 0; bki < S.barriers.length; bki++) {
      var blk2 = S.barriers[bki];
      if (blk2.alive && rectHit({ x: eb.x - 3, y: eb.y, w: 6, h: 12 }, blk2)) {
        blk2.alive = false;
        eb.y = 999;
        break;
      }
    }
  }

  // Enemy bullets hit player (wider hitbox for more reliable detection)
  for (bi = 0; bi < S.enemyBullets.length; bi++) {
    var eb2 = S.enemyBullets[bi];
    // Player hitbox: slightly padded for reliable hit registration
    var playerBox = { x: p.x - p.w / 2 - 2, y: p.y - p.h / 2 - 2, w: p.w + 4, h: p.h + 4 };
    var bulletBox = { x: eb2.x - 3, y: eb2.y, w: 6, h: 12 };
    if (rectHit(bulletBox, playerBox)) {
      eb2.y = 999;
      S.lives--;
      S.bullets = []; // clear player bullets during explosion
      u('Hit!');
      explodeShip();
      return; // pause game loop — explosion takes over
    }
  }

  // Enemies reach player level
  if (S.enemies.some(function(e) { return e.alive && e.y + e.h >= p.y - 18; })) {
    S.run = false; S.lives = 0; u('Invaders Win');
    showGameOver('Invaders Win!', 'The aliens reached your defenses!');
  }

  // All enemies destroyed: advance wave
  if (S.enemies.every(function(e) { return !e.alive; })) {
    S.wave++;
    mkWave();
    mkBarriers();
    u('Next Wave');
  }
}

/** Draw an enemy with row-specific color and dancing animation.
 *  Frame 0: legs down. Frame 1: legs up. Two alternating poses. */
function drawEnemy(e) {
  var color = getRowColor(e.row);
  x.fillStyle = color;

  if (S.animFrame === 0) {
    // Frame A: standard body with legs spread
    x.fillRect(e.x + 4, e.y, e.w - 8, e.h - 6);
    x.fillRect(e.x, e.y + 4, e.w, e.h - 12);
    // Eyes
    x.fillStyle = '#050a14';
    x.fillRect(e.x + 7, e.y + 7, 5, 5);
    x.fillRect(e.x + 22, e.y + 7, 5, 5);
    // Legs spread down
    x.fillStyle = color;
    x.fillRect(e.x + 2, e.y + e.h - 6, 6, 6);
    x.fillRect(e.x + e.w - 8, e.y + e.h - 6, 6, 6);
    // Antennae up
    x.fillRect(e.x + 6, e.y - 4, 3, 5);
    x.fillRect(e.x + e.w - 9, e.y - 4, 3, 5);
  } else {
    // Frame B: legs tucked, arms out, shifted pose
    x.fillRect(e.x + 4, e.y + 2, e.w - 8, e.h - 6);
    x.fillRect(e.x + 2, e.y + 6, e.w - 4, e.h - 12);
    // Eyes
    x.fillStyle = '#050a14';
    x.fillRect(e.x + 7, e.y + 9, 5, 5);
    x.fillRect(e.x + 22, e.y + 9, 5, 5);
    // Legs tucked in
    x.fillStyle = color;
    x.fillRect(e.x + 8, e.y + e.h - 4, 6, 4);
    x.fillRect(e.x + e.w - 14, e.y + e.h - 4, 6, 4);
    // Antennae angled
    x.fillRect(e.x + 3, e.y - 2, 3, 4);
    x.fillRect(e.x + e.w - 6, e.y - 2, 3, 4);
  }
}

/** Draw destructible barriers */
function drawBarriers() {
  var isDark = document.documentElement.getAttribute('data-theme') !== 'light';
  x.fillStyle = isDark ? '#22c55e' : '#15803d';
  for (var i = 0; i < S.barriers.length; i++) {
    var block = S.barriers[i];
    if (block.alive) {
      x.fillRect(block.x, block.y, block.w, block.h);
    }
  }
}

/** Main draw loop */
function draw() {
  x.clearRect(0, 0, c.width, c.height);

  // Background stars
  x.fillStyle = '#0a0f1f';
  for (var i = 0; i < 80; i++) {
    x.fillRect((i * 97) % c.width, (i * 53) % c.height, 1, 1);
  }

  // Player ship (hidden during explosion)
  if (!S.exploding) {
    x.fillStyle = colors.player;
    x.fillRect(S.player.x - S.player.w / 2, S.player.y - S.player.h / 2, S.player.w, S.player.h);
    x.fillRect(S.player.x - 10, S.player.y - 18, 20, 8);
  } else {
    drawExplosion();
  }

  // Player bullets
  x.fillStyle = colors.bullet;
  S.bullets.forEach(function(b) { x.fillRect(b.x - 2, b.y, 4, 10); });

  // Enemy bullets
  x.fillStyle = colors.primary;
  S.enemyBullets.forEach(function(b) { x.fillRect(b.x - 2, b.y, 4, 10); });

  // Enemies with per-row colors and dance animation
  S.enemies.forEach(function(e) { if (e.alive) drawEnemy(e); });

  // Defensive barriers
  drawBarriers();
}

/** Game loop runs via requestAnimationFrame */
function loop() { upd(); draw(); requestAnimationFrame(loop); }

// Keyboard input
document.addEventListener('keydown', function(e) {
  var k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  S.keys[k] = true;
  if (k === ' ') e.preventDefault();
});
document.addEventListener('keyup', function(e) {
  var k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  S.keys[k] = false;
});

// ---- Mobile Touch Controls ----
// Helper to bind touch start/end for a virtual key
function bindTouch(btnId, keyName) {
  var btn = ui(btnId);
  btn.addEventListener('touchstart', function(e) {
    e.preventDefault();
    S.keys[keyName] = true;
    btn.classList.add('pressed');
    // Auto-start game on first touch
    if (!S.run && !S.gameOver) { S.run = true; u('Running'); }
  }, { passive: false });
  btn.addEventListener('touchend', function(e) {
    e.preventDefault();
    S.keys[keyName] = false;
    btn.classList.remove('pressed');
  }, { passive: false });
  btn.addEventListener('touchcancel', function() {
    S.keys[keyName] = false;
    btn.classList.remove('pressed');
  });
  // Prevent mouse events from also firing on desktop fallback
  btn.addEventListener('mousedown', function(e) {
    e.preventDefault();
    S.keys[keyName] = true;
    btn.classList.add('pressed');
    if (!S.run && !S.gameOver) { S.run = true; u('Running'); }
  });
  btn.addEventListener('mouseup', function() {
    S.keys[keyName] = false;
    btn.classList.remove('pressed');
  });
  btn.addEventListener('mouseleave', function() {
    S.keys[keyName] = false;
    btn.classList.remove('pressed');
  });
}
bindTouch('btnLeft', '_touchLeft');
bindTouch('btnRight', '_touchRight');
bindTouch('btnFire', '_touchFire');

// Button handlers
ui('start').onclick = function() { if (!S.gameOver) { S.run = true; u('Running'); } };
ui('restart').onclick = function() { reset(true); S.run = true; u('Running'); };
ui('goRestart').onclick = function() { reset(true); S.run = true; u('Running'); };

// Initialize
reset(true);
loop();
</script>
