<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Logic Lights Out app thumbnail">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0c122b"/>
      <stop offset="100%" stop-color="#121a3d"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="140" y="42" width="520" height="366" rx="22" fill="#121a3d" stroke="#818cf8" stroke-opacity="0.35"/>

  <text x="170" y="85" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#eef2ff">💡 Logic Lights Out</text>
  <text x="170" y="110" font-family="system-ui, sans-serif" font-size="14" fill="#b3bde9">Turn off every light with cross-pattern flips</text>

  <rect x="170" y="128" width="110" height="54" rx="10" fill="#1c2655"/>
  <rect x="295" y="128" width="110" height="54" rx="10" fill="#1c2655"/>
  <rect x="420" y="128" width="110" height="54" rx="10" fill="#1c2655"/>
  <text x="225" y="147" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#b3bde9">MOVES</text>
  <text x="225" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#eef2ff">14</text>
  <text x="350" y="147" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#b3bde9">BEST</text>
  <text x="350" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#eef2ff">11</text>
  <text x="475" y="147" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#b3bde9">STATUS</text>
  <text x="475" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#eef2ff">Playing</text>

  <g transform="translate(255,202)">
    <rect width="290" height="180" rx="14" fill="#1c2655"/>
    <g transform="translate(15,15)">
      <g fill="#334155">
        <rect x="0" y="0" width="44" height="44" rx="10"/>
        <rect x="50" y="0" width="44" height="44" rx="10"/>
        <rect x="100" y="0" width="44" height="44" rx="10"/>
        <rect x="150" y="0" width="44" height="44" rx="10"/>
        <rect x="200" y="0" width="44" height="44" rx="10"/>

        <rect x="0" y="50" width="44" height="44" rx="10"/>
        <rect x="50" y="50" width="44" height="44" rx="10"/>
        <rect x="100" y="50" width="44" height="44" rx="10"/>
        <rect x="150" y="50" width="44" height="44" rx="10"/>
        <rect x="200" y="50" width="44" height="44" rx="10"/>

        <rect x="0" y="100" width="44" height="44" rx="10"/>
        <rect x="50" y="100" width="44" height="44" rx="10"/>
        <rect x="100" y="100" width="44" height="44" rx="10"/>
        <rect x="150" y="100" width="44" height="44" rx="10"/>
        <rect x="200" y="100" width="44" height="44" rx="10"/>
      </g>

      <g fill="#34d399" filter="url(#glow)">
        <rect x="50" y="0" width="44" height="44" rx="10"/>
        <rect x="150" y="0" width="44" height="44" rx="10"/>
        <rect x="0" y="50" width="44" height="44" rx="10"/>
        <rect x="100" y="50" width="44" height="44" rx="10"/>
        <rect x="200" y="50" width="44" height="44" rx="10"/>
        <rect x="50" y="100" width="44" height="44" rx="10"/>
        <rect x="150" y="100" width="44" height="44" rx="10"/>
      </g>
    </g>
  </g>
</svg>
