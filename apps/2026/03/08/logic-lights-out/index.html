  <style>
    :root {
      --bg: #f4f7ff;
      --surface: #ffffff;
      --surface-2: #e8eeff;
      --text: #1f2440;
      --muted: #6671a3;
      --accent: #4f46e5;
      --accent-2: #7c3aed;
      --on: #22c55e;
      --off: #c7d2fe;
      --shadow: 0 16px 40px rgba(79, 70, 229, 0.18);
    }

    [data-theme="dark"] {
      --bg: #0c122b;
      --surface: #121a3d;
      --surface-2: #1c2655;
      --text: #eef2ff;
      --muted: #b3bde9;
      --accent: #818cf8;
      --accent-2: #c084fc;
      --on: #34d399;
      --off: #334155;
      --shadow: 0 18px 44px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(124,58,237,0.2), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(79,70,229,0.2), transparent 35%),
        var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 1rem;
      transition: background .3s ease, color .3s ease;
    }

    .app {
      width: min(720px, 100%);
      background: var(--surface);
      border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: clamp(1rem, 2.6vw, 2rem);
      transition: background .3s ease;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    h1 { font-size: clamp(1.2rem, 2.8vw, 1.8rem); margin: 0; }
    .subtitle { margin: .35rem 0 0; color: var(--muted); font-size: .95rem; }

    .theme-toggle {
      border: none;
      background: var(--surface-2);
      color: var(--text);
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 1.1rem;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: .75rem;
      margin: 1rem 0;
    }

    .stat {
      background: var(--surface-2);
      border-radius: 12px;
      padding: .65rem .8rem;
      text-align: center;
    }

    .stat small { display:block; color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; }
    .stat strong { font-size: 1.15rem; }

    .board-wrap {
      display: grid;
      place-items: center;
      margin: 1rem 0;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(5, minmax(50px, 70px));
      gap: .55rem;
      touch-action: manipulation;
    }

    .cell {
      aspect-ratio: 1;
      border: none;
      border-radius: 14px;
      background: var(--off);
      cursor: pointer;
      transition: transform .12s ease, background .18s ease, box-shadow .2s ease;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.3);
    }

    .cell.on {
      background: radial-gradient(circle at 30% 30%, #fff8, transparent 55%), var(--on);
      box-shadow: 0 0 22px color-mix(in srgb, var(--on) 65%, transparent);
    }

    .cell:hover, .cell:focus-visible { transform: translateY(-1px) scale(1.02); outline: 2px solid color-mix(in srgb, var(--accent) 50%, transparent); }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: .65rem;
      justify-content: center;
      margin-top: .7rem;
    }

    button.action {
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      border-radius: 999px;
      padding: .65rem 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .hint { text-align: center; color: var(--muted); margin-top: .85rem; font-size: .9rem; }

    footer {
      text-align: center;
      padding-top: 1rem;
      margin-top: 1.4rem;
      border-top: 1px solid color-mix(in srgb, var(--muted) 28%, transparent);
      font-size: .9rem;
      color: var(--muted);
    }

    footer a { color: var(--accent); text-decoration: none; }
    @media (max-width: 460px) {
      .board { grid-template-columns: repeat(5, minmax(42px, 1fr)); gap: .45rem; }
      .stats { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  [data-theme='light']{--bg:#eef4ff;--surface:#ffffff;--text:#1f2f52;--accent:#0891b2;--shadow:rgba(31, 47, 82, 0.12);}

<body>
  <main class="app">
    <header>
      <div>
        <h1>💡 Logic Lights Out</h1>
        <p class="subtitle">Turn off every light. Each tap flips a cross pattern.</p>
      </div>
      <button class="theme-toggle" aria-label="Toggle theme" id="themeToggle">🌙</button>
    </header>

    <section class="stats" aria-live="polite">
      <div class="stat"><small>Moves</small><strong id="moves">0</strong></div>
      <div class="stat"><small>Best</small><strong id="best">—</strong></div>
      <div class="stat"><small>Status</small><strong id="status">Playing</strong></div>
    </section>

    <div class="board-wrap">
      <div class="board" id="board" role="grid" aria-label="Lights Out puzzle board"></div>
    </div>

    <div class="controls">
      <button class="action" id="newGame">New Puzzle</button>
      <button class="action" id="dailyGame">Daily Challenge</button>
    </div>

    <p class="hint">Tip: Solve in as few moves as possible. The board always starts solvable.</p>

    <footer>
      <a href="https://www.valleyofai.com" target="_blank" rel="noopener">← Back to Valley of AI</a>
    </footer>
  </main>

  <script>
    const size = 5;
    const boardEl = document.getElementById('board');
    const movesEl = document.getElementById('moves');
    const bestEl = document.getElementById('best');
    const statusEl = document.getElementById('status');
    const themeToggle = document.getElementById('themeToggle');

    const storageKey = 'valley-lightsout-best';
    const themeKey = 'theme';

    let board = new Array(size * size).fill(false);
    let moves = 0;

    function applyTheme(initial = false) {
      const preferred = localStorage.getItem(themeKey) || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', preferred);
      themeToggle.textContent = preferred === 'dark' ? '☀️' : '🌙';
      if (!initial) localStorage.setItem(themeKey, preferred);
    }

    function toggleTheme() {
      const now = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      localStorage.setItem(themeKey, now);
      applyTheme(true);
    }

    function idx(r, c) { return r * size + c; }

    function flip(r, c) {
      if (r < 0 || r >= size || c < 0 || c >= size) return;
      const i = idx(r, c);
      board[i] = !board[i];
    }

    function handleMove(r, c) {
      flip(r, c);
      flip(r - 1, c);
      flip(r + 1, c);
      flip(r, c - 1);
      flip(r, c + 1);
      moves += 1;
      render();
      if (isSolved()) {
        statusEl.textContent = 'Solved!';
        maybeSaveBest();
      }
    }

    function isSolved() {
      return board.every(v => !v);
    }

    function render() {
      boardEl.innerHTML = '';
      board.forEach((on, i) => {
        const b = document.createElement('button');
        b.className = 'cell' + (on ? ' on' : '');
        b.type = 'button';
        b.setAttribute('role', 'gridcell');
        b.setAttribute('aria-label', `row ${Math.floor(i / size) + 1}, col ${i % size + 1}, ${on ? 'on' : 'off'}`);
        b.addEventListener('click', () => {
          if (isSolved()) return;
          handleMove(Math.floor(i / size), i % size);
        });
        boardEl.appendChild(b);
      });
      movesEl.textContent = moves;
      if (!isSolved()) statusEl.textContent = 'Playing';
      loadBest();
    }

    function loadBest() {
      const best = Number(localStorage.getItem(storageKey));
      bestEl.textContent = Number.isFinite(best) && best > 0 ? best : '—';
    }

    function maybeSaveBest() {
      const best = Number(localStorage.getItem(storageKey));
      if (!Number.isFinite(best) || moves < best) {
        localStorage.setItem(storageKey, String(moves));
      }
      loadBest();
    }

    function scramble(seedMoves = 16, random = Math.random) {
      board = new Array(size * size).fill(false);
      moves = 0;
      for (let i = 0; i < seedMoves; i++) {
        const r = Math.floor(random() * size);
        const c = Math.floor(random() * size);
        flip(r, c); flip(r - 1, c); flip(r + 1, c); flip(r, c - 1); flip(r, c + 1);
      }
      if (isSolved()) scramble(seedMoves + 1, random);
      render();
    }

    function seededRandom(seed) {
      let t = seed >>> 0;
      return () => {
        t += 0x6D2B79F5;
        let x = Math.imul(t ^ (t >>> 15), 1 | t);
        x ^= x + Math.imul(x ^ (x >>> 7), 61 | x);
        return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
      };
    }

    function dailySeed() {
      const d = new Date();
      return Number(`${d.getUTCFullYear()}${String(d.getUTCMonth() + 1).padStart(2, '0')}${String(d.getUTCDate()).padStart(2, '0')}`);
    }

    document.getElementById('newGame').addEventListener('click', () => scramble());
    document.getElementById('dailyGame').addEventListener('click', () => scramble(18, seededRandom(dailySeed())));
    themeToggle.addEventListener('click', toggleTheme);

    applyTheme(true);
    scramble();
  </script>
</body>
