  <meta charset="UTF-8" />

  <title>Mini Putt Gauntlet - __MAIN_SITE_NAME__</title>
  <meta name="description" content="Play a 3-hole mini putt challenge with a moving windmill, a closing gate, and a trap door. Par is 3 on every hole." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231f7a4c'/%3E%3Ccircle cx='66' cy='34' r='16' fill='%23f5f7ff'/%3E%3Ccircle cx='66' cy='34' r='6' fill='%2314213d'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #f3f7ff;
      --bg-alt: #dbe8ff;
      --surface: rgba(255, 255, 255, 0.86);
      --surface-strong: #ffffff;
      --text: #14213d;
      --muted: #51607c;
      --line: rgba(20, 33, 61, 0.14);
      --accent: #1f7a4c;
      --accent-2: #f59e0b;
      --danger: #e11d48;
      --shadow: 0 20px 50px rgba(20, 33, 61, 0.15);
    }

    [data-theme="dark"] {
      --bg: #071222;
      --bg-alt: #10243b;
      --surface: rgba(10, 22, 38, 0.84);
      --surface-strong: #122338;
      --text: #e8f2ff;
      --muted: #9eb3cd;
      --line: rgba(158, 179, 205, 0.24);
      --accent: #34d399;
      --accent-2: #fbbf24;
      --danger: #fb7185;
      --shadow: 0 22px 52px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Avenir Next", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 12% 10%, color-mix(in srgb, var(--bg-alt) 85%, white 15%) 0%, transparent 30%),
        radial-gradient(circle at 80% 0%, color-mix(in srgb, var(--accent-2) 20%, transparent) 0%, transparent 28%),
        linear-gradient(150deg, var(--bg), color-mix(in srgb, var(--bg) 72%, white 28%));
      color: var(--text);
      padding: 16px;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .app {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      border-radius: 18px;
      backdrop-filter: blur(14px);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.4rem, 3.2vw, 2.1rem);
      letter-spacing: -0.02em;
    }

    .sub {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.96rem;
    }

    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    button,
    .link {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface-strong);
      color: var(--text);
      padding: 9px 14px;
      font: inherit;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    button:hover,
    .link:hover,
    button:focus-visible,
    .link:focus-visible {
      outline: none;
      transform: translateY(-1px);
      border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      padding: 12px;
    }

    .stat {
      background: var(--surface-strong);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px;
    }

    .stat .label {
      display: block;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .stat .value {
      margin-top: 4px;
      font-size: 1.2rem;
      font-weight: 700;
    }

    .playfield-wrap {
      position: relative;
      padding: 10px;
    }

    canvas {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #0b4029;
    }

    .status-line {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      padding: 0 12px 12px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .status-line strong { color: var(--text); }

    .overlay {
      position: absolute;
      inset: 10px;
      border-radius: 14px;
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      border: 1px solid var(--line);
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .overlay.show { display: flex; }

    .overlay-box {
      max-width: 460px;
      background: var(--surface-strong);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .overlay h2 {
      margin: 0 0 8px;
      font-size: 1.7rem;
    }

    .overlay p {
      margin: 8px 0;
      color: var(--muted);
    }

    .over {
      color: var(--danger);
      font-weight: 700;
    }

    .under {
      color: var(--accent);
      font-weight: 700;
    }

    @media (max-width: 820px) {
      .hud {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 540px) {
      body { padding: 10px; }
      .topbar { padding: 12px; }
      .hud { gap: 8px; padding: 10px; }
      .stat .value { font-size: 1.05rem; }
    }

<body>
  <main class="app">
    <section class="card topbar">
      <div>
        <h1>Mini Putt Gauntlet</h1>
        <p class="sub">3-hole challenge: windmill, closing gate, trap door. Par 3 on every hole.</p>
      </div>
      <div class="actions">
        <a class="link" href="/" aria-label="Back to Valley of AI">Back to gallery</a>
        <button id="theme-toggle" aria-label="Toggle theme">Toggle theme</button>
        <button id="restart-all" aria-label="Restart all holes">Restart round</button>
      </div>
    </section>

    <section class="card">
      <div class="hud">
        <div class="stat"><span class="label">Hole</span><div class="value" id="hole-label">1 / 3</div></div>
        <div class="stat"><span class="label">Par</span><div class="value" id="par-label">3</div></div>
        <div class="stat"><span class="label">Strokes (Hole)</span><div class="value" id="stroke-label">0</div></div>
        <div class="stat"><span class="label">Total vs Par</span><div class="value" id="score-label">E</div></div>
      </div>
      <div class="playfield-wrap">
        <canvas id="course" width="900" height="520"></canvas>
        <div id="overlay" class="overlay" role="status" aria-live="polite">
          <div class="overlay-box">
            <h2 id="overlay-title">Hole Complete</h2>
            <p id="overlay-main"></p>
            <p id="overlay-sub"></p>
            <button id="overlay-btn" type="button">Next Hole</button>
          </div>
        </div>
      </div>
      <div class="status-line">
        <span><strong>How to shoot:</strong> drag from the ball opposite your shot direction, then release.</span>
        <span id="hazard-hint">Hazard: rotating windmill blades</span>
      </div>
    </section>
  </main>

  <script>
    const docEl = document.documentElement;
    const savedTheme = localStorage.getItem('theme');
    const theme = savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    docEl.setAttribute('data-theme', theme);

    const canvas = document.getElementById('course');
    const ctx = canvas.getContext('2d');

    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayMain = document.getElementById('overlay-main');
    const overlaySub = document.getElementById('overlay-sub');
    const overlayBtn = document.getElementById('overlay-btn');

    const holeLabel = document.getElementById('hole-label');
    const parLabel = document.getElementById('par-label');
    const strokeLabel = document.getElementById('stroke-label');
    const scoreLabel = document.getElementById('score-label');
    const hazardHint = document.getElementById('hazard-hint');

    document.getElementById('theme-toggle').addEventListener('click', () => {
      const next = docEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      docEl.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });

    const PAR = 3;
    const BALL_R = 10;
    const CUP_R = 14;

    const holes = [
      {
        name: 'Hole 1: Windmill Crossing',
        hint: 'Hazard: moving windmill blades',
        start: { x: 104, y: 420 },
        cup: { x: 786, y: 130 },
        walls: [
          { x: 80, y: 80, w: 740, h: 360 }
        ],
        staticObstacles: [
          { x: 208, y: 338, w: 206, h: 18 },
          { x: 602, y: 276, w: 146, h: 18 }
        ],
        obstacle: 'windmill'
      },
      {
        name: 'Hole 2: Closing Gate Alley',
        hint: 'Hazard: timed gate opening and closing',
        start: { x: 120, y: 260 },
        cup: { x: 780, y: 260 },
        walls: [
          { x: 80, y: 130, w: 740, h: 260 }
        ],
        staticObstacles: [
          { x: 238, y: 150, w: 16, h: 76 },
          { x: 238, y: 292, w: 16, h: 76 },
          { x: 642, y: 150, w: 16, h: 76 },
          { x: 642, y: 292, w: 16, h: 76 }
        ],
        obstacle: 'gate'
      },
      {
        name: 'Hole 3: Trap Door Run',
        hint: 'Hazard: trap door opens every few seconds',
        start: { x: 120, y: 120 },
        cup: { x: 780, y: 390 },
        walls: [
          { x: 80, y: 80, w: 740, h: 360 }
        ],
        staticObstacles: [
          { x: 210, y: 168, w: 18, h: 166 },
          { x: 330, y: 80, w: 18, h: 146 },
          { x: 530, y: 292, w: 18, h: 148 },
          { x: 650, y: 162, w: 18, h: 140 }
        ],
        obstacle: 'trap'
      }
    ];

    const state = {
      holeIndex: 0,
      ball: { x: 0, y: 0, vx: 0, vy: 0 },
      aiming: false,
      aimX: 0,
      aimY: 0,
      strokes: [0, 0, 0],
      overlayMode: 'none',
      lastTime: performance.now(),
      trapRecoverUntil: 0,
      trapFlashUntil: 0,
      cupAssistUntil: 0,
      cupAttemptCooldownUntil: 0,
      holeDone: false
    };

    function currentHole() {
      return holes[state.holeIndex];
    }

    function resetBall() {
      const hole = currentHole();
      state.ball.x = hole.start.x;
      state.ball.y = hole.start.y;
      state.ball.vx = 0;
      state.ball.vy = 0;
      state.aiming = false;
    }

    function startHole(index) {
      state.holeIndex = index;
      state.holeDone = false;
      overlay.classList.remove('show');
      state.overlayMode = 'none';
      resetBall();
      updateHud();
    }

    function restartRound() {
      state.strokes = [0, 0, 0];
      startHole(0);
    }

    function speed() {
      return Math.hypot(state.ball.vx, state.ball.vy);
    }

    function getTotalVsPar() {
      return state.strokes.reduce((sum, s) => sum + (s - PAR), 0);
    }

    function fmtRelative(value) {
      if (value === 0) return 'E';
      return value > 0 ? `+${value}` : `${value}`;
    }

    function updateHud() {
      holeLabel.textContent = `${state.holeIndex + 1} / ${holes.length}`;
      parLabel.textContent = `${PAR}`;
      strokeLabel.textContent = `${state.strokes[state.holeIndex]}`;
      scoreLabel.textContent = fmtRelative(getTotalVsPar());
      hazardHint.textContent = currentHole().hint;
    }

    function toCanvasPoint(evt) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: (evt.clientX - rect.left) * scaleX,
        y: (evt.clientY - rect.top) * scaleY
      };
    }

    canvas.addEventListener('pointerdown', (evt) => {
      if (state.holeDone || overlay.classList.contains('show')) return;
      if (state.trapRecoverUntil > performance.now()) return;
      if (speed() > 0.26) return;
      const p = toCanvasPoint(evt);
      const d = Math.hypot(p.x - state.ball.x, p.y - state.ball.y);
      if (d <= BALL_R + 8) {
        state.aiming = true;
        state.aimX = p.x;
        state.aimY = p.y;
        canvas.setPointerCapture(evt.pointerId);
      }
    });

    canvas.addEventListener('pointermove', (evt) => {
      if (!state.aiming) return;
      const p = toCanvasPoint(evt);
      state.aimX = p.x;
      state.aimY = p.y;
    });

    function releaseShot() {
      if (!state.aiming) return;
      state.aiming = false;

      const dx = state.ball.x - state.aimX;
      const dy = state.ball.y - state.aimY;
      const dist = Math.hypot(dx, dy);
      if (dist < 8) return;

      const power = Math.min(900, dist * 7.2);
      state.ball.vx = (dx / dist) * power;
      state.ball.vy = (dy / dist) * power;
      state.strokes[state.holeIndex] += 1;
      updateHud();
    }

    canvas.addEventListener('pointerup', releaseShot);
    canvas.addEventListener('pointercancel', releaseShot);

    function collideWithRect(rect, bounciness = 0.88) {
      const b = state.ball;
      const nearestX = Math.max(rect.x, Math.min(b.x, rect.x + rect.w));
      const nearestY = Math.max(rect.y, Math.min(b.y, rect.y + rect.h));
      const dx = b.x - nearestX;
      const dy = b.y - nearestY;
      const dist = Math.hypot(dx, dy);
      if (dist >= BALL_R || dist === 0) return false;

      const nx = dx / dist;
      const ny = dy / dist;
      const overlap = BALL_R - dist;
      b.x += nx * overlap;
      b.y += ny * overlap;

      const dot = b.vx * nx + b.vy * ny;
      if (dot < 0) {
        b.vx -= 2 * dot * nx;
        b.vy -= 2 * dot * ny;
        b.vx *= bounciness;
        b.vy *= bounciness;
      }
      return true;
    }

    function collideSegment(ax, ay, bx, by, thickness) {
      const b = state.ball;
      const abx = bx - ax;
      const aby = by - ay;
      const apx = b.x - ax;
      const apy = b.y - ay;
      const abLen2 = abx * abx + aby * aby;
      let t = 0;
      if (abLen2 > 0) {
        t = Math.max(0, Math.min(1, (apx * abx + apy * aby) / abLen2));
      }
      const cx = ax + t * abx;
      const cy = ay + t * aby;
      const dx = b.x - cx;
      const dy = b.y - cy;
      const minDist = BALL_R + thickness * 0.5;
      const dist = Math.hypot(dx, dy);
      if (dist >= minDist || dist === 0) return false;

      const nx = dx / dist;
      const ny = dy / dist;
      const overlap = minDist - dist;
      b.x += nx * overlap;
      b.y += ny * overlap;

      const dot = b.vx * nx + b.vy * ny;
      if (dot < 0) {
        b.vx -= 2 * dot * nx;
        b.vy -= 2 * dot * ny;
        b.vx *= 0.9;
        b.vy *= 0.9;
      }
      return true;
    }

    function updatePhysics(dt, now) {
      if (state.holeDone) return;
      const b = state.ball;
      const prevX = b.x;
      const prevY = b.y;
      if (state.trapRecoverUntil > now) {
        b.vx = 0;
        b.vy = 0;
        return;
      }

      b.x += b.vx * dt;
      b.y += b.vy * dt;

      // Keep fast launch feel, then apply realistic rolling slowdown.
      const dragPerSecond = 0.52;
      const rollingDecel = 280;
      const dragFactor = Math.pow(dragPerSecond, dt);
      b.vx *= dragFactor;
      b.vy *= dragFactor;

      const v = Math.hypot(b.vx, b.vy);
      if (v > 0) {
        const nextV = Math.max(0, v - rollingDecel * dt);
        const s = nextV / v;
        b.vx *= s;
        b.vy *= s;
      }

      if (Math.abs(b.vx) < 0.12) b.vx = 0;
      if (Math.abs(b.vy) < 0.12) b.vy = 0;

      const hole = currentHole();
      const boundary = hole.walls[0];
      if (b.x - BALL_R < boundary.x) {
        b.x = boundary.x + BALL_R;
        b.vx = Math.abs(b.vx) * 0.9;
      }
      if (b.x + BALL_R > boundary.x + boundary.w) {
        b.x = boundary.x + boundary.w - BALL_R;
        b.vx = -Math.abs(b.vx) * 0.9;
      }
      if (b.y - BALL_R < boundary.y) {
        b.y = boundary.y + BALL_R;
        b.vy = Math.abs(b.vy) * 0.9;
      }
      if (b.y + BALL_R > boundary.y + boundary.h) {
        b.y = boundary.y + boundary.h - BALL_R;
        b.vy = -Math.abs(b.vy) * 0.9;
      }

      for (const blocker of hole.staticObstacles || []) {
        collideWithRect(blocker, 0.86);
      }

      if (hole.obstacle === 'windmill') {
        const windmills = [
          { cx: 700, cy: 182, arm: 116, phase: 0 },
          { cx: 540, cy: 284, arm: 96, phase: Math.PI / 3 }
        ];
        for (const wm of windmills) {
          const angle = now * 0.0018 + wm.phase;
          const x1 = wm.cx - Math.cos(angle) * wm.arm;
          const y1 = wm.cy - Math.sin(angle) * wm.arm;
          const x2 = wm.cx + Math.cos(angle) * wm.arm;
          const y2 = wm.cy + Math.sin(angle) * wm.arm;
          collideSegment(x1, y1, x2, y2, 16);
        }
      }

      if (hole.obstacle === 'gate') {
        const t = (Math.sin(now * 0.004) + 1) * 0.5;
        const gateHeight = 170;
        const y = 150 + t * 110;
        collideWithRect({ x: 435, y, w: 30, h: gateHeight });
      }

      if (hole.obstacle === 'trap') {
        const cycle = now % 3400;
        const isOpen = cycle > 1500 && cycle < 2450;
        const trap = { x: 385, y: 205, w: 130, h: 90 };
        if (isOpen && b.x > trap.x && b.x < trap.x + trap.w && b.y > trap.y && b.y < trap.y + trap.h) {
          state.trapRecoverUntil = now + 700;
          state.trapFlashUntil = now + 700;
          state.strokes[state.holeIndex] += 1;
          updateHud();
          setTimeout(() => {
            if (state.holeIndex === 2 && !state.holeDone) {
              resetBall();
            }
          }, 680);
        }
      }

      const cup = hole.cup;
      const dc = Math.hypot(b.x - cup.x, b.y - cup.y);
      const lipRadius = CUP_R + BALL_R * 1.55;

      // Capture putts that pass over the hole between frames.
      const segDx = b.x - prevX;
      const segDy = b.y - prevY;
      const segLen2 = segDx * segDx + segDy * segDy;
      let pathClosest = dc;
      if (segLen2 > 0) {
        const tx = cup.x - prevX;
        const ty = cup.y - prevY;
        const t = Math.max(0, Math.min(1, (tx * segDx + ty * segDy) / segLen2));
        const cx = prevX + segDx * t;
        const cy = prevY + segDy * t;
        pathClosest = Math.hypot(cup.x - cx, cup.y - cy);
      }

      const nearCup = dc < lipRadius || pathClosest < lipRadius;
      const ballSpeed = speed();
      const passOver = pathClosest < lipRadius;

      // Immediate cup decision on pass-over: if speed is reasonable, grab now.
      if (
        passOver
        && now >= state.cupAttemptCooldownUntil
        && now >= state.cupAssistUntil
      ) {
        const sinkSpeedLimit = 78;
        if (ballSpeed <= sinkSpeedLimit) {
          state.cupAssistUntil = now + 320;
        } else {
          // Lip out when crossing too fast.
          const nx = (b.x - cup.x) || 1;
          const ny = (b.y - cup.y) || 0;
          const nLen = Math.hypot(nx, ny) || 1;
          const ux = nx / nLen;
          const uy = ny / nLen;
          b.x = cup.x + ux * (lipRadius + 2);
          b.y = cup.y + uy * (lipRadius + 2);
          b.vx = b.vx * 0.78 + ux * 45;
          b.vy = b.vy * 0.78 + uy * 45;
          state.cupAttemptCooldownUntil = now + 150;
        }
      }

      // Near-cup fallback assist for very slow dribblers that don't cross center.
      if (
        nearCup
        && !passOver
        && ballSpeed < 18
        && now >= state.cupAttemptCooldownUntil
        && now >= state.cupAssistUntil
      ) {
        state.cupAssistUntil = now + 220;
      }

      if (nearCup && now < state.cupAssistUntil) {
        const pull = Math.min(1, dt * 10);
        b.x += (cup.x - b.x) * pull;
        b.y += (cup.y - b.y) * pull;
        b.vx = b.vx * 0.5 + (cup.x - b.x) * 0.12;
        b.vy = b.vy * 0.5 + (cup.y - b.y) * 0.12;

        if (Math.hypot(b.x - cup.x, b.y - cup.y) < 2.8 && speed() < 16) {
          b.x = cup.x;
          b.y = cup.y;
          completeHole();
        }
      }
    }

    function completeHole() {
      if (state.holeDone) return;
      state.holeDone = true;
      state.ball.vx = 0;
      state.ball.vy = 0;

      const holeStrokes = state.strokes[state.holeIndex];
      const rel = holeStrokes - PAR;
      const relText = rel === 0 ? 'on par' : (rel > 0 ? `${rel} over par` : `${Math.abs(rel)} under par`);

      overlayTitle.textContent = `Hole ${state.holeIndex + 1} Complete`;
      overlayMain.textContent = `You took ${holeStrokes} stroke${holeStrokes === 1 ? '' : 's'} (${relText}).`;

      if (state.holeIndex < holes.length - 1) {
        overlaySub.textContent = `Next: ${holes[state.holeIndex + 1].name} (Par ${PAR}).`;
        overlayBtn.textContent = 'Next Hole';
        state.overlayMode = 'next';
      } else {
        const total = getTotalVsPar();
        const cls = total > 0 ? 'over' : (total < 0 ? 'under' : '');
        overlaySub.innerHTML = `Round complete. Final score: <span class="${cls}">${fmtRelative(total)}</span> versus par.`;
        overlayBtn.textContent = 'Play Again';
        state.overlayMode = 'restart';
      }

      overlay.classList.add('show');
      updateHud();
    }

    overlayBtn.addEventListener('click', () => {
      overlay.classList.remove('show');
      if (state.overlayMode === 'next') {
        startHole(state.holeIndex + 1);
      } else {
        restartRound();
      }
    });

    document.getElementById('restart-all').addEventListener('click', restartRound);

    function drawCourse(now) {
      const hole = currentHole();
      const b = state.ball;
      const bounds = hole.walls[0];
      const dark = docEl.getAttribute('data-theme') === 'dark';

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = dark ? '#06331f' : '#0d5c36';
      ctx.fillRect(bounds.x, bounds.y, bounds.w, bounds.h);

      ctx.strokeStyle = dark ? '#2dd4bf66' : '#d9f99d88';
      ctx.lineWidth = 3;
      ctx.strokeRect(bounds.x, bounds.y, bounds.w, bounds.h);

      ctx.fillStyle = dark ? '#174936' : '#1f7a4c';
      for (let i = 0; i < 8; i += 1) {
        const stripeY = bounds.y + 20 + i * 42;
        ctx.fillRect(bounds.x + 8, stripeY, bounds.w - 16, 12);
      }

      // Static course blockers used across each hole for additional strategy.
      for (const blocker of hole.staticObstacles || []) {
        ctx.fillStyle = dark ? '#334155' : '#7c8ba1';
        ctx.fillRect(blocker.x, blocker.y, blocker.w, blocker.h);
        ctx.strokeStyle = dark ? '#94a3b8' : '#334155';
        ctx.lineWidth = 2;
        ctx.strokeRect(blocker.x + 1, blocker.y + 1, blocker.w - 2, blocker.h - 2);
      }

      ctx.fillStyle = '#f5f7ff';
      ctx.beginPath();
      ctx.arc(hole.cup.x, hole.cup.y, CUP_R, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(hole.cup.x, hole.cup.y, 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#f8fafc';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(hole.cup.x, hole.cup.y - 44);
      ctx.lineTo(hole.cup.x, hole.cup.y - 10);
      ctx.stroke();
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.moveTo(hole.cup.x, hole.cup.y - 44);
      ctx.lineTo(hole.cup.x + 30, hole.cup.y - 34);
      ctx.lineTo(hole.cup.x, hole.cup.y - 22);
      ctx.closePath();
      ctx.fill();

      if (hole.obstacle === 'windmill') {
        const windmills = [
          { cx: 700, cy: 182, arm: 110, mast: 94, phase: 0 },
          { cx: 540, cy: 284, arm: 92, mast: 80, phase: Math.PI / 3 }
        ];

        for (const wm of windmills) {
          const angle = now * 0.0018 + wm.phase;

          ctx.fillStyle = '#e2e8f0';
          ctx.fillRect(wm.cx - 18, wm.cy - wm.mast, 36, wm.mast * 2);

          ctx.save();
          ctx.translate(wm.cx, wm.cy);
          ctx.rotate(angle);
          ctx.fillStyle = '#f59e0b';
          ctx.fillRect(-wm.arm, -8, wm.arm * 2, 16);
          ctx.restore();

          ctx.fillStyle = '#111827';
          ctx.beginPath();
          ctx.arc(wm.cx, wm.cy, 10, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      if (hole.obstacle === 'gate') {
        const t = (Math.sin(now * 0.004) + 1) * 0.5;
        const gateHeight = 170;
        const y = 150 + t * 110;

        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(435, y, 30, gateHeight);

        ctx.fillStyle = '#0f172a';
        for (let i = 0; i < 6; i += 1) {
          ctx.fillRect(437, y + 8 + i * 26, 26, 7);
        }
      }

      if (hole.obstacle === 'trap') {
        const cycle = now % 3400;
        const isOpen = cycle > 1500 && cycle < 2450;
        ctx.fillStyle = '#0f172a55';
        ctx.fillRect(385, 205, 130, 90);

        if (!isOpen) {
          ctx.fillStyle = '#64748b';
          ctx.fillRect(385, 205, 130, 90);
          ctx.strokeStyle = '#94a3b8';
          ctx.lineWidth = 2;
          ctx.strokeRect(385, 205, 130, 90);
          ctx.beginPath();
          ctx.moveTo(450, 205);
          ctx.lineTo(450, 295);
          ctx.stroke();
        } else {
          ctx.fillStyle = '#111827';
          ctx.fillRect(385, 205, 130, 90);
        }

        if (state.trapFlashUntil > now) {
          ctx.fillStyle = '#fb718577';
          ctx.fillRect(bounds.x, bounds.y, bounds.w, bounds.h);
        }
      }

      if (state.aiming) {
        const dx = state.ball.x - state.aimX;
        const dy = state.ball.y - state.aimY;
        const dist = Math.min(140, Math.hypot(dx, dy));
        const nx = dist > 0 ? dx / dist : 0;
        const ny = dist > 0 ? dy / dist : 0;
        const tipX = state.ball.x + nx * dist;
        const tipY = state.ball.y + ny * dist;

        ctx.strokeStyle = '#ffffffcc';
        ctx.lineWidth = 3;
        ctx.setLineDash([10, 8]);
        ctx.beginPath();
        ctx.moveTo(state.ball.x, state.ball.y);
        ctx.lineTo(tipX, tipY);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.arc(b.x, b.y, BALL_R, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = '#f8fafc';
      ctx.font = '700 20px Trebuchet MS, sans-serif';
      ctx.fillText(hole.name, 94, 114);
    }

    function loop(now) {
      const dt = Math.min(0.033, (now - state.lastTime) / 1000);
      state.lastTime = now;

      updatePhysics(dt, now);
      drawCourse(now);

      requestAnimationFrame(loop);
    }

    startHole(0);
    requestAnimationFrame(loop);
  </script>
</body>
</html>
