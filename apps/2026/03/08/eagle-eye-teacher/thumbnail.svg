<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Background (floor) -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Chalkboard -->
  <rect x="100" y="12" width="600" height="78" rx="4" fill="#1a3a2a" stroke="#92400e" stroke-width="4"/>
  <text x="400" y="60" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="22" fill="#e2e8f0" opacity="0.9">📚 Pop Quiz: Chapter 7</text>

  <!-- HUD Bar -->
  <rect x="0" y="0" width="800" height="10" fill="transparent"/>
  <!-- Score -->
  <text x="50" y="445" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-transform="uppercase">SCORE</text>
  <text x="50" y="430" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f1f5f9">185</text>
  <!-- Timer -->
  <text x="720" y="445" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">TIME</text>
  <text x="720" y="430" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f1f5f9">38</text>
  <!-- Streak -->
  <text x="400" y="445" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">STREAK</text>
  <text x="400" y="430" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f59e0b">4</text>

  <!-- Chaos bar -->
  <rect x="200" y="436" width="160" height="10" rx="5" fill="#334155"/>
  <rect x="200" y="436" width="72" height="10" rx="5" fill="url(#chaosGrad)"/>
  <defs>
    <linearGradient id="chaosGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Desk Row 1 -->
  <!-- Desk 1: sleeping student -->
  <g transform="translate(48, 105)">
    <rect x="8" y="55" width="120" height="35" rx="4" fill="#78350f"/>
    <rect x="8" y="52" width="120" height="4" rx="2" fill="#92400e"/>
    <text x="68" y="35" text-anchor="middle" font-size="32">😴</text>
    <rect x="35" y="42" width="66" height="16" rx="8" fill="#1e293b" opacity="0.85"/>
    <text x="68" y="54" text-anchor="middle" font-family="system-ui" font-size="10" fill="#f1f5f9">Zzz...</text>
  </g>

  <!-- Desk 2: empty -->
  <g transform="translate(192, 105)">
    <rect x="8" y="55" width="120" height="35" rx="4" fill="#78350f"/>
    <rect x="8" y="52" width="120" height="4" rx="2" fill="#92400e"/>
  </g>

  <!-- Desk 3: texting student -->
  <g transform="translate(336, 105)">
    <rect x="8" y="55" width="120" height="35" rx="4" fill="#78350f"/>
    <rect x="8" y="52" width="120" height="4" rx="2" fill="#92400e"/>
    <text x="68" y="35" text-anchor="middle" font-size="32">📱</text>
    <rect x="30" y="42" width="76" height="16" rx="8" fill="#1e293b" opacity="0.85"/>
    <text x="68" y="54" text-anchor="middle" font-family="system-ui" font-size="10" fill="#f1f5f9">Texting</text>
  </g>

  <!-- Desk 4: empty -->
  <g transform="translate(480, 105)">
    <rect x="8" y="55" width="120" height="35" rx="4" fill="#78350f"/>
    <rect x="8" y="52" width="120" height="4" rx="2" fill="#92400e"/>
  </g>

  <!-- Desk 5: hand raised (good!) -->
  <g transform="translate(624, 105)">
    <rect x="8" y="55" width="120" height="35" rx="4" fill="#78350f"/>
    <rect x="8" y="52" width="120" height="4" rx="2" fill="#92400e"/>
    <text x="68" y="35" text-anchor="middle" font-size="32">✋</text>
    <rect x="20" y="42" width="96" height="16" rx="8" fill="#1e293b" opacity="0.85"/>
    <text x="68" y="54" text-anchor="middle" font-family="system-ui" font-size="10" fill="#22c55e">Question!</text>
  </g>

  <!-- Desk Row 2 -->
  <!-- Desk 6: paper airplane -->
  <g transform="translate(48, 210)">
    <rect x="8" y="55" width="120" height="35" rx="4" fill="#78350f"/>
    <rect x="8" y="52" width="120" height="4" rx="2" fill="#92400e"/>
    <text x="68" y="35" text-anchor="middle" font-size="32">✈️</text>
    <rect x="30" y="42" width="76" height="16" rx="8" fill="#1e293b" opacity="0.85"/>
    <text x="68" y="54" text-anchor="middle" font-family="system-ui" font-size="10" fill="#f1f5f9">Throw!</text>
  </g>

  <!-- Desk 7: empty -->
  <g transform="translate(192, 210)">
    <rect x="8" y="55" width="120" height="35" rx="4" fill="#78350f"/>
    <rect x="8" y="52" width="120" height="4" rx="2" fill="#92400e"/>
  </g>

  <!-- Desk 8: star student -->
  <g transform="translate(336, 210)">
    <rect x="8" y="55" width="120" height="35" rx="4" fill="#78350f"/>
    <rect x="8" y="52" width="120" height="4" rx="2" fill="#92400e"/>
    <text x="68" y="35" text-anchor="middle" font-size="32">⭐</text>
    <rect x="25" y="42" width="86" height="16" rx="8" fill="#1e293b" opacity="0.85"/>
    <text x="68" y="54" text-anchor="middle" font-family="system-ui" font-size="10" fill="#22c55e">Working!</text>
  </g>

  <!-- Desk 9: passing notes -->
  <g transform="translate(480, 210)">
    <rect x="8" y="55" width="120" height="35" rx="4" fill="#78350f"/>
    <rect x="8" y="52" width="120" height="4" rx="2" fill="#92400e"/>
    <text x="68" y="35" text-anchor="middle" font-size="32">📝</text>
    <rect x="37" y="42" width="62" height="16" rx="8" fill="#1e293b" opacity="0.85"/>
    <text x="68" y="54" text-anchor="middle" font-family="system-ui" font-size="10" fill="#f1f5f9">Psst!</text>
  </g>

  <!-- Desk 10: empty -->
  <g transform="translate(624, 210)">
    <rect x="8" y="55" width="120" height="35" rx="4" fill="#78350f"/>
    <rect x="8" y="52" width="120" height="4" rx="2" fill="#92400e"/>
  </g>

  <!-- Desk Row 3 -->
  <!-- Desk 11: empty -->
  <g transform="translate(48, 315)">
    <rect x="8" y="55" width="120" height="35" rx="4" fill="#78350f"/>
    <rect x="8" y="52" width="120" height="4" rx="2" fill="#92400e"/>
  </g>

  <!-- Desk 12: sleeping -->
  <g transform="translate(192, 315)">
    <rect x="8" y="55" width="120" height="35" rx="4" fill="#78350f"/>
    <rect x="8" y="52" width="120" height="4" rx="2" fill="#92400e"/>
    <text x="68" y="35" text-anchor="middle" font-size="32">😴</text>
    <rect x="35" y="42" width="66" height="16" rx="8" fill="#1e293b" opacity="0.85"/>
    <text x="68" y="54" text-anchor="middle" font-family="system-ui" font-size="10" fill="#f1f5f9">Zzz...</text>
  </g>

  <!-- Desk 13: empty -->
  <g transform="translate(336, 315)">
    <rect x="8" y="55" width="120" height="35" rx="4" fill="#78350f"/>
    <rect x="8" y="52" width="120" height="4" rx="2" fill="#92400e"/>
  </g>

  <!-- Desk 14: empty -->
  <g transform="translate(480, 315)">
    <rect x="8" y="55" width="120" height="35" rx="4" fill="#78350f"/>
    <rect x="8" y="52" width="120" height="4" rx="2" fill="#92400e"/>
  </g>

  <!-- Desk 15: texting -->
  <g transform="translate(624, 315)">
    <rect x="8" y="55" width="120" height="35" rx="4" fill="#78350f"/>
    <rect x="8" y="52" width="120" height="4" rx="2" fill="#92400e"/>
    <text x="68" y="35" text-anchor="middle" font-size="32">📱</text>
    <rect x="30" y="42" width="76" height="16" rx="8" fill="#1e293b" opacity="0.85"/>
    <text x="68" y="54" text-anchor="middle" font-family="system-ui" font-size="10" fill="#f1f5f9">Texting</text>
  </g>

  <!-- Floating score popup -->
  <text x="116" y="115" text-anchor="middle" font-family="system-ui" font-size="18" font-weight="800" fill="#22c55e" opacity="0.7">+10</text>

  <!-- Combo text -->
  <text x="400" y="105" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="800" fill="#f59e0b">⚡ 4x Streak!</text>

  <!-- Title -->
  <text x="400" y="420" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">🦅 Eagle Eye Teacher</text>
</svg>
