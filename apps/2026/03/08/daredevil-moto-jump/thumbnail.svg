<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#1a1040"/>
    </linearGradient>
    <linearGradient id="rampGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#cc3300"/>
      <stop offset="100%" style="stop-color:#991100"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="800" height="450" fill="url(#sky)"/>

  <!-- Tiny stars -->
  <circle cx="80" cy="40" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="200" cy="70" r="1" fill="white" opacity="0.4"/>
  <circle cx="350" cy="30" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="500" cy="55" r="1" fill="white" opacity="0.5"/>
  <circle cx="650" cy="25" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="720" cy="80" r="1" fill="white" opacity="0.3"/>
  <circle cx="140" cy="90" r="1" fill="white" opacity="0.5"/>
  <circle cx="450" cy="85" r="1.5" fill="white" opacity="0.4"/>

  <!-- Ground -->
  <rect x="0" y="340" width="800" height="110" fill="#1a1a0a"/>
  <line x1="0" y1="340" x2="800" y2="340" stroke="#333300" stroke-width="2"/>

  <!-- Launch ramp -->
  <polygon points="100,340 180,270 180,340" fill="url(#rampGrad)"/>
  <line x1="120" y1="340" x2="130" y2="322" stroke="#ff6600" stroke-width="2"/>
  <line x1="140" y1="340" x2="155" y2="305" stroke="#ff6600" stroke-width="2"/>
  <line x1="160" y1="340" x2="170" y2="288" stroke="#ff6600" stroke-width="2"/>

  <!-- Buses -->
  <g>
    <!-- Bus 1 -->
    <rect x="220" y="295" width="70" height="45" rx="6" fill="#2244aa"/>
    <rect x="226" y="301" width="12" height="14" rx="2" fill="#88bbff"/>
    <rect x="243" y="301" width="12" height="14" rx="2" fill="#88bbff"/>
    <rect x="260" y="301" width="12" height="14" rx="2" fill="#88bbff"/>
    <circle cx="235" cy="340" r="7" fill="#222"/><circle cx="275" cy="340" r="7" fill="#222"/>

    <!-- Bus 2 -->
    <rect x="296" y="295" width="70" height="45" rx="6" fill="#cc2222"/>
    <rect x="302" y="301" width="12" height="14" rx="2" fill="#88bbff"/>
    <rect x="319" y="301" width="12" height="14" rx="2" fill="#88bbff"/>
    <rect x="336" y="301" width="12" height="14" rx="2" fill="#88bbff"/>
    <circle cx="311" cy="340" r="7" fill="#222"/><circle cx="351" cy="340" r="7" fill="#222"/>

    <!-- Bus 3 -->
    <rect x="372" y="295" width="70" height="45" rx="6" fill="#22aa44"/>
    <rect x="378" y="301" width="12" height="14" rx="2" fill="#88bbff"/>
    <rect x="395" y="301" width="12" height="14" rx="2" fill="#88bbff"/>
    <rect x="412" y="301" width="12" height="14" rx="2" fill="#88bbff"/>
    <circle cx="387" cy="340" r="7" fill="#222"/><circle cx="427" cy="340" r="7" fill="#222"/>

    <!-- Bus 4 -->
    <rect x="448" y="295" width="70" height="45" rx="6" fill="#aa8800"/>
    <rect x="454" y="301" width="12" height="14" rx="2" fill="#88bbff"/>
    <rect x="471" y="301" width="12" height="14" rx="2" fill="#88bbff"/>
    <rect x="488" y="301" width="12" height="14" rx="2" fill="#88bbff"/>
    <circle cx="463" cy="340" r="7" fill="#222"/><circle cx="503" cy="340" r="7" fill="#222"/>
  </g>

  <!-- Landing ramp -->
  <polygon points="560,270 560,340 640,340" fill="url(#rampGrad)"/>
  <line x1="580" y1="340" x2="570" y2="305" stroke="#ff6600" stroke-width="2"/>
  <line x1="600" y1="340" x2="575" y2="288" stroke="#ff6600" stroke-width="2"/>

  <!-- Collectible stars above buses (with glow) -->
  <g filter="url(#glow)">
    <polygon points="300,200 304,212 316,212 306,220 310,232 300,224 290,232 294,220 284,212 296,212" fill="#ffcc00"/>
    <polygon points="380,180 384,192 396,192 386,200 390,212 380,204 370,212 374,200 364,192 376,192" fill="#ffcc00"/>
    <polygon points="460,195 464,207 476,207 466,215 470,227 460,219 450,227 454,215 444,207 456,207" fill="#ffcc00"/>
  </g>

  <!-- Motorcycle mid-jump (rotated slightly, over buses) -->
  <g transform="translate(370, 155) rotate(-25)">
    <!-- Bike body -->
    <ellipse cx="0" cy="-5" rx="28" ry="12" fill="#cc0000"/>
    <!-- Seat -->
    <ellipse cx="-5" cy="-14" rx="15" ry="6" fill="#222" transform="rotate(-8)"/>
    <!-- Tank -->
    <ellipse cx="10" cy="-12" rx="10" ry="7" fill="#ee0000" transform="rotate(11)"/>
    <!-- Chrome accent -->
    <ellipse cx="10" cy="-12" rx="6" ry="3" fill="#ccc" transform="rotate(11)"/>
    <!-- Handlebars -->
    <line x1="20" y1="-10" x2="26" y2="-22" stroke="#888" stroke-width="3"/>
    <line x1="26" y1="-26" x2="26" y2="-18" stroke="#888" stroke-width="3"/>
    <!-- Rear wheel -->
    <circle cx="-24" cy="8" r="10" fill="#111" stroke="#444" stroke-width="2"/>
    <circle cx="-24" cy="8" r="3" fill="#888"/>
    <!-- Front wheel -->
    <circle cx="24" cy="8" r="10" fill="#111" stroke="#444" stroke-width="2"/>
    <circle cx="24" cy="8" r="3" fill="#888"/>
    <!-- Rider body -->
    <ellipse cx="-2" cy="-26" rx="8" ry="14" fill="white"/>
    <rect x="-6" y="-32" width="8" height="8" fill="#0044cc"/>
    <!-- Head + helmet -->
    <circle cx="0" cy="-44" r="9" fill="white"/>
    <path d="M3,-49 A6,6 0 0,1 9,-43 L3,-43 Z" fill="#224"/>
    <!-- Star on chest -->
    <text x="-2" y="-24" text-anchor="middle" font-size="10" fill="#ffcc00">★</text>
    <!-- Arms -->
    <line x1="4" y1="-30" x2="20" y2="-18" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="-6" y1="-30" x2="-15" y2="-20" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <!-- Legs -->
    <line x1="-4" y1="-14" x2="-14" y2="-2" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="2" y1="-14" x2="12" y2="-2" stroke="white" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Fire trail particles -->
  <circle cx="335" cy="180" r="5" fill="#ff4400" opacity="0.8"/>
  <circle cx="325" cy="188" r="4" fill="#ffcc00" opacity="0.7"/>
  <circle cx="318" cy="194" r="6" fill="#ff6600" opacity="0.6"/>
  <circle cx="310" cy="200" r="4" fill="#ff4400" opacity="0.5"/>
  <circle cx="302" cy="208" r="5" fill="#ffaa00" opacity="0.4"/>
  <circle cx="296" cy="215" r="3" fill="#ff4400" opacity="0.3"/>

  <!-- HUD Score -->
  <rect x="20" y="15" width="100" height="50" rx="8" fill="rgba(0,0,0,0.6)"/>
  <text x="70" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8888aa" letter-spacing="1.5">SCORE</text>
  <text x="70" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#ff4400">1,250</text>

  <!-- HUD Level -->
  <rect x="350" y="15" width="100" height="50" rx="8" fill="rgba(0,0,0,0.6)"/>
  <text x="400" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8888aa" letter-spacing="1.5">LEVEL</text>
  <text x="400" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffcc00">3</text>

  <!-- HUD Flips -->
  <rect x="570" y="15" width="100" height="50" rx="8" fill="rgba(0,0,0,0.6)"/>
  <text x="620" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8888aa" letter-spacing="1.5">FLIPS</text>
  <text x="620" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffcc00">2</text>

  <!-- HUD Stars -->
  <rect x="680" y="15" width="100" height="50" rx="8" fill="rgba(0,0,0,0.6)"/>
  <text x="730" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8888aa" letter-spacing="1.5">STARS</text>
  <text x="730" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffcc00">5</text>

  <!-- Title -->
  <text x="400" y="420" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="900" fill="#f0f0ff">🏍️ Daredevil Moto Jump</text>

  <!-- Combo text -->
  <text x="400" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="30" font-weight="900" fill="#ff4400" filter="url(#glow)">🔥 2x FLIP! +200</text>
</svg>
