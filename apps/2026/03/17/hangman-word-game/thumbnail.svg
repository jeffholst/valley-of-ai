<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Hangman Word Game thumbnail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="660" cy="70" r="140" fill="#22d3ee" opacity="0.12"/>

  <rect x="40" y="34" width="720" height="382" rx="24" fill="url(#card)" stroke="#475569"/>

  <text x="70" y="84" fill="#e2e8f0" font-size="36" font-family="Arial, sans-serif" font-weight="700">Hangman Word Game</text>
  <rect x="70" y="100" width="190" height="28" rx="14" fill="#0f172a"/>
  <text x="86" y="120" fill="#34d399" font-size="16" font-family="Arial, sans-serif">Lives: 4</text>

  <g transform="translate(90 150)" stroke="#e5e7eb" stroke-width="8" stroke-linecap="round" fill="none">
    <line x1="0" y1="190" x2="200" y2="190"/>
    <line x1="40" y1="190" x2="40" y2="10"/>
    <line x1="40" y1="10" x2="170" y2="10"/>
    <line x1="170" y1="10" x2="170" y2="36"/>
    <circle cx="170" cy="60" r="24"/>
    <line x1="170" y1="84" x2="170" y2="136"/>
    <line x1="170" y1="100" x2="140" y2="122"/>
    <line x1="170" y1="100" x2="198" y2="122"/>
    <line x1="170" y1="136" x2="145" y2="168"/>
    <line x1="170" y1="136" x2="193" y2="168"/>
  </g>

  <g transform="translate(390 144)">
    <rect x="0" y="0" width="330" height="220" rx="16" fill="#1e293b" stroke="#64748b"/>
    <text x="18" y="34" fill="#cbd5e1" font-size="18" font-family="Arial, sans-serif">Guess the hidden word.</text>

    <g fill="#e2e8f0" font-family="Arial, sans-serif" font-size="32" font-weight="700">
      <text x="18" y="90">H _ N G _ A N</text>
    </g>

    <text x="18" y="132" fill="#fb7185" font-size="16" font-family="Arial, sans-serif">Wrong letters: E, O</text>

    <g transform="translate(18 152)">
      <rect x="0" y="0" width="28" height="28" rx="6" fill="#334155"/>
      <rect x="34" y="0" width="28" height="28" rx="6" fill="#334155"/>
      <rect x="68" y="0" width="28" height="28" rx="6" fill="#334155"/>
      <rect x="102" y="0" width="28" height="28" rx="6" fill="#34d399"/>
      <rect x="136" y="0" width="28" height="28" rx="6" fill="#fb7185"/>
      <rect x="170" y="0" width="28" height="28" rx="6" fill="#334155"/>
      <rect x="204" y="0" width="28" height="28" rx="6" fill="#334155"/>
      <rect x="238" y="0" width="28" height="28" rx="6" fill="#334155"/>
      <rect x="272" y="0" width="28" height="28" rx="6" fill="#334155"/>
    </g>
  </g>
</svg>
