<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="450" fill="#0f172a"/>
  
  <!-- Dark surface box -->
  <rect x="100" y="60" width="600" height="330" rx="12" fill="#1e293b"/>
  
  <!-- Title -->
  <text x="400" y="110" font-family="system-ui, sans-serif" font-size="36" font-weight="600" fill="#f9fafb" text-anchor="middle">Focus Timer</text>
  
  <!-- Timer display -->
  <rect x="180" y="150" width="440" height="120" rx="8" fill="#0f172a"/>
  <text x="400" y="240" font-family="Monaco, monospace" font-size="72" font-weight="bold" fill="#3b82f6" text-anchor="middle">25:00</text>
  
  <!-- Start button -->
  <rect x="200" y="295" width="400" height="50" rx="6" fill="#3b82f6"/>
  <text x="400" y="330" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="white" text-anchor="middle">Start</text>
  
  <!-- Preset buttons at bottom -->
  <g font-family="system-ui, sans-serif" font-size="12" fill="white">
    <rect x="130" y="365" width="50" height="35" rx="4" fill="#3b82f6" opacity="0.7"/>
    <text x="155" y="388" text-anchor="middle">5 min</text>
    
    <rect x="210" y="365" width="50" height="35" rx="4" fill="#3b82f6" opacity="0.7"/>
    <text x="235" y="388" text-anchor="middle">15 min</text>
    
    <rect x="290" y="365" width="50" height="35" rx="4" fill="#3b82f6" opacity="0.7"/>
    <text x="315" y="388" text-anchor="middle">25 min</text>
    
    <rect x="370" y="365" width="50" height="35" rx="4" fill="#3b82f6" opacity="0.7"/>
    <text x="395" y="388" text-anchor="middle">45 min</text>
    
    <rect x="450" y="365" width="50" height="35" rx="4" fill="#3b82f6" opacity="0.7"/>
    <text x="475" y="388" text-anchor="middle">60 min</text>
    
    <rect x="530" y="365" width="50" height="35" rx="4" fill="#3b82f6" opacity="0.7"/>
    <text x="555" y="388" text-anchor="middle">90 min</text>
  </g>
</svg>
