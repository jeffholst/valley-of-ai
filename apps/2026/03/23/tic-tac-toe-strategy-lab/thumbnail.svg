<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Tic-Tac-Toe Strategy Lab gameplay preview">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0b1224"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2d4d"/>
      <stop offset="100%" stop-color="#16213b"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="760" height="410" rx="24" fill="none" stroke="#22d3ee" stroke-opacity="0.35"/>

  <rect x="40" y="36" width="720" height="88" rx="16" fill="url(#panelGrad)" stroke="#32466f"/>
  <text x="62" y="74" fill="#e2e8f0" font-family="Inter,Segoe UI,sans-serif" font-size="34" font-weight="800" filter="url(#softGlow)">
    Tic-Tac-Toe Strategy Lab
  </text>
  <text x="62" y="102" fill="#a5b4fc" font-family="Inter,Segoe UI,sans-serif" font-size="18">
    You (X): 3   AI (O): 2   Draws: 1   Turn: You
  </text>

  <rect x="210" y="140" width="380" height="280" rx="22" fill="url(#panelGrad)" stroke="#32466f"/>

  <g transform="translate(245,170)">
    <rect x="0" y="0" width="90" height="74" rx="14" fill="#22345a" stroke="#32466f"/>
    <rect x="100" y="0" width="90" height="74" rx="14" fill="#22345a" stroke="#32466f"/>
    <rect x="200" y="0" width="90" height="74" rx="14" fill="#22345a" stroke="#32466f"/>
    <rect x="0" y="84" width="90" height="74" rx="14" fill="#22345a" stroke="#32466f"/>
    <rect x="100" y="84" width="90" height="74" rx="14" fill="#22345a" stroke="#32466f"/>
    <rect x="200" y="84" width="90" height="74" rx="14" fill="#22345a" stroke="#32466f"/>
    <rect x="0" y="168" width="90" height="74" rx="14" fill="#22345a" stroke="#32466f"/>
    <rect x="100" y="168" width="90" height="74" rx="14" fill="#22345a" stroke="#32466f"/>
    <rect x="200" y="168" width="90" height="74" rx="14" fill="#22345a" stroke="#32466f"/>

    <text x="35" y="52" font-family="Inter,Segoe UI,sans-serif" font-size="54" font-weight="900" fill="#22d3ee" filter="url(#softGlow)">X</text>
    <text x="131" y="136" font-family="Inter,Segoe UI,sans-serif" font-size="54" font-weight="900" fill="#a78bfa" filter="url(#softGlow)">O</text>
    <text x="233" y="52" font-family="Inter,Segoe UI,sans-serif" font-size="54" font-weight="900" fill="#22d3ee" filter="url(#softGlow)">X</text>
    <text x="33" y="220" font-family="Inter,Segoe UI,sans-serif" font-size="54" font-weight="900" fill="#a78bfa" filter="url(#softGlow)">O</text>
    <text x="133" y="220" font-family="Inter,Segoe UI,sans-serif" font-size="54" font-weight="900" fill="#22d3ee" filter="url(#softGlow)">X</text>
    <text x="234" y="136" font-family="Inter,Segoe UI,sans-serif" font-size="54" font-weight="900" fill="#a78bfa" filter="url(#softGlow)">O</text>
  </g>

  <text x="250" y="415" fill="#34d399" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="700">
    Mid-game state: one move from victory
  </text>
</svg>
