<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="400" y="80" font-size="56" font-weight="900" text-anchor="middle" fill="#4f46e5" letter-spacing="2">🧠 Memory Sequence</text>
  
  <!-- Game Board (2x2 Grid) -->
  <g transform="translate(280, 140)">
    <!-- Red Square -->
    <rect x="0" y="0" width="100" height="100" rx="10" fill="#ef4444" opacity="0.8"/>
    <text x="50" y="60" font-size="40" text-anchor="middle" dominant-baseline="middle">🔴</text>
    
    <!-- Green Square -->
    <rect x="120" y="0" width="100" height="100" rx="10" fill="#10b981" opacity="0.8"/>
    <text x="170" y="60" font-size="40" text-anchor="middle" dominant-baseline="middle">🟢</text>
    
    <!-- Blue Square -->
    <rect x="0" y="120" width="100" height="100" rx="10" fill="#3b82f6" opacity="0.8"/>
    <text x="50" y="180" font-size="40" text-anchor="middle" dominant-baseline="middle">🔵</text>
    
    <!-- Yellow Square -->
    <rect x="120" y="120" width="100" height="100" rx="10" fill="#fbbf24" opacity="0.8"/>
    <text x="170" y="180" font-size="40" text-anchor="middle" dominant-baseline="middle">🟡</text>
    
    <!-- Glow on one square (active state) -->
    <circle cx="50" cy="60" r="60" fill="none" stroke="#ec4899" stroke-width="2" opacity="0.5"/>
  </g>
  
  <!-- Stats badges -->
  <rect x="50" y="320" width="160" height="70" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <text x="65" y="340" font-size="13" fill="rgba(255,255,255,0.6)">Round</text>
  <text x="65" y="368" font-size="32" font-weight="bold" fill="#4f46e5">5</text>
  
  <rect x="590" y="320" width="160" height="70" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <text x="605" y="340" font-size="13" fill="rgba(255,255,255,0.6)">Score</text>
  <text x="605" y="368" font-size="32" font-weight="bold" fill="#4f46e5">250</text>
</svg>
