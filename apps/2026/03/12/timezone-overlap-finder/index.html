  <style>
    :root {
      --bg: #08111f;
      --bg-soft: #101d31;
      --surface: #152740;
      --surface-2: #1a3252;
      --text: #edf4ff;
      --text-dim: #9eb4d1;
      --line: #2c4364;
      --accent: #4cc9f0;
      --accent-2: #90f8d2;
      --good: #36d399;
      --warn: #f8d36a;
      --bad: #fb7185;
      --shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
    }

    [data-theme="light"] {
      --bg: #f3f7ff;
      --bg-soft: #e9f1ff;
      --surface: #ffffff;
      --surface-2: #eef5ff;
      --text: #13263f;
      --text-dim: #4a6485;
      --line: #ced9ea;
      --accent: #0077b6;
      --accent-2: #00a896;
      --good: #0d9f6e;
      --warn: #b7791f;
      --bad: #be123c;
      --shadow: 0 14px 34px rgba(10, 38, 75, 0.13);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Avenir Next", "Segoe UI", "Trebuchet MS", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 10%, rgba(76, 201, 240, 0.2), transparent 42%),
        radial-gradient(circle at 85% 80%, rgba(144, 248, 210, 0.18), transparent 44%),
        linear-gradient(145deg, var(--bg), var(--bg-soft));
    }

    main {
      width: min(1100px, 100% - 2rem);
      margin: 0 auto;
      padding: 1.2rem 0 2.5rem;
      display: grid;
      gap: 1rem;
    }

    h1 {
      margin: 0.8rem 0 0;
      font-size: clamp(1.7rem, 4vw, 2.5rem);
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin: 0;
      color: var(--text-dim);
      max-width: 72ch;
      font-size: 0.98rem;
      line-height: 1.45;
    }

    .panel {
      background: linear-gradient(180deg, var(--surface), var(--surface-2));
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 1rem;
    }

    .controls {
      display: grid;
      gap: 0.75rem;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      align-items: end;
    }

    .field {
      display: grid;
      gap: 0.35rem;
    }

    label {
      font-size: 0.84rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    select, input[type="range"] {
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface) 84%, transparent);
      color: var(--text);
      padding: 0.6rem 0.75rem;
      font-size: 0.95rem;
    }

    .range-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }

    .time-chip {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.22rem 0.62rem;
      font-size: 0.8rem;
      color: var(--text-dim);
      white-space: nowrap;
    }

    .clock-grid {
      display: grid;
      gap: 0.7rem;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      margin-top: 0.85rem;
    }

    .clock-card {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0.65rem 0.75rem;
      background: color-mix(in srgb, var(--surface) 88%, transparent);
    }

    .clock-city {
      display: flex;
      justify-content: space-between;
      gap: 0.6rem;
      color: var(--text-dim);
      font-size: 0.83rem;
      margin-bottom: 0.25rem;
    }

    .clock-time {
      font-size: 1.24rem;
      font-weight: 650;
      letter-spacing: 0.02em;
    }

    .timeline {
      overflow-x: auto;
      margin-top: 1rem;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: color-mix(in srgb, var(--bg) 65%, var(--surface));
      padding: 0.65rem;
    }

    .lane {
      min-width: 800px;
      display: grid;
      grid-template-columns: 120px repeat(24, 1fr);
      align-items: center;
      gap: 0.2rem;
      margin-bottom: 0.25rem;
    }

    .lane:last-child { margin-bottom: 0; }

    .lane-name {
      font-size: 0.84rem;
      color: var(--text-dim);
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
      padding-right: 0.35rem;
    }

    .cell {
      height: 20px;
      border-radius: 4px;
      border: 1px solid color-mix(in srgb, var(--line) 75%, transparent);
      background: color-mix(in srgb, var(--surface) 70%, transparent);
    }

    .cell.work {
      background: color-mix(in srgb, var(--accent) 35%, transparent);
      border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
    }

    .cell.overlap {
      background: linear-gradient(120deg, color-mix(in srgb, var(--good) 40%, transparent), color-mix(in srgb, var(--accent-2) 45%, transparent));
      border-color: color-mix(in srgb, var(--good) 70%, var(--line));
    }

    .cell.bad {
      background: color-mix(in srgb, var(--bad) 22%, transparent);
      border-color: color-mix(in srgb, var(--bad) 45%, var(--line));
    }

    .hour-row {
      min-width: 800px;
      display: grid;
      grid-template-columns: 120px repeat(24, 1fr);
      color: var(--text-dim);
      font-size: 0.72rem;
      margin-bottom: 0.2rem;
    }

    .result-row {
      margin-top: 0.75rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      align-items: center;
    }

    .result-pill {
      border-radius: 999px;
      padding: 0.32rem 0.7rem;
      border: 1px solid var(--line);
      font-size: 0.82rem;
      color: var(--text-dim);
      background: color-mix(in srgb, var(--surface) 85%, transparent);
    }

    .result-pill.good {
      color: color-mix(in srgb, var(--good) 65%, var(--text));
      border-color: color-mix(in srgb, var(--good) 65%, var(--line));
    }

    .result-pill.warn {
      color: color-mix(in srgb, var(--warn) 68%, var(--text));
      border-color: color-mix(in srgb, var(--warn) 65%, var(--line));
    }

    .result-pill.bad {
      color: color-mix(in srgb, var(--bad) 68%, var(--text));
      border-color: color-mix(in srgb, var(--bad) 65%, var(--line));
    }

    @media (max-width: 720px) {
      main { width: min(1100px, 100% - 1.2rem); }
      .controls { grid-template-columns: 1fr; }
      .lane, .hour-row { min-width: 680px; grid-template-columns: 92px repeat(24, 1fr); }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Timezone Overlap Finder</h1>
      <p class="subtitle">Find the best meeting windows across time zones. Pick cities, set each person's working hours, and scan a 24-hour overlap timeline instantly.</p>
    </header>

    <section class="panel" aria-label="Scheduler controls">
      <div class="controls" id="controls"></div>
      <div class="clock-grid" id="clockGrid"></div>
    </section>

    <section class="panel" aria-label="Overlap timeline">
      <div class="hour-row" id="hourRow"></div>
      <div class="timeline" id="timeline"></div>
      <div class="result-row" id="resultRow"></div>
    </section>
  </main>

  <script>
    (function () {
      const zones = [
        { id: 'America/Los_Angeles', label: 'Los Angeles', short: 'PT' },
        { id: 'America/Denver', label: 'Denver', short: 'MT' },
        { id: 'America/Chicago', label: 'Chicago', short: 'CT' },
        { id: 'America/New_York', label: 'New York', short: 'ET' },
        { id: 'America/Sao_Paulo', label: 'Sao Paulo', short: 'BRT' },
        { id: 'Europe/London', label: 'London', short: 'GMT/BST' },
        { id: 'Europe/Paris', label: 'Paris', short: 'CET/CEST' },
        { id: 'Africa/Johannesburg', label: 'Johannesburg', short: 'SAST' },
        { id: 'Asia/Dubai', label: 'Dubai', short: 'GST' },
        { id: 'Asia/Kolkata', label: 'Bangalore', short: 'IST' },
        { id: 'Asia/Singapore', label: 'Singapore', short: 'SGT' },
        { id: 'Asia/Tokyo', label: 'Tokyo', short: 'JST' },
        { id: 'Australia/Sydney', label: 'Sydney', short: 'AEST/AEDT' },
        { id: 'Pacific/Auckland', label: 'Auckland', short: 'NZT' }
      ];

      const members = [
        { id: 'a', name: 'Person A', zone: 'America/Los_Angeles', start: 9, end: 17 },
        { id: 'b', name: 'Person B', zone: 'Europe/London', start: 9, end: 17 },
        { id: 'c', name: 'Person C', zone: 'Asia/Tokyo', start: 10, end: 18 }
      ];

      const controls = document.getElementById('controls');
      const clockGrid = document.getElementById('clockGrid');
      const hourRow = document.getElementById('hourRow');
      const timeline = document.getElementById('timeline');
      const resultRow = document.getElementById('resultRow');

      function buildHourHeader() {
        hourRow.innerHTML = '<div class="lane-name">UTC</div>';
        for (let i = 0; i < 24; i += 1) {
          const h = document.createElement('div');
          h.textContent = String(i).padStart(2, '0');
          hourRow.appendChild(h);
        }
      }

      function zoneOptions(selected) {
        return zones.map((z) => `<option value="${z.id}"${z.id === selected ? ' selected' : ''}>${z.label} (${z.short})</option>`).join('');
      }

      function displayHour(value) {
        const v = ((value % 24) + 24) % 24;
        const suffix = v >= 12 ? 'PM' : 'AM';
        const h12 = v % 12 === 0 ? 12 : v % 12;
        return `${h12}:00 ${suffix}`;
      }

      function renderControls() {
        controls.innerHTML = '';
        members.forEach((m) => {
          const block = document.createElement('article');
          block.className = 'field';
          block.innerHTML = `
            <label for="zone-${m.id}">${m.name} Timezone</label>
            <select id="zone-${m.id}" data-type="zone" data-id="${m.id}">${zoneOptions(m.zone)}</select>
            <div class="range-row">
              <div class="field">
                <label for="start-${m.id}">Work Start</label>
                <input id="start-${m.id}" type="range" min="0" max="23" value="${m.start}" data-type="start" data-id="${m.id}">
                <span class="time-chip" id="start-chip-${m.id}">${displayHour(m.start)}</span>
              </div>
              <div class="field">
                <label for="end-${m.id}">Work End</label>
                <input id="end-${m.id}" type="range" min="0" max="23" value="${m.end}" data-type="end" data-id="${m.id}">
                <span class="time-chip" id="end-chip-${m.id}">${displayHour(m.end)}</span>
              </div>
            </div>
          `;
          controls.appendChild(block);
        });
      }

      function localHourAtUtc(zone, utcHour) {
        const base = new Date(Date.UTC(2026, 2, 12, utcHour, 0, 0));
        const hour = new Intl.DateTimeFormat('en-US', {
          timeZone: zone,
          hour: '2-digit',
          hour12: false
        }).format(base);
        return Number(hour);
      }

      function isInShift(localHour, start, end) {
        if (start === end) return true;
        if (start < end) return localHour >= start && localHour < end;
        return localHour >= start || localHour < end;
      }

      function renderClocks() {
        clockGrid.innerHTML = '';
        const now = new Date();
        members.forEach((m) => {
          const local = new Intl.DateTimeFormat('en-US', {
            timeZone: m.zone,
            hour: '2-digit',
            minute: '2-digit',
            weekday: 'short',
            hour12: true
          }).format(now);

          const zoneLabel = zones.find((z) => z.id === m.zone);
          const card = document.createElement('article');
          card.className = 'clock-card';
          card.innerHTML = `
            <div class="clock-city"><span>${m.name}</span><span>${zoneLabel ? zoneLabel.label : m.zone}</span></div>
            <div class="clock-time">${local}</div>
            <div class="clock-city"><span>Work window</span><span>${displayHour(m.start)} - ${displayHour(m.end)}</span></div>
          `;
          clockGrid.appendChild(card);
        });
      }

      function renderTimeline() {
        timeline.innerHTML = '';
        const hourly = [];

        members.forEach((m) => {
          const row = document.createElement('div');
          row.className = 'lane';
          const zoneLabel = zones.find((z) => z.id === m.zone);
          row.innerHTML = `<div class="lane-name">${m.name} · ${zoneLabel ? zoneLabel.short : m.zone}</div>`;

          const personHours = [];
          for (let u = 0; u < 24; u += 1) {
            const lh = localHourAtUtc(m.zone, u);
            const isWork = isInShift(lh, m.start, m.end);
            personHours.push(isWork);
            const cell = document.createElement('div');
            cell.className = `cell ${isWork ? 'work' : ''}`;
            cell.title = `${m.name}: UTC ${String(u).padStart(2, '0')}:00 · Local ${String(lh).padStart(2, '0')}:00`;
            row.appendChild(cell);
          }
          hourly.push(personHours);
          timeline.appendChild(row);
        });

        const overlapRow = document.createElement('div');
        overlapRow.className = 'lane';
        overlapRow.innerHTML = '<div class="lane-name">Team overlap</div>';

        const overlapHours = [];
        for (let u = 0; u < 24; u += 1) {
          const allIn = hourly.every((person) => person[u]);
          overlapHours.push(allIn);
          const cell = document.createElement('div');
          cell.className = `cell ${allIn ? 'overlap' : 'bad'}`;
          cell.title = `${allIn ? 'Overlap' : 'No overlap'} at UTC ${String(u).padStart(2, '0')}:00`;
          overlapRow.appendChild(cell);
        }
        timeline.appendChild(overlapRow);

        renderResults(overlapHours);
      }

      function collectWindows(flags) {
        const out = [];
        let start = -1;

        for (let i = 0; i <= 24; i += 1) {
          const on = i < 24 ? flags[i] : false;
          if (on && start === -1) start = i;
          if (!on && start !== -1) {
            out.push([start, i]);
            start = -1;
          }
        }
        return out;
      }

      function renderResults(overlapHours) {
        resultRow.innerHTML = '';
        const windows = collectWindows(overlapHours);
        const total = overlapHours.filter(Boolean).length;

        const totalPill = document.createElement('div');
        totalPill.className = `result-pill ${total >= 4 ? 'good' : total >= 2 ? 'warn' : 'bad'}`;
        totalPill.textContent = `Total overlap: ${total}h`;
        resultRow.appendChild(totalPill);

        if (!windows.length) {
          const none = document.createElement('div');
          none.className = 'result-pill bad';
          none.textContent = 'No shared window. Expand one or more work ranges.';
          resultRow.appendChild(none);
          return;
        }

        windows.forEach(([s, e], idx) => {
          const p = document.createElement('div');
          p.className = `result-pill ${e - s >= 3 ? 'good' : 'warn'}`;
          p.textContent = `Window ${idx + 1}: ${String(s).padStart(2, '0')}:00-${String(e).padStart(2, '0')}:00 UTC`;
          resultRow.appendChild(p);
        });
      }

      function onInput(event) {
        const target = event.target;
        const type = target.getAttribute('data-type');
        const id = target.getAttribute('data-id');
        if (!type || !id) return;

        const m = members.find((item) => item.id === id);
        if (!m) return;

        if (type === 'zone') m.zone = target.value;
        if (type === 'start') m.start = Number(target.value);
        if (type === 'end') m.end = Number(target.value);

        const startChip = document.getElementById(`start-chip-${id}`);
        const endChip = document.getElementById(`end-chip-${id}`);
        if (startChip) startChip.textContent = displayHour(m.start);
        if (endChip) endChip.textContent = displayHour(m.end);

        renderClocks();
        renderTimeline();
      }

      buildHourHeader();
      renderControls();
      renderClocks();
      renderTimeline();

      controls.addEventListener('input', onInput);
      controls.addEventListener('change', onInput);

      setInterval(renderClocks, 60000);
    })();
  </script>
</body>
