<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meeting Cost Calculator - __MAIN_SITE_NAME__</title>
    <meta name="description" content="Track real-time meeting cost by attendee and hourly rate with a mobile-friendly timer." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%231e293b'/%3E%3Cpath d='M32 14v18l12 7' stroke='%2338bdf8' stroke-width='6' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=__GA_MEASUREMENT_ID__"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '__GA_MEASUREMENT_ID__');
    </script>

    <meta name="voa-main-site-url" content="__MAIN_SITE_URL__">
    <meta name="voa-main-site-name" content="__MAIN_SITE_NAME__">
    <meta name="voa-social-x-url" content="__SOCIAL_X_URL__">
    <meta name="voa-social-facebook-url" content="__SOCIAL_FACEBOOK_URL__">
    <meta name="voa-social-instagram-url" content="__SOCIAL_INSTAGRAM_URL__">
  <meta name="voa-app-id" content="2026/03/12/meeting-cost-calculator" />
    <script src="/apps/shared/app-shell.js" defer></script>

    <style>
      :root { --bg:#0f172a; --text:#f8fafc; --surface:#1e293b; --surface2:#334155; --accent:#38bdf8; --good:#22c55e; --warn:#f59e0b; --danger:#ef4444; }
      [data-theme="light"] { --bg:#ffffff; --text:#1f2937; --surface:#f3f4f6; --surface2:#e5e7eb; --accent:#0284c7; --good:#16a34a; --warn:#d97706; --danger:#dc2626; }
      * { box-sizing:border-box; }
      body { margin:0; font-family: Inter, system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); }
      .app { max-width:860px; margin:0 auto; padding:16px; display:grid; gap:14px; }
      .card { background:var(--surface); border:1px solid color-mix(in oklab, var(--surface2), transparent 40%); border-radius:14px; padding:14px; }
      h1 { font-size:1.35rem; margin:0 0 6px; }
      .sub { margin:0; opacity:.8; font-size:.95rem; }
      .grid { display:grid; gap:10px; grid-template-columns:1fr; }
      @media (min-width: 760px){ .grid{ grid-template-columns: 1fr 1fr; } }
      label { display:block; font-size:.9rem; margin-bottom:5px; opacity:.9; }
      input, button { font:inherit; }
      input { width:100%; border:1px solid var(--surface2); background:var(--bg); color:var(--text); border-radius:10px; padding:10px; }
      button { border:0; border-radius:10px; padding:10px 12px; background:var(--accent); color:white; font-weight:700; cursor:pointer; }
      button.secondary { background:var(--surface2); color:var(--text); }
      .row { display:flex; gap:8px; flex-wrap:wrap; }
      .attendee { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 10px; background:var(--bg); border:1px solid var(--surface2); border-radius:10px; margin-top:8px; }
      .metrics { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
      .metric { background:var(--bg); border:1px solid var(--surface2); border-radius:10px; padding:12px; }
      .k { font-size:.78rem; opacity:.75; margin-bottom:4px; }
      .v { font-size:1.2rem; font-weight:800; }
      .v.overrun { color:var(--danger); }
      .timer { font-size:2rem; font-weight:900; letter-spacing:1px; }
      .hint { font-size:.86rem; opacity:.75; }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="card">
        <h1>Meeting Cost Calculator</h1>
        <p class="sub">Add attendees, start the timer, and see real-time cost + overrun against plan.</p>
      </section>

      <section class="card grid" aria-label="Meeting setup">
        <div>
          <label for="name">Attendee Name</label>
          <input id="name" type="text" placeholder="e.g. Product Manager" />
        </div>
        <div>
          <label for="rate">Hourly Rate (USD)</label>
          <input id="rate" type="number" min="0" step="1" inputmode="decimal" placeholder="e.g. 120" />
        </div>
        <div class="row">
          <button id="addAttendee">Add Attendee</button>
          <button class="secondary" id="clearAttendees">Clear</button>
        </div>
        <div>
          <label for="plannedMinutes">Planned Duration (minutes)</label>
          <input id="plannedMinutes" type="number" min="1" step="1" value="30" />
        </div>
      </section>

      <section class="card" aria-label="Attendees">
        <div class="hint">Tip: keyboard shortcut <strong>Space</strong> to start/pause timer, <strong>R</strong> to reset.</div>
        <div id="attendees"></div>
      </section>

      <section class="card" aria-live="polite">
        <div class="timer" id="timer">00:00</div>
        <div class="row" style="margin:10px 0 14px;">
          <button id="toggleTimer">Start</button>
          <button class="secondary" id="resetTimer">Reset</button>
        </div>
        <div class="metrics">
          <div class="metric"><div class="k">Team Hourly Burn</div><div class="v" id="burnRate">$0.00</div></div>
          <div class="metric"><div class="k">Live Cost</div><div class="v" id="liveCost">$0.00</div></div>
          <div class="metric"><div class="k">Planned Cost</div><div class="v" id="plannedCost">$0.00</div></div>
          <div class="metric"><div class="k">Overrun</div><div class="v" id="overrun">$0.00</div></div>
        </div>
      </section>
    </main>

    <script>
      const state = { attendees: [], seconds: 0, running: false, startedAt: null, interval: null };
      const el = (id) => document.getElementById(id);
      const money = (n) => new Intl.NumberFormat('en-US', { style:'currency', currency:'USD' }).format(n || 0);

      function totalHourly() { return state.attendees.reduce((sum, a) => sum + a.rate, 0); }
      function liveCost() { return totalHourly() * (state.seconds / 3600); }
      function plannedCost() {
        const mins = Number(el('plannedMinutes').value || 0);
        return totalHourly() * (mins / 60);
      }

      function renderAttendees() {
        const root = el('attendees');
        root.innerHTML = '';
        state.attendees.forEach((a, i) => {
          const item = document.createElement('div');
          item.className = 'attendee';
          item.innerHTML = `<span>${a.name} · ${money(a.rate)}/hr</span><button class="secondary" data-i="${i}" aria-label="Remove ${a.name}">Remove</button>`;
          root.appendChild(item);
        });
        root.querySelectorAll('button[data-i]').forEach(btn => btn.addEventListener('click', () => {
          state.attendees.splice(Number(btn.dataset.i), 1);
          update();
          renderAttendees();
        }));
      }

      function formatTime(sec) {
        const m = Math.floor(sec / 60).toString().padStart(2, '0');
        const s = Math.floor(sec % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      }

      function update() {
        const burn = totalHourly();
        const live = liveCost();
        const planned = plannedCost();
        const over = live - planned;

        el('timer').textContent = formatTime(state.seconds);
        el('burnRate').textContent = money(burn);
        el('liveCost').textContent = money(live);
        el('plannedCost').textContent = money(planned);
        const overrun = el('overrun');
        overrun.textContent = money(over);
        overrun.classList.toggle('overrun', over > 0);
      }

      function toggleTimer() {
        state.running = !state.running;
        el('toggleTimer').textContent = state.running ? 'Pause' : 'Start';
        if (state.running) {
          state.startedAt = Date.now() - state.seconds * 1000;
          state.interval = setInterval(() => {
            state.seconds = Math.floor((Date.now() - state.startedAt) / 1000);
            update();
          }, 250);
        } else {
          clearInterval(state.interval);
        }
      }

      function resetTimer() {
        state.running = false;
        clearInterval(state.interval);
        state.seconds = 0;
        el('toggleTimer').textContent = 'Start';
        update();
      }

      el('addAttendee').addEventListener('click', () => {
        const name = el('name').value.trim();
        const rate = Number(el('rate').value);
        if (!name || !Number.isFinite(rate) || rate < 0) return;
        state.attendees.push({ name, rate });
        el('name').value = '';
        el('rate').value = '';
        renderAttendees();
        update();
      });

      el('clearAttendees').addEventListener('click', () => {
        state.attendees = [];
        renderAttendees();
        update();
      });

      el('plannedMinutes').addEventListener('input', update);
      el('toggleTimer').addEventListener('click', toggleTimer);
      el('resetTimer').addEventListener('click', resetTimer);

      document.addEventListener('keydown', (ev) => {
        if (ev.code === 'Space' && ev.target.tagName !== 'INPUT') {
          ev.preventDefault();
          toggleTimer();
        }
        if (ev.key.toLowerCase() === 'r' && ev.target.tagName !== 'INPUT') {
          resetTimer();
        }
      });

      renderAttendees();
      update();
    </script>
  </body>
</html>
