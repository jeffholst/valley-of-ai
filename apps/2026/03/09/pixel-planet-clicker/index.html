<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel Planet Clicker - Valley of AI</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%8C%8D%3C/text%3E%3C/svg%3E">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-WRFSFDYD80"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-WRFSFDYD80');
  </script>

  <style>
    :root {
      --bg: #060b1a;
      --surface: #121b35;
      --surface-2: #1b2a4f;
      --text: #eff6ff;
      --text-dim: #a7b7d8;
      --accent: #7c9cff;
      --accent-2: #39d6ff;
      --good: #35db92;
      --ring: #2f4478;
      --shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
    }
    [data-theme="light"] {
      --bg: #f3f7ff;
      --surface: #ffffff;
      --surface-2: #e9f0ff;
      --text: #0f172a;
      --text-dim: #475569;
      --accent: #3457d5;
      --accent-2: #0ea5e9;
      --good: #059669;
      --ring: #c6d6ff;
      --shadow: 0 12px 25px rgba(15, 23, 42, 0.15);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at 20% 20%, #18306b 0%, var(--bg) 50%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .app {
      width: min(920px, 100%);
      background: linear-gradient(160deg, var(--surface), var(--surface-2));
      border: 1px solid color-mix(in srgb, var(--text) 10%, transparent);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 20px;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }
    h1 { margin: 0; font-size: clamp(1.2rem, 3vw, 1.8rem); }
    .theme-toggle {
      width: 42px; height: 42px; border-radius: 999px; border: none;
      background: var(--surface); color: var(--text); cursor: pointer;
      font-size: 1.1rem;
    }
    .grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; }
    .card {
      background: color-mix(in srgb, var(--surface) 78%, black 8%);
      border: 1px solid color-mix(in srgb, var(--text) 12%, transparent);
      border-radius: 18px;
      padding: 14px;
    }
    .planet-wrap { display: grid; place-items: center; gap: 12px; }
    .planet {
      width: min(62vw, 290px); aspect-ratio: 1/1; border-radius: 50%; border: none;
      background:
        radial-gradient(circle at 35% 32%, #8de6ff 0 18%, transparent 19%),
        radial-gradient(circle at 60% 68%, #58b7ff 0 18%, transparent 19%),
        radial-gradient(circle at 70% 25%, #2a6ee7 0 65%, #163e91 68%, #0b1d4f 100%);
      box-shadow: inset -18px -20px 40px rgba(5, 12, 30, 0.45), 0 0 0 8px color-mix(in srgb, var(--accent) 18%, transparent), 0 20px 45px rgba(0,0,0,.35);
      cursor: pointer;
      transform: scale(1);
      transition: transform 120ms ease;
      touch-action: manipulation;
    }
    .planet:active { transform: scale(0.97); }
    .click-hint { color: var(--text-dim); font-size: .95rem; }
    .stats { display: grid; gap: 10px; }
    .stat { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
    .upgrades { display: grid; gap: 8px; margin-top: 10px; }
    .upgrade {
      display: flex; justify-content: space-between; align-items: center;
      gap: 8px; padding: 10px; border-radius: 12px;
      border: 1px solid color-mix(in srgb, var(--text) 12%, transparent);
      background: color-mix(in srgb, var(--surface) 88%, black 5%);
    }
    button.buy {
      border: none; border-radius: 999px; padding: 8px 12px;
      background: var(--accent); color: white; cursor: pointer; font-weight: 600;
    }
    button.buy:disabled { opacity: .5; cursor: not-allowed; }
    .progress {
      margin-top: 14px; height: 10px; border-radius: 999px; background: var(--ring); overflow: hidden;
    }
    .progress > div {
      height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .2s linear;
    }
    .event { margin-top: 8px; color: var(--good); min-height: 1.2em; }
    footer { text-align: center; padding-top: 16px; margin-top: 14px; border-top: 1px solid color-mix(in srgb, var(--text) 18%, transparent); opacity: .8; }
    footer a { color: var(--accent-2); text-decoration: none; }
    :focus-visible { outline: 3px solid var(--accent-2); outline-offset: 2px; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } .planet { width: min(78vw, 260px); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="app">
    <div class="top">
      <h1>🌍 Pixel Planet Clicker</h1>
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">🌙</button>
    </div>
    <div class="grid">
      <section class="card planet-wrap" aria-label="Planet clicking area">
        <button class="planet" id="planet" aria-label="Mine planet resources"></button>
        <div class="click-hint">Tap/click the planet to harvest Crystalium.</div>
        <div class="progress" aria-hidden="true"><div id="pulseBar"></div></div>
        <div class="event" id="eventText"></div>
      </section>
      <section class="card">
        <div class="stats">
          <div class="stat"><span>Crystalium</span><strong id="score">0</strong></div>
          <div class="stat"><span>Per Click</span><strong id="perClick">1</strong></div>
          <div class="stat"><span>Per Second</span><strong id="perSecond">0</strong></div>
          <div class="stat"><span>Drones</span><strong id="drones">0</strong></div>
        </div>
        <div class="upgrades" id="upgrades"></div>
      </section>
    </div>
    <footer>
      <a href="https://www.valleyofai.com" target="_blank" rel="noopener">← Back to Valley of AI</a>
    </footer>
  </main>

  <script>
    const theme = localStorage.getItem('theme') ||
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
    document.querySelector('.theme-toggle').textContent = theme === 'dark' ? '☀️' : '🌙';

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      document.querySelector('.theme-toggle').textContent = next === 'dark' ? '☀️' : '🌙';
    }

    const state = { score: 0, perClick: 1, drones: 0, perSecond: 0, pulse: 0 };
    const upgrades = [
      { id: 'drone', name: '🛰️ Orbital Drone', base: 30, owned: 0, apply: s => { s.drones++; s.perSecond += 1; } },
      { id: 'laser', name: '🔦 Core Laser', base: 60, owned: 0, apply: s => { s.perClick += 2; } },
      { id: 'mine', name: '🏭 Nano Mine', base: 140, owned: 0, apply: s => { s.perSecond += 4; } }
    ];

    const fmt = n => Math.floor(n).toLocaleString();
    const el = id => document.getElementById(id);

    function cost(upg) { return Math.floor(upg.base * Math.pow(1.45, upg.owned)); }

    function render() {
      el('score').textContent = fmt(state.score);
      el('perClick').textContent = state.perClick;
      el('perSecond').textContent = state.perSecond;
      el('drones').textContent = state.drones;
      const wrap = el('upgrades');
      wrap.innerHTML = '';
      upgrades.forEach(upg => {
        const c = cost(upg);
        const row = document.createElement('div');
        row.className = 'upgrade';
        row.innerHTML = `<div><strong>${upg.name}</strong><div style="color:var(--text-dim);font-size:.85rem">Owned: ${upg.owned} · Cost: ${fmt(c)}</div></div>`;
        const btn = document.createElement('button');
        btn.className = 'buy';
        btn.textContent = 'Buy';
        btn.disabled = state.score < c;
        btn.onclick = () => {
          if (state.score < c) return;
          state.score -= c;
          upg.owned++;
          upg.apply(state);
          render();
        };
        row.appendChild(btn);
        wrap.appendChild(row);
      });
    }

    function mine(mult = 1) {
      state.score += state.perClick * mult;
      render();
    }

    el('planet').addEventListener('click', () => mine());
    el('planet').addEventListener('touchstart', (e) => { e.preventDefault(); mine(); }, { passive: false });

    setInterval(() => {
      state.score += state.perSecond / 10;
      state.pulse = (state.pulse + 2) % 100;
      el('pulseBar').style.width = `${state.pulse}%`;
      if (Math.random() < 0.01) {
        el('eventText').textContent = 'Solar pulse! 2x click power for 5s';
        const prev = state.perClick;
        state.perClick *= 2;
        render();
        setTimeout(() => { state.perClick = prev; el('eventText').textContent = ''; render(); }, 5000);
      }
      render();
    }, 100);

    render();
  </script>
</body>
</html>
