	<script src="/apps/shared/app-shell.js" defer></script><style>
:root{--bg:#0b1220;--bg2:#1b2a4a;--surface:#101a31;--text:#edf3ff;--muted:#9eb1da;--wall:#3b82f6;--player:#22d3ee;--goal:#22c55e}
@media(prefers-color-scheme:light){:root{--bg:#eef4ff;--bg2:#dbeafe;--surface:#fff;--text:#1f2f52;--muted:#60739a;--wall:#2563eb;--player:#0891b2;--goal:#15803d}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;font-family:Inter,system-ui;background:radial-gradient(1000px 700px at 20% 20%,var(--bg2),var(--bg));color:var(--text)}
.card{width:min(860px,100%);background:color-mix(in srgb,var(--surface) 90%,transparent);border:1px solid color-mix(in srgb,var(--muted) 24%,transparent);border-radius:18px;padding:14px;box-shadow:0 18px 45px #0004}h1{margin:0 0 4px}.sub{margin:0 0 10px;color:var(--muted)}
.top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.pill{font-size:.86rem;padding:6px 10px;border-radius:999px;border:1px solid color-mix(in srgb,var(--muted) 24%,transparent);color:var(--muted)}
canvas{width:100%;max-width:640px;aspect-ratio:1/1;display:block;margin:auto;background:#050a14;border-radius:12px;border:1px solid color-mix(in srgb,var(--muted) 26%,transparent)}
.controls{text-align:center;margin-top:10px}button{border:none;border-radius:999px;padding:9px 13px;font:inherit;font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(90deg,#7c3aed,#22d3ee)}
.k{text-align:center;color:var(--muted);font-size:.9rem;margin-top:8px}
</style></head><body><main class='card'><h1>🧭 Maze Runner</h1><p class='sub'>Reach the green exit in the shortest time.</p>
<div class='top'><span class='pill' id='time'>Time: 0.0s</span><span class='pill' id='best'>Best: —</span><span class='pill' id='state'>State: Ready</span></div>
<canvas id='g' width='600' height='600'></canvas><div class='controls'><button id='restart'>New Maze</button></div><p class='k'>Controls: ← → ↑ ↓ or WASD</p></main>
<script>
const N=20,cv=document.getElementById('g'),ctx=cv.getContext('2d'),cell=cv.width/N;let maze,player,goal,startT=0,done=false,best=+localStorage.getItem('maze-best')||0;
function u(id,t){document.getElementById(id).textContent=t}
function makeMaze(){maze=[...Array(N)].map(()=>Array(N).fill(1));const dirs=[[2,0],[-2,0],[0,2],[0,-2]];function carve(x,y){maze[y][x]=0;for(const [dx,dy] of dirs.sort(()=>Math.random()-0.5)){const nx=x+dx,ny=y+dy;if(nx>0&&ny>0&&nx<N-1&&ny<N-1&&maze[ny][nx]===1){maze[y+dy/2][x+dx/2]=0;carve(nx,ny)}}}carve(1,1);player={x:1,y:1};goal={x:N-2,y:N-2};startT=performance.now();done=false;u('state','State: Running');}
function move(dx,dy){if(done)return;const nx=player.x+dx,ny=player.y+dy;if(nx<0||ny<0||nx>=N||ny>=N||maze[ny][nx])return;player.x=nx;player.y=ny;if(player.x===goal.x&&player.y===goal.y){done=true;const t=((performance.now()-startT)/1000).toFixed(1);u('state','State: Finished');u('time',`Time: ${t}s`);if(!best||+t<best){best=+t;localStorage.setItem('maze-best',best)}u('best',`Best: ${best?best.toFixed(1):'—'}s`);}}
function draw(){ctx.clearRect(0,0,cv.width,cv.height);for(let y=0;y<N;y++)for(let x=0;x<N;x++){ctx.fillStyle=maze[y][x]?'#3b82f6':'#0a0f1f';ctx.fillRect(x*cell,y*cell,cell,cell);}ctx.fillStyle='var(--goal)';ctx.fillRect(goal.x*cell+4,goal.y*cell+4,cell-8,cell-8);ctx.fillStyle='var(--player)';ctx.beginPath();ctx.arc(player.x*cell+cell/2,player.y*cell+cell/2,cell*0.32,0,Math.PI*2);ctx.fill();if(!done)u('time',`Time: ${((performance.now()-startT)/1000).toFixed(1)}s`);requestAnimationFrame(draw)}
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')move(-1,0);if(k==='arrowright'||k==='d')move(1,0);if(k==='arrowup'||k==='w')move(0,-1);if(k==='arrowdown'||k==='s')move(0,1)});
document.getElementById('restart').onclick=()=>makeMaze();u('best',`Best: ${best?best.toFixed(1):'—'}s`);makeMaze();draw();
</script></body></html>
