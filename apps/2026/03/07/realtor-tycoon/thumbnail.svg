<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#f1f5f9">🏠 Realtor Tycoon</text>
  <text x="400" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Make your fortune in real estate!</text>
  
  <!-- Stats Bar -->
  <rect x="50" y="85" width="160" height="60" rx="10" fill="#334155"/>
  <text x="130" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-transform="uppercase">CASH</text>
  <text x="130" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#10b981">$24,350</text>
  
  <rect x="225" y="85" width="140" height="60" rx="10" fill="#334155"/>
  <text x="295" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">WEEK</text>
  <text x="295" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#3b82f6">3 / 8</text>
  
  <rect x="380" y="85" width="160" height="60" rx="10" fill="#334155"/>
  <text x="460" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">HOMES SOLD</text>
  <text x="460" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#fbbf24">7</text>
  
  <rect x="555" y="85" width="195" height="60" rx="10" fill="#334155"/>
  <text x="652" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">REPUTATION</text>
  <text x="652" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20">⭐⭐⭐⭐☆</text>
  
  <!-- Market Conditions Card -->
  <rect x="50" y="160" width="340" height="175" rx="14" fill="#334155"/>
  <text x="75" y="190" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">📊 This Week's Market</text>
  
  <!-- Market indicators -->
  <text x="75" y="220" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Market Temperature</text>
  <rect x="280" y="207" width="80" height="22" rx="11" fill="#7f1d1d"/>
  <text x="320" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#fca5a5">Hot</text>
  
  <text x="75" y="250" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Interest Rates</text>
  <rect x="280" y="237" width="80" height="22" rx="11" fill="#1e3a5f"/>
  <text x="320" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#93c5fd">4.8%</text>
  
  <text x="75" y="280" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Buyer Demand</text>
  <rect x="280" y="267" width="80" height="22" rx="11" fill="#78350f"/>
  <text x="320" y="282" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#fcd34d">High</text>
  
  <text x="75" y="310" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Season</text>
  <rect x="280" y="297" width="80" height="22" rx="11" fill="#1e3a5f"/>
  <text x="320" y="312" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#93c5fd">🌸 Spring</text>
  
  <!-- Your Decisions Card -->
  <rect x="410" y="160" width="340" height="175" rx="14" fill="#334155"/>
  <text x="435" y="190" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">📋 Your Decisions</text>
  
  <!-- Form fields -->
  <text x="435" y="220" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Listings to Acquire</text>
  <rect x="435" y="228" width="290" height="32" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <text x="450" y="250" font-family="system-ui, sans-serif" font-size="14" fill="#f1f5f9">3</text>
  
  <text x="435" y="280" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Marketing Budget</text>
  <rect x="435" y="288" width="290" height="32" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <text x="450" y="310" font-family="system-ui, sans-serif" font-size="14" fill="#f1f5f9">$1,000</text>
  
  <!-- Run Week Button -->
  <defs>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect x="250" y="355" width="300" height="50" rx="12" fill="url(#btnGrad)"/>
  <text x="400" y="387" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="white">📅 Run This Week</text>
  
  <!-- Decorative houses -->
  <text x="60" y="420" font-family="system-ui, sans-serif" font-size="24" opacity="0.3">🏡</text>
  <text x="100" y="430" font-family="system-ui, sans-serif" font-size="18" opacity="0.2">🏠</text>
  <text x="700" y="420" font-family="system-ui, sans-serif" font-size="24" opacity="0.3">🏡</text>
  <text x="740" y="430" font-family="system-ui, sans-serif" font-size="18" opacity="0.2">🏠</text>
</svg>
