<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Fishing Frenzy - Valley of AI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎣</text></svg>">
  <style>
    :root {
      --bg-sky: #87CEEB;
      --bg-water: #1e90ff;
      --bg-water-deep: #0066cc;
      --bg-grass: #228B22;
      --bg-dock: #8B4513;
      --text-primary: #ffffff;
      --text-dark: #1a1a2e;
      --accent: #ffd700;
      --surface: rgba(0, 0, 0, 0.6);
    }

    [data-theme="dark"] {
      --bg-sky: #1a1a3e;
      --bg-water: #0a2463;
      --bg-water-deep: #051937;
      --bg-grass: #0f4c0f;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-sky);
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }

    /* Top Bar */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      z-index: 100;
      background: linear-gradient(to bottom, rgba(0,0,0,0.3), transparent);
    }

    .home-link {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-primary);
      text-decoration: none;
      font-size: 14px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
      transition: color 0.2s;
    }

    .home-link:hover {
      color: var(--accent);
    }

    .home-link svg {
      width: 20px;
      height: 20px;
    }

    .theme-toggle {
      background: var(--surface);
      border: none;
      color: var(--text-primary);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.3s;
    }

    .theme-toggle:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* Game Canvas */
    #game-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    /* HUD */
    .hud {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      z-index: 50;
    }

    .hud-item {
      background: var(--surface);
      padding: 10px 20px;
      border-radius: 30px;
      color: var(--text-primary);
      text-align: center;
      backdrop-filter: blur(5px);
    }

    .hud-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      opacity: 0.8;
    }

    .hud-value {
      font-size: 1.3rem;
      font-weight: 700;
    }

    .hud-value.score { color: var(--accent); }

    /* Power Meter */
    .power-meter {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 20px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 10px;
      overflow: hidden;
      z-index: 50;
      display: none;
    }

    .power-fill {
      height: 100%;
      background: linear-gradient(90deg, #22c55e, #eab308, #ef4444);
      width: 0%;
      transition: width 0.05s;
    }

    .power-label {
      position: absolute;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 12px;
      font-weight: 700;
      line-height: 20px;
      text-shadow: 1px 1px 2px black;
    }

    /* Depth Controls */
    .depth-controls {
      position: fixed;
      bottom: 80px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 50;
    }

    .depth-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: none;
      background: var(--surface);
      color: white;
      font-size: 24px;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: all 0.2s;
    }

    .depth-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.1);
    }

    .depth-btn:active {
      transform: scale(0.95);
    }

    /* Bite Indicator */
    .bite-indicator {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 4rem;
      font-weight: 900;
      color: #ef4444;
      text-shadow: 0 0 20px rgba(239, 68, 68, 0.8);
      pointer-events: none;
      opacity: 0;
      z-index: 100;
      animation: none;
    }

    .bite-indicator.active {
      animation: biteFlash 0.3s ease-in-out infinite;
    }

    @keyframes biteFlash {
      0%, 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 0.7; transform: translate(-50%, -50%) scale(1.1); }
    }

    /* Instructions */
    .instructions {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface);
      padding: 12px 24px;
      border-radius: 30px;
      color: var(--text-primary);
      font-size: 0.9rem;
      z-index: 50;
      text-align: center;
      backdrop-filter: blur(5px);
      max-width: 90vw;
    }

    /* Start Screen */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      backdrop-filter: blur(5px);
    }

    .overlay.hidden {
      display: none;
    }

    .overlay h1 {
      font-size: 3rem;
      color: var(--text-primary);
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    .overlay p {
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 30px;
      font-size: 1.1rem;
    }

    .btn {
      padding: 16px 50px;
      font-size: 1.2rem;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      box-shadow: 0 4px 20px rgba(34, 197, 94, 0.4);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(34, 197, 94, 0.5);
    }

    /* Game Over */
    .final-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin: 30px 0;
    }

    .final-stat {
      background: rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 16px;
      text-align: center;
    }

    .final-stat .value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
    }

    .final-stat .label {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.7);
    }

    /* Catch notification */
    .catch-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 3rem;
      font-weight: 900;
      color: var(--accent);
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
      pointer-events: none;
      opacity: 0;
      z-index: 100;
    }

    .catch-popup.show {
      animation: catchPop 1s ease-out forwards;
    }

    @keyframes catchPop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
      20% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
      100% { opacity: 0; transform: translate(-50%, -80%) scale(1); }
    }

    /* Responsive */
    @media (max-width: 600px) {
      .hud { gap: 10px; }
      .hud-item { padding: 8px 14px; }
      .hud-value { font-size: 1rem; }
      .overlay h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <!-- Top Bar -->
  <div class="top-bar">
    <a href="https://www.valleyofai.com" class="home-link">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
      </svg>
      Valley of AI
    </a>
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">🌙</button>
  </div>

  <!-- HUD -->
  <div class="hud" id="hud" style="display: none;">
    <div class="hud-item">
      <div class="hud-label">Score</div>
      <div class="hud-value score" id="score">0</div>
    </div>
    <div class="hud-item">
      <div class="hud-label">Fish</div>
      <div class="hud-value" id="fish-count">0</div>
    </div>
    <div class="hud-item">
      <div class="hud-label">Time</div>
      <div class="hud-value" id="timer">60</div>
    </div>
  </div>

  <!-- Power Meter -->
  <div class="power-meter" id="power-meter">
    <div class="power-label">HOLD TO CAST</div>
    <div class="power-fill" id="power-fill"></div>
  </div>

  <!-- Depth Controls (mobile) -->
  <div class="depth-controls" id="depth-controls" style="display: none;">
    <button class="depth-btn" onclick="adjustDepth(-20)">▲</button>
    <button class="depth-btn" onclick="adjustDepth(20)">▼</button>
  </div>

  <!-- Bite Indicator -->
  <div class="bite-indicator" id="bite-indicator">🐟 BITE!</div>

  <!-- Instructions -->
  <div class="instructions" id="instructions">
    Hold to charge cast, then use ↑↓ keys or scroll to move your bobber to fish depth!
  </div>

  <!-- Game Canvas -->
  <canvas id="game-canvas"></canvas>

  <!-- Start Screen -->
  <div class="overlay" id="start-screen">
    <h1>🎣 Fishing Frenzy</h1>
    <p>Cast your line and catch as many fish as you can!</p>
    <button class="btn btn-primary" onclick="startGame()">🐟 Start Fishing</button>
  </div>

  <!-- Game Over Screen -->
  <div class="overlay hidden" id="game-over-screen">
    <h1 id="game-over-title">⏱️ Time's Up!</h1>
    <p>Great fishing session!</p>
    <div class="final-stats">
      <div class="final-stat">
        <div class="value" id="final-score">0</div>
        <div class="label">Total Score</div>
      </div>
      <div class="final-stat">
        <div class="value" id="final-fish">0</div>
        <div class="label">Fish Caught</div>
      </div>
      <div class="final-stat">
        <div class="value" id="final-best">0</div>
        <div class="label">Biggest Catch</div>
      </div>
      <div class="final-stat">
        <div class="value" id="final-rank">🎣</div>
        <div class="label">Rank</div>
      </div>
    </div>
    <button class="btn btn-primary" onclick="startGame()">🔄 Fish Again</button>
  </div>

  <!-- Catch Popup -->
  <div class="catch-popup" id="catch-popup"></div>

  <script>
    // Theme Management
    const storedTheme = localStorage.getItem('fishing-frenzy-theme') || 
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', storedTheme);
    updateThemeIcon();

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('fishing-frenzy-theme', next);
      updateThemeIcon();
    }

    function updateThemeIcon() {
      const btn = document.querySelector('.theme-toggle');
      if (btn) btn.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
    }

    // Canvas Setup
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // Game Constants
    const GAME_DURATION = 90;
    const WATER_LEVEL = 0.45; // Water starts at 45% of screen height
    const DOCK_WIDTH = 120;
    const MAX_DEPTH = 200; // Maximum hook depth below surface
    const HOOK_SINK_SPEED = 1.5;
    const BITE_DURATION = 2000; // ms to click when fish bites
    const BITE_RADIUS = 35; // How close fish needs to be to hook

    // Depth zones for different fish
    const DEPTH_ZONES = {
      SHALLOW: { min: 20, max: 60, label: 'Shallow' },
      MID: { min: 60, max: 120, label: 'Mid-water' },
      DEEP: { min: 120, max: 200, label: 'Deep' }
    };

    // Fish Types with preferred depths
    const FISH_TYPES = [
      { name: 'Minnow', emoji: '🐟', points: 10, size: 18, speed: 3, rarity: 0.35, depthZone: 'SHALLOW', color: '#60a5fa' },
      { name: 'Perch', emoji: '🐠', points: 25, size: 24, speed: 2.5, rarity: 0.25, depthZone: 'SHALLOW', color: '#f59e0b' },
      { name: 'Trout', emoji: '🐟', points: 40, size: 30, speed: 2, rarity: 0.18, depthZone: 'MID', color: '#a78bfa' },
      { name: 'Bass', emoji: '🐡', points: 60, size: 35, speed: 1.8, rarity: 0.12, depthZone: 'MID', color: '#22c55e' },
      { name: 'Catfish', emoji: '🐟', points: 80, size: 40, speed: 1.2, rarity: 0.06, depthZone: 'DEEP', color: '#6b7280' },
      { name: 'Shark', emoji: '🦈', points: 150, size: 55, speed: 1, rarity: 0.04, depthZone: 'DEEP', color: '#3b82f6' },
    ];

    // Game State
    let gameState = 'menu';
    let score = 0;
    let fishCaught = 0;
    let biggestCatch = 0;
    let timeLeft = GAME_DURATION;
    let timerId = null;
    let missedBites = 0;

    // Entities
    let fishes = [];
    let bubbles = [];
    let ripples = [];

    // Fisherman & Rod
    const fisherman = {
      x: 80,
      y: 0,
      rodAngle: -0.5,
      rodLength: 80,
      casting: false,
      reeling: false,
      bobberX: 0,
      bobberY: 0,
      bobberVX: 0,
      bobberVY: 0,
      lineInWater: false,
      bobberDepth: 0,        // Current depth of bobber below water surface
      targetDepth: 50,       // Target depth (player controlled)
      catchingFish: null,
      swingAngle: 0,
      bitingFish: null,      // Fish currently biting
      biteTimer: 0,          // Time left to catch biting fish
      bobberWiggle: 0        // Animation for bobber wiggling when fish bites
    };

    // Casting
    let castPower = 0;
    let isCharging = false;
    let castAngle = -0.6;

    // Animation timing
    let lastTime = 0;
    let waveOffset = 0;

    // Depth adjustment function (for buttons)
    function adjustDepth(delta) {
      if (!fisherman.lineInWater || fisherman.reeling) return;
      fisherman.targetDepth = Math.max(10, Math.min(MAX_DEPTH, fisherman.targetDepth + delta));
    }

    // Initialize fish pool
    function spawnFish() {
      const waterTop = height * WATER_LEVEL;
      
      // Random fish type based on rarity
      const roll = Math.random();
      let cumulative = 0;
      let type = FISH_TYPES[0];
      for (const t of FISH_TYPES) {
        cumulative += t.rarity;
        if (roll < cumulative) {
          type = t;
          break;
        }
      }

      // Get depth range for this fish type
      const zone = DEPTH_ZONES[type.depthZone];
      const depth = zone.min + Math.random() * (zone.max - zone.min);
      const y = waterTop + depth;

      const direction = Math.random() > 0.5 ? 1 : -1;
      const x = direction > 0 ? -type.size : width + type.size;

      fishes.push({
        ...type,
        x,
        y,
        depth,
        direction,
        baseY: y,
        phase: Math.random() * Math.PI * 2,
        tailPhase: Math.random() * Math.PI * 2,
        interested: false, // Fish showing interest in bait
        fleeing: false     // Fish scared away
      });
    }

    function spawnBubble() {
      const waterTop = height * WATER_LEVEL + 50;
      bubbles.push({
        x: DOCK_WIDTH + 50 + Math.random() * (width - DOCK_WIDTH - 100),
        y: height - 30,
        size: 3 + Math.random() * 6,
        speed: 0.5 + Math.random() * 1,
        wobble: Math.random() * Math.PI * 2
      });
    }

    function addRipple(x, y) {
      ripples.push({
        x,
        y,
        radius: 5,
        maxRadius: 30 + Math.random() * 20,
        alpha: 0.6
      });
    }

    // Input handling
    function handlePointerDown(e) {
      if (gameState !== 'playing') return;
      
      // If there's a biting fish, try to catch it!
      if (fisherman.bitingFish && fisherman.lineInWater) {
        catchBitingFish();
        return;
      }
      
      if (fisherman.casting || fisherman.reeling) return;
      
      // If line is in water, clicking reels in
      if (fisherman.lineInWater) {
        startReeling();
        return;
      }
      
      isCharging = true;
      castPower = 0;
      document.getElementById('power-meter').style.display = 'block';
    }

    function handlePointerUp(e) {
      if (!isCharging) return;
      isCharging = false;
      document.getElementById('power-meter').style.display = 'none';
      
      if (castPower > 10) {
        castLine();
      }
    }

    function handlePointerMove(e) {
      if (gameState !== 'playing') return;
      
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX || (e.touches && e.touches[0].clientX);
      const my = e.clientY || (e.touches && e.touches[0].clientY);
      
      if (!fisherman.casting && !fisherman.lineInWater) {
        const rodTipX = fisherman.x + 40;
        const rodTipY = fisherman.y - 20;
        castAngle = Math.atan2(my - rodTipY, mx - rodTipX);
        castAngle = Math.max(-1.0, Math.min(0.2, castAngle));
      }
    }

    // Keyboard controls for depth
    document.addEventListener('keydown', (e) => {
      if (gameState !== 'playing' || !fisherman.lineInWater || fisherman.reeling) return;
      
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
        fisherman.targetDepth = Math.max(10, fisherman.targetDepth - 15);
        e.preventDefault();
      } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
        fisherman.targetDepth = Math.min(MAX_DEPTH, fisherman.targetDepth + 15);
        e.preventDefault();
      } else if (e.key === ' ' && fisherman.bitingFish) {
        catchBitingFish();
        e.preventDefault();
      }
    });

    // Mouse wheel for depth control
    canvas.addEventListener('wheel', (e) => {
      if (gameState !== 'playing' || !fisherman.lineInWater || fisherman.reeling) return;
      e.preventDefault();
      const delta = e.deltaY > 0 ? 20 : -20;
      fisherman.targetDepth = Math.max(10, Math.min(MAX_DEPTH, fisherman.targetDepth + delta));
    }, { passive: false });

    canvas.addEventListener('mousedown', handlePointerDown);
    canvas.addEventListener('mouseup', handlePointerUp);
    canvas.addEventListener('mousemove', handlePointerMove);
    canvas.addEventListener('touchstart', e => { e.preventDefault(); handlePointerDown(e.touches[0]); });
    canvas.addEventListener('touchend', e => { e.preventDefault(); handlePointerUp(e); });
    canvas.addEventListener('touchmove', e => { e.preventDefault(); handlePointerMove(e.touches[0]); });

    function castLine() {
      fisherman.casting = true;
      fisherman.swingAngle = 0;
      fisherman.bobberDepth = 0;
      fisherman.targetDepth = 50;
      fisherman.bitingFish = null;
      fisherman.biteTimer = 0;
      fisherman.bobberWiggle = 0;
      
      const power = castPower / 100;
      const angle = castAngle;
      
      const rodTipX = fisherman.x + 40 + Math.cos(angle) * fisherman.rodLength;
      const rodTipY = fisherman.y - 20 + Math.sin(angle) * fisherman.rodLength;
      
      fisherman.bobberX = rodTipX;
      fisherman.bobberY = rodTipY;
      fisherman.bobberVX = Math.cos(angle) * power * 18;
      fisherman.bobberVY = Math.sin(angle) * power * 14 - 6;
    }

    function catchBitingFish() {
      if (!fisherman.bitingFish) return;
      
      const fish = fisherman.bitingFish;
      fisherman.catchingFish = fish;
      fisherman.bitingFish = null;
      fisherman.biteTimer = 0;
      
      // Remove from fish array
      const idx = fishes.indexOf(fish);
      if (idx > -1) fishes.splice(idx, 1);
      
      // Start reeling with the fish
      startReeling();
      
      // Hide bite indicator
      document.getElementById('bite-indicator').classList.remove('active');
      document.getElementById('bite-indicator').style.opacity = '0';
    }

    function startReeling() {
      fisherman.reeling = true;
      fisherman.bitingFish = null;
      fisherman.biteTimer = 0;
      document.getElementById('bite-indicator').classList.remove('active');
      document.getElementById('bite-indicator').style.opacity = '0';
      document.getElementById('depth-controls').style.display = 'none';
    }

    function catchFish(fish) {
      score += fish.points;
      fishCaught++;
      biggestCatch = Math.max(biggestCatch, fish.points);
      
      // Show popup
      const popup = document.getElementById('catch-popup');
      popup.textContent = `${fish.emoji} ${fish.name}! +${fish.points}`;
      popup.classList.remove('show');
      void popup.offsetWidth;
      popup.classList.add('show');
      
      updateHUD();
    }

    function updateHUD() {
      document.getElementById('score').textContent = score;
      document.getElementById('fish-count').textContent = fishCaught;
      document.getElementById('timer').textContent = timeLeft;
    }

    // Check if any fish wants to bite
    function checkForBites() {
      if (!fisherman.lineInWater || fisherman.reeling || fisherman.bitingFish) return;
      
      // Bobber position is where fish bite
      const baitX = fisherman.bobberX;
      const baitY = fisherman.bobberY;
      
      for (const fish of fishes) {
        if (fish.fleeing) continue;
        
        const dx = fish.x - baitX;
        const dy = fish.y - baitY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        
        // Fish shows interest when nearby
        if (dist < BITE_RADIUS * 2) {
          fish.interested = true;
          
          // Fish bites when very close!
          if (dist < BITE_RADIUS && Math.random() < 0.02) {
            fisherman.bitingFish = fish;
            fisherman.biteTimer = BITE_DURATION;
            fisherman.bobberWiggle = 1;
            
            // Show bite indicator
            document.getElementById('bite-indicator').classList.add('active');
            document.getElementById('bite-indicator').style.opacity = '1';
            document.getElementById('instructions').textContent = '🐟 CLICK NOW to catch the fish!';
            
            addRipple(fisherman.bobberX, height * WATER_LEVEL + 10);
            break;
          }
        } else {
          fish.interested = false;
        }
      }
    }

    // Game loop
    function update(dt) {
      if (gameState !== 'playing') return;
      if (!dt || dt > 100) dt = 16; // Cap delta time
      
      waveOffset += dt * 0.001;
      
      // Charge power
      if (isCharging) {
        castPower = Math.min(100, castPower + dt * 0.12);
        document.getElementById('power-fill').style.width = castPower + '%';
      }
      
      // Update fisherman position (on dock)
      fisherman.y = height * WATER_LEVEL - 10;
      
      // Casting animation
      if (fisherman.casting) {
        fisherman.swingAngle += dt * 0.015;
        
        // Bobber physics
        fisherman.bobberVY += dt * 0.025; // gravity
        fisherman.bobberX += fisherman.bobberVX;
        fisherman.bobberY += fisherman.bobberVY;
        fisherman.bobberVX *= 0.99;
        
        // Check if bobber hits water
        const waterY = height * WATER_LEVEL + 10;
        if (fisherman.bobberY > waterY) {
          fisherman.bobberY = waterY;
          fisherman.bobberVY = 0;
          fisherman.bobberVX = 0;
          fisherman.casting = false;
          fisherman.lineInWater = true;
          addRipple(fisherman.bobberX, fisherman.bobberY);
          document.getElementById('depth-controls').style.display = 'flex';
          document.getElementById('instructions').textContent = '↑↓ or scroll to move bobber to fish. Click when a fish bites!';
        }
      }
      
      // Bobber in water - sinks to target depth
      if (fisherman.lineInWater && !fisherman.reeling) {
        const waterSurface = height * WATER_LEVEL + 10;
        
        // Bobber sinks/rises to target depth
        const depthDiff = fisherman.targetDepth - fisherman.bobberDepth;
        if (Math.abs(depthDiff) > 1) {
          fisherman.bobberDepth += Math.sign(depthDiff) * HOOK_SINK_SPEED * (dt / 16);
        }
        
        // Bobber position is at water surface + current depth + wiggle
        const wiggleAmount = fisherman.bobberWiggle * Math.sin(Date.now() * 0.02) * 5;
        fisherman.bobberY = waterSurface + fisherman.bobberDepth + wiggleAmount;
        
        // Decay bobber wiggle
        if (fisherman.bobberWiggle > 0) {
          fisherman.bobberWiggle = Math.max(0, fisherman.bobberWiggle - dt * 0.002);
        }
        
        // Check for fish bites
        checkForBites();
        
        // Handle bite timer
        if (fisherman.bitingFish) {
          fisherman.biteTimer -= dt;
          fisherman.bobberWiggle = 0.8;
          
          if (fisherman.biteTimer <= 0) {
            // Fish got away!
            missedBites++;
            fisherman.bitingFish.fleeing = true;
            fisherman.bitingFish = null;
            fisherman.bobberWiggle = 0;
            document.getElementById('bite-indicator').classList.remove('active');
            document.getElementById('bite-indicator').style.opacity = '0';
            document.getElementById('instructions').textContent = '🐟 It got away! Move bobber to fish depth and try again!';
          }
        }
      }
      
      // Reeling animation
      if (fisherman.reeling) {
        const rodTipX = fisherman.x + 60;
        const rodTipY = fisherman.y - 30;
        const waterSurface = height * WATER_LEVEL + 10;
        
        // First reel up the bobber to surface, then to rod
        if (fisherman.bobberDepth > 5) {
          fisherman.bobberDepth -= 4;
          fisherman.bobberY = waterSurface + fisherman.bobberDepth;
          
          if (fisherman.catchingFish) {
            fisherman.catchingFish.x = fisherman.bobberX;
            fisherman.catchingFish.y = fisherman.bobberY;
          }
        } else {
          const dx = rodTipX - fisherman.bobberX;
          const dy = rodTipY - fisherman.bobberY;
          const dist = Math.sqrt(dx * dx + dy * dy);
          
          if (dist < 20) {
            // Done reeling
            fisherman.reeling = false;
            fisherman.lineInWater = false;
            fisherman.bobberDepth = 0;
            
            if (fisherman.catchingFish) {
              catchFish(fisherman.catchingFish);
              fisherman.catchingFish = null;
            }
            
            document.getElementById('instructions').textContent = 'Hold to charge cast. Good luck!';
          } else {
            const speed = 10;
            fisherman.bobberX += (dx / dist) * speed;
            fisherman.bobberY += (dy / dist) * speed;
            
            if (fisherman.catchingFish) {
              fisherman.catchingFish.x = fisherman.bobberX;
              fisherman.catchingFish.y = fisherman.bobberY;
            }
          }
        }
      }
      
      // Update fish
      for (let i = fishes.length - 1; i >= 0; i--) {
        const f = fishes[i];
        
        // Fleeing fish swim away fast
        const speed = f.fleeing ? f.speed * 3 : (f.interested ? f.speed * 0.3 : f.speed);
        f.x += speed * f.direction;
        
        // Vertical swimming motion
        f.y = f.baseY + Math.sin(Date.now() * 0.003 + f.phase) * 6;
        f.tailPhase += dt * 0.02 * (f.interested ? 1.5 : 1);
        
        // Clear fleeing status after going offscreen
        if ((f.direction > 0 && f.x > width + f.size) ||
            (f.direction < 0 && f.x < -f.size)) {
          fishes.splice(i, 1);
        }
      }
      
      // Spawn fish more frequently
      if (Math.random() < 0.025 && fishes.length < 15) {
        spawnFish();
      }
      
      // Update bubbles
      for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        b.y -= b.speed;
        b.wobble += dt * 0.01;
        b.x += Math.sin(b.wobble) * 0.3;
        
        if (b.y < height * WATER_LEVEL) {
          bubbles.splice(i, 1);
        }
      }
      
      // Spawn bubbles
      if (Math.random() < 0.03) {
        spawnBubble();
      }
      
      // Update ripples
      for (let i = ripples.length - 1; i >= 0; i--) {
        const r = ripples[i];
        r.radius += dt * 0.05;
        r.alpha -= dt * 0.002;
        
        if (r.alpha <= 0 || r.radius > r.maxRadius) {
          ripples.splice(i, 1);
        }
      }
    }

    function render() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const waterTop = height * WATER_LEVEL;
      
      // Sky gradient
      const skyGrad = ctx.createLinearGradient(0, 0, 0, waterTop);
      if (isDark) {
        skyGrad.addColorStop(0, '#0a0a1f');
        skyGrad.addColorStop(1, '#1a1a3e');
      } else {
        skyGrad.addColorStop(0, '#87CEEB');
        skyGrad.addColorStop(1, '#b0e0e6');
      }
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, width, waterTop);
      
      // Sun/Moon
      ctx.beginPath();
      ctx.arc(width - 100, 80, 40, 0, Math.PI * 2);
      ctx.fillStyle = isDark ? '#f0f0c0' : '#ffd700';
      ctx.fill();
      
      // Clouds
      if (!isDark) {
        drawCloud(width * 0.2, 60, 0.8);
        drawCloud(width * 0.5, 90, 1);
        drawCloud(width * 0.75, 50, 0.6);
      } else {
        // Stars
        ctx.fillStyle = '#ffffff';
        for (let i = 0; i < 30; i++) {
          ctx.beginPath();
          ctx.arc((i * 97 + 50) % width, (i * 43 + 20) % (waterTop - 20), 1, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      
      // Grass/shore
      ctx.fillStyle = isDark ? '#0f4c0f' : '#228B22';
      ctx.fillRect(0, waterTop - 20, DOCK_WIDTH + 60, 40);
      
      // Water with depth zones
      const waterGrad = ctx.createLinearGradient(0, waterTop, 0, height);
      if (isDark) {
        waterGrad.addColorStop(0, '#0a2463');
        waterGrad.addColorStop(0.3, '#072050');
        waterGrad.addColorStop(0.6, '#051937');
        waterGrad.addColorStop(1, '#030d20');
      } else {
        waterGrad.addColorStop(0, '#1e90ff');
        waterGrad.addColorStop(0.3, '#1a7fd1');
        waterGrad.addColorStop(0.6, '#0066cc');
        waterGrad.addColorStop(1, '#004499');
      }
      ctx.fillStyle = waterGrad;
      ctx.fillRect(0, waterTop, width, height);
      
      // Depth zone indicators on right side
      if (fisherman.lineInWater && !fisherman.reeling) {
        drawDepthIndicator(isDark);
      }
      
      // Animated waves
      ctx.fillStyle = isDark ? 'rgba(100, 150, 255, 0.3)' : 'rgba(255, 255, 255, 0.3)';
      ctx.beginPath();
      ctx.moveTo(0, waterTop);
      for (let x = 0; x <= width; x += 20) {
        const y = waterTop + Math.sin(x * 0.02 + waveOffset * 2) * 5;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(width, waterTop + 15);
      ctx.lineTo(0, waterTop + 15);
      ctx.fill();
      
      // Dock
      ctx.fillStyle = isDark ? '#5a3510' : '#8B4513';
      ctx.fillRect(0, waterTop - 15, DOCK_WIDTH, 20);
      ctx.fillRect(20, waterTop, 10, 50);
      ctx.fillRect(DOCK_WIDTH - 30, waterTop, 10, 50);
      ctx.strokeStyle = isDark ? '#3d2409' : '#654321';
      ctx.lineWidth = 2;
      for (let x = 10; x < DOCK_WIDTH; x += 20) {
        ctx.beginPath();
        ctx.moveTo(x, waterTop - 15);
        ctx.lineTo(x, waterTop + 5);
        ctx.stroke();
      }
      
      // Draw ripples
      ripples.forEach(r => {
        ctx.beginPath();
        ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255, 255, 255, ${r.alpha})`;
        ctx.lineWidth = 2;
        ctx.stroke();
      });
      
      // Draw bubbles
      ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
      bubbles.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
        ctx.fill();
      });
      
      // Draw fish
      fishes.forEach(f => {
        ctx.save();
        ctx.translate(f.x, f.y);
        ctx.scale(f.direction, 1);
        
        // Glow effect for interested fish
        if (f.interested && !f.fleeing) {
          ctx.shadowColor = f.color;
          ctx.shadowBlur = 15;
        }
        
        // Fish body
        ctx.fillStyle = f.color || '#22c55e';
        ctx.globalAlpha = f.fleeing ? 0.5 : 1;
        ctx.beginPath();
        ctx.ellipse(0, 0, f.size / 2, f.size / 3, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // Tail
        const tailWag = Math.sin(f.tailPhase) * 0.3;
        ctx.beginPath();
        ctx.moveTo(-f.size / 2, 0);
        ctx.lineTo(-f.size / 2 - f.size / 3, -f.size / 4 + tailWag * 10);
        ctx.lineTo(-f.size / 2 - f.size / 3, f.size / 4 + tailWag * 10);
        ctx.closePath();
        ctx.fill();
        
        // Eye
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(f.size / 4, -f.size / 8, f.size / 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(f.size / 4 + 2, -f.size / 8, f.size / 16, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.restore();
      });
      
      // Draw fisherman
      drawFisherman();
      
      // Draw fishing line and bobber
      if (fisherman.casting || fisherman.lineInWater || fisherman.reeling) {
        const rodTipX = fisherman.x + 40 + Math.cos(fisherman.rodAngle) * fisherman.rodLength;
        const rodTipY = fisherman.y - 20 + Math.sin(fisherman.rodAngle) * fisherman.rodLength;
        
        // Line from rod to bobber
        ctx.strokeStyle = '#888';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(rodTipX, rodTipY);
        ctx.lineTo(fisherman.bobberX, fisherman.bobberY);
        ctx.stroke();
        
        // Bobber (underwater at depth) with wiggle
        const wiggleX = fisherman.bobberWiggle * Math.sin(Date.now() * 0.025) * 3;
        const bobberDrawX = fisherman.bobberX + wiggleX;
        const bobberDrawY = fisherman.bobberY;
        
        // Glow when fish is biting
        if (fisherman.bitingFish) {
          ctx.shadowColor = '#22c55e';
          ctx.shadowBlur = 20;
        }
        
        // Bobber body
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(bobberDrawX, bobberDrawY, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(bobberDrawX, bobberDrawY - 4, 10, Math.PI, 0);
        ctx.fill();
        
        ctx.shadowBlur = 0;
        
        // Hook and bait below bobber
        ctx.strokeStyle = '#666';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(bobberDrawX, bobberDrawY + 10);
        ctx.lineTo(bobberDrawX, bobberDrawY + 25);
        ctx.arc(bobberDrawX + 5, bobberDrawY + 25, 5, Math.PI, 0, true);
        ctx.lineTo(bobberDrawX + 10, bobberDrawY + 20);
        ctx.stroke();
        
        // Bait (worm)
        ctx.fillStyle = fisherman.bitingFish ? '#22c55e' : '#f97316';
        ctx.beginPath();
        ctx.ellipse(bobberDrawX + 3, bobberDrawY + 28, 6, 3, 0.3, 0, Math.PI * 2);
        ctx.fill();
        
        // Draw caught fish on bobber
        if (fisherman.catchingFish && fisherman.reeling) {
          const f = fisherman.catchingFish;
          ctx.save();
          ctx.translate(f.x, f.y + 15);
          ctx.fillStyle = f.color || '#22c55e';
          ctx.beginPath();
          ctx.ellipse(0, 0, f.size / 2, f.size / 3, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }
    }

    function drawDepthIndicator(isDark) {
      const indicatorX = width - 60;
      const indicatorTop = height * WATER_LEVEL + 30;
      const indicatorHeight = MAX_DEPTH;
      
      // Background bar
      ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
      ctx.fillRect(indicatorX - 15, indicatorTop, 30, indicatorHeight);
      
      // Depth zone colors
      const zones = [
        { zone: DEPTH_ZONES.SHALLOW, color: isDark ? '#60a5fa55' : '#60a5fa77' },
        { zone: DEPTH_ZONES.MID, color: isDark ? '#a78bfa55' : '#a78bfa77' },
        { zone: DEPTH_ZONES.DEEP, color: isDark ? '#3b82f655' : '#3b82f677' }
      ];
      
      zones.forEach(({ zone, color }) => {
        ctx.fillStyle = color;
        ctx.fillRect(indicatorX - 15, indicatorTop + zone.min, 30, zone.max - zone.min);
      });
      
      // Bobber position marker
      const markerY = indicatorTop + fisherman.bobberDepth;
      ctx.fillStyle = fisherman.bitingFish ? '#ef4444' : '#22c55e';
      ctx.beginPath();
      ctx.moveTo(indicatorX - 20, markerY);
      ctx.lineTo(indicatorX - 30, markerY - 8);
      ctx.lineTo(indicatorX - 30, markerY + 8);
      ctx.closePath();
      ctx.fill();
      
      // Depth label
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(Math.round(fisherman.bobberDepth) + 'm', indicatorX - 35, markerY + 4);
      
      // Zone labels
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Shallow', indicatorX, indicatorTop + 40);
      ctx.fillText('Mid', indicatorX, indicatorTop + 90);
      ctx.fillText('Deep', indicatorX, indicatorTop + 160);
    }

    function drawCloud(x, y, scale) {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.beginPath();
      ctx.arc(x, y, 25 * scale, 0, Math.PI * 2);
      ctx.arc(x + 30 * scale, y, 30 * scale, 0, Math.PI * 2);
      ctx.arc(x + 60 * scale, y, 25 * scale, 0, Math.PI * 2);
      ctx.arc(x + 15 * scale, y - 15 * scale, 20 * scale, 0, Math.PI * 2);
      ctx.arc(x + 45 * scale, y - 15 * scale, 20 * scale, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawFisherman() {
      const x = fisherman.x;
      const y = fisherman.y;
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      
      // Body
      ctx.fillStyle = isDark ? '#4a5568' : '#1e40af';
      ctx.fillRect(x + 10, y - 40, 30, 40);
      
      // Head
      ctx.fillStyle = '#fcd5b4';
      ctx.beginPath();
      ctx.arc(x + 25, y - 55, 15, 0, Math.PI * 2);
      ctx.fill();
      
      // Hat
      ctx.fillStyle = isDark ? '#2d3748' : '#854d0e';
      ctx.fillRect(x + 10, y - 72, 30, 8);
      ctx.fillRect(x + 15, y - 82, 20, 12);
      
      // Arm
      ctx.strokeStyle = '#fcd5b4';
      ctx.lineWidth = 8;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x + 35, y - 30);
      ctx.lineTo(x + 50, y - 25);
      ctx.stroke();
      
      // Rod
      const rodAngle = fisherman.casting ? castAngle - Math.sin(fisherman.swingAngle) * 0.5 : castAngle;
      fisherman.rodAngle = rodAngle;
      
      ctx.strokeStyle = isDark ? '#8b6914' : '#964B00';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(x + 40, y - 20);
      ctx.lineTo(
        x + 40 + Math.cos(rodAngle) * fisherman.rodLength,
        y - 20 + Math.sin(rodAngle) * fisherman.rodLength
      );
      ctx.stroke();
      
      // Rod tip
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(
        x + 40 + Math.cos(rodAngle) * fisherman.rodLength,
        y - 20 + Math.sin(rodAngle) * fisherman.rodLength,
        4, 0, Math.PI * 2
      );
      ctx.fill();
    }

    function gameLoop(timestamp) {
      const dt = timestamp - lastTime;
      lastTime = timestamp;
      
      update(dt);
      render();
      
      requestAnimationFrame(gameLoop);
    }

    function startGame() {
      gameState = 'playing';
      score = 0;
      fishCaught = 0;
      biggestCatch = 0;
      missedBites = 0;
      timeLeft = GAME_DURATION;
      
      fishes = [];
      bubbles = [];
      ripples = [];
      
      fisherman.casting = false;
      fisherman.reeling = false;
      fisherman.lineInWater = false;
      fisherman.catchingFish = null;
      fisherman.bitingFish = null;
      fisherman.biteTimer = 0;
      fisherman.bobberDepth = 0;
      fisherman.targetDepth = 50;
      fisherman.bobberWiggle = 0;
      castPower = 0;
      isCharging = false;
      
      // Spawn initial fish across all depths
      for (let i = 0; i < 8; i++) {
        spawnFish();
        fishes[fishes.length - 1].x = DOCK_WIDTH + 100 + Math.random() * (width - DOCK_WIDTH - 200);
      }
      
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('game-over-screen').classList.add('hidden');
      document.getElementById('hud').style.display = 'flex';
      document.getElementById('instructions').style.display = 'block';
      document.getElementById('depth-controls').style.display = 'none';
      
      updateHUD();
      
      if (timerId) clearInterval(timerId);
      timerId = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').textContent = timeLeft;
        
        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      gameState = 'gameover';
      if (timerId) clearInterval(timerId);
      
      document.getElementById('hud').style.display = 'none';
      document.getElementById('instructions').style.display = 'none';
      document.getElementById('power-meter').style.display = 'none';
      document.getElementById('depth-controls').style.display = 'none';
      document.getElementById('bite-indicator').classList.remove('active');
      document.getElementById('bite-indicator').style.opacity = '0';
      
      // Calculate rank
      let rank;
      if (score >= 600) rank = '🏆 Master Angler';
      else if (score >= 400) rank = '⭐ Expert Fisher';
      else if (score >= 200) rank = '🎣 Skilled Caster';
      else if (score >= 100) rank = '🐟 Pond Regular';
      else rank = '🪱 Bait Collector';
      
      document.getElementById('final-score').textContent = score;
      document.getElementById('final-fish').textContent = fishCaught;
      document.getElementById('final-best').textContent = biggestCatch + 'pts';
      document.getElementById('final-rank').textContent = rank;
      
      document.getElementById('game-over-screen').classList.remove('hidden');
    }

    // Start game loop
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
