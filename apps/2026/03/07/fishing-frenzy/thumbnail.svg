<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB"/>
      <stop offset="100%" style="stop-color:#b0e0e6"/>
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e90ff"/>
      <stop offset="100%" style="stop-color:#0066cc"/>
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="400" height="165" fill="url(#sky)"/>
  
  <!-- Sun -->
  <circle cx="340" cy="50" r="30" fill="#ffd700"/>
  
  <!-- Clouds -->
  <g fill="rgba(255,255,255,0.8)">
    <circle cx="60" cy="40" r="18"/>
    <circle cx="82" cy="40" r="22"/>
    <circle cx="108" cy="40" r="18"/>
    <circle cx="73" cy="28" r="15"/>
    <circle cx="95" cy="28" r="15"/>
  </g>
  
  <!-- Shore/Grass -->
  <rect x="0" y="150" width="100" height="30" fill="#228B22"/>
  
  <!-- Water -->
  <rect y="165" width="400" height="135" fill="url(#water)"/>
  
  <!-- Waves -->
  <path d="M0 165 Q50 160 100 165 T200 165 T300 165 T400 165 L400 175 L0 175 Z" fill="rgba(255,255,255,0.3)"/>
  
  <!-- Dock -->
  <rect x="0" y="145" width="90" height="15" fill="#8B4513"/>
  <rect x="15" y="160" width="8" height="35" fill="#8B4513"/>
  <rect x="67" y="160" width="8" height="35" fill="#8B4513"/>
  
  <!-- Fisherman body -->
  <rect x="35" y="110" width="25" height="35" fill="#1e40af" rx="3"/>
  
  <!-- Head -->
  <circle cx="47" cy="98" r="12" fill="#fcd5b4"/>
  
  <!-- Hat -->
  <rect x="32" y="82" width="30" height="6" fill="#854d0e"/>
  <rect x="37" y="74" width="20" height="10" fill="#854d0e"/>
  
  <!-- Arm -->
  <line x1="55" y1="120" x2="68" y2="115" stroke="#fcd5b4" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Fishing Rod -->
  <line x1="60" y1="110" x2="180" y2="60" stroke="#964B00" stroke-width="4" stroke-linecap="round"/>
  <circle cx="180" cy="60" r="4" fill="#ef4444"/>
  
  <!-- Fishing Line -->
  <line x1="180" y1="60" x2="260" y2="190" stroke="#999" stroke-width="1.5"/>
  
  <!-- Bobber -->
  <circle cx="260" cy="190" r="8" fill="#ef4444"/>
  <path d="M252 190 A8 8 0 0 1 268 190" fill="#ffffff"/>
  
  <!-- Ripples -->
  <circle cx="260" cy="190" r="15" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <circle cx="260" cy="190" r="25" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  
  <!-- Fish 1 -->
  <g transform="translate(180, 220)">
    <ellipse cx="0" cy="0" rx="18" ry="10" fill="#22c55e"/>
    <path d="M-18 0 L-30 -8 L-30 8 Z" fill="#22c55e"/>
    <circle cx="10" cy="-3" r="4" fill="white"/>
    <circle cx="11" cy="-3" r="2" fill="black"/>
  </g>
  
  <!-- Fish 2 -->
  <g transform="translate(320, 240) scale(-1,1)">
    <ellipse cx="0" cy="0" rx="22" ry="12" fill="#4ade80"/>
    <path d="M-22 0 L-36 -10 L-36 10 Z" fill="#4ade80"/>
    <circle cx="12" cy="-4" r="5" fill="white"/>
    <circle cx="13" cy="-4" r="2.5" fill="black"/>
  </g>
  
  <!-- Fish 3 (golden) -->
  <g transform="translate(140, 260)">
    <ellipse cx="0" cy="0" rx="14" ry="8" fill="#ffd700"/>
    <path d="M-14 0 L-24 -6 L-24 6 Z" fill="#ffd700"/>
    <circle cx="8" cy="-2" r="3" fill="white"/>
    <circle cx="9" cy="-2" r="1.5" fill="black"/>
  </g>
  
  <!-- Bubbles -->
  <circle cx="200" cy="250" r="4" fill="rgba(255,255,255,0.4)"/>
  <circle cx="290" cy="270" r="3" fill="rgba(255,255,255,0.4)"/>
  <circle cx="350" cy="260" r="5" fill="rgba(255,255,255,0.4)"/>
  
  <!-- Title -->
  <text x="200" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">🎣 Fishing Frenzy</text>
</svg>
