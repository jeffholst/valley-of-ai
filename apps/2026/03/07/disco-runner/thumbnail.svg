<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff2e63"/>
      <stop offset="50%" style="stop-color:#bf00ff"/>
      <stop offset="100%" style="stop-color:#00d4ff"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff2e63"/>
      <stop offset="50%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#39ff14"/>
    </linearGradient>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <!-- Disco floor lines -->
  <g stroke="#bf00ff" stroke-width="2" opacity="0.3">
    <line x1="50" y1="0" x2="80" y2="450"/>
    <line x1="150" y1="0" x2="180" y2="450"/>
    <line x1="250" y1="0" x2="280" y2="450"/>
    <line x1="350" y1="0" x2="380" y2="450"/>
    <line x1="450" y1="0" x2="480" y2="450"/>
    <line x1="550" y1="0" x2="580" y2="450"/>
    <line x1="650" y1="0" x2="680" y2="450"/>
    <line x1="750" y1="0" x2="780" y2="450"/>
  </g>
  
  <!-- Ground -->
  <rect x="0" y="360" width="800" height="90" fill="url(#groundGrad)"/>
  
  <!-- Platforms -->
  <g filter="url(#neonGlow)">
    <rect x="250" y="300" width="100" height="20" rx="4" fill="#00d4ff"/>
    <rect x="420" y="280" width="120" height="20" rx="4" fill="#39ff14"/>
    <rect x="600" y="310" width="90" height="20" rx="4" fill="#ff2e63"/>
  </g>
  
  <!-- Obstacles -->
  <g filter="url(#neonGlow)">
    <!-- Spike -->
    <polygon points="500,360 485,320 515,320" fill="#ffff00"/>
    <!-- Block -->
    <rect x="680" y="310" width="40" height="50" fill="#ff6600"/>
  </g>
  
  <!-- Disco Ball -->
  <g transform="translate(350, 220)" filter="url(#strongGlow)">
    <circle r="25" fill="#c0c0c0"/>
    <circle cx="-10" cy="-10" r="5" fill="#ff2e63"/>
    <circle cx="10" cy="-10" r="5" fill="#00d4ff"/>
    <circle cx="0" cy="10" r="5" fill="#39ff14"/>
    <circle cx="-15" cy="5" r="4" fill="#ffff00"/>
    <circle cx="15" cy="5" r="4" fill="#bf00ff"/>
  </g>
  
  <!-- Player (Disco Dancer) -->
  <g transform="translate(120, 285)" filter="url(#neonGlow)">
    <!-- Body -->
    <rect x="10" y="15" width="20" height="30" fill="#ff2e63"/>
    <!-- Head -->
    <circle cx="20" cy="10" r="12" fill="#ff2e63"/>
    <!-- Afro -->
    <path d="M5 10 Q5 -5 20 -5 Q35 -5 35 10" fill="#ff2e63"/>
    <!-- Arms dancing -->
    <rect x="-8" y="20" width="18" height="6" fill="#ff2e63"/>
    <rect x="30" y="18" width="18" height="6" fill="#ff2e63"/>
    <!-- Legs -->
    <rect x="10" y="45" width="8" height="20" fill="#ff2e63"/>
    <rect x="22" y="45" width="8" height="20" fill="#ff2e63"/>
  </g>
  
  <!-- Particles -->
  <g opacity="0.8">
    <circle cx="160" cy="340" r="4" fill="#00d4ff"/>
    <circle cx="180" cy="330" r="3" fill="#39ff14"/>
    <circle cx="140" cy="350" r="5" fill="#ff2e63"/>
    <circle cx="170" cy="355" r="3" fill="#ffff00"/>
  </g>
  
  <!-- UI Header -->
  <rect x="0" y="0" width="800" height="60" fill="rgba(0,0,0,0.5)"/>
  
  <!-- Title -->
  <text x="30" y="40" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="url(#titleGrad)">🕺 Disco Runner</text>
  
  <!-- Score -->
  <g font-family="system-ui, sans-serif">
    <text x="550" y="35" font-size="14" fill="#a0a0a0">🎵 Score:</text>
    <text x="620" y="35" font-size="18" font-weight="bold" fill="#ffff00" filter="url(#neonGlow)">1250</text>
    <text x="680" y="35" font-size="14" fill="#a0a0a0">🏆 Best:</text>
    <text x="745" y="35" font-size="18" font-weight="bold" fill="#ffff00" filter="url(#neonGlow)">2400</text>
  </g>
  
  <!-- Gravity indicator -->
  <rect x="20" y="70" width="140" height="30" rx="8" fill="rgba(0,0,0,0.5)"/>
  <text x="35" y="91" font-family="system-ui, sans-serif" font-size="14" fill="#ffffff">⬇️ Gravity: Normal</text>
  
  <!-- Hint at bottom -->
  <rect x="250" y="400" width="300" height="35" rx="8" fill="rgba(0,0,0,0.5)"/>
  <text x="400" y="423" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#a0a0a0">
    🪩 Collect disco balls to 
    <tspan fill="#39ff14">FLIP GRAVITY!</tspan>
  </text>
</svg>