<!doctype html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=__GA_MEASUREMENT_ID__"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '__GA_MEASUREMENT_ID__');
    </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workout Timer Pulse - __MAIN_SITE_NAME__</title>
  <style>
    :root{--bg:#0b1220;--bg2:#15243d;--surface:#101a30;--text:#eaf1ff;--muted:#98abd4;--primary:#22d3ee;--accent:#8b5cf6;--work:#22c55e;--rest:#f59e0b;--ready:#60a5fa}
    [data-theme="light"]{--bg:#eef5ff;--bg2:#dbeafe;--surface:#fff;--text:#1f2f52;--muted:#5f7198;--primary:#0891b2;--accent:#6d28d9;--work:#15803d;--rest:#b45309;--ready:#2563eb}
    .theme-toggle{position:absolute;top:16px;right:16px;z-index:10;background:color-mix(in srgb,var(--surface) 90%,transparent);border:1px solid color-mix(in srgb,var(--muted) 28%,transparent);border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;color:var(--text)}
    .theme-toggle:hover{transform:scale(1.1)}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;font-family:Inter,system-ui;background:radial-gradient(1000px 700px at 20% 20%,var(--bg2),var(--bg));color:var(--text)}
    .card{width:min(860px,100%);background:color-mix(in srgb,var(--surface) 90%,transparent);border:1px solid color-mix(in srgb,var(--muted) 24%,transparent);border-radius:20px;padding:16px;box-shadow:0 18px 45px #0004}
    h1{margin:0 0 4px;font-size:1.5rem}.sub{margin:0 0 12px;color:var(--muted)}
    .layout{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}
    .panel{border:1px solid color-mix(in srgb,var(--muted) 22%,transparent);border-radius:14px;padding:12px;background:color-mix(in srgb,var(--surface) 94%,transparent)}
    .ring-wrap{display:grid;place-items:center;height:360px;position:relative}
    svg{width:280px;height:280px}
    .center{position:absolute;text-align:center}
    .phase{font-size:.95rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
    .time{font-size:3rem;font-weight:800;line-height:1}
    .meta{font-size:.95rem;color:var(--muted)}
    .controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
    button,select,input{font:inherit;border-radius:999px;border:1px solid color-mix(in srgb,var(--muted) 28%,transparent);padding:9px 12px;background:color-mix(in srgb,var(--surface) 92%,transparent);color:var(--text)}
    button{cursor:pointer;font-weight:700}
    .primary{background:linear-gradient(90deg,var(--accent),var(--primary));color:#fff;border:none}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    label{font-size:.82rem;color:var(--muted);display:block;margin:2px 6px}
    .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
    .chip{font-size:.75rem;padding:5px 8px;border-radius:999px;border:1px solid color-mix(in srgb,var(--muted) 24%,transparent);color:var(--muted)}
    @media(max-width:800px){.layout{grid-template-columns:1fr}.ring-wrap{height:320px}}
  </style>
  <meta name="voa-main-site-url" content="__MAIN_SITE_URL__">
  <meta name="voa-main-site-name" content="__MAIN_SITE_NAME__">
  <script src="/apps/shared/app-shell.js" defer></script>
</head>
<body>
  <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">🌙</button>
  <main class="card">
    <h1>🏋️ Workout Timer Pulse</h1>
    <p class="sub">Popular interval features: presets, prep countdown, rounds, audio cues, pause/skip.</p>
    <section class="layout">
      <article class="panel">
        <div class="ring-wrap">
          <svg viewBox="0 0 300 300" aria-label="timer ring">
            <circle cx="150" cy="150" r="120" fill="none" stroke="color-mix(in srgb,var(--muted) 25%,transparent)" stroke-width="16" />
            <circle id="prog" cx="150" cy="150" r="120" fill="none" stroke="var(--primary)" stroke-width="16" stroke-linecap="round" transform="rotate(-90 150 150)" />
          </svg>
          <div class="center">
            <div class="phase" id="phase">Ready</div>
            <div class="time" id="time">00:10</div>
            <div class="meta" id="meta">Round 0 / 8</div>
          </div>
        </div>
        <div class="controls">
          <button class="primary" id="start">Start</button>
          <button id="pause">Pause</button>
          <button id="skip">Skip</button>
          <button id="reset">Reset</button>
        </div>
        <div class="chips">
          <span class="chip">Space: Start/Pause</span>
          <span class="chip">N: Skip</span>
          <span class="chip">M: Mute cues</span>
        </div>
      </article>
      <aside class="panel">
        <div class="grid">
          <div><label>Preset</label><select id="preset"><option value="tabata">Tabata 20/10 × 8</option><option value="3030">30/30 × 10</option><option value="emom">EMOM 45/15 × 12</option><option value="custom">Custom</option></select></div>
          <div><label>Prep (sec)</label><input id="prep" type="number" min="0" max="60" value="10"></div>
          <div><label>Work (sec)</label><input id="work" type="number" min="5" max="600" value="20"></div>
          <div><label>Rest (sec)</label><input id="rest" type="number" min="0" max="300" value="10"></div>
          <div><label>Rounds</label><input id="rounds" type="number" min="1" max="99" value="8"></div>
          <div><label>Audio Cues</label><select id="audio"><option value="on">On</option><option value="off">Off</option></select></div>
        </div>
      </aside>
    </section>
  </main>
<script>
// Theme handling
const storedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
document.documentElement.setAttribute('data-theme', storedTheme);
document.querySelector('.theme-toggle').textContent = storedTheme === 'dark' ? '☀️' : '🌙';
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  document.querySelector('.theme-toggle').textContent = next === 'dark' ? '☀️' : '🌙';
}
const $=id=>document.getElementById(id);
const state={running:false,phase:'ready',timeLeft:10,total:10,round:0,cfg:{prep:10,work:20,rest:10,rounds:8},muted:false};
const prog=$('prog'); const C=2*Math.PI*120; prog.setAttribute('stroke-dasharray',C);
let tmr=null;

const presets={tabata:{prep:10,work:20,rest:10,rounds:8},'3030':{prep:10,work:30,rest:30,rounds:10},emom:{prep:10,work:45,rest:15,rounds:12}};
function fmt(s){const m=String(Math.floor(s/60)).padStart(2,'0');const ss=String(s%60).padStart(2,'0');return `${m}:${ss}`}
function phaseColor(){return state.phase==='work'?'var(--work)':state.phase==='rest'?'var(--rest)':'var(--ready)'}
function render(){
  $('phase').textContent=state.phase;
  $('time').textContent=fmt(state.timeLeft);
  $('meta').textContent=`Round ${state.round} / ${state.cfg.rounds}`;
  const p=1-(state.timeLeft/state.total||1); prog.setAttribute('stroke-dashoffset',String(C-(C*p))); prog.setAttribute('stroke',phaseColor());
}
function beep(freq=880,d=.08){ if(state.muted) return; try{const ctx=new (window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=freq;o.start();g.gain.setValueAtTime(.08,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+d);o.stop(ctx.currentTime+d);}catch(e){} }
function applyConfig(){state.cfg={prep:+$('prep').value,work:+$('work').value,rest:+$('rest').value,rounds:+$('rounds').value};state.muted=$('audio').value==='off';}
function setPreset(){const p=$('preset').value;if(p==='custom')return; const c=presets[p]; $('prep').value=c.prep; $('work').value=c.work; $('rest').value=c.rest; $('rounds').value=c.rounds; applyConfig(); reset();}
function nextPhase(){
  if(state.phase==='ready'){state.phase='work';state.total=state.timeLeft=state.cfg.work;state.round=1;beep(740,.1);return}
  if(state.phase==='work'){
    if(state.cfg.rest>0){state.phase='rest';state.total=state.timeLeft=state.cfg.rest;beep(520,.12);return}
    if(state.round>=state.cfg.rounds){finish();return}
    state.round++;state.phase='work';state.total=state.timeLeft=state.cfg.work;beep(740,.1);return
  }
  if(state.phase==='rest'){
    if(state.round>=state.cfg.rounds){finish();return}
    state.round++;state.phase='work';state.total=state.timeLeft=state.cfg.work;beep(740,.1);return
  }
}
function finish(){state.running=false;clearInterval(tmr);state.phase='done';state.timeLeft=0;state.total=1;beep(980,.2);render();}
function tick(){ if(!state.running)return; state.timeLeft--; if(state.timeLeft<=3 && state.timeLeft>0)beep(1200,.05); if(state.timeLeft<=0)nextPhase(); render(); }
function start(){applyConfig(); if(state.phase==='done')reset(); if(!state.running){state.running=true; if(!tmr)tmr=setInterval(tick,1000);} }
function pause(){state.running=false;}
function skip(){if(!state.running && state.phase==='ready')start(); else nextPhase(); render();}
function reset(){clearInterval(tmr);tmr=null;state.running=false;state.phase='ready';state.round=0;state.total=state.timeLeft=+$('prep').value||10;render();}
$('start').onclick=start; $('pause').onclick=pause; $('skip').onclick=skip; $('reset').onclick=reset; $('preset').onchange=setPreset; ['prep','work','rest','rounds','audio'].forEach(id=>$(id).onchange=()=>{applyConfig();if(!state.running)reset();});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return; if(e.code==='Space'){e.preventDefault(); state.running?pause():start();} if(e.key.toLowerCase()==='n')skip(); if(e.key.toLowerCase()==='m'){state.muted=!state.muted; $('audio').value=state.muted?'off':'on';}});
reset();
</script>
</body>
</html>
