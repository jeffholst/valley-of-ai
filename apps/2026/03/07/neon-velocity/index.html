  <meta charset="UTF-8">

  <title>Neon Velocity - __MAIN_SITE_NAME__</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --neon-cyan: #00ffff;
      --neon-pink: #ff00ff;
      --neon-yellow: #ffff00;
      --neon-green: #00ff88;
      --neon-orange: #ff6600;
      --neon-red: #ff0044;
      --text-primary: #ffffff;
      --text-secondary: #88889a;
      --surface: #1a1a2e;
    }

    [data-theme="light"] {
      --bg-primary: #e8e8f0;
      --bg-secondary: #d0d0e0;
      --surface: #f0f0f8;
      --text-primary: #1a1a2e;
      --text-secondary: #555566;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Top Bar */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      z-index: 100;
      background: linear-gradient(to bottom, var(--bg-primary), transparent);
    }

    .home-link {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s;
    }

    .home-link:hover {
      color: var(--neon-cyan);
    }

    .home-link svg {
      width: 20px;
      height: 20px;
    }

    .theme-toggle {
      background: var(--surface);
      border: 1px solid var(--text-secondary);
      color: var(--text-primary);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: all 0.3s;
    }

    .theme-toggle:hover {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 15px var(--neon-cyan);
    }

    /* Game Container */
    .game-container {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
      max-width: 100%;
      max-height: 100vh;
      image-rendering: pixelated;
    }

    /* HUD */
    .hud {
      position: fixed;
      top: 60px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 40px;
      padding: 10px;
      z-index: 50;
      pointer-events: none;
    }

    .hud-item {
      text-align: center;
    }

    .hud-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .hud-value {
      font-size: 28px;
      font-weight: 700;
      text-shadow: 0 0 20px var(--neon-cyan);
      color: var(--neon-cyan);
      font-family: 'Courier New', monospace;
    }

    .hud-value.combo {
      color: var(--neon-pink);
      text-shadow: 0 0 20px var(--neon-pink);
    }

    /* Power-up Indicators */
    .power-ups {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 50;
    }

    .power-up-indicator {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      background: var(--surface);
      border: 2px solid var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      opacity: 0.3;
      transition: all 0.3s;
    }

    .power-up-indicator.active {
      opacity: 1;
      animation: pulse-glow 0.5s ease-in-out infinite alternate;
    }

    .power-up-indicator.shield.active {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 20px var(--neon-cyan);
    }

    .power-up-indicator.magnet.active {
      border-color: var(--neon-pink);
      box-shadow: 0 0 20px var(--neon-pink);
    }

    .power-up-indicator.double.active {
      border-color: var(--neon-yellow);
      box-shadow: 0 0 20px var(--neon-yellow);
    }

    .power-up-indicator.slow.active {
      border-color: var(--neon-green);
      box-shadow: 0 0 20px var(--neon-green);
    }

    @keyframes pulse-glow {
      from { transform: scale(1); }
      to { transform: scale(1.1); }
    }

    /* Overlays */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 15, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      transition: opacity 0.3s;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .title {
      font-size: clamp(48px, 12vw, 96px);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 8px;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink), var(--neon-yellow));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      animation: title-glow 2s ease-in-out infinite alternate;
      margin-bottom: 20px;
    }

    @keyframes title-glow {
      from {
        filter: drop-shadow(0 0 20px var(--neon-cyan)) drop-shadow(0 0 40px var(--neon-pink));
      }
      to {
        filter: drop-shadow(0 0 30px var(--neon-pink)) drop-shadow(0 0 60px var(--neon-cyan));
      }
    }

    .subtitle {
      font-size: 16px;
      color: var(--text-secondary);
      margin-bottom: 40px;
      text-transform: uppercase;
      letter-spacing: 4px;
    }

    .start-btn {
      padding: 20px 60px;
      font-size: 24px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 4px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
      color: #000;
      transition: all 0.3s;
      animation: button-pulse 1.5s ease-in-out infinite;
    }

    .start-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 40px var(--neon-cyan), 0 0 80px var(--neon-pink);
    }

    @keyframes button-pulse {
      0%, 100% { box-shadow: 0 0 20px var(--neon-cyan); }
      50% { box-shadow: 0 0 40px var(--neon-pink); }
    }

    .controls-info {
      margin-top: 40px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
    }

    .controls-info kbd {
      display: inline-block;
      padding: 4px 10px;
      background: var(--surface);
      border: 1px solid var(--text-secondary);
      border-radius: 4px;
      margin: 0 4px;
      font-family: monospace;
    }

    /* Game Over */
    .game-over-title {
      font-size: clamp(36px, 8vw, 64px);
      font-weight: 900;
      color: var(--neon-red);
      text-shadow: 0 0 30px var(--neon-red);
      margin-bottom: 20px;
      animation: shake 0.5s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-20px); }
      40% { transform: translateX(20px); }
      60% { transform: translateX(-10px); }
      80% { transform: translateX(10px); }
    }

    .final-score {
      font-size: 48px;
      font-weight: 700;
      color: var(--neon-cyan);
      text-shadow: 0 0 20px var(--neon-cyan);
      margin-bottom: 10px;
    }

    .high-score {
      font-size: 18px;
      color: var(--neon-yellow);
      text-shadow: 0 0 10px var(--neon-yellow);
      margin-bottom: 30px;
    }

    .new-high-score {
      animation: rainbow 1s linear infinite;
    }

    @keyframes rainbow {
      0% { color: var(--neon-cyan); text-shadow: 0 0 20px var(--neon-cyan); }
      25% { color: var(--neon-pink); text-shadow: 0 0 20px var(--neon-pink); }
      50% { color: var(--neon-yellow); text-shadow: 0 0 20px var(--neon-yellow); }
      75% { color: var(--neon-green); text-shadow: 0 0 20px var(--neon-green); }
      100% { color: var(--neon-cyan); text-shadow: 0 0 20px var(--neon-cyan); }
    }

    .stats {
      display: flex;
      gap: 30px;
      margin-bottom: 30px;
    }

    .stat {
      text-align: center;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    /* Mobile touch zones */
    .touch-zones {
      position: fixed;
      bottom: 80px;
      left: 0;
      right: 0;
      display: none;
      justify-content: center;
      gap: 20px;
      z-index: 100;
    }

    @media (max-width: 768px) {
      .touch-zones {
        display: flex;
      }
      .controls-info {
        display: none;
      }
    }

    .touch-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid var(--neon-cyan);
      background: rgba(0, 255, 255, 0.1);
      color: var(--neon-cyan);
      font-size: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      -webkit-user-select: none;
      user-select: none;
    }

    .touch-btn:active {
      transform: scale(0.9);
      background: rgba(0, 255, 255, 0.3);
      box-shadow: 0 0 30px var(--neon-cyan);
    }

    .touch-btn.left { border-color: var(--neon-pink); color: var(--neon-pink); background: rgba(255, 0, 255, 0.1); }
    .touch-btn.left:active { background: rgba(255, 0, 255, 0.3); box-shadow: 0 0 30px var(--neon-pink); }
    .touch-btn.right { border-color: var(--neon-green); color: var(--neon-green); background: rgba(0, 255, 136, 0.1); }
    .touch-btn.right:active { background: rgba(0, 255, 136, 0.3); box-shadow: 0 0 30px var(--neon-green); }

    /* Screen shake */
    .shake {
      animation: screen-shake 0.3s ease-out;
    }

    @keyframes screen-shake {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      10% { transform: translate(-5px, -5px) rotate(-1deg); }
      20% { transform: translate(5px, -5px) rotate(1deg); }
      30% { transform: translate(-5px, 5px) rotate(0deg); }
      40% { transform: translate(5px, 5px) rotate(1deg); }
      50% { transform: translate(-5px, -5px) rotate(-1deg); }
      60% { transform: translate(5px, -5px) rotate(0deg); }
      70% { transform: translate(-5px, 5px) rotate(-1deg); }
      80% { transform: translate(-5px, -5px) rotate(1deg); }
      90% { transform: translate(5px, -5px) rotate(0deg); }
    }

    /* Particles container */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }
  </style>

  <!-- Background Particles -->

  <script>
    // Theme Management
    const theme = localStorage.getItem('theme') || 
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
    updateThemeIcon();

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeIcon();
    }

    function updateThemeIcon() {
      const btn = document.querySelector('.theme-toggle');
      btn.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
    }

    // Game Constants
    const LANE_COUNT = 3;
    const GRAVITY = 0.6;
    const JUMP_FORCE = -14;
    const BASE_SPEED = 5;
    const MAX_SPEED = 18;
    const SPEED_INCREMENT = 0.0008;
    const GRACE_PERIOD = 2000; // 2 seconds before obstacles spawn
    const MIN_OBSTACLE_SPACING = 500; // minimum pixels between obstacles
    
    // Canvas Setup
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let width, height;
    let laneWidth, groundY, playerSize;

    function resize() {
      const container = document.getElementById('game-container');
      const aspectRatio = 16 / 9;
      let w = window.innerWidth;
      let h = window.innerHeight;
      
      if (w / h > aspectRatio) {
        w = h * aspectRatio;
      } else {
        h = w / aspectRatio;
      }
      
      canvas.width = width = Math.floor(w);
      canvas.height = height = Math.floor(h);
      
      laneWidth = width / LANE_COUNT;
      groundY = height * 0.75;
      playerSize = Math.min(width * 0.08, 60);
    }
    
    resize();
    window.addEventListener('resize', resize);

    // Colors
    const COLORS = {
      cyan: '#00ffff',
      pink: '#ff00ff',
      yellow: '#ffff00',
      green: '#00ff88',
      orange: '#ff6600',
      red: '#ff0044',
      white: '#ffffff'
    };

    // Game State
    let gameState = 'menu'; // menu, playing, gameover
    let score = 0;
    let distance = 0;
    let combo = 1;
    let maxCombo = 1;
    let orbsCollected = 0;
    let speed = BASE_SPEED;
    let highScore = parseInt(localStorage.getItem('neon-velocity-high') || '0');
    let lastTime = 0;
    let deltaTime = 0;
    let gameStartTime = 0;
    let lastObstacleX = 0;

    // Player
    const player = {
      lane: 1,
      x: 0,
      y: 0,
      targetX: 0,
      vy: 0,
      isJumping: false,
      width: 0,
      height: 0,
      shield: false,
      shieldTime: 0,
      magnet: false,
      magnetTime: 0,
      doublePoints: false,
      doublePointsTime: 0,
      slowMotion: false,
      slowMotionTime: 0,
      trail: []
    };

    // Game Objects
    let obstacles = [];
    let orbs = [];
    let powerUps = [];
    let particles = [];
    let gridLines = [];

    // Object Pooling
    const MAX_PARTICLES = 200;

    function createParticle(x, y, color, vx, vy, size, life) {
      if (particles.length >= MAX_PARTICLES) {
        particles.shift();
      }
      particles.push({ x, y, color, vx, vy, size, life, maxLife: life, alpha: 1 });
    }

    function createExplosion(x, y, color, count = 20) {
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
        const speed = 3 + Math.random() * 5;
        createParticle(
          x, y, color,
          Math.cos(angle) * speed,
          Math.sin(angle) * speed,
          3 + Math.random() * 4,
          30 + Math.random() * 30
        );
      }
    }

    function createTrailParticle(x, y, color) {
      createParticle(
        x + (Math.random() - 0.5) * 10,
        y + (Math.random() - 0.5) * 10,
        color,
        (Math.random() - 0.5) * 2,
        (Math.random() - 0.5) * 2,
        4 + Math.random() * 4,
        15 + Math.random() * 15
      );
    }

    // Obstacle Types
    const OBSTACLE_TYPES = [
      { type: 'barrier', width: 0.7, height: 0.5, color: COLORS.red },
      { type: 'spike', width: 0.35, height: 0.6, color: COLORS.orange },
      { type: 'wall', width: 0.8, height: 0.75, color: COLORS.red },
    ];

    // Power-up Types
    const POWERUP_TYPES = [
      { type: 'shield', emoji: '🛡️', color: COLORS.cyan, duration: 5000 },
      { type: 'magnet', emoji: '🧲', color: COLORS.pink, duration: 8000 },
      { type: 'double', emoji: '✨', color: COLORS.yellow, duration: 10000 },
      { type: 'slow', emoji: '⏱️', color: COLORS.green, duration: 5000 },
    ];

    function spawnObstacle() {
      // Check minimum spacing from last obstacle
      if (lastObstacleX > width - MIN_OBSTACLE_SPACING) return;
      
      const obstType = OBSTACLE_TYPES[Math.floor(Math.random() * OBSTACLE_TYPES.length)];
      const lane = Math.floor(Math.random() * LANE_COUNT);
      
      lastObstacleX = width + 100;
      obstacles.push({
        ...obstType,
        lane,
        x: width + 100,
        y: groundY,
        actualWidth: laneWidth * obstType.width,
        actualHeight: playerSize * obstType.height,
        passed: false
      });
    }

    function spawnOrb() {
      const lane = Math.floor(Math.random() * LANE_COUNT);
      const isHigh = Math.random() > 0.5;
      
      orbs.push({
        lane,
        x: width + 50,
        y: isHigh ? groundY - playerSize * 1.5 : groundY - playerSize * 0.3,
        radius: 12,
        collected: false,
        pulse: 0
      });
    }

    function spawnPowerUp() {
      const type = POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)];
      const lane = Math.floor(Math.random() * LANE_COUNT);
      
      powerUps.push({
        ...type,
        lane,
        x: width + 50,
        y: groundY - playerSize * 0.5,
        size: 30,
        collected: false,
        pulse: 0
      });
    }

    // Grid Lines for speed effect
    function initGridLines() {
      gridLines = [];
      const spacing = 50;
      for (let i = 0; i < width / spacing + 5; i++) {
        gridLines.push({ x: i * spacing });
      }
    }

    // Input Handling
    const keys = {};
    document.addEventListener('keydown', (e) => {
      keys[e.key.toLowerCase()] = true;
      
      if (gameState === 'playing') {
        if (['arrowleft', 'a'].includes(e.key.toLowerCase()) && player.lane > 0) {
          player.lane--;
        }
        if (['arrowright', 'd'].includes(e.key.toLowerCase()) && player.lane < LANE_COUNT - 1) {
          player.lane++;
        }
        if (['arrowup', 'w', ' '].includes(e.key.toLowerCase()) && !player.isJumping) {
          player.vy = JUMP_FORCE;
          player.isJumping = true;
          createExplosion(player.x, player.y + player.height / 2, COLORS.cyan, 10);
        }
      }
      
      e.preventDefault();
    });

    document.addEventListener('keyup', (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    // Touch Controls
    document.getElementById('btn-left').addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (gameState === 'playing' && player.lane > 0) player.lane--;
    });

    document.getElementById('btn-right').addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (gameState === 'playing' && player.lane < LANE_COUNT - 1) player.lane++;
    });

    document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (gameState === 'playing' && !player.isJumping) {
        player.vy = JUMP_FORCE;
        player.isJumping = true;
        createExplosion(player.x, player.y + player.height / 2, COLORS.cyan, 10);
      }
    });

    // Start/Restart
    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', startGame);

    function startGame() {
      gameState = 'playing';
      score = 0;
      distance = 0;
      combo = 1;
      maxCombo = 1;
      orbsCollected = 0;
      speed = BASE_SPEED;
      gameStartTime = Date.now();
      lastObstacleX = 0;
      
      player.lane = 1;
      player.vy = 0;
      player.isJumping = false;
      player.shield = false;
      player.magnet = false;
      player.doublePoints = false;
      player.slowMotion = false;
      player.trail = [];
      
      obstacles = [];
      orbs = [];
      powerUps = [];
      particles = [];
      
      initGridLines();
      
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('game-over-screen').classList.add('hidden');
      document.getElementById('hud').style.display = 'flex';
      document.getElementById('power-ups').style.display = 'flex';
      
      if (window.innerWidth <= 768) {
        document.getElementById('touch-zones').style.display = 'flex';
      }
      
      updateHUD();
    }

    function gameOver() {
      gameState = 'gameover';
      
      document.getElementById('hud').style.display = 'none';
      document.getElementById('power-ups').style.display = 'none';
      document.getElementById('touch-zones').style.display = 'none';
      
      // Screen shake
      document.getElementById('game-container').classList.add('shake');
      setTimeout(() => {
        document.getElementById('game-container').classList.remove('shake');
      }, 300);
      
      // Update high score
      const isNewHigh = score > highScore;
      if (isNewHigh) {
        highScore = score;
        localStorage.setItem('neon-velocity-high', highScore.toString());
      }
      
      // Show game over
      document.getElementById('final-score').textContent = score.toLocaleString();
      const highScoreEl = document.getElementById('high-score');
      highScoreEl.textContent = isNewHigh ? '🎉 NEW HIGH SCORE! 🎉' : `High Score: ${highScore.toLocaleString()}`;
      highScoreEl.className = 'high-score' + (isNewHigh ? ' new-high-score' : '');
      
      document.getElementById('stat-distance').textContent = Math.floor(distance) + 'm';
      document.getElementById('stat-max-combo').textContent = 'x' + maxCombo;
      document.getElementById('stat-orbs').textContent = orbsCollected;
      
      document.getElementById('game-over-screen').classList.remove('hidden');
      
      // Big explosion
      createExplosion(player.x, player.y, COLORS.red, 50);
    }

    function updateHUD() {
      document.getElementById('score').textContent = score.toLocaleString();
      document.getElementById('combo').textContent = 'x' + combo;
      document.getElementById('speed').textContent = (speed / BASE_SPEED).toFixed(1);
      
      // Power-up indicators
      document.getElementById('pu-shield').className = 'power-up-indicator shield' + (player.shield ? ' active' : '');
      document.getElementById('pu-magnet').className = 'power-up-indicator magnet' + (player.magnet ? ' active' : '');
      document.getElementById('pu-double').className = 'power-up-indicator double' + (player.doublePoints ? ' active' : '');
      document.getElementById('pu-slow').className = 'power-up-indicator slow' + (player.slowMotion ? ' active' : '');
    }

    // Collision Detection
    function checkCollision(rect1, rect2) {
      return rect1.x < rect2.x + rect2.width &&
             rect1.x + rect1.width > rect2.x &&
             rect1.y < rect2.y + rect2.height &&
             rect1.y + rect1.height > rect2.y;
    }

    // Update Functions
    function update(timestamp) {
      deltaTime = timestamp - lastTime;
      lastTime = timestamp;
      
      if (gameState !== 'playing') {
        requestAnimationFrame(update);
        return;
      }
      
      const effectiveSpeed = player.slowMotion ? speed * 0.5 : speed;
      
      // Update speed
      speed = Math.min(MAX_SPEED, speed + SPEED_INCREMENT);
      distance += effectiveSpeed * 0.1;
      
      // Update player position
      player.width = playerSize * 0.7;
      player.height = playerSize;
      player.targetX = laneWidth * player.lane + laneWidth / 2;
      player.x += (player.targetX - player.x) * 0.2;
      
      // Gravity and jumping
      player.vy += GRAVITY;
      player.y += player.vy;
      
      if (player.y >= groundY - player.height) {
        player.y = groundY - player.height;
        player.vy = 0;
        player.isJumping = false;
      }
      
      // Player trail
      if (player.trail.length > 8) player.trail.shift();
      player.trail.push({ x: player.x, y: player.y });
      
      // Trail particles
      if (Math.random() > 0.5) {
        createTrailParticle(player.x, player.y + player.height, player.shield ? COLORS.cyan : COLORS.pink);
      }
      
      // Update power-up timers
      const now = Date.now();
      if (player.shield && now > player.shieldTime) player.shield = false;
      if (player.magnet && now > player.magnetTime) player.magnet = false;
      if (player.doublePoints && now > player.doublePointsTime) player.doublePoints = false;
      if (player.slowMotion && now > player.slowMotionTime) player.slowMotion = false;
      
      // Spawn objects (with grace period for obstacles)
      const elapsed = Date.now() - gameStartTime;
      if (elapsed > GRACE_PERIOD && Math.random() < 0.008 + speed * 0.0004) spawnObstacle();
      if (Math.random() < 0.04) spawnOrb();
      if (elapsed > GRACE_PERIOD * 0.5 && Math.random() < 0.004) spawnPowerUp();
      
      // Update grid lines
      gridLines.forEach(line => {
        line.x -= effectiveSpeed;
        if (line.x < -50) line.x += width + 100;
      });
      
      // Update obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= effectiveSpeed;
        
        // Collision check
        const playerRect = {
          x: player.x - player.width / 2,
          y: player.y,
          width: player.width,
          height: player.height
        };
        
        const obsRect = {
          x: obs.x - obs.actualWidth / 2,
          y: obs.y - obs.actualHeight,
          width: obs.actualWidth,
          height: obs.actualHeight
        };
        
        if (checkCollision(playerRect, obsRect)) {
          if (player.shield) {
            // Destroy obstacle with shield
            createExplosion(obs.x, obs.y - obs.actualHeight / 2, COLORS.cyan, 30);
            obstacles.splice(i, 1);
            score += 50 * combo;
            continue;
          } else {
            gameOver();
            break;
          }
        }
        
        // Score for passing obstacle
        if (!obs.passed && obs.x < player.x - 50) {
          obs.passed = true;
          score += 10 * combo;
        }
        
        if (obs.x < -100) obstacles.splice(i, 1);
      }
      
      // Track rightmost obstacle for minimum spacing
      lastObstacleX = obstacles.reduce((max, obs) => Math.max(max, obs.x), 0);
      
      // Update orbs
      for (let i = orbs.length - 1; i >= 0; i--) {
        const orb = orbs[i];
        orb.x -= effectiveSpeed;
        orb.pulse = (orb.pulse + 0.1) % (Math.PI * 2);
        
        // Magnet effect
        if (player.magnet && !orb.collected) {
          const dx = player.x - orb.x;
          const dy = (player.y + player.height / 2) - orb.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 200) {
            orb.x += dx * 0.1;
            orb.y += dy * 0.1;
          }
        }
        
        // Collection check
        const dist = Math.sqrt(
          Math.pow(player.x - orb.x, 2) +
          Math.pow((player.y + player.height / 2) - orb.y, 2)
        );
        
        if (dist < player.width / 2 + orb.radius && !orb.collected) {
          orb.collected = true;
          orbsCollected++;
          combo = Math.min(10, combo + 1);
          maxCombo = Math.max(maxCombo, combo);
          
          const points = (player.doublePoints ? 20 : 10) * combo;
          score += points;
          
          createExplosion(orb.x, orb.y, COLORS.yellow, 15);
        }
        
        if (orb.x < -50 || orb.collected) orbs.splice(i, 1);
      }
      
      // Update power-ups
      for (let i = powerUps.length - 1; i >= 0; i--) {
        const pu = powerUps[i];
        pu.x -= effectiveSpeed;
        pu.pulse = (pu.pulse + 0.1) % (Math.PI * 2);
        
        const dist = Math.sqrt(
          Math.pow(player.x - pu.x, 2) +
          Math.pow((player.y + player.height / 2) - pu.y, 2)
        );
        
        if (dist < player.width / 2 + pu.size && !pu.collected) {
          pu.collected = true;
          
          switch (pu.type) {
            case 'shield':
              player.shield = true;
              player.shieldTime = Date.now() + pu.duration;
              break;
            case 'magnet':
              player.magnet = true;
              player.magnetTime = Date.now() + pu.duration;
              break;
            case 'double':
              player.doublePoints = true;
              player.doublePointsTime = Date.now() + pu.duration;
              break;
            case 'slow':
              player.slowMotion = true;
              player.slowMotionTime = Date.now() + pu.duration;
              break;
          }
          
          createExplosion(pu.x, pu.y, pu.color, 25);
        }
        
        if (pu.x < -50 || pu.collected) powerUps.splice(i, 1);
      }
      
      // Combo decay
      if (orbsCollected > 0 && Math.random() < 0.002) {
        combo = Math.max(1, combo - 1);
      }
      
      // Update particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.1;
        p.life--;
        p.alpha = p.life / p.maxLife;
        
        if (p.life <= 0) particles.splice(i, 1);
      }
      
      updateHUD();
      render();
      requestAnimationFrame(update);
    }

    // Render Functions
    function render() {
      const theme = document.documentElement.getAttribute('data-theme');
      const isDark = theme !== 'light';
      
      // Background
      const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
      if (isDark) {
        bgGrad.addColorStop(0, '#0a0a1a');
        bgGrad.addColorStop(0.5, '#1a0a2a');
        bgGrad.addColorStop(1, '#0a1a2a');
      } else {
        bgGrad.addColorStop(0, '#e8e0f0');
        bgGrad.addColorStop(0.5, '#d0d8e8');
        bgGrad.addColorStop(1, '#c8d0e0');
      }
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, width, height);
      
      // Grid effect
      ctx.strokeStyle = isDark ? 'rgba(0, 255, 255, 0.1)' : 'rgba(0, 128, 255, 0.15)';
      ctx.lineWidth = 1;
      
      // Horizontal lines (perspective)
      for (let i = 0; i < 15; i++) {
        const y = groundY + i * (height - groundY) / 10;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }
      
      // Vertical lines (moving)
      gridLines.forEach(line => {
        ctx.beginPath();
        ctx.moveTo(line.x, groundY);
        ctx.lineTo(line.x, height);
        ctx.stroke();
      });
      
      // Lane dividers
      ctx.strokeStyle = isDark ? 'rgba(255, 0, 255, 0.3)' : 'rgba(128, 0, 128, 0.2)';
      ctx.lineWidth = 2;
      ctx.setLineDash([20, 20]);
      for (let i = 1; i < LANE_COUNT; i++) {
        ctx.beginPath();
        ctx.moveTo(laneWidth * i, groundY - height * 0.3);
        ctx.lineTo(laneWidth * i, groundY);
        ctx.stroke();
      }
      ctx.setLineDash([]);
      
      // Ground line
      const groundGrad = ctx.createLinearGradient(0, groundY, width, groundY);
      groundGrad.addColorStop(0, COLORS.cyan);
      groundGrad.addColorStop(0.5, COLORS.pink);
      groundGrad.addColorStop(1, COLORS.cyan);
      ctx.strokeStyle = groundGrad;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      ctx.lineTo(width, groundY);
      ctx.stroke();
      
      // Ground glow
      const glowGrad = ctx.createLinearGradient(0, groundY, 0, groundY + 50);
      glowGrad.addColorStop(0, isDark ? 'rgba(0, 255, 255, 0.3)' : 'rgba(0, 128, 255, 0.2)');
      glowGrad.addColorStop(1, 'transparent');
      ctx.fillStyle = glowGrad;
      ctx.fillRect(0, groundY, width, 50);
      
      // Draw obstacles
      obstacles.forEach(obs => {
        const x = obs.x - obs.actualWidth / 2;
        const y = obs.y - obs.actualHeight;
        
        // Glow
        ctx.shadowColor = obs.color;
        ctx.shadowBlur = 20;
        
        // Body
        ctx.fillStyle = obs.color;
        ctx.fillRect(x, y, obs.actualWidth, obs.actualHeight);
        
        // Inner glow
        const innerGrad = ctx.createLinearGradient(x, y, x, y + obs.actualHeight);
        innerGrad.addColorStop(0, 'rgba(255, 255, 255, 0.3)');
        innerGrad.addColorStop(1, 'transparent');
        ctx.fillStyle = innerGrad;
        ctx.fillRect(x, y, obs.actualWidth, obs.actualHeight);
        
        // Border
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, obs.actualWidth, obs.actualHeight);
        
        ctx.shadowBlur = 0;
      });
      
      // Draw orbs
      orbs.forEach(orb => {
        const pulseSize = Math.sin(orb.pulse) * 4;
        
        ctx.shadowColor = COLORS.yellow;
        ctx.shadowBlur = 20;
        
        // Outer glow
        const glowGrad = ctx.createRadialGradient(orb.x, orb.y, 0, orb.x, orb.y, orb.radius + pulseSize + 10);
        glowGrad.addColorStop(0, 'rgba(255, 255, 0, 0.8)');
        glowGrad.addColorStop(0.5, 'rgba(255, 200, 0, 0.4)');
        glowGrad.addColorStop(1, 'transparent');
        ctx.fillStyle = glowGrad;
        ctx.beginPath();
        ctx.arc(orb.x, orb.y, orb.radius + pulseSize + 10, 0, Math.PI * 2);
        ctx.fill();
        
        // Core
        ctx.fillStyle = COLORS.yellow;
        ctx.beginPath();
        ctx.arc(orb.x, orb.y, orb.radius + pulseSize, 0, Math.PI * 2);
        ctx.fill();
        
        // Shine
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(orb.x - 4, orb.y - 4, 3, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.shadowBlur = 0;
      });
      
      // Draw power-ups
      powerUps.forEach(pu => {
        const pulseSize = Math.sin(pu.pulse) * 5;
        
        ctx.shadowColor = pu.color;
        ctx.shadowBlur = 30;
        
        // Background circle
        ctx.fillStyle = pu.color;
        ctx.beginPath();
        ctx.arc(pu.x, pu.y, pu.size + pulseSize, 0, Math.PI * 2);
        ctx.fill();
        
        // Emoji
        ctx.shadowBlur = 0;
        ctx.font = `${pu.size}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(pu.emoji, pu.x, pu.y);
      });
      
      // Draw player trail
      player.trail.forEach((pos, i) => {
        const alpha = i / player.trail.length * 0.5;
        const size = player.width * (0.5 + i / player.trail.length * 0.5);
        
        ctx.fillStyle = player.shield 
          ? `rgba(0, 255, 255, ${alpha})`
          : `rgba(255, 0, 255, ${alpha})`;
        
        ctx.beginPath();
        ctx.arc(pos.x, pos.y + player.height / 2, size / 2, 0, Math.PI * 2);
        ctx.fill();
      });
      
      // Draw player
      const px = player.x - player.width / 2;
      const py = player.y;
      
      // Shield effect
      if (player.shield) {
        ctx.shadowColor = COLORS.cyan;
        ctx.shadowBlur = 30;
        ctx.strokeStyle = COLORS.cyan;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(player.x, py + player.height / 2, player.width * 0.9, 0, Math.PI * 2);
        ctx.stroke();
        ctx.shadowBlur = 0;
      }
      
      // Player body (geometric style)
      const gradient = ctx.createLinearGradient(px, py, px, py + player.height);
      gradient.addColorStop(0, COLORS.cyan);
      gradient.addColorStop(0.5, COLORS.pink);
      gradient.addColorStop(1, COLORS.cyan);
      
      ctx.shadowColor = COLORS.pink;
      ctx.shadowBlur = 20;
      
      // Body shape (hexagon-ish)
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.moveTo(player.x, py);
      ctx.lineTo(player.x + player.width / 2, py + player.height * 0.2);
      ctx.lineTo(player.x + player.width / 2, py + player.height * 0.8);
      ctx.lineTo(player.x, py + player.height);
      ctx.lineTo(player.x - player.width / 2, py + player.height * 0.8);
      ctx.lineTo(player.x - player.width / 2, py + player.height * 0.2);
      ctx.closePath();
      ctx.fill();
      
      // Inner glow
      ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
      ctx.beginPath();
      ctx.moveTo(player.x, py + player.height * 0.15);
      ctx.lineTo(player.x + player.width * 0.3, py + player.height * 0.3);
      ctx.lineTo(player.x + player.width * 0.3, py + player.height * 0.5);
      ctx.lineTo(player.x, py + player.height * 0.6);
      ctx.lineTo(player.x - player.width * 0.3, py + player.height * 0.5);
      ctx.lineTo(player.x - player.width * 0.3, py + player.height * 0.3);
      ctx.closePath();
      ctx.fill();
      
      // Eye/core
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(player.x, py + player.height * 0.35, 6, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.shadowBlur = 0;
      
      // Draw particles
      particles.forEach(p => {
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
      
      // Slow motion effect
      if (player.slowMotion) {
        ctx.fillStyle = 'rgba(0, 255, 136, 0.1)';
        ctx.fillRect(0, 0, width, height);
      }
    }

    // Menu background animation
    function menuLoop(timestamp) {
      if (gameState !== 'menu') {
        requestAnimationFrame(update);
        return;
      }
      
      const theme = document.documentElement.getAttribute('data-theme');
      const isDark = theme !== 'light';
      
      // Background
      const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
      if (isDark) {
        bgGrad.addColorStop(0, '#0a0a1a');
        bgGrad.addColorStop(0.5, '#1a0a2a');
        bgGrad.addColorStop(1, '#0a1a2a');
      } else {
        bgGrad.addColorStop(0, '#e8e0f0');
        bgGrad.addColorStop(0.5, '#d0d8e8');
        bgGrad.addColorStop(1, '#c8d0e0');
      }
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, width, height);
      
      // Animated grid
      const time = timestamp * 0.001;
      ctx.strokeStyle = isDark ? 'rgba(0, 255, 255, 0.1)' : 'rgba(0, 128, 255, 0.15)';
      ctx.lineWidth = 1;
      
      for (let i = 0; i < 20; i++) {
        const y = ((i * 50 + time * 100) % height);
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }
      
      for (let i = 0; i < 30; i++) {
        const x = ((i * 50 - time * 50) % (width + 100)) - 50;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }
      
      requestAnimationFrame(menuLoop);
    }

    // Initialize
    initGridLines();
    requestAnimationFrame(menuLoop);
  </script>
</body>
</html>
