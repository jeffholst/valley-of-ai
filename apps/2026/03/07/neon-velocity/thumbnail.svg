<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="50%" style="stop-color:#1a0a2a"/>
      <stop offset="100%" style="stop-color:#0a1a2a"/>
    </linearGradient>
    <linearGradient id="groundGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ffff"/>
      <stop offset="50%" style="stop-color:#ff00ff"/>
      <stop offset="100%" style="stop-color:#00ffff"/>
    </linearGradient>
    <linearGradient id="playerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff"/>
      <stop offset="50%" style="stop-color:#ff00ff"/>
      <stop offset="100%" style="stop-color:#00ffff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Grid lines - horizontal -->
  <g stroke="#00ffff" stroke-width="0.5" opacity="0.15">
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="340" x2="800" y2="340"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="380" x2="800" y2="380"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="420" x2="800" y2="420"/>
    <line x1="0" y1="440" x2="800" y2="440"/>
  </g>
  
  <!-- Grid lines - vertical (perspective) -->
  <g stroke="#00ffff" stroke-width="0.5" opacity="0.15">
    <line x1="100" y1="300" x2="100" y2="450"/>
    <line x1="200" y1="300" x2="200" y2="450"/>
    <line x1="300" y1="300" x2="300" y2="450"/>
    <line x1="400" y1="300" x2="400" y2="450"/>
    <line x1="500" y1="300" x2="500" y2="450"/>
    <line x1="600" y1="300" x2="600" y2="450"/>
    <line x1="700" y1="300" x2="700" y2="450"/>
  </g>
  
  <!-- Lane dividers -->
  <g stroke="#ff00ff" stroke-width="2" opacity="0.4" stroke-dasharray="15,15">
    <line x1="267" y1="200" x2="267" y2="300"/>
    <line x1="533" y1="200" x2="533" y2="300"/>
  </g>
  
  <!-- Ground line with glow -->
  <line x1="0" y1="300" x2="800" y2="300" stroke="url(#groundGlow)" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Ground glow effect -->
  <rect x="0" y="300" width="800" height="30" fill="url(#groundGlow)" opacity="0.2"/>
  
  <!-- Obstacle 1 - Right lane barrier -->
  <g filter="url(#glow)">
    <rect x="600" y="240" width="80" height="60" rx="4" fill="#ff0044"/>
    <rect x="600" y="240" width="80" height="30" rx="4" fill="#ff0044" opacity="0.5"/>
    <rect x="600" y="240" width="80" height="60" rx="4" fill="none" stroke="#ffffff" stroke-width="2"/>
  </g>
  
  <!-- Obstacle 2 - Far right spike -->
  <g filter="url(#glow)">
    <rect x="720" y="220" width="40" height="80" rx="2" fill="#ff6600"/>
    <rect x="720" y="220" width="40" height="40" rx="2" fill="#ff6600" opacity="0.5"/>
    <rect x="720" y="220" width="40" height="80" rx="2" fill="none" stroke="#ffffff" stroke-width="2"/>
  </g>
  
  <!-- Energy Orbs -->
  <g filter="url(#strongGlow)">
    <!-- Orb 1 -->
    <circle cx="500" cy="260" r="12" fill="#ffff00"/>
    <circle cx="496" cy="256" r="3" fill="#ffffff"/>
    <!-- Orb 2 -->
    <circle cx="450" cy="200" r="12" fill="#ffff00"/>
    <circle cx="446" cy="196" r="3" fill="#ffffff"/>
    <!-- Orb 3 -->
    <circle cx="550" cy="220" r="12" fill="#ffff00"/>
    <circle cx="546" cy="216" r="3" fill="#ffffff"/>
  </g>
  
  <!-- Power-up (shield) -->
  <g filter="url(#strongGlow)">
    <circle cx="350" cy="250" r="22" fill="#00ffff"/>
    <text x="350" y="258" text-anchor="middle" font-size="20">🛡️</text>
  </g>
  
  <!-- Player trail effect -->
  <g opacity="0.3">
    <polygon points="100,230 120,242 120,278 100,290 80,278 80,242" fill="#ff00ff"/>
  </g>
  <g opacity="0.5">
    <polygon points="140,230 160,242 160,278 140,290 120,278 120,242" fill="#ff00ff"/>
  </g>
  
  <!-- Player character (hexagonal cyber runner) -->
  <g filter="url(#strongGlow)">
    <polygon points="200,220 230,236 230,284 200,300 170,284 170,236" fill="url(#playerGrad)"/>
    <!-- Inner highlight -->
    <polygon points="200,235 215,245 215,265 200,275 185,265 185,245" fill="rgba(255,255,255,0.3)"/>
    <!-- Eye/core -->
    <circle cx="200" cy="250" r="6" fill="#ffffff"/>
    
    <!-- Shield effect around player -->
    <circle cx="200" cy="260" r="50" fill="none" stroke="#00ffff" stroke-width="3" opacity="0.6"/>
  </g>
  
  <!-- Speed lines -->
  <g stroke="#00ffff" stroke-width="2" opacity="0.4">
    <line x1="50" y1="260" x2="80" y2="260"/>
    <line x1="30" y1="240" x2="70" y2="240"/>
    <line x1="40" y1="280" x2="90" y2="280"/>
    <line x1="20" y1="250" x2="60" y2="250"/>
    <line x1="45" y1="270" x2="85" y2="270"/>
  </g>
  
  <!-- Particles -->
  <g fill="#ff00ff" opacity="0.8">
    <circle cx="120" cy="290" r="3"/>
    <circle cx="130" cy="295" r="2"/>
    <circle cx="110" cy="285" r="2.5"/>
    <circle cx="140" cy="288" r="2"/>
  </g>
  <g fill="#00ffff" opacity="0.8">
    <circle cx="160" cy="292" r="2"/>
    <circle cx="150" cy="298" r="3"/>
    <circle cx="175" cy="290" r="2"/>
  </g>
  
  <!-- HUD - Score -->
  <g>
    <text x="100" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#88889a" letter-spacing="2">SCORE</text>
    <text x="100" y="75" text-anchor="middle" font-family="'Courier New', monospace" font-size="28" font-weight="700" fill="#00ffff" filter="url(#glow)">12,450</text>
  </g>
  
  <!-- HUD - Combo -->
  <g>
    <text x="400" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#88889a" letter-spacing="2">COMBO</text>
    <text x="400" y="75" text-anchor="middle" font-family="'Courier New', monospace" font-size="28" font-weight="700" fill="#ff00ff" filter="url(#glow)">x7</text>
  </g>
  
  <!-- HUD - Speed -->
  <g>
    <text x="700" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#88889a" letter-spacing="2">SPEED</text>
    <text x="700" y="75" text-anchor="middle" font-family="'Courier New', monospace" font-size="28" font-weight="700" fill="#00ffff" filter="url(#glow)">1.8</text>
  </g>
  
  <!-- Power-up indicators at bottom -->
  <g transform="translate(400, 410)">
    <rect x="-100" y="-20" width="40" height="40" rx="8" fill="#1a1a2e" stroke="#00ffff" stroke-width="2"/>
    <text x="-80" y="4" text-anchor="middle" font-size="18">🛡️</text>
    
    <rect x="-50" y="-20" width="40" height="40" rx="8" fill="#1a1a2e" stroke="#88889a" stroke-width="1" opacity="0.4"/>
    <text x="-30" y="4" text-anchor="middle" font-size="18" opacity="0.4">🧲</text>
    
    <rect x="0" y="-20" width="40" height="40" rx="8" fill="#1a1a2e" stroke="#88889a" stroke-width="1" opacity="0.4"/>
    <text x="20" y="4" text-anchor="middle" font-size="18" opacity="0.4">✨</text>
    
    <rect x="50" y="-20" width="40" height="40" rx="8" fill="#1a1a2e" stroke="#88889a" stroke-width="1" opacity="0.4"/>
    <text x="70" y="4" text-anchor="middle" font-size="18" opacity="0.4">⏱️</text>
  </g>
  
  <!-- Title text overlay -->
  <text x="400" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#88889a" letter-spacing="4">⚡ HIGH-SPEED CYBER RUNNER ⚡</text>
</svg>
