<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#ffd700"/>
    </linearGradient>
    <radialGradient id="spotlightGrad" cx="50%" cy="0%" r="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,200,0.4)"/>
      <stop offset="70%" style="stop-color:rgba(255,255,150,0.15)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,100,0)"/>
    </radialGradient>
    <radialGradient id="playerGrad" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#f9a8d4"/>
      <stop offset="100%" style="stop-color:#f472b6"/>
    </radialGradient>
    <radialGradient id="instructorGrad" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#ff7b8a"/>
      <stop offset="100%" style="stop-color:#e94560"/>
    </radialGradient>
    <radialGradient id="markGrad" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#ffed4a"/>
      <stop offset="100%" style="stop-color:#ffd700"/>
    </radialGradient>
  </defs>
  
  <!-- Background - Football field green -->
  <rect width="800" height="450" fill="#2d5a27"/>
  
  <!-- Field lines -->
  <line x1="100" y1="0" x2="100" y2="450" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>
  <line x1="250" y1="0" x2="250" y2="450" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>
  <line x1="400" y1="0" x2="400" y2="450" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>
  <line x1="550" y1="0" x2="550" y2="450" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>
  <line x1="700" y1="0" x2="700" y2="450" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>
  
  <!-- Center circle -->
  <circle cx="400" cy="225" r="80" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>
  
  <!-- Spotlight cone (triangular shape) -->
  <polygon points="400,100 280,350 520,350" fill="url(#spotlightGrad)"/>
  <line x1="400" y1="100" x2="280" y2="350" stroke="rgba(255,255,200,0.5)" stroke-width="2"/>
  <line x1="400" y1="100" x2="520" y2="350" stroke="rgba(255,255,200,0.5)" stroke-width="2"/>
  
  <!-- Dance marks (gold stars scattered) -->
  <circle cx="180" cy="180" r="20" fill="url(#markGrad)">
    <animate attributeName="r" values="18;22;18" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="180" r="10" fill="#fff3b0"/>
  
  <circle cx="620" cy="200" r="20" fill="url(#markGrad)">
    <animate attributeName="r" values="18;22;18" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="620" cy="200" r="10" fill="#fff3b0"/>
  
  <circle cx="550" cy="350" r="20" fill="url(#markGrad)">
    <animate attributeName="r" values="18;22;18" dur="0.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="550" cy="350" r="10" fill="#fff3b0"/>
  
  <circle cx="150" cy="320" r="20" fill="url(#markGrad)">
    <animate attributeName="r" values="18;22;18" dur="1.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="320" r="10" fill="#fff3b0"/>
  
  <!-- Instructor (angry face at top) -->
  <circle cx="400" cy="100" r="35" fill="#1a1a2e"/>
  <circle cx="400" cy="100" r="30" fill="url(#instructorGrad)"/>
  
  <!-- Instructor angry eyes -->
  <circle cx="388" cy="94" r="8" fill="white"/>
  <circle cx="412" cy="94" r="8" fill="white"/>
  <circle cx="388" cy="94" r="4" fill="black"/>
  <circle cx="412" cy="94" r="4" fill="black"/>
  
  <!-- Angry eyebrows -->
  <line x1="378" y1="82" x2="393" y2="87" stroke="black" stroke-width="3" stroke-linecap="round"/>
  <line x1="422" y1="82" x2="407" y2="87" stroke="black" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Frown -->
  <path d="M388 115 Q400 105 412 115" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Whistle -->
  <circle cx="430" cy="108" r="6" fill="#c0c0c0"/>
  
  <!-- Player (pink dancer avoiding the spotlight!) -->
  <g>
    <circle cx="600" cy="380" r="30" fill="rgba(244,114,182,0.3)"/>
    <circle cx="600" cy="380" r="22" fill="url(#playerGrad)"/>
    <circle cx="593" cy="375" r="5" fill="white"/>
    <circle cx="607" cy="375" r="5" fill="white"/>
    <circle cx="593" cy="375" r="2.5" fill="black"/>
    <circle cx="607" cy="375" r="2.5" fill="black"/>
    <path d="M593 388 Q600 395 607 388" fill="none" stroke="black" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Stats bar at top -->
  <rect x="50" y="15" width="700" height="50" rx="10" fill="rgba(22,33,62,0.9)"/>
  
  <!-- Lives (hearts) -->
  <text x="90" y="48" font-size="20">❤️❤️❤️</text>
  
  <!-- Score -->
  <text x="260" y="45" font-family="SF Mono, monospace" font-size="22" font-weight="700" fill="#ffd700">1250</text>
  <text x="260" y="58" font-family="system-ui, sans-serif" font-size="10" fill="#888" letter-spacing="1">SCORE</text>
  
  <!-- Marks -->
  <text x="420" y="45" font-family="SF Mono, monospace" font-size="22" font-weight="700" fill="#00d26a">3/5</text>
  <text x="420" y="58" font-family="system-ui, sans-serif" font-size="10" fill="#888" letter-spacing="1">MARKS</text>
  
  <!-- Level -->
  <text x="580" y="45" font-family="SF Mono, monospace" font-size="22" font-weight="700" fill="#e94560">3</text>
  <text x="580" y="58" font-family="system-ui, sans-serif" font-size="10" fill="#888" letter-spacing="1">LEVEL</text>
  
  <!-- Title overlay -->
  <text x="400" y="430" text-anchor="middle" font-family="system-ui, sans-serif" 
        font-size="24" font-weight="800" fill="url(#titleGrad)">🏈 HALFTIME HUSTLE</text>
</svg>
