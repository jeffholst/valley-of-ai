<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a6b1a"/>
      <stop offset="100%" style="stop-color:#1a5c1a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="wetSpot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgba(100, 149, 237, 0.7)"/>
      <stop offset="50%" style="stop-color:rgba(100, 149, 237, 0.5)"/>
      <stop offset="100%" style="stop-color:rgba(100, 149, 237, 0.2)"/>
    </radialGradient>
  </defs>
  
  <!-- Grass background -->
  <rect width="800" height="450" fill="url(#grassGrad)"/>
  
  <!-- Grass motion stripes - left side -->
  <g fill="#1a7a1a" opacity="0.8">
    <rect x="0" y="20" width="180" height="15"/>
    <rect x="0" y="80" width="180" height="15"/>
    <rect x="0" y="140" width="180" height="15"/>
    <rect x="0" y="200" width="180" height="15"/>
    <rect x="0" y="260" width="180" height="15"/>
    <rect x="0" y="320" width="180" height="15"/>
    <rect x="0" y="380" width="180" height="15"/>
  </g>
  
  <!-- Grass motion stripes - right side -->
  <g fill="#1a7a1a" opacity="0.8">
    <rect x="620" y="40" width="180" height="15"/>
    <rect x="620" y="100" width="180" height="15"/>
    <rect x="620" y="160" width="180" height="15"/>
    <rect x="620" y="220" width="180" height="15"/>
    <rect x="620" y="280" width="180" height="15"/>
    <rect x="620" y="340" width="180" height="15"/>
    <rect x="620" y="400" width="180" height="15"/>
  </g>
  
  <!-- Road -->
  <rect x="200" y="0" width="400" height="450" fill="#2d2d2d"/>
  
  <!-- Road edge lines - white -->
  <rect x="200" y="0" width="4" height="450" fill="#ffffff"/>
  <rect x="596" y="0" width="4" height="450" fill="#ffffff"/>
  
  <!-- Lane dividers - yellow dashed -->
  <g fill="#ffcc00">
    <!-- Lane 1-2 divider -->
    <rect x="298" y="10" width="4" height="30"/>
    <rect x="298" y="70" width="4" height="30"/>
    <rect x="298" y="130" width="4" height="30"/>
    <rect x="298" y="190" width="4" height="30"/>
    <rect x="298" y="250" width="4" height="30"/>
    <rect x="298" y="310" width="4" height="30"/>
    <rect x="298" y="370" width="4" height="30"/>
    <rect x="298" y="430" width="4" height="20"/>
    
    <!-- Lane 2-3 divider -->
    <rect x="398" y="30" width="4" height="30"/>
    <rect x="398" y="90" width="4" height="30"/>
    <rect x="398" y="150" width="4" height="30"/>
    <rect x="398" y="210" width="4" height="30"/>
    <rect x="398" y="270" width="4" height="30"/>
    <rect x="398" y="330" width="4" height="30"/>
    <rect x="398" y="390" width="4" height="30"/>
    
    <!-- Lane 3-4 divider -->
    <rect x="498" y="10" width="4" height="30"/>
    <rect x="498" y="70" width="4" height="30"/>
    <rect x="498" y="130" width="4" height="30"/>
    <rect x="498" y="190" width="4" height="30"/>
    <rect x="498" y="250" width="4" height="30"/>
    <rect x="498" y="310" width="4" height="30"/>
    <rect x="498" y="370" width="4" height="30"/>
    <rect x="498" y="430" width="4" height="20"/>
  </g>
  
  <!-- Wet spot -->
  <ellipse cx="450" cy="200" rx="45" ry="35" fill="url(#wetSpot)"/>
  <ellipse cx="440" cy="190" rx="15" ry="8" fill="rgba(255,255,255,0.3)"/>
  
  <!-- Enemy car 1 - Blue, lane 1 -->
  <g transform="translate(250, 100)">
    <rect x="-25" y="-45" width="50" height="90" rx="8" fill="#3399ff"/>
    <rect x="-18" y="-10" width="36" height="30" rx="5" fill="#2277dd"/>
    <rect x="-15" y="-35" width="30" height="18" rx="3" fill="rgba(100, 200, 255, 0.8)"/>
    <rect x="-12" y="12" width="24" height="12" rx="3" fill="rgba(100, 200, 255, 0.6)"/>
    <circle cx="-17" cy="38" r="4" fill="#ff3333"/>
    <circle cx="17" cy="38" r="4" fill="#ff3333"/>
    <rect x="-29" y="-25" width="6" height="22" fill="#222"/>
    <rect x="23" y="-25" width="6" height="22" fill="#222"/>
    <rect x="-29" y="10" width="6" height="22" fill="#222"/>
    <rect x="23" y="10" width="6" height="22" fill="#222"/>
  </g>
  
  <!-- Enemy car 2 - Green, lane 3 -->
  <g transform="translate(450, 60)">
    <rect x="-25" y="-45" width="50" height="90" rx="8" fill="#33ff33"/>
    <rect x="-18" y="-10" width="36" height="30" rx="5" fill="#22cc22"/>
    <rect x="-15" y="-35" width="30" height="18" rx="3" fill="rgba(100, 200, 255, 0.8)"/>
    <rect x="-12" y="12" width="24" height="12" rx="3" fill="rgba(100, 200, 255, 0.6)"/>
    <circle cx="-17" cy="38" r="4" fill="#ff3333"/>
    <circle cx="17" cy="38" r="4" fill="#ff3333"/>
    <rect x="-29" y="-25" width="6" height="22" fill="#222"/>
    <rect x="23" y="-25" width="6" height="22" fill="#222"/>
    <rect x="-29" y="10" width="6" height="22" fill="#222"/>
    <rect x="23" y="10" width="6" height="22" fill="#222"/>
  </g>
  
  <!-- Enemy car 3 - Yellow, lane 4 (ahead) -->
  <g transform="translate(550, 180)">
    <rect x="-22" y="-40" width="44" height="80" rx="7" fill="#ffff33"/>
    <rect x="-16" y="-8" width="32" height="26" rx="4" fill="#cccc22"/>
    <rect x="-13" y="-30" width="26" height="16" rx="3" fill="rgba(100, 200, 255, 0.8)"/>
    <rect x="-10" y="10" width="20" height="10" rx="2" fill="rgba(100, 200, 255, 0.6)"/>
    <circle cx="-14" cy="34" r="3" fill="#ff3333"/>
    <circle cx="14" cy="34" r="3" fill="#ff3333"/>
    <rect x="-26" y="-22" width="5" height="19" fill="#222"/>
    <rect x="21" y="-22" width="5" height="19" fill="#222"/>
    <rect x="-26" y="8" width="5" height="19" fill="#222"/>
    <rect x="21" y="8" width="5" height="19" fill="#222"/>
  </g>
  
  <!-- Player car - Red, lane 2, with headlights -->
  <g transform="translate(350, 340)" filter="url(#glow)">
    <rect x="-28" y="-50" width="56" height="100" rx="9" fill="#ff3333"/>
    <rect x="-20" y="-12" width="40" height="34" rx="6" fill="#cc2222"/>
    <rect x="-17" y="-40" width="34" height="20" rx="4" fill="rgba(100, 200, 255, 0.8)"/>
    <rect x="-14" y="14" width="28" height="14" rx="4" fill="rgba(100, 200, 255, 0.6)"/>
    <!-- Headlights -->
    <circle cx="-17" cy="-45" r="5" fill="#ffff99"/>
    <circle cx="17" cy="-45" r="5" fill="#ffff99"/>
    <!-- Taillights -->
    <circle cx="-19" cy="44" r="4" fill="#ff3333"/>
    <circle cx="19" cy="44" r="4" fill="#ff3333"/>
    <!-- Wheels -->
    <rect x="-32" y="-28" width="6" height="24" fill="#222"/>
    <rect x="26" y="-28" width="6" height="24" fill="#222"/>
    <rect x="-32" y="12" width="6" height="24" fill="#222"/>
    <rect x="26" y="12" width="6" height="24" fill="#222"/>
  </g>
  
  <!-- HUD elements -->
  <g>
    <!-- Score box -->
    <rect x="150" y="15" width="100" height="50" rx="8" fill="rgba(0,0,0,0.6)"/>
    <text x="200" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#88889a" letter-spacing="2">SCORE</text>
    <text x="200" y="55" text-anchor="middle" font-family="'Courier New', monospace" font-size="20" font-weight="700" fill="#ffcc00">2,450</text>
    
    <!-- Speed box -->
    <rect x="350" y="15" width="100" height="50" rx="8" fill="rgba(0,0,0,0.6)"/>
    <text x="400" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#88889a" letter-spacing="2">SPEED</text>
    <text x="400" y="55" text-anchor="middle" font-family="'Courier New', monospace" font-size="20" font-weight="700" fill="#ff3333">96</text>
    
    <!-- Distance box -->
    <rect x="550" y="15" width="100" height="50" rx="8" fill="rgba(0,0,0,0.6)"/>
    <text x="600" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#88889a" letter-spacing="2">DISTANCE</text>
    <text x="600" y="55" text-anchor="middle" font-family="'Courier New', monospace" font-size="20" font-weight="700" fill="#3399ff">847m</text>
  </g>
  
  <!-- Water droplet warning icon near wet spot -->
  <text x="480" y="175" font-size="22" opacity="0.8">💧</text>
</svg>
