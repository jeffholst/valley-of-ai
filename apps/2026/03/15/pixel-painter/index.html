<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Painter - __MAIN_SITE_NAME__</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=__GA_MEASUREMENT_ID__"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', '__GA_MEASUREMENT_ID__');
    </script>

    <meta name="voa-main-site-url" content="__MAIN_SITE_URL__">
    <meta name="voa-main-site-name" content="__MAIN_SITE_NAME__">
    <meta name="voa-social-x-url" content="__SOCIAL_X_URL__">
    <meta name="voa-social-facebook-url" content="__SOCIAL_FACEBOOK_URL__">
    <meta name="voa-social-instagram-url" content="__SOCIAL_INSTAGRAM_URL__">
    <script src="/apps/shared/app-shell.js" defer></script>
    <style>
      :root { --bg:#0f172a; --text:#f9fafb; --surface:#1e293b; }
      [data-theme='light'] { --bg:#ffffff; --text:#1f2937; --surface:#f3f4f6; }
      body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
      main{max-width:900px;margin:0 auto;padding:1rem}
      canvas{width:100%;max-width:640px;image-rendering:pixelated;background:#fff;border:1px solid #334155}
      .row{display:flex;gap:.5rem;flex-wrap:wrap;margin:.7rem 0}
      button,input{font:inherit;padding:.45rem .6rem;border-radius:8px;border:1px solid #475569;background:var(--surface);color:var(--text)}
    </style>
  </head>
  <body>
    <main>
      <h1>Pixel Painter</h1>
      <div class="row"><input type="color" id="color" value="#22d3ee"><button id="clear">Clear</button></div>
      <canvas id="c" width="320" height="240"></canvas>
    </main>
    <script>
      const c=document.getElementById('c'),ctx=c.getContext('2d');
      const color=document.getElementById('color');
      let down=false;
      const draw=(e)=>{if(!down)return;const r=c.getBoundingClientRect();const x=Math.floor((e.clientX-r.left)/r.width*c.width);const y=Math.floor((e.clientY-r.top)/r.height*c.height);ctx.fillStyle=color.value;ctx.fillRect(x,y,2,2)};
      c.addEventListener('pointerdown',e=>{down=true;draw(e)});c.addEventListener('pointermove',draw);window.addEventListener('pointerup',()=>down=false);
      document.getElementById('clear').onclick=()=>ctx.clearRect(0,0,c.width,c.height);
    </script>
  </body>
</html>
