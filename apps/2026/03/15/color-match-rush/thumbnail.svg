<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="400" y="80" font-size="56" font-weight="900" text-anchor="middle" fill="#ef4444" letter-spacing="2">🎨 Color Match</text>
  
  <!-- Color Grid (2x2) -->
  <g transform="translate(250, 150)">
    <!-- Red -->
    <rect x="0" y="0" width="120" height="120" rx="12" fill="#ef4444" opacity="0.9"/>
    <text x="60" y="70" font-size="48" text-anchor="middle" dominant-baseline="middle">🔴</text>
    
    <!-- Green -->
    <rect x="140" y="0" width="120" height="120" rx="12" fill="#22c55e" opacity="0.9"/>
    <text x="200" y="70" font-size="48" text-anchor="middle" dominant-baseline="middle">🟢</text>
    
    <!-- Blue -->
    <rect x="0" y="140" width="120" height="120" rx="12" fill="#3b82f6" opacity="0.9"/>
    <text x="60" y="210" font-size="48" text-anchor="middle" dominant-baseline="middle">🔵</text>
    
    <!-- Yellow -->
    <rect x="140" y="140" width="120" height="120" rx="12" fill="#eab308" opacity="0.9"/>
    <text x="200" y="210" font-size="48" text-anchor="middle" dominant-baseline="middle">🟡</text>
  </g>
  
  <!-- Glow effect on one box -->
  <circle cx="370" cy="220" r="75" fill="none" stroke="#ef4444" stroke-width="3" opacity="0.6"/>
  <circle cx="370" cy="220" r="75" fill="none" stroke="#ef4444" stroke-width="1" opacity="0.3" r="85"/>
  
  <!-- Score badge -->
  <rect x="50" y="320" width="200" height="80" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <text x="60" y="340" font-size="14" fill="rgba(255,255,255,0.6)">Score</text>
  <text x="60" y="370" font-size="40" font-weight="bold" fill="#ef4444">2,450</text>
  
  <!-- Combo badge -->
  <rect x="550" y="320" width="200" height="80" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <text x="560" y="340" font-size="14" fill="rgba(255,255,255,0.6)">Combo</text>
  <text x="560" y="370" font-size="40" font-weight="bold" fill="#22c55e">12×</text>
</svg>
