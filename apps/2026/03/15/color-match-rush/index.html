<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Match Rush - __MAIN_SITE_NAME__</title>

    <meta name="voa-main-site-name" content="__MAIN_SITE_NAME__">

    <meta name="voa-social-facebook-url" content="__SOCIAL_FACEBOOK_URL__">
    <meta name="voa-social-instagram-url" content="__SOCIAL_INSTAGRAM_URL__">

    <script async src="https://www.googletagmanager.com/gtag/js?id=__GA_MEASUREMENT_ID__"></script>
    <script>
        window.dataLayer = window.dataLayer || [];

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0f172a;
            --text: #f9fafb;
            --surface: #1e293b;
            --primary: #ef4444;
            --secondary: #22c55e;
            --accent: #3b82f6;
            --warning: #f59e0b;
        }

        [data-theme="light"] {
            --bg: #ffffff;
            --text: #1f2937;
            --surface: #f3f4f6;
            --primary: #dc2626;
            --secondary: #16a34a;
            --accent: #2563eb;
            --warning: #d97706;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg), var(--surface));
            color: var(--text);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        .game-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            z-index: 10;
        }

        .header h1 {
            font-size: clamp(24px, 6vw, 48px);
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .stats {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .stat {
            background: rgba(255, 255, 255, 0.08);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .stat-value {
            font-weight: bold;
            color: var(--primary);
            font-size: 18px;
        }

        .game-area {
            flex: 0 1 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 600px;
            margin: 20px 0;
            max-height: 50vh;
        }

        .color-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            width: 100%;
            aspect-ratio: 1;
            max-width: 360px;
        }

        .color-box {
            background: var(--surface);
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .color-box.target {
            animation: pulse-target 0.6s ease-out;
            box-shadow: 0 0 30px currentColor;
            border-color: currentColor;
        }

        .color-box.hit {
            animation: flash-hit 0.4s ease-out;
        }

        @keyframes pulse-target {
            0% { transform: scale(0.9); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes flash-hit {
            0% { transform: scale(1.1); filter: brightness(1.5); }
            50% { transform: scale(1); }
            100% { transform: scale(0.95); filter: brightness(1); }
        }

        .feedback {
            position: fixed;
            font-size: 32px;
            font-weight: bold;
            pointer-events: none;
            animation: float-up 0.6s ease-out forwards;
            z-index: 50;
        }

        @keyframes float-up {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-60px) scale(0.6); opacity: 0; }
        }

        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 20px 0;
            width: 100%;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(239, 68, 68, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: rgba(34, 197, 94, 0.2);
            color: var(--secondary);
            border: 2px solid var(--secondary);
            box-shadow: none;
        }

        .game-over-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
        }

        .game-over-modal.is-open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--surface);
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            border: 2px solid var(--accent);
            max-width: 90%;
            animation: slide-up 0.4s ease-out;
        }

        @keyframes slide-up {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-content h2 {
            font-size: 32px;
            margin-bottom: 24px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .modal-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .modal-stat {
            background: rgba(255, 255, 255, 0.05);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-stat-label {
            font-size: 12px;
            text-transform: uppercase;
            opacity: 0.7;
            margin-bottom: 4px;
        }

        .modal-stat-value {
            font-size: 28px;
            font-weight: bold;
            color: var(--primary);
        }

        @media (max-width: 600px) {
            .game-container {
                padding: 12px;
            }

            .header h1 {
                font-size: 28px;
                margin-bottom: 6px;
            }

            .stat {
                font-size: 11px;
                padding: 4px 8px;
            }

            .stats {
                gap: 8px;
            }

            .color-grid {
                gap: 12px;
                max-width: 280px;
            }

            .controls {
                flex-direction: column;
                gap: 8px;
            }

            button {
                width: 100%;
                padding: 12px 16px;
                font-size: 14px;
            }

            .modal-content {
                padding: 24px;
            }

            .modal-content h2 {
                font-size: 24px;
                margin-bottom: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>🎨 Color Match Rush</h1>
            <div class="stats">
                <div class="stat">Score: <span class="stat-value" id="scoreDisplay">0</span></div>
                <div class="stat">Combo: <span class="stat-value" id="comboDisplay">0</span></div>
                <div class="stat">Time: <span class="stat-value" id="timeDisplay">30s</span></div>
            </div>
        </div>

        <div class="game-area">
            <div class="color-grid" id="colorGrid"></div>
        </div>

        <div class="controls">
            <button id="playBtn">Play Game</button>
            <button id="restartBtn" class="btn-secondary" style="display:none;">Restart</button>
        </div>
    </div>

    <div class="game-over-modal" id="gameOverModal">
        <div class="modal-content">
            <h2>Game Over!</h2>
            <div class="modal-stats">
                <div class="modal-stat">
                    <div class="modal-stat-label">Final Score</div>
                    <div class="modal-stat-value" id="finalScore">0</div>
                </div>
                <div class="modal-stat">
                    <div class="modal-stat-label">Max Combo</div>
                    <div class="modal-stat-value" id="maxCombo">0</div>
                </div>
                <div class="modal-stat">
                    <div class="modal-stat-label">Taps</div>
                    <div class="modal-stat-value" id="totalTaps">0</div>
                </div>
                <div class="modal-stat">
                    <div class="modal-stat-label">Accuracy</div>
                    <div class="modal-stat-value" id="accuracy">0%</div>
                </div>
            </div>
            <button id="playAgainBtn" style="margin-top:20px;">Play Again</button>
        </div>
    </div>

    <script src="/apps/shared/app-shell.js" defer></script>
    <script>
        // Game State
        const gameState = {
            isPlaying: false,
            score: 0,
            combo: 0,
            maxCombo: 0,
            totalTaps: 0,
            hits: 0,
            misses: 0,
            timeElapsed: 0,
            maxDuration: 30000,
            sequence: [],
            currentIndex: 0,
        };

        const COLORS = [
            { name: 'red', hex: '#ef4444' },
            { name: 'green', hex: '#22c55e' },
            { name: 'blue', hex: '#3b82f6' },
            { name: 'yellow', hex: '#eab308' },
        ];

        const SCORES = { perfect: 100, great: 70, good: 40 };
        const MISS_PENALTY = 50;

        let gameStartTime = 0;
        let gameLoopFrame = null;
        let lastTapTime = 0;

        const DOM = {
            playBtn: document.getElementById('playBtn'),
            restartBtn: document.getElementById('restartBtn'),
            colorGrid: document.getElementById('colorGrid'),
            scoreDisplay: document.getElementById('scoreDisplay'),
            comboDisplay: document.getElementById('comboDisplay'),
            timeDisplay: document.getElementById('timeDisplay'),
            gameOverModal: document.getElementById('gameOverModal'),
            finalScore: document.getElementById('finalScore'),
            maxCombo: document.getElementById('maxCombo'),
            totalTaps: document.getElementById('totalTaps'),
            accuracy: document.getElementById('accuracy'),
            playAgainBtn: document.getElementById('playAgainBtn'),
        };

        function initGrid() {
            DOM.colorGrid.innerHTML = '';
            COLORS.forEach((color, idx) => {
                const box = document.createElement('div');
                box.className = 'color-box';
                box.id = `color-${idx}`;
                box.style.color = color.hex;
                box.textContent = ['🔴', '🟢', '🔵', '🟡'][idx];
                box.addEventListener('pointerdown', (e) => onColorTap(e, idx));
                DOM.colorGrid.appendChild(box);
            });
        }

        function generateSequence() {
            gameState.sequence = [];
            let nextTime = 600;
            const intervals = [500, 450, 400, 350]; // Progressively faster
            let level = 0;

            while (nextTime < gameState.maxDuration + 200) {
                const colorIdx = Math.floor(Math.random() * 4);
                gameState.sequence.push({
                    time: nextTime,
                    colorIdx,
                    state: 'pending', // pending -> active -> hit/missed
                    shownAt: 0,
                });

                // Increase speed over time
                const progress = nextTime / gameState.maxDuration;
                level = Math.floor(progress * intervals.length);
                const interval = intervals[Math.min(level, intervals.length - 1)];
                nextTime += interval + (Math.random() - 0.5) * 40; // ±20ms jitter
            }
        }

        function startGame() {
            gameState.isPlaying = true;
            gameState.score = 0;
            gameState.combo = 0;
            gameState.maxCombo = 0;
            gameState.totalTaps = 0;
            gameState.hits = 0;
            gameState.misses = 0;
            gameState.currentIndex = 0;
            gameState.timeElapsed = 0;
            lastTapTime = 0;

            generateSequence();
            updateUI();
            DOM.playBtn.style.display = 'none';
            DOM.restartBtn.style.display = 'inline-block';
            DOM.gameOverModal.classList.remove('is-open');

            gameStartTime = performance.now();
            gameLoop();
        }

        function gameLoop() {
            if (!gameState.isPlaying) return;

            gameState.timeElapsed = performance.now() - gameStartTime;

            if (gameState.timeElapsed >= gameState.maxDuration) {
                endGame();
                return;
            }

            processSequence();
            updateUI();
            gameLoopFrame = requestAnimationFrame(gameLoop);
        }

        function processSequence() {
            const seq = gameState.sequence;
            
            // Skip completed colors
            while (gameState.currentIndex < seq.length) {
                if (seq[gameState.currentIndex].state === 'pending' || seq[gameState.currentIndex].state === 'active') {
                    break;
                }
                gameState.currentIndex++;
            }

            if (gameState.currentIndex >= seq.length) return;

            const color = seq[gameState.currentIndex];

            if (color.state === 'pending' && gameState.timeElapsed >= color.time) {
                activateColor(gameState.currentIndex);
            } else if (color.state === 'active') {
                // Miss if window passed
                const timeSinceActive = gameState.timeElapsed - color.shownAt;
                if (timeSinceActive > 600) {
                    missColor(gameState.currentIndex);
                }
            }
        }

        function activateColor(idx) {
            const color = gameState.sequence[idx];
            color.state = 'active';
            color.shownAt = gameState.timeElapsed;

            const box = document.getElementById(`color-${color.colorIdx}`);
            if (box) {
                box.classList.add('target');
            }
        }

        function onColorTap(e, colorIdx) {
            if (!gameState.isPlaying) return;
            e.preventDefault();

            const now = performance.now();
            if (now - lastTapTime < 50) return;
            lastTapTime = now;

            gameState.totalTaps++;

            const seq = gameState.sequence;
            const idx = gameState.currentIndex;
            if (idx >= seq.length) return;

            const color = seq[idx];
            if (color.state !== 'active' || color.colorIdx !== colorIdx) {
                // Wrong color or timing
                gameState.combo = 0;
                gameState.misses++;
                gameState.score = Math.max(0, gameState.score - 30);
                showFeedback('❌', color.colorIdx);
                return;
            }

            // Correct color!
            color.state = 'hit';
            const timeSinceActive = gameState.timeElapsed - color.shownAt;
            const box = document.getElementById(`color-${colorIdx}`);
            if (box) {
                box.classList.remove('target');
                box.classList.add('hit');
                setTimeout(() => box.classList.remove('hit'), 300);
            }

            gameState.hits++;
            gameState.combo++;
            if (gameState.combo > gameState.maxCombo) gameState.maxCombo = gameState.combo;

            let points = SCORES.good;
            let feedback = '✓';
            if (timeSinceActive < 150) {
                points = SCORES.perfect;
                feedback = '🎯';
            } else if (timeSinceActive < 350) {
                points = SCORES.great;
                feedback = '⭐';
            }

            gameState.score += points * (1 + Math.floor(gameState.combo / 5));
            showFeedback(feedback, colorIdx);
            updateUI();
        }

        function missColor(idx) {
            const color = gameState.sequence[idx];
            color.state = 'missed';

            gameState.misses++;
            gameState.combo = 0;
            gameState.score = Math.max(0, gameState.score - MISS_PENALTY);

            const box = document.getElementById(`color-${color.colorIdx}`);
            if (box) box.classList.remove('target');
            
            updateUI();
        }

        function showFeedback(text, colorIdx) {
            const feedback = document.createElement('div');
            feedback.className = 'feedback';
            feedback.textContent = text;
            
            const box = document.getElementById(`color-${colorIdx}`);
            if (box) {
                const rect = box.getBoundingClientRect();
                feedback.style.left = (rect.left + rect.width / 2) + 'px';
                feedback.style.top = (rect.top + rect.height / 2) + 'px';
                feedback.style.transform = 'translate(-50%, -50%)';
            }
            
            document.body.appendChild(feedback);
            setTimeout(() => feedback.remove(), 600);
        }

        function updateUI() {
            DOM.scoreDisplay.textContent = gameState.score;
            DOM.comboDisplay.textContent = gameState.combo;
            const secsLeft = Math.ceil((gameState.maxDuration - gameState.timeElapsed) / 1000);
            DOM.timeDisplay.textContent = Math.max(0, secsLeft) + 's';
        }

        function endGame() {
            gameState.isPlaying = false;
            cancelAnimationFrame(gameLoopFrame);

            const accuracy = gameState.totalTaps > 0 ? Math.round((gameState.hits / gameState.totalTaps) * 100) : 0;
            DOM.finalScore.textContent = gameState.score;
            DOM.maxCombo.textContent = gameState.maxCombo;
            DOM.totalTaps.textContent = gameState.totalTaps;
            DOM.accuracy.textContent = accuracy + '%';

            DOM.gameOverModal.classList.add('is-open');
            DOM.playBtn.style.display = 'inline-block';
            DOM.restartBtn.style.display = 'none';
        }

        function restartGame() {
            DOM.gameOverModal.classList.remove('is-open');
            startGame();
        }

        initGrid();
        DOM.playBtn.addEventListener('click', startGame);
        DOM.restartBtn.addEventListener('click', restartGame);
        DOM.playAgainBtn.addEventListener('click', restartGame);

        console.log('Color Match Rush loaded');
    </script>
</body>
