<!doctype html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=__GA_MEASUREMENT_ID__"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '__GA_MEASUREMENT_ID__');

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hydration Nudge Tracker - __MAIN_SITE_NAME__</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='0.9em' font-size='52'%3E%F0%9F%92%A7%3C/text%3E%3C/svg%3E">
  <meta name="voa-main-site-url" content="__MAIN_SITE_URL__">
  <meta name="voa-main-site-name" content="__MAIN_SITE_NAME__">
  <meta name="voa-social-x-url" content="__SOCIAL_X_URL__">
  <meta name="voa-social-facebook-url" content="__SOCIAL_FACEBOOK_URL__">
  <meta name="voa-social-instagram-url" content="__SOCIAL_INSTAGRAM_URL__">
  <meta name="voa-app-id" content="2026/03/15/hydration-nudge-tracker" />
  <script src="/apps/shared/app-shell.js" defer></script>
  <style>
    :root{--bg:#0f172a;--text:#f9fafb;--surface:#1e293b;--muted:#94a3b8;--accent:#22d3ee;--accent2:#38bdf8;--ok:#34d399;--ring:#0ea5e9;--shadow:rgba(0,0,0,.35)}
    [data-theme="light"]{--bg:#ffffff;--text:#1f2937;--surface:#f3f4f6;--muted:#64748b;--accent:#0891b2;--accent2:#0ea5e9;--ok:#059669;--ring:#0284c7;--shadow:rgba(31,47,82,.12)}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:radial-gradient(1000px 700px at 20% 0%,color-mix(in oklab,var(--accent) 16%,var(--bg)),var(--bg));color:var(--text);min-height:100vh;padding:14px}
    .app{width:min(900px,100%);margin:0 auto;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid color-mix(in oklab,var(--muted) 28%,transparent);border-radius:20px;padding:16px;box-shadow:0 20px 50px var(--shadow)}
    h1{margin:0 0 6px;font-size:clamp(1.35rem,2.8vw,1.9rem)}
    .sub{margin:0 0 14px;color:var(--muted)}
    .layout{display:grid;gap:14px;grid-template-columns:1.1fr .9fr}
    .card{background:color-mix(in srgb,var(--surface) 85%,transparent);border:1px solid color-mix(in srgb,var(--muted) 20%,transparent);border-radius:14px;padding:12px}
    .ring{aspect-ratio:1;display:grid;place-items:center;max-width:260px;margin:auto;border-radius:50%;background:conic-gradient(var(--ring) calc(var(--pct)*1%),color-mix(in srgb,var(--surface) 60%,#0000) 0)}
    .ring-inner{width:78%;height:78%;border-radius:50%;display:grid;place-items:center;background:var(--bg)}
    .amount{font-size:1.7rem;font-weight:800}.tiny{font-size:.88rem;color:var(--muted)}
    .quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
    button,input,select{font:inherit}
    .btn{min-height:44px;border:none;border-radius:12px;padding:10px 8px;font-weight:700;color:white;background:linear-gradient(135deg,var(--accent2),var(--accent));cursor:pointer;touch-action:manipulation}
    .btn.secondary{background:color-mix(in srgb,var(--surface) 75%,var(--muted));color:var(--text)}
    .row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:8px 0}
    input[type="number"],select{width:110px;padding:8px;border-radius:10px;border:1px solid color-mix(in srgb,var(--muted) 40%,transparent);background:transparent;color:var(--text)}
    .nudge{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .status{margin-top:8px;font-weight:600;color:var(--ok)}
    .history{display:grid;gap:8px;max-height:200px;overflow:auto}
    .pill{font-size:.85rem;padding:6px 10px;border-radius:999px;border:1px solid color-mix(in srgb,var(--muted) 25%,transparent);display:inline-block}
    .confetti-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden;z-index:9999}
    .confetti{position:absolute;width:10px;height:10px;background:#22d3ee;border-radius:50%}
    @keyframes fall{
      0%{transform:translateY(-10px) rotate(0deg);opacity:1}
      100%{transform:translateY(100vh) rotate(720deg);opacity:0}
    }
    @keyframes sway{
      0%,100%{transform:translateX(0)}
      50%{transform:translateX(50px)}
    }
    @media (max-width:760px){.layout{grid-template-columns:1fr}.quick{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <div class="confetti-container" id="confettiContainer"></div>
  <main class="app">
    <h1>💧 Hydration Nudge Tracker</h1>
    <p class="sub">Track water intake, keep a streak, and get gentle reminders during your active hours.</p>
    <section class="layout">
      <article class="card">
        <div class="ring" id="ring" style="--pct:0">
          <div class="ring-inner">
            <div style="text-align:center">
              <div class="amount" id="total">0 mL</div>
              <div class="tiny" id="goalText">of 2000 mL goal</div>
            </div>
          </div>
        </div>
        <div class="quick" id="quickButtons"></div>
        <div class="row"><span>Unit</span><select id="unit" aria-label="Unit selection"><option value="oz" selected>oz</option><option value="ml">mL</option></select></div>
        <div class="row"><span id="goalLabel">Daily goal (mL)</span><input id="goal" type="number" min="250" step="1" value="2000" aria-label="Daily goal"></div>
        <div class="row"><span>Wake hour</span><input id="wake" type="number" min="0" max="23" value="8" aria-label="Wake hour"></div>
        <div class="row"><span>Sleep hour</span><input id="sleep" type="number" min="0" max="23" value="22" aria-label="Sleep hour"></div>
        <div class="nudge">
          <button id="nudgeToggle" class="btn secondary">Start nudges</button>
          <span class="tiny" id="nudgeText">Nudges off</span>
        </div>
        <div class="status" id="status">Let's build your streak.</div>
      </article>
      <article class="card">
        <h2 style="margin-top:0">Today</h2>
        <div class="row"><span class="pill" id="progressPill">0% complete</span><span class="pill" id="streak">Streak: 0 days</span></div>
        <div class="row"><button id="undo" class="btn secondary">Undo last</button><button id="reset" class="btn secondary">Reset today</button></div>
        <h3>Intake log</h3>
        <div class="history" id="history" aria-live="polite"></div>
      </article>
    </section>
  </main>
<script>
const $=s=>document.querySelector(s);
const ring=$('#ring'), totalEl=$('#total'), goalText=$('#goalText'), progressPill=$('#progressPill'), streakEl=$('#streak'), historyEl=$('#history'), statusEl=$('#status');
const goalInput=$('#goal'), wakeInput=$('#wake'), sleepInput=$('#sleep'), nudgeToggle=$('#nudgeToggle'), nudgeText=$('#nudgeText'), unitSelect=$('#unit'), goalLabel=$('#goalLabel'), quickButtons=$('#quickButtons');
const key='voa-hydration-nudge-tracker';
const OZ_TO_ML=29.5735;
const PRESETS={ml:[150,250,350,500],oz:[8,12,16,20]};
let nudgeTimer=null,nudgesOn=false;
const today=()=>new Date().toISOString().slice(0,10);

function load(){try{return JSON.parse(localStorage.getItem(key))||{};}catch{return {};}}
function save(data){localStorage.setItem(key,JSON.stringify(data));}
function normalize(st){
  if(st.goalMl==null) st.goalMl=Number(st.goal)||2000; // migrate older state
  st.unit=st.unit==='ml'?'ml':'oz';
  st.entries=Array.isArray(st.entries)?st.entries.map(e=>({ml:Math.max(1,Number(e.ml)||0),ts:e.ts||Date.now()})):[];
  st.goalMl=Math.max(250,Number(st.goalMl)||2000);
  st.wake=Math.min(23,Math.max(0,Number(st.wake)||8));
  st.sleep=Math.min(23,Math.max(0,Number(st.sleep)||22));
  st.streak=Number(st.streak)||0;
  return st;
}
function getState(){
  const all=load();
  if(!all[today()]) all[today()]={goalMl:1893,wake:8,sleep:22,entries:[],streak:0,lastHit:null,unit:'oz'};
  all[today()]=normalize(all[today()]);
  save(all);
  return all[today()];
}
function setState(st){const all=load(); all[today()]=normalize(st); save(all);}
function toDisplay(ml,unit){return unit==='oz'?ml/OZ_TO_ML:ml;}
function toMl(v,unit){return unit==='oz'?v*OZ_TO_ML:v;}
function fmt(value,unit){const n=unit==='oz'?value.toFixed(1).replace(/\.0$/,''):Math.round(value).toString(); return `${n} ${unit==='oz'?'oz':'mL'}`;}

function renderQuickButtons(unit){
  quickButtons.innerHTML=PRESETS[unit].map(v=>`<button class="btn" data-add="${v}">+${fmt(v,unit)}</button>`).join('');
  quickButtons.querySelectorAll('[data-add]').forEach(btn=>btn.addEventListener('click',()=>add(toMl(Number(btn.dataset.add),unit))));
}

function calc(){
  const st=getState();
  const totalMl=st.entries.reduce((a,e)=>a+e.ml,0);
  const pct=Math.min(100,Math.round((totalMl/st.goalMl)*100));
  ring.style.setProperty('--pct',pct);
  totalEl.textContent=fmt(toDisplay(totalMl,st.unit),st.unit);
  goalText.textContent=`of ${fmt(toDisplay(st.goalMl,st.unit),st.unit)} goal`;
  progressPill.textContent=`${pct}% complete`;
  streakEl.textContent=`Streak: ${st.streak||0} days`;
  unitSelect.value=st.unit;
  goalLabel.textContent=`Daily goal (${st.unit==='oz'?'oz':'mL'})`;
  goalInput.value=st.unit==='oz'?toDisplay(st.goalMl,st.unit).toFixed(1):Math.round(st.goalMl);
  goalInput.step=st.unit==='oz'?'0.1':'1';
  goalInput.min=st.unit==='oz'?'8':'250';
  wakeInput.value=st.wake;
  sleepInput.value=st.sleep;
  renderQuickButtons(st.unit);
  historyEl.innerHTML=st.entries.length
    ? st.entries.slice().reverse().map(e=>`<div class="pill">${fmt(toDisplay(e.ml,st.unit),st.unit)} • ${new Date(e.ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div>`).join('')
    : '<div class="tiny">No intake logged yet.</div>';
  const remMl=Math.max(0,st.goalMl-totalMl);
  statusEl.textContent=pct>=100
    ? `Goal reached (${fmt(toDisplay(st.goalMl,st.unit),st.unit)}). Great hydration discipline!`
    : `Keep sipping — ${fmt(toDisplay(remMl,st.unit),st.unit)} to goal.`;
}
function add(ml){const st=getState(); const prevTotal=st.entries.reduce((a,e)=>a+e.ml,0); st.entries.push({ml,ts:Date.now()}); const total=st.entries.reduce((a,e)=>a+e.ml,0); if(total>=st.goalMl && prevTotal<st.goalMl){triggerConfetti();} if(total>=st.goalMl && st.lastHit!==today()){st.streak=(st.streak||0)+1; st.lastHit=today();} setState(st); calc();}
function undo(){const st=getState(); st.entries.pop(); setState(st); calc();}
function resetDay(){const st=getState(); st.entries=[]; st.lastHit=null; setState(st); calc();}
function savePrefs(){const st=getState(); const raw=Number(goalInput.value)||2000; st.goalMl=Math.round(st.unit==='oz'?toMl(raw,'oz'):raw); st.goalMl=Math.max(250,st.goalMl); st.wake=Math.min(23,Math.max(0,Number(wakeInput.value)||8)); st.sleep=Math.min(23,Math.max(0,Number(sleepInput.value)||22)); setState(st); calc();}
function triggerConfetti(){const container=$('#confettiContainer'); const colors=['#22d3ee','#38bdf8','#0ea5e9','#06b6d4','#0891b2','#f59e0b','#34d399']; for(let i=0;i<60;i++){const piece=document.createElement('div'); piece.className='confetti'; piece.style.left=Math.random()*100+'%'; piece.style.top='-12px'; piece.style.backgroundColor=colors[Math.floor(Math.random()*colors.length)]; const size=Math.random()*8+6; piece.style.width=size+'px'; piece.style.height=size+'px'; piece.style.borderRadius=Math.random()>.5?'50%':'3px'; const dur=2+Math.random()*1.5; const delay=Math.random()*400; piece.style.animation=`fall ${dur}s linear ${delay}ms forwards`; container.appendChild(piece); setTimeout(()=>piece.remove(),dur*1000+delay+100);}}
function inActiveHours(){const st=getState(); const h=new Date().getHours(); return st.wake<=st.sleep ? h>=st.wake && h<st.sleep : (h>=st.wake || h<st.sleep);}
function notifyNudge(){
  if(!inActiveHours()) return;
  const st=getState();
  const totalMl=st.entries.reduce((a,e)=>a+e.ml,0);
  const remMl=Math.max(0,st.goalMl-totalMl);
  nudgeText.textContent=remMl>0?`Time for a quick sip 💧 (${fmt(toDisplay(remMl,st.unit),st.unit)} left)`:'You already hit goal today 🎉';
  setTimeout(()=>{if(nudgesOn) nudgeText.textContent='Nudges active';},4000);
}
function onUnitChange(){const st=getState(); st.unit=unitSelect.value; setState(st); calc();}
function toggleNudges(){nudgesOn=!nudgesOn; nudgeToggle.textContent=nudgesOn?'Stop nudges':'Start nudges'; nudgeText.textContent=nudgesOn?'Nudges active':'Nudges off'; if(nudgesOn){notifyNudge(); nudgeTimer=setInterval(notifyNudge,45*60*1000);} else {clearInterval(nudgeTimer);}}

$('#undo').addEventListener('click',undo);
$('#reset').addEventListener('click',resetDay);
goalInput.addEventListener('change',savePrefs);
wakeInput.addEventListener('change',savePrefs);
sleepInput.addEventListener('change',savePrefs);
unitSelect.addEventListener('change',onUnitChange);
nudgeToggle.addEventListener('click',toggleNudges);

calc();
</script>
</body>
</html>
