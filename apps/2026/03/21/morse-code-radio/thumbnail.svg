<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Morse Code Radio thumbnail">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050d1a"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>

    <!-- Accent glow gradient -->
    <radialGradient id="scope-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <!-- Title glow filter -->
    <filter id="title-glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Signal glow filter -->
    <filter id="signal-glow" x="-10%" y="-80%" width="120%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Dot/dash glow filter -->
    <filter id="elem-glow" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Panel gradient -->
    <linearGradient id="panel-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0d1525"/>
    </linearGradient>

    <!-- Key button gradient -->
    <radialGradient id="key-grad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </radialGradient>

    <!-- Oscilloscope bg -->
    <linearGradient id="scope-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050d1a"/>
      <stop offset="100%" stop-color="#07111f"/>
    </linearGradient>

    <!-- Corner edge gradient -->
    <linearGradient id="edge-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-grad)"/>

  <!-- Subtle grid -->
  <g opacity="0.05" stroke="#22d3ee" stroke-width="0.5">
    <line x1="0" y1="56" x2="800" y2="56"/><line x1="0" y1="112" x2="800" y2="112"/>
    <line x1="0" y1="168" x2="800" y2="168"/><line x1="0" y1="224" x2="800" y2="224"/>
    <line x1="0" y1="280" x2="800" y2="280"/><line x1="0" y1="336" x2="800" y2="336"/>
    <line x1="0" y1="392" x2="800" y2="392"/>
    <line x1="80" y1="0" x2="80" y2="450"/><line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="240" y1="0" x2="240" y2="450"/><line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/><line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="560" y1="0" x2="560" y2="450"/><line x1="640" y1="0" x2="640" y2="450"/>
    <line x1="720" y1="0" x2="720" y2="450"/>
  </g>

  <!-- ─── Title block ──────────────────────────────────────── -->
  <text x="400" y="46" font-family="'Courier New', monospace" font-size="10"
    fill="#22d3ee" opacity="0.6" text-anchor="middle" letter-spacing="4">▼ MORSE CODE RADIO</text>

  <text x="400" y="80" font-family="'Courier New', monospace" font-size="34"
    fill="#22d3ee" font-weight="700" text-anchor="middle" letter-spacing="3"
    filter="url(#title-glow)">MORSE CODE RADIO</text>

  <text x="400" y="100" font-family="'Courier New', monospace" font-size="11"
    fill="#64748b" text-anchor="middle" letter-spacing="6">TRANSLATE · TRANSMIT · TRAIN</text>

  <!-- ─── Oscilloscope panel ──────────────────────────────── -->
  <rect x="30" y="118" width="740" height="88" rx="6" fill="url(#panel-grad)"
    stroke="#22d3ee" stroke-width="0.8" stroke-opacity="0.3"/>
  <rect x="30" y="118" width="740" height="88" rx="6" fill="url(#scope-glow)"/>

  <!-- Scope bg -->
  <rect x="38" y="128" width="724" height="68" rx="4" fill="url(#scope-bg)"/>

  <!-- Scope grid lines -->
  <g stroke="#22d3ee" stroke-width="0.4" stroke-opacity="0.08">
    <line x1="38" y1="148" x2="762" y2="148"/>
    <line x1="38" y1="162" x2="762" y2="162"/>
    <line x1="38" y1="176" x2="762" y2="176"/>
    <line x1="218" y1="128" x2="218" y2="196"/>
    <line x1="398" y1="128" x2="398" y2="196"/>
    <line x1="578" y1="128" x2="578" y2="196"/>
  </g>

  <!-- Oscilloscope waveform (active signal - sine wave) -->
  <path d="M38,162 C55,162 60,140 75,140 C90,140 95,184 110,184 C125,184 130,140 145,140 C160,140 165,184 180,184 C195,184 200,140 215,140 C230,140 235,184 250,184 C265,184 270,140 285,140 C300,140 305,184 320,184 C335,184 340,140 355,140 C370,140 375,184 390,184 C405,184 410,140 425,140 C440,140 445,184 460,184 C475,184 480,140 495,140 C510,140 515,184 530,184 C545,184 550,140 565,140 C580,140 585,184 600,184 C615,184 620,140 635,140 C650,140 655,184 670,184 C685,184 690,140 705,140 C720,140 725,184 740,184 C755,184 758,162 762,162"
    fill="none" stroke="#22d3ee" stroke-width="2.2" filter="url(#signal-glow)" stroke-opacity="0.95"/>

  <!-- Scope label -->
  <text x="46" y="143" font-family="'Courier New', monospace" font-size="8"
    fill="#22d3ee" opacity="0.5" letter-spacing="2">■ SIGNAL MONITOR</text>

  <!-- ─── Morse symbols strip ──────────────────────────────── -->
  <rect x="30" y="220" width="740" height="72" rx="6" fill="url(#panel-grad)"
    stroke="#22d3ee" stroke-width="0.8" stroke-opacity="0.3"/>
  <text x="46" y="238" font-family="'Courier New', monospace" font-size="8"
    fill="#22d3ee" opacity="0.5" letter-spacing="2">■ MORSE SIGNAL</text>

  <!-- Letter H .... -->
  <text x="60" y="258" font-family="'Courier New', monospace" font-size="9" fill="#64748b">H</text>
  <circle cx="60" cy="272" r="5" fill="#22d3ee" filter="url(#elem-glow)"/>
  <circle cx="73" cy="272" r="5" fill="#22d3ee" filter="url(#elem-glow)"/>
  <circle cx="86" cy="272" r="5" fill="#22d3ee" filter="url(#elem-glow)"/>
  <circle cx="99" cy="272" r="5" fill="#22d3ee" filter="url(#elem-glow)"/>

  <!-- Letter E . -->
  <text x="117" y="258" font-family="'Courier New', monospace" font-size="9" fill="#64748b">E</text>
  <circle cx="117" cy="272" r="5" fill="#22d3ee" filter="url(#elem-glow)"/>

  <!-- Letter L .-.. -->
  <text x="135" y="258" font-family="'Courier New', monospace" font-size="9" fill="#64748b">L</text>
  <circle cx="135" cy="272" r="5" fill="#22d3ee" filter="url(#elem-glow)"/>
  <rect x="146" y="267" width="22" height="10" rx="5" fill="#0ea5e9" filter="url(#elem-glow)"/>
  <circle cx="175" cy="272" r="5" fill="#22d3ee" filter="url(#elem-glow)"/>
  <circle cx="188" cy="272" r="5" fill="#22d3ee" filter="url(#elem-glow)"/>

  <!-- Letter L .-.. -->
  <text x="206" y="258" font-family="'Courier New', monospace" font-size="9" fill="#64748b">L</text>
  <circle cx="206" cy="272" r="5" fill="#22d3ee" filter="url(#elem-glow)"/>
  <rect x="217" y="267" width="22" height="10" rx="5" fill="#0ea5e9" filter="url(#elem-glow)"/>
  <circle cx="246" cy="272" r="5" fill="#22d3ee" filter="url(#elem-glow)"/>
  <circle cx="259" cy="272" r="5" fill="#22d3ee" filter="url(#elem-glow)"/>

  <!-- Word gap spacer -->

  <!-- Letter W .-- -->
  <text x="284" y="258" font-family="'Courier New', monospace" font-size="9" fill="#64748b">W</text>
  <circle cx="284" cy="272" r="5" fill="#22d3ee" filter="url(#elem-glow)"/>
  <rect x="295" y="267" width="22" height="10" rx="5" fill="#0ea5e9" filter="url(#elem-glow)"/>
  <rect x="323" y="267" width="22" height="10" rx="5" fill="#0ea5e9" filter="url(#elem-glow)"/>

  <!-- Letter O --- -->
  <text x="356" y="258" font-family="'Courier New', monospace" font-size="9" fill="#64748b">O</text>
  <rect x="356" y="267" width="22" height="10" rx="5" fill="#0ea5e9" filter="url(#elem-glow)"/>
  <rect x="384" y="267" width="22" height="10" rx="5" fill="#0ea5e9" filter="url(#elem-glow)"/>
  <rect x="412" y="267" width="22" height="10" rx="5" fill="#0ea5e9" filter="url(#elem-glow)"/>

  <!-- Letter R .-. -->
  <text x="446" y="258" font-family="'Courier New', monospace" font-size="9" fill="#64748b">R</text>
  <circle cx="446" cy="272" r="5" fill="#22d3ee" filter="url(#elem-glow)"/>
  <rect x="457" y="267" width="22" height="10" rx="5" fill="#0ea5e9" filter="url(#elem-glow)"/>
  <circle cx="486" cy="272" r="5" fill="#22d3ee" filter="url(#elem-glow)"/>

  <!-- Letter L .-.. -->
  <text x="504" y="258" font-family="'Courier New', monospace" font-size="9" fill="#64748b">D</text>
  <rect x="504" y="267" width="22" height="10" rx="5" fill="#0ea5e9" filter="url(#elem-glow)"/>
  <circle cx="533" cy="272" r="5" fill="#22d3ee" filter="url(#elem-glow)"/>
  <circle cx="546" cy="272" r="5" fill="#22d3ee" filter="url(#elem-glow)"/>

  <!-- ─── Controls row ─────────────────────────────────────── -->
  <!-- WPM control -->
  <rect x="30" y="308" width="220" height="58" rx="6" fill="url(#panel-grad)"
    stroke="#22d3ee" stroke-width="0.8" stroke-opacity="0.3"/>
  <text x="46" y="326" font-family="'Courier New', monospace" font-size="8" fill="#64748b" letter-spacing="2">SPEED (WPM)</text>
  <text x="238" y="326" font-family="'Courier New', monospace" font-size="10" fill="#22d3ee" text-anchor="end">15</text>
  <rect x="46" y="334" width="192" height="4" rx="2" fill="#1a2540"/>
  <rect x="46" y="334" width="86" height="4" rx="2" fill="#22d3ee"/>
  <circle cx="132" cy="336" r="7" fill="#22d3ee" filter="url(#elem-glow)"/>
  <text x="46" y="358" font-family="'Courier New', monospace" font-size="8" fill="#64748b">5 WPM</text>
  <text x="238" y="358" font-family="'Courier New', monospace" font-size="8" fill="#64748b" text-anchor="end">40 WPM</text>

  <!-- Tone control -->
  <rect x="264" y="308" width="220" height="58" rx="6" fill="url(#panel-grad)"
    stroke="#22d3ee" stroke-width="0.8" stroke-opacity="0.3"/>
  <text x="280" y="326" font-family="'Courier New', monospace" font-size="8" fill="#64748b" letter-spacing="2">TONE (HZ)</text>
  <text x="472" y="326" font-family="'Courier New', monospace" font-size="10" fill="#22d3ee" text-anchor="end">700</text>
  <rect x="280" y="334" width="192" height="4" rx="2" fill="#1a2540"/>
  <rect x="280" y="334" width="110" height="4" rx="2" fill="#22d3ee"/>
  <circle cx="390" cy="336" r="7" fill="#22d3ee" filter="url(#elem-glow)"/>
  <text x="280" y="358" font-family="'Courier New', monospace" font-size="8" fill="#64748b">400 Hz</text>
  <text x="472" y="358" font-family="'Courier New', monospace" font-size="8" fill="#64748b" text-anchor="end">1000 Hz</text>

  <!-- Manual KEY button -->
  <circle cx="660" cy="336" r="40" fill="url(#panel-grad)" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.4"/>
  <circle cx="660" cy="336" r="32" fill="url(#key-grad)" filter="url(#elem-glow)"/>
  <text x="660" y="332" font-family="'Courier New', monospace" font-size="13" font-weight="700"
    fill="#0a0f1a" text-anchor="middle">KEY</text>
  <text x="660" y="346" font-family="'Courier New', monospace" font-size="8"
    fill="#0a0f1a" text-anchor="middle">■</text>
  <text x="660" y="388" font-family="'Courier New', monospace" font-size="8"
    fill="#64748b" text-anchor="middle" letter-spacing="1">Hold / Space</text>

  <!-- Transmit button -->
  <rect x="498" y="308" width="140" height="44" rx="6" fill="#22d3ee" filter="url(#elem-glow)"/>
  <text x="568" y="335" font-family="'Courier New', monospace" font-size="13" font-weight="700"
    fill="#0a0f1a" text-anchor="middle">▶ TRANSMIT</text>

  <!-- ─── Status bar ────────────────────────────────────────── -->
  <rect x="30" y="378" width="740" height="36" rx="6" fill="url(#panel-grad)"
    stroke="#22d3ee" stroke-width="0.8" stroke-opacity="0.25"/>

  <!-- Status dot (active) -->
  <circle cx="52" cy="396" r="5" fill="#22d3ee" filter="url(#elem-glow)"/>
  <text x="64" y="400" font-family="'Courier New', monospace" font-size="10"
    fill="#22d3ee" letter-spacing="2">TRANSMITTING</text>

  <text x="758" y="400" font-family="'Courier New', monospace" font-size="10"
    fill="#64748b" text-anchor="end" letter-spacing="1">12 / 200 chars</text>

  <!-- ─── Edge glow frame ─────────────────────────────────── -->
  <rect x="0" y="0" width="800" height="2" fill="url(#edge-grad)"/>
  <rect x="0" y="448" width="800" height="2" fill="url(#edge-grad)"/>

  <!-- Corner accents -->
  <rect x="0" y="0" width="2" height="40" fill="#22d3ee" opacity="0.5"/>
  <rect x="0" y="0" width="40" height="2" fill="#22d3ee" opacity="0.5"/>
  <rect x="798" y="0" width="2" height="40" fill="#22d3ee" opacity="0.5"/>
  <rect x="760" y="0" width="40" height="2" fill="#22d3ee" opacity="0.5"/>
  <rect x="0" y="410" width="2" height="40" fill="#22d3ee" opacity="0.5"/>
  <rect x="0" y="448" width="40" height="2" fill="#22d3ee" opacity="0.5"/>
  <rect x="798" y="410" width="2" height="40" fill="#22d3ee" opacity="0.5"/>
  <rect x="760" y="448" width="40" height="2" fill="#22d3ee" opacity="0.5"/>
</svg>
