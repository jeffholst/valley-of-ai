<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Pattern Pulse Memory thumbnail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#132243" />
      <stop offset="55%" stop-color="#070d1d" />
      <stop offset="100%" stop-color="#0c1630" />
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2746" />
      <stop offset="100%" stop-color="#121b32" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" />
  <path d="M0 360 Q140 330 240 360 T480 360 T800 340 L800 450 L0 450Z" fill="#0a1328" opacity="0.9" />

  <rect x="42" y="38" width="716" height="374" rx="26" fill="url(#card)" stroke="#67e8f9" stroke-opacity="0.3" filter="url(#shadow)" />
  <text x="74" y="88" font-family="Inter,Arial,sans-serif" font-size="39" font-weight="700" fill="#f6f9ff" filter="url(#glow)">Pattern Pulse Memory</text>
  <text x="76" y="118" font-family="Inter,Arial,sans-serif" font-size="18" fill="#9caecf">Round 7 • Best 12 • Streak 4</text>

  <rect x="74" y="140" width="196" height="70" rx="14" fill="#0a1730" stroke="#67e8f9" stroke-opacity="0.25" />
  <text x="96" y="182" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700" fill="#67e8f9">Watch closely…</text>

  <g transform="translate(312 138)">
    <rect width="414" height="238" rx="18" fill="#0b1428" stroke="#67e8f9" stroke-opacity="0.2" />

    <rect x="20" y="20" width="180" height="94" rx="18" fill="#0ea5e9" filter="url(#glow)" />
    <rect x="214" y="20" width="180" height="94" rx="18" fill="#8b5cf6" />
    <rect x="20" y="124" width="180" height="94" rx="18" fill="#22c55e" />
    <rect x="214" y="124" width="180" height="94" rx="18" fill="#f97316" />

    <text x="96" y="78" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800" fill="#fff">1</text>
    <text x="304" y="78" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800" fill="#fff">2</text>
    <text x="96" y="182" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800" fill="#fff">3</text>
    <text x="304" y="182" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800" fill="#fff">4</text>
  </g>

  <text x="76" y="258" font-family="Inter,Arial,sans-serif" font-size="17" fill="#9caecf">Keys: 1 2 3 4 • Touch enabled • Mid-game sequence playback</text>
  <rect x="76" y="280" width="190" height="54" rx="13" fill="#1d365f" stroke="#67e8f9" stroke-opacity="0.4" />
  <text x="96" y="315" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" fill="#f6f9ff">Replay Sequence</text>

  <circle cx="736" cy="66" r="14" fill="#22c55e" filter="url(#glow)" />
</svg>
