<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="jelly" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#fda4af"/>
      <stop offset="1" stop-color="#e11d48"/>
    </radialGradient>
    <radialGradient id="popGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a3e635" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="s"/>
      <feOffset in="s" dx="0" dy="3" result="o"/>
      <feMerge>
        <feMergeNode in="o"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="800" height="450" fill="url(#bg)"/>
  <!-- parallax speckles -->
  <g fill="#94a3b8" opacity="0.3">
    <rect x="70" y="60" width="3" height="3"/>
    <rect x="180" y="140" width="3" height="3"/>
    <rect x="90" y="300" width="3" height="3"/>
    <rect x="700" y="90" width="3" height="3"/>
    <rect x="640" y="250" width="3" height="3"/>
    <rect x="740" y="380" width="3" height="3"/>
    <rect x="320" y="70" width="3" height="3"/>
    <rect x="500" y="330" width="3" height="3"/>
  </g>

  <!-- title -->
  <text x="400" y="64" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif"
        font-size="52" font-weight="800" fill="url(#titleGrad)" filter="url(#glow)">Sling Pop</text>

  <!-- HUD: score and combo -->
  <g font-family="system-ui, 'Segoe UI', sans-serif">
    <text x="28" y="46" font-size="30" font-weight="800" fill="#f9fafb">2,840</text>
    <text x="28" y="68" font-size="14" fill="#94a3b8">best 5,120</text>
    <text x="772" y="46" text-anchor="end" font-size="26" font-weight="800" fill="#22d3ee" filter="url(#glow)">x4</text>
  </g>

  <!-- block field: rows of rounded colored blocks scrolling down -->
  <g filter="url(#shadow)">
    <!-- top row -->
    <rect x="140" y="120" width="120" height="66" rx="10" fill="#fbbf24"/>
    <rect x="270" y="120" width="120" height="66" rx="10" fill="#fbbf24"/>
    <rect x="530" y="120" width="120" height="66" rx="10" fill="#22d3ee"/>
    <!-- second row -->
    <rect x="10" y="196" width="120" height="66" rx="10" fill="#f43f5e"/>
    <rect x="270" y="196" width="120" height="66" rx="10" fill="#475569"/>
    <rect x="400" y="196" width="120" height="66" rx="10" fill="#22d3ee"/>
    <rect x="530" y="196" width="120" height="66" rx="10" fill="#22d3ee"/>
    <!-- third row: lime group mid-pop -->
    <rect x="140" y="272" width="120" height="66" rx="10" fill="#a3e635" opacity="0.55"/>
    <rect x="270" y="272" width="120" height="66" rx="10" fill="#a3e635" opacity="0.55"/>
    <rect x="660" y="272" width="120" height="66" rx="10" fill="#f43f5e"/>
    <!-- bottom row -->
    <rect x="10" y="348" width="120" height="66" rx="10" fill="#22d3ee"/>
    <rect x="400" y="348" width="120" height="66" rx="10" fill="#fbbf24"/>
    <rect x="530" y="348" width="120" height="66" rx="10" fill="#475569"/>
    <rect x="660" y="348" width="120" height="66" rx="10" fill="#a3e635"/>
  </g>
  <!-- bevel highlights on a few blocks -->
  <g fill="#ffffff" opacity="0.22">
    <rect x="140" y="120" width="120" height="22" rx="10"/>
    <rect x="530" y="196" width="120" height="22" rx="10"/>
    <rect x="660" y="272" width="120" height="22" rx="10"/>
    <rect x="400" y="348" width="120" height="22" rx="10"/>
  </g>

  <!-- pop burst over the lime group -->
  <circle cx="265" cy="305" r="90" fill="url(#popGlow)"/>
  <g fill="#a3e635" filter="url(#glow)">
    <rect x="200" y="250" width="9" height="9"/>
    <rect x="320" y="242" width="7" height="7"/>
    <rect x="360" y="290" width="8" height="8"/>
    <rect x="180" y="320" width="7" height="7"/>
    <rect x="300" y="350" width="9" height="9"/>
  </g>
  <text x="265" y="238" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="30" font-weight="800" fill="#f9fafb" filter="url(#glow)">+240</text>

  <!-- trajectory dots arcing from lower right to the popping group -->
  <g fill="#f9fafb" opacity="0.5">
    <circle cx="600" cy="360" r="5"/>
    <circle cx="560" cy="320" r="5"/>
    <circle cx="516" cy="286" r="5"/>
    <circle cx="468" cy="260" r="5"/>
    <circle cx="418" cy="244" r="5"/>
    <circle cx="368" cy="240" r="5"/>
    <circle cx="320" cy="248" r="5"/>
  </g>

  <!-- player jelly mid-flight with squash-stretch -->
  <g transform="translate(620,378)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="30" ry="36" fill="url(#jelly)"/>
    <circle cx="-10" cy="-8" r="7" fill="#ffffff"/>
    <circle cx="10" cy="-8" r="7" fill="#ffffff"/>
    <circle cx="-8" cy="-8" r="3.2" fill="#0f172a"/>
    <circle cx="12" cy="-8" r="3.2" fill="#0f172a"/>
  </g>
  <!-- rubber band aim line -->
  <line x1="620" y1="378" x2="672" y2="424" stroke="#f9fafb" stroke-width="4" opacity="0.4" stroke-linecap="round"/>

  <!-- corner accents -->
  <path d="M 0 0 L 56 0 L 0 56 Z" fill="#f43f5e" opacity="0.3"/>
  <path d="M 800 450 L 744 450 L 800 394 Z" fill="#22d3ee" opacity="0.3"/>
</svg>
