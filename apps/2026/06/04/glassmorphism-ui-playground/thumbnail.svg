<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ee9ca7" />
      <stop offset="100%" stop-color="#6dd5ed" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feOffset dx="0" dy="10" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="blur" />
      </feMerge>
    </filter>
  </defs>
  
  <rect x="0" y="0" width="800" height="450" fill="url(#bgGrad)" />
  
  <!-- Abstract Background Shapes for contrast -->
  <circle cx="200" cy="150" r="80" fill="#ffdde1" opacity="0.6" />
  <circle cx="600" cy="300" r="120" fill="#2193b0" opacity="0.4" />
  
  <!-- Glass Card -->
  <rect x="250" y="100" width="300" height="200" rx="24" fill="white" fill-opacity="0.2" stroke="white" stroke-opacity="0.4" stroke-width="2" filter="url(#shadow)" />
  
  <!-- Glass Content -->
  <text x="400" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" filter="url(#glow)">Glassmorphism</text>
  <text x="400" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="white" opacity="0.8">Interactive Playground</text>
  
  <!-- Decorative UI Elements -->
  <rect x="280" y="230" width="60" height="10" rx="5" fill="white" fill-opacity="0.4" />
  <rect x="350" y="230" width="40" height="10" rx="5" fill="white" fill-opacity="0.4" />
  <rect x="400" y="230" width="100" height="10" rx="5" fill="white" fill-opacity="0.4" />
  
  <!-- Title Label -->
  <text x="40" y="60" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#0f172a">UI Designer Tools</text>
</svg>
