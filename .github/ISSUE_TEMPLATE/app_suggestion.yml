name: App Suggestion
description: Suggest a new mini-app for AI to build
title: '[Suggestion] '
labels:
  - suggestion
  - status:pending
body:
  - type: input
    id: concept
    attributes:
      label: App Concept
      description: A short, descriptive name for the app.
      placeholder: 'e.g., Budget Tracker, Typing Speed Test'
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Games
        - Productivity
        - Utilities
        - Visualizations
        - Creative
        - Entertainment
        - Education
        - Design
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What should this app do? Describe the core experience in 1,000 characters or less.
    validations:
      required: true