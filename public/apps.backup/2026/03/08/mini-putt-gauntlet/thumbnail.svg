<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Mini Putt Gauntlet thumbnail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3f7ff" />
      <stop offset="100%" stop-color="#dbe8ff" />
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d5c36" />
      <stop offset="100%" stop-color="#0b4029" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" />

  <rect x="26" y="24" width="748" height="60" rx="16" fill="#ffffff" opacity="0.92" stroke="#14213d" stroke-opacity="0.12" />
  <text x="52" y="58" font-family="Trebuchet MS, sans-serif" font-size="28" font-weight="700" fill="#14213d">Mini Putt Gauntlet</text>
  <text x="52" y="78" font-family="Trebuchet MS, sans-serif" font-size="13" fill="#51607c">3 holes · Par 3 each · Windmill + Gate + Trap Door</text>

  <rect x="26" y="98" width="748" height="326" rx="18" fill="#ffffff" opacity="0.92" stroke="#14213d" stroke-opacity="0.12" />
  <rect x="44" y="116" width="712" height="290" rx="14" fill="url(#grass)" stroke="#d9f99d" stroke-opacity="0.5" stroke-width="2" />

  <!-- cup and flag -->
  <circle cx="674" cy="158" r="13" fill="#f5f7ff" />
  <circle cx="674" cy="158" r="5" fill="#0f172a" />
  <line x1="674" y1="114" x2="674" y2="148" stroke="#f8fafc" stroke-width="2" />
  <path d="M674 114 L700 122 L674 132 Z" fill="#f59e0b" />

  <!-- ball -->
  <circle cx="138" cy="334" r="10" fill="#f8fafc" stroke="#334155" stroke-width="2" />

  <!-- windmill -->
  <rect x="384" y="180" width="32" height="150" fill="#e2e8f0" />
  <rect x="308" y="244" width="184" height="14" fill="#f59e0b" />
  <rect x="393" y="167" width="14" height="180" fill="#ef4444" />
  <circle cx="400" cy="251" r="10" fill="#111827" />

  <!-- closing gate -->
  <rect x="520" y="158" width="8" height="190" fill="#334155" />
  <rect x="560" y="158" width="8" height="190" fill="#334155" />
  <rect x="528" y="222" width="32" height="118" fill="#f59e0b" />
  <rect x="532" y="232" width="24" height="7" fill="#0f172a" />
  <rect x="532" y="256" width="24" height="7" fill="#0f172a" />
  <rect x="532" y="280" width="24" height="7" fill="#0f172a" />

  <!-- trap door -->
  <rect x="286" y="286" width="120" height="70" fill="#111827" />
  <rect x="286" y="286" width="120" height="70" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6" />

  <!-- HUD chips -->
  <rect x="610" y="34" width="62" height="38" rx="10" fill="#ffffff" stroke="#14213d" stroke-opacity="0.15" />
  <text x="620" y="50" font-family="Trebuchet MS, sans-serif" font-size="10" fill="#51607c">HOLE</text>
  <text x="620" y="66" font-family="Trebuchet MS, sans-serif" font-size="16" font-weight="700" fill="#14213d">1 / 3</text>

  <rect x="680" y="34" width="74" height="38" rx="10" fill="#ffffff" stroke="#14213d" stroke-opacity="0.15" />
  <text x="690" y="50" font-family="Trebuchet MS, sans-serif" font-size="10" fill="#51607c">PAR</text>
  <text x="690" y="66" font-family="Trebuchet MS, sans-serif" font-size="16" font-weight="700" fill="#14213d">3</text>
</svg>
