<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB"/>
      <stop offset="100%" style="stop-color:#E0F6FF"/>
    </linearGradient>
    
    <!-- Target gradient -->
    <radialGradient id="targetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0"/>
    </radialGradient>
    
    <!-- Arrow trail -->
    <linearGradient id="trail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#888;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#888;stop-opacity:0.5"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#sky)"/>
  
  <!-- Mountains -->
  <path d="M0 220 Q50 180 100 200 Q150 160 200 190 Q250 150 300 180 Q350 140 400 170 L400 220 Z" fill="#9CB4C2"/>
  
  <!-- Ground -->
  <rect x="0" y="220" width="400" height="80" fill="#4CAF50"/>
  
  <!-- Grass tufts -->
  <g stroke="#66BB6A" stroke-width="2" fill="none">
    <path d="M10 220 L13 210"/>
    <path d="M30 220 L33 205"/>
    <path d="M55 220 L58 212"/>
    <path d="M80 220 L83 207"/>
    <path d="M110 220 L113 211"/>
    <path d="M140 220 L143 206"/>
    <path d="M170 220 L173 213"/>
    <path d="M200 220 L203 208"/>
  </g>
  
  <!-- Sun -->
  <circle cx="350" cy="50" r="25" fill="#FFE066"/>
  <g stroke="#FFE066" stroke-width="2" opacity="0.5">
    <line x1="350" y1="15" x2="350" y2="5"/>
    <line x1="350" y1="85" x2="350" y2="95"/>
    <line x1="315" y1="50" x2="305" y2="50"/>
    <line x1="385" y1="50" x2="395" y2="50"/>
    <line x1="325" y1="25" x2="318" y2="18"/>
    <line x1="375" y1="75" x2="382" y2="82"/>
    <line x1="325" y1="75" x2="318" y2="82"/>
    <line x1="375" y1="25" x2="382" y2="18"/>
  </g>
  
  <!-- Target Stand -->
  <rect x="295" y="180" width="10" height="40" fill="#5D4037"/>
  <line x1="300" y1="180" x2="270" y2="220" stroke="#5D4037" stroke-width="6"/>
  <line x1="300" y1="180" x2="330" y2="220" stroke="#5D4037" stroke-width="6"/>
  
  <!-- Target glow -->
  <circle cx="300" cy="130" r="60" fill="url(#targetGlow)"/>
  
  <!-- Target rings -->
  <circle cx="300" cy="130" r="50" fill="#fff" stroke="#333" stroke-width="1"/>
  <circle cx="300" cy="130" r="45" fill="#222" stroke="#333" stroke-width="1"/>
  <circle cx="300" cy="130" r="40" fill="#fff" stroke="#333" stroke-width="1"/>
  <circle cx="300" cy="130" r="35" fill="#222" stroke="#333" stroke-width="1"/>
  <circle cx="300" cy="130" r="30" fill="#0077B6" stroke="#333" stroke-width="1"/>
  <circle cx="300" cy="130" r="25" fill="#0077B6" stroke="#333" stroke-width="1"/>
  <circle cx="300" cy="130" r="20" fill="#DC3545" stroke="#333" stroke-width="1"/>
  <circle cx="300" cy="130" r="15" fill="#DC3545" stroke="#333" stroke-width="1"/>
  <circle cx="300" cy="130" r="10" fill="#FFD700" stroke="#333" stroke-width="1"/>
  <circle cx="300" cy="130" r="5" fill="#FFD700" stroke="#333" stroke-width="1"/>
  <circle cx="300" cy="130" r="2" fill="#000"/>
  
  <!-- Arrow stuck in bullseye -->
  <g transform="translate(300, 128) rotate(-5)">
    <line x1="-30" y1="0" x2="0" y2="0" stroke="#654321" stroke-width="3"/>
    <polygon points="-30,0 -20,-5 -20,5" fill="#e74c3c"/>
    <polygon points="-30,0 -20,5 -20,0" fill="#c0392b"/>
  </g>
  
  <!-- Flying arrow with trail -->
  <path d="M100 160 Q150 140 180 125" stroke="url(#trail)" stroke-width="3" fill="none" stroke-dasharray="5,3"/>
  
  <g transform="translate(200, 115) rotate(-20)">
    <!-- Arrow shaft -->
    <line x1="-40" y1="0" x2="15" y2="0" stroke="#654321" stroke-width="3"/>
    <!-- Arrow head -->
    <polygon points="25,0 15,-5 15,5" fill="#888"/>
    <!-- Fletching -->
    <polygon points="-40,0 -28,-6 -28,0" fill="#e74c3c"/>
    <polygon points="-40,0 -28,6 -28,0" fill="#c0392b"/>
  </g>
  
  <!-- Archer silhouette -->
  <g transform="translate(60, 160)">
    <!-- Legs -->
    <rect x="-15" y="30" width="8" height="30" fill="#444"/>
    <rect x="0" y="30" width="8" height="30" fill="#444"/>
    <!-- Body -->
    <rect x="-20" y="0" width="25" height="35" fill="#444"/>
    <!-- Head -->
    <circle cx="-7" cy="-15" r="15" fill="#DEB887"/>
    <!-- Arm with bow -->
    <rect x="5" y="5" width="45" height="8" fill="#DEB887"/>
    <!-- Bow -->
    <path d="M45 -25 Q65 10 45 45" stroke="#8B4513" stroke-width="5" fill="none"/>
    <!-- String (drawn back) -->
    <path d="M45 -25 L20 10 L45 45" stroke="#555" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Wind indicator -->
  <g transform="translate(180, 30)">
    <rect x="-30" y="-12" width="60" height="24" rx="12" fill="rgba(0,0,0,0.5)"/>
    <text x="-20" y="5" font-family="sans-serif" font-size="12" fill="white">💨</text>
    <text x="0" y="5" font-family="sans-serif" font-size="11" fill="white" font-weight="bold">3.2</text>
  </g>
  
  <!-- Score display -->
  <g transform="translate(30, 30)">
    <rect x="0" y="0" width="70" height="45" rx="8" fill="rgba(0,0,0,0.7)"/>
    <text x="10" y="18" font-family="sans-serif" font-size="10" fill="#aaa">SCORE</text>
    <text x="10" y="38" font-family="sans-serif" font-size="18" fill="#FF6B35" font-weight="bold">85</text>
  </g>
  
  <!-- Power meter -->
  <g transform="translate(15, 100)">
    <rect x="0" y="0" width="12" height="80" rx="6" fill="rgba(0,0,0,0.5)"/>
    <rect x="2" y="30" width="8" height="48" rx="4" fill="url(#powerGradient)"/>
  </g>
  
  <defs>
    <linearGradient id="powerGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#4CAF50"/>
      <stop offset="50%" style="stop-color:#FFC107"/>
      <stop offset="100%" style="stop-color:#FF5722"/>
    </linearGradient>
  </defs>
  
  <!-- +10 score popup near target -->
  <text x="280" y="95" font-family="sans-serif" font-size="20" fill="#FFD700" font-weight="bold" opacity="0.9">+10</text>
</svg>
