<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <!-- Night sky background gradient -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#020408"/>
      <stop offset="45%"  stop-color="#04061a"/>
      <stop offset="80%"  stop-color="#080620"/>
      <stop offset="100%" stop-color="#10081a"/>
    </linearGradient>
    <!-- Milky way glow -->
    <radialGradient id="mw" cx="58%" cy="38%" r="50%">
      <stop offset="0%"   stop-color="rgba(55,75,130,0.10)"/>
      <stop offset="100%" stop-color="rgba(55,75,130,0)"/>
    </radialGradient>
    <!-- Info panel surface -->
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#0c1030" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#080c28" stop-opacity="0.95"/>
    </linearGradient>
    <!-- Star glow -->
    <radialGradient id="betelglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ff8855" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff8855" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rigelglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#aac8ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#aac8ff" stop-opacity="0"/>
    </radialGradient>
    <!-- Filter for panel border glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="450" fill="url(#sky)"/>
  <rect width="800" height="450" fill="url(#mw)"/>

  <!-- Background stars (scattered) -->
  <g fill="white">
    <circle cx="42"  cy="18"  r="0.8" opacity="0.55"/>
    <circle cx="98"  cy="52"  r="1.1" opacity="0.45"/>
    <circle cx="155" cy="8"   r="0.7" opacity="0.6"/>
    <circle cx="210" cy="32"  r="1.0" opacity="0.4"/>
    <circle cx="280" cy="15"  r="0.9" opacity="0.65"/>
    <circle cx="310" cy="68"  r="0.6" opacity="0.5"/>
    <circle cx="370" cy="22"  r="1.1" opacity="0.35"/>
    <circle cx="425" cy="44"  r="0.8" opacity="0.55"/>
    <circle cx="480" cy="12"  r="0.7" opacity="0.6"/>
    <circle cx="545" cy="35"  r="1.0" opacity="0.45"/>
    <circle cx="600" cy="18"  r="0.8" opacity="0.5"/>
    <circle cx="650" cy="55"  r="0.6" opacity="0.65"/>
    <circle cx="710" cy="28"  r="1.1" opacity="0.4"/>
    <circle cx="758" cy="14"  r="0.7" opacity="0.55"/>
    <circle cx="680" cy="90"  r="0.9" opacity="0.45"/>
    <circle cx="730" cy="115" r="0.8" opacity="0.5"/>
    <circle cx="760" cy="78"  r="1.0" opacity="0.35"/>
    <circle cx="55"  cy="110" r="0.7" opacity="0.5"/>
    <circle cx="120" cy="95"  r="1.0" opacity="0.4"/>
    <circle cx="180" cy="130" r="0.8" opacity="0.55"/>
    <circle cx="250" cy="88"  r="0.6" opacity="0.6"/>
    <circle cx="340" cy="105" r="0.9" opacity="0.45"/>
    <circle cx="410" cy="118" r="0.7" opacity="0.5"/>
    <circle cx="490" cy="82"  r="1.1" opacity="0.35"/>
    <circle cx="562" cy="98"  r="0.8" opacity="0.6"/>
    <circle cx="72"  cy="175" r="0.7" opacity="0.45"/>
    <circle cx="145" cy="160" r="0.9" opacity="0.5"/>
    <circle cx="220" cy="195" r="0.6" opacity="0.55"/>
    <circle cx="300" cy="168" r="1.0" opacity="0.4"/>
    <circle cx="380" cy="185" r="0.8" opacity="0.5"/>
    <circle cx="460" cy="172" r="0.7" opacity="0.45"/>
    <circle cx="530" cy="155" r="1.1" opacity="0.35"/>
    <circle cx="32"  cy="260" r="0.8" opacity="0.5"/>
    <circle cx="110" cy="242" r="0.6" opacity="0.4"/>
    <circle cx="185" cy="275" r="0.9" opacity="0.55"/>
    <circle cx="265" cy="252" r="0.7" opacity="0.45"/>
    <circle cx="350" cy="268" r="1.0" opacity="0.35"/>
    <circle cx="435" cy="248" r="0.8" opacity="0.5"/>
    <circle cx="520" cy="262" r="0.6" opacity="0.55"/>
    <circle cx="590" cy="238" r="1.1" opacity="0.4"/>
    <circle cx="660" cy="258" r="0.7" opacity="0.5"/>
    <circle cx="740" cy="245" r="0.9" opacity="0.45"/>
    <circle cx="55"  cy="330" r="0.8" opacity="0.4"/>
    <circle cx="130" cy="342" r="0.7" opacity="0.5"/>
    <circle cx="210" cy="318" r="1.0" opacity="0.35"/>
    <circle cx="290" cy="355" r="0.6" opacity="0.55"/>
    <circle cx="718" cy="340" r="0.8" opacity="0.4"/>
    <circle cx="762" cy="320" r="0.7" opacity="0.5"/>
  </g>

  <!-- ═══════ Orion constellation (selected, highlighted) ═══════ -->
  <!-- Constellation lines (highlighted bright blue) -->
  <!-- Scale: nx*800, ny*450 -->
  <!-- Meissa (0.32,0.36) → Betelgeuse (0.28,0.44) → Mintaka (0.27,0.52) -->
  <!-- Meissa → Bellatrix (0.35,0.42) -->
  <!-- Belt: Mintaka→Alnilam→Alnitak -->
  <!-- Alnitak→Rigel, Bellatrix→Alnitak -->
  <!-- Saiph(0.28,0.64)→Mintaka; Alnitak→Rigel; Saiph→Rigel -->
  <g stroke="rgba(155,200,255,0.85)" stroke-width="1.6" fill="none" stroke-linecap="round">
    <!-- Head to shoulders -->
    <line x1="256" y1="162" x2="224" y2="198"/>  <!-- Meissa→Betelgeuse -->
    <line x1="256" y1="162" x2="280" y2="189"/>  <!-- Meissa→Bellatrix -->
    <!-- Shoulders to belt -->
    <line x1="224" y1="198" x2="216" y2="234"/>  <!-- Betelgeuse→Mintaka -->
    <line x1="280" y1="189" x2="280" y2="243"/>  <!-- Bellatrix→Alnitak -->
    <!-- Belt -->
    <line x1="216" y1="234" x2="248" y2="239"/>  <!-- Mintaka→Alnilam -->
    <line x1="248" y1="239" x2="280" y2="243"/>  <!-- Alnilam→Alnitak -->
    <!-- Feet -->
    <line x1="216" y1="234" x2="224" y2="288"/>  <!-- Mintaka→Saiph -->
    <line x1="280" y1="243" x2="296" y2="284"/>  <!-- Alnitak→Rigel -->
    <line x1="224" y1="288" x2="296" y2="284"/>  <!-- Saiph→Rigel -->
  </g>

  <!-- Star glows (selected state) -->
  <circle cx="224" cy="198" r="22" fill="url(#betelglow)"/>
  <circle cx="296" cy="284" r="20" fill="url(#rigelglow)"/>

  <!-- Orion stars -->
  <!-- Betelgeuse - orange red, brightest -->
  <circle cx="224" cy="198" r="6.5" fill="#ff8855"/>
  <!-- Bellatrix -->
  <circle cx="280" cy="189" r="4.0" fill="#c8dcff"/>
  <!-- Meissa (head) -->
  <circle cx="256" cy="162" r="2.8" fill="#c0d4ff"/>
  <!-- Mintaka (belt) -->
  <circle cx="216" cy="234" r="3.5" fill="#c0d8ff"/>
  <!-- Alnilam (belt center) -->
  <circle cx="248" cy="239" r="4.2" fill="#c8e0ff"/>
  <!-- Alnitak (belt) -->
  <circle cx="280" cy="243" r="3.8" fill="#c0d8ff"/>
  <!-- Saiph -->
  <circle cx="224" cy="288" r="3.6" fill="#c0d4ff"/>
  <!-- Rigel - bright blue-white -->
  <circle cx="296" cy="284" r="7.0" fill="#aac8ff"/>

  <!-- Label -->
  <text x="252" y="135" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="rgba(200,220,255,0.95)">Orion</text>

  <!-- ═══════ Other constellations (dimmed) ═══════ -->
  <!-- Ursa Major (Big Dipper) dim -->
  <g stroke="rgba(70,100,170,0.14)" stroke-width="0.7" fill="none">
    <polyline points="96,40 128,54 160,63 184,68 200,95 168,99 152,77"/>
  </g>
  <g fill="rgba(180,200,240,0.28)">
    <circle cx="96"  cy="40" r="2.5"/>
    <circle cx="128" cy="54" r="2.5"/>
    <circle cx="160" cy="63" r="2.5"/>
    <circle cx="184" cy="68" r="2.5"/>
    <circle cx="200" cy="95" r="2.5"/>
    <circle cx="168" cy="99" r="2.5"/>
    <circle cx="152" cy="77" r="3.0"/>
  </g>
  <text x="150" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="rgba(130,160,220,0.5)">Ursa Major</text>

  <!-- Cassiopeia dim (W shape) -->
  <g stroke="rgba(70,100,170,0.14)" stroke-width="0.7" fill="none">
    <polyline points="480,59 504,41 536,54 568,41 600,54"/>
  </g>
  <g fill="rgba(180,200,240,0.28)">
    <circle cx="480" cy="59" r="2.0"/>
    <circle cx="504" cy="41" r="2.2"/>
    <circle cx="536" cy="54" r="2.0"/>
    <circle cx="568" cy="41" r="2.6"/>
    <circle cx="600" cy="54" r="2.2"/>
  </g>
  <text x="540" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="rgba(130,160,220,0.5)">Cassiopeia</text>

  <!-- Scorpius dim (lower right) -->
  <g stroke="rgba(70,100,170,0.10)" stroke-width="0.7" fill="none">
    <polyline points="528,230 544,256 552,266 560,234 570,272 560,296 536,306 504,306"/>
  </g>
  <g fill="rgba(180,200,240,0.25)">
    <circle cx="528" cy="230" r="2.2"/>
    <circle cx="560" cy="234" r="2.0"/>
    <circle cx="544" cy="256" r="2.8" fill="rgba(200,80,50,0.35)"/><!-- Antares -->
    <circle cx="552" cy="266" r="2.0"/>
    <circle cx="570" cy="272" r="2.2"/>
    <circle cx="560" cy="296" r="2.0"/>
    <circle cx="536" cy="306" r="2.2"/>
    <circle cx="504" cy="306" r="2.0"/>
  </g>
  <text x="548" y="220" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="rgba(130,160,220,0.5)">Scorpius</text>

  <!-- Canis Major dim (lower left, with bright Sirius) -->
  <g stroke="rgba(70,100,170,0.12)" stroke-width="0.7" fill="none">
    <polyline points="248,329 216,315 264,360 232,383 288,379"/>
  </g>
  <g fill="rgba(180,200,240,0.28)">
    <circle cx="248" cy="329" r="4.5" fill="rgba(220,240,255,0.5)"/><!-- Sirius dim -->
    <circle cx="216" cy="315" r="2.2"/>
    <circle cx="264" cy="360" r="2.5"/>
    <circle cx="232" cy="383" r="3.0"/>
    <circle cx="288" cy="379" r="2.2"/>
    <circle cx="216" cy="360" r="2.0"/>
  </g>
  <text x="248" y="314" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="rgba(130,160,220,0.5)">Canis Major</text>

  <!-- Gemini dim -->
  <g stroke="rgba(70,100,170,0.12)" stroke-width="0.7" fill="none">
    <polyline points="368,126 392,135 368,198 320,198 296,194 312,162"/>
  </g>
  <g fill="rgba(180,200,240,0.28)">
    <circle cx="368" cy="126" r="2.8"/>
    <circle cx="392" cy="135" r="3.0" fill="rgba(255,200,100,0.35)"/><!-- Pollux -->
    <circle cx="368" cy="198" r="2.2"/>
    <circle cx="320" cy="198" r="2.2"/>
    <circle cx="296" cy="194" r="2.5"/>
    <circle cx="312" cy="162" r="2.0"/>
  </g>
  <text x="370" y="115" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="rgba(130,160,220,0.5)">Gemini</text>

  <!-- Shooting star (decorative) -->
  <line x1="90" y1="18" x2="168" y2="65" stroke="url(#shootgrad)" stroke-width="1.3" opacity="0.7"/>
  <defs>
    <linearGradient id="shootgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="rgba(200,220,255,0)"/>
      <stop offset="60%"  stop-color="rgba(200,220,255,0.4)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.9)"/>
    </linearGradient>
  </defs>
  <circle cx="168" cy="65" r="1.5" fill="white" opacity="0.9"/>

  <!-- ═══════ Info Panel ═══════ -->
  <rect x="384" y="55" width="220" height="342" rx="14" fill="url(#panel)" stroke="rgba(100,140,255,0.22)" stroke-width="1"/>

  <!-- Emoji -->
  <text x="404" y="100" font-size="32" font-family="system-ui,sans-serif">🏹</text>

  <!-- Name + subtitle -->
  <text x="404" y="128" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#e8eeff">Orion</text>
  <text x="404" y="146" font-family="system-ui,sans-serif" font-size="12" fill="#7888b8">The Hunter</text>

  <!-- Badges -->
  <rect x="404" y="155" width="62" height="20" rx="8" fill="rgba(96,165,250,0.12)" stroke="rgba(96,165,250,0.3)" stroke-width="0.8"/>
  <text x="435" y="169" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#60a5fa">Winter</text>

  <rect x="474" y="155" width="60" height="20" rx="8" fill="rgba(90,110,190,0.18)" stroke="rgba(90,110,190,0.3)" stroke-width="0.8"/>
  <text x="504" y="169" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#90a8e8">8 stars</text>

  <!-- Story text (abbreviated) -->
  <text x="404" y="194" font-family="system-ui,sans-serif" font-size="11" fill="#9aaac8">
    <tspan x="404" dy="0">In Greek mythology, Orion</tspan>
    <tspan x="404" dy="15">was a giant huntsman placed</tspan>
    <tspan x="404" dy="15">among the stars by Zeus. His</tspan>
    <tspan x="404" dy="15">three-star belt has guided sailors</tspan>
    <tspan x="404" dy="15">for thousands of years. The</tspan>
    <tspan x="404" dy="15">reddish Betelgeuse is a red</tspan>
    <tspan x="404" dy="15">supergiant nearing the end</tspan>
    <tspan x="404" dy="15">of its extraordinary life.</tspan>
  </text>

  <!-- Divider -->
  <line x1="404" y1="318" x2="585" y2="318" stroke="rgba(100,130,200,0.2)" stroke-width="0.8"/>

  <!-- Star list header -->
  <text x="404" y="334" font-family="system-ui,sans-serif" font-size="9" letter-spacing="1.2" fill="#7888b8">BRIGHTEST STARS</text>

  <!-- Star rows -->
  <circle cx="410" cy="350" r="4" fill="#aac8ff"/>
  <text x="422" y="354" font-family="system-ui,sans-serif" font-size="11" fill="#e8eeff">Rigel</text>
  <text x="565" y="354" text-anchor="end" font-family="monospace,sans-serif" font-size="10" fill="#7888b8">+0.1</text>

  <circle cx="410" cy="368" r="4.5" fill="#ff8855"/>
  <text x="422" y="372" font-family="system-ui,sans-serif" font-size="11" fill="#e8eeff">Betelgeuse</text>
  <text x="565" y="372" text-anchor="end" font-family="monospace,sans-serif" font-size="10" fill="#7888b8">+0.4</text>

  <circle cx="410" cy="386" r="3" fill="#c8e0ff"/>
  <text x="422" y="390" font-family="system-ui,sans-serif" font-size="11" fill="#e8eeff">Alnilam</text>
  <text x="565" y="390" text-anchor="end" font-family="monospace,sans-serif" font-size="10" fill="#7888b8">+1.7</text>

  <!-- ═══════ Bottom picker bar ═══════ -->
  <rect x="0" y="404" width="800" height="46" fill="rgba(3,5,16,0.96)"/>

  <!-- Picker items -->
  <rect x="10"  y="412" width="76" height="26" rx="13" fill="rgba(70,100,200,0.38)" stroke="rgba(112,144,255,0.7)" stroke-width="1"/>
  <text x="48"  y="429" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#e8eeff">🏹 Orion</text>

  <rect x="93"  y="412" width="95" height="26" rx="13" fill="rgba(10,15,32,0.88)" stroke="rgba(100,140,255,0.22)" stroke-width="0.8"/>
  <text x="140" y="429" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#7888b8">🐻 Ursa Major</text>

  <rect x="195" y="412" width="92" height="26" rx="13" fill="rgba(10,15,32,0.88)" stroke="rgba(100,140,255,0.22)" stroke-width="0.8"/>
  <text x="241" y="429" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#7888b8">🌟 Ursa Minor</text>

  <rect x="294" y="412" width="100" height="26" rx="13" fill="rgba(10,15,32,0.88)" stroke="rgba(100,140,255,0.22)" stroke-width="0.8"/>
  <text x="344" y="429" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#7888b8">👑 Cassiopeia</text>

  <rect x="401" y="412" width="62" height="26" rx="13" fill="rgba(10,15,32,0.88)" stroke="rgba(100,140,255,0.22)" stroke-width="0.8"/>
  <text x="432" y="429" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#7888b8">🦁 Leo</text>

  <rect x="470" y="412" width="76" height="26" rx="13" fill="rgba(10,15,32,0.88)" stroke="rgba(100,140,255,0.22)" stroke-width="0.8"/>
  <text x="508" y="429" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#7888b8">🦂 Scorpius</text>

  <rect x="553" y="412" width="72" height="26" rx="13" fill="rgba(10,15,32,0.88)" stroke="rgba(100,140,255,0.22)" stroke-width="0.8"/>
  <text x="589" y="429" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#7888b8">🦢 Cygnus</text>

  <rect x="633" y="412" width="68" height="26" rx="13" fill="rgba(10,15,32,0.88)" stroke="rgba(100,140,255,0.22)" stroke-width="0.8"/>
  <text x="667" y="429" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#7888b8">♊ Gemini</text>

  <rect x="709" y="412" width="52" height="26" rx="13" fill="rgba(10,15,32,0.88)" stroke="rgba(100,140,255,0.22)" stroke-width="0.8"/>
  <text x="735" y="429" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#7888b8">🎵 Lyra</text>
</svg>
