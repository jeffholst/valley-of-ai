  <!-- Do not hand-code the common header/footer. The shared shell injects them. -->

  <style>
    :root {
      --bg: #030508;
      --surface: rgba(10, 15, 32, 0.88);
      --surface-border: rgba(100, 140, 255, 0.22);
      --text: #e8eeff;
      --text-dim: #7888b8;
      --accent: #7090ff;
    }

    [data-theme="light"] {
      --bg: #020410;
      --surface: rgba(5, 10, 30, 0.94);
      --surface-border: rgba(120, 160, 255, 0.35);
      --text: #eef0ff;
      --text-dim: #8898cc;
      --accent: #90aeff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      height: 100svh;
      width: 100vw;
    }

    #sky-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* Controls — top right */
    #controls {
      position: fixed;
      top: 64px;
      right: 14px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ctrl-btn {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      color: var(--text-dim);
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: all 0.2s;
      user-select: none;
    }
    .ctrl-btn:hover { color: var(--text); border-color: rgba(100,150,255,0.5); }
    .ctrl-btn.active { color: var(--accent); border-color: var(--accent); background: rgba(70,100,200,0.2); }

    /* Constellation picker — bottom strip */
    #picker {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
      padding: 10px 14px 14px;
      background: linear-gradient(0deg, rgba(3,5,16,0.97) 65%, transparent);
    }

    #picker-label {
      font-size: 10px;
      letter-spacing: 1.8px;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    #picker-list {
      display: flex;
      gap: 7px;
      list-style: none;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    #picker-list::-webkit-scrollbar { display: none; }

    .picker-item {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      color: var(--text-dim);
      padding: 6px 13px;
      border-radius: 16px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
      backdrop-filter: blur(8px);
      flex-shrink: 0;
      white-space: nowrap;
    }
    .picker-item:hover { color: var(--text); border-color: rgba(100,150,255,0.4); }
    .picker-item.selected {
      background: rgba(70,100,200,0.38);
      border-color: var(--accent);
      color: var(--text);
    }

    /* Info panel — slides in from left */
    #info-panel {
      position: fixed;
      top: 64px;
      left: 14px;
      width: min(330px, calc(100vw - 28px));
      z-index: 20;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 16px;
      padding: 20px 18px 18px;
      backdrop-filter: blur(18px);
      transform: translateX(calc(-100% - 30px));
      transition: transform 0.38s cubic-bezier(0.4, 0, 0.2, 1);
      max-height: calc(100svh - 180px);
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(100,120,200,0.3) transparent;
    }
    #info-panel.open { transform: translateX(0); }

    #info-close {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(100,120,200,0.15);
      border: 1px solid var(--surface-border);
      color: var(--text-dim);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    #info-close:hover { color: var(--text); background: rgba(100,120,200,0.35); }

    #info-emoji { font-size: 30px; display: block; margin-bottom: 6px; }
    #info-name { font-size: 21px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
    #info-subtitle { font-size: 13px; color: var(--text-dim); margin-bottom: 10px; }

    #info-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .info-badge {
      padding: 3px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    #info-story { font-size: 13px; line-height: 1.72; color: #9aaac8; }

    #info-stars { margin-top: 14px; }
    #info-stars h3 {
      font-size: 10px;
      letter-spacing: 1.4px;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .star-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .star-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .star-name { font-size: 12px; color: var(--text); flex: 1; }
    .star-mag { font-size: 11px; color: var(--text-dim); font-family: monospace; }

    /* Interaction hint */
    #hint {
      position: fixed;
      bottom: 88px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(8,12,28,0.85);
      border: 1px solid var(--surface-border);
      color: var(--text-dim);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      backdrop-filter: blur(10px);
      pointer-events: none;
      white-space: nowrap;
      transition: opacity 0.6s;
      z-index: 10;
    }
    #hint.hidden { opacity: 0; }

    /* Desktop: pick list on the right side */
    @media (min-width: 768px) {
      #picker {
        top: 64px;
        bottom: auto;
        left: auto;
        right: 64px;
        width: auto;
        background: none;
        padding: 0;
      }
      #picker-list { flex-direction: column; align-items: flex-end; }
      #hint { bottom: 20px; }
    }
  </style>
</head>

      },
    ];

    // ─── State ─────────────────────────────────────────────────────────────
    let selected = null;
    let showLines = true;
    let showLabels = true;
    let frame = 0;
    let hinted = false;
    let bgStars = [];
    let shootingStar = null;
    let nextShootFrame = 300 + Math.floor(Math.random() * 300);

    // ─── Canvas ────────────────────────────────────────────────────────────
    const canvas = document.getElementById('sky-canvas');
    const ctx = canvas.getContext('2d');
    let W = 0, H = 0, DPR = 1;

    function resize() {
      DPR = window.devicePixelRatio || 1;
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width  = Math.round(W * DPR);
      canvas.height = Math.round(H * DPR);
      canvas.style.width  = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      generateBgStars();
    }

    function generateBgStars() {
      bgStars = Array.from({ length: 450 }, () => ({
        x:    Math.random(),
        y:    Math.random(),
        r:    Math.random() * 1.3 + 0.3,
        base: Math.random() * 0.5 + 0.25,
        ph:   Math.random() * Math.PI * 2,
        sp:   Math.random() * 0.018 + 0.004,
        warm: Math.random() < 0.08,
      }));
    }

    // ─── Draw helpers ──────────────────────────────────────────────────────
    function drawBackground() {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0.00, '#020408');
      g.addColorStop(0.45, '#04061a');
      g.addColorStop(0.80, '#080620');
      g.addColorStop(1.00, '#10081a');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      // Milky Way subtle glow
      const mw = ctx.createRadialGradient(W*0.58, H*0.35, 0, W*0.58, H*0.4, W*0.5);
      mw.addColorStop(0, 'rgba(55,75,130,0.07)');
      mw.addColorStop(1, 'rgba(55,75,130,0)');
      ctx.fillStyle = mw;
      ctx.fillRect(0, 0, W, H);
    }

    function drawBgStars() {
      bgStars.forEach(s => {
        const op = s.base + Math.sin(frame * s.sp + s.ph) * 0.18;
        ctx.globalAlpha = Math.max(0.05, Math.min(1, op));
        ctx.fillStyle = s.warm ? '#ffe8c0' : '#ffffff';
        ctx.beginPath();
        ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    function starR(mag) {
      return Math.max(2, Math.min(8, 4.2 - mag * 0.55));
    }

    function hexToRgb(hex) {
      const h = hex.replace('#', '');
      return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
    }

    function drawConstellations() {
      CONSTELLATIONS.forEach(c => {
        const isSel   = selected && selected.id === c.id;
        const isDimmed = selected && !isSel;

        // Lines
        if (showLines) {
          c.lines.forEach(([a, b]) => {
            const s1 = c.stars[a], s2 = c.stars[b];
            ctx.beginPath();
            ctx.moveTo(s1.nx * W, s1.ny * H);
            ctx.lineTo(s2.nx * W, s2.ny * H);
            if (isSel) {
              ctx.strokeStyle = 'rgba(160,205,255,0.85)';
              ctx.lineWidth = 1.6;
            } else if (isDimmed) {
              ctx.strokeStyle = 'rgba(70,100,170,0.14)';
              ctx.lineWidth = 0.7;
            } else {
              ctx.strokeStyle = 'rgba(100,145,225,0.36)';
              ctx.lineWidth = 1.0;
            }
            ctx.stroke();
          });
        }

        // Stars
        c.stars.forEach(s => {
          const px = s.nx * W;
          const py = s.ny * H;
          const r  = starR(s.mag);
          const op = isDimmed ? 0.28 : 1.0;
          const [ri, gi, bi] = hexToRgb(s.color);

          if (isSel) {
            const glow = ctx.createRadialGradient(px, py, 0, px, py, r * 4);
            glow.addColorStop(0, `rgba(${ri},${gi},${bi},0.55)`);
            glow.addColorStop(1, `rgba(${ri},${gi},${bi},0)`);
            ctx.beginPath();
            ctx.arc(px, py, r * 4, 0, Math.PI * 2);
            ctx.fillStyle = glow;
            ctx.fill();
          }

          ctx.beginPath();
          ctx.arc(px, py, r, 0, Math.PI * 2);
          ctx.globalAlpha = op;
          ctx.fillStyle = s.color;
          ctx.fill();
          ctx.globalAlpha = 1;
        });

        // Labels
        if (showLabels && !isDimmed) {
          const cx = c.stars.reduce((t, s) => t + s.nx, 0) / c.stars.length;
          const cy = c.stars.reduce((t, s) => t + s.ny, 0) / c.stars.length;
          ctx.textAlign = 'center';
          if (isSel) {
            ctx.font = 'bold 13px system-ui,sans-serif';
            ctx.fillStyle = 'rgba(200,220,255,0.95)';
          } else {
            ctx.font = '11px system-ui,sans-serif';
            ctx.fillStyle = 'rgba(130,160,220,0.60)';
          }
          ctx.fillText(c.name, cx * W, cy * H - 18);
        }
      });
    }

    function drawShootingStar() {
      if (!shootingStar) return;
      const { x, y, dx, dy, tail } = shootingStar;
      const tx = x - dx * tail;
      const ty = y - dy * tail;
      const g = ctx.createLinearGradient(tx, ty, x, y);
      g.addColorStop(0, 'rgba(180,210,255,0)');
      g.addColorStop(0.6, 'rgba(200,220,255,0.35)');
      g.addColorStop(1, 'rgba(255,255,255,0.9)');
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(x, y);
      ctx.strokeStyle = g;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    function updateShootingStar() {
      if (shootingStar) {
        shootingStar.x += shootingStar.dx * 9;
        shootingStar.y += shootingStar.dy * 9;
        shootingStar.life--;
        if (shootingStar.life <= 0) shootingStar = null;
      } else {
        nextShootFrame--;
        if (nextShootFrame <= 0) {
          nextShootFrame = 250 + Math.floor(Math.random() * 350);
          const ang = (Math.random() * 35 + 18) * Math.PI / 180;
          shootingStar = {
            x: Math.random() * W * 0.55,
            y: Math.random() * H * 0.30,
            dx: Math.cos(ang),
            dy: Math.sin(ang),
            tail: 90,
            life: 55,
          };
        }
      }
    }

    // ─── Render loop ───────────────────────────────────────────────────────
    function render() {
      frame++;
      ctx.clearRect(0, 0, W, H);
      drawBackground();
      drawBgStars();
      drawConstellations();
      updateShootingStar();
      drawShootingStar();
      requestAnimationFrame(render);
    }

    // ─── Hit detection ─────────────────────────────────────────────────────
    function hitTest(cx, cy) {
      const nx = cx / W;
      const ny = cy / H;
      let best = null, bestDist = Infinity;
      CONSTELLATIONS.forEach(c => {
        c.stars.forEach(s => {
          const d = Math.hypot(s.nx - nx, s.ny - ny);
          if (d < bestDist) { bestDist = d; best = c; }
        });
      });
      return bestDist < 0.055 ? best : null;
    }

    // ─── Select ────────────────────────────────────────────────────────────
    function selectConstellation(c) {
      selected = c;
      document.querySelectorAll('.picker-item').forEach(el => {
        el.classList.toggle('selected', el.dataset.id === (c ? c.id : ''));
      });

      const panel = document.getElementById('info-panel');
      if (!c) { panel.classList.remove('open'); return; }

      document.getElementById('info-emoji').textContent    = c.emoji;
      document.getElementById('info-name').textContent     = c.name;
      document.getElementById('info-subtitle').textContent = c.subtitle;
      document.getElementById('info-story').textContent    = c.story;

      document.getElementById('info-badges').innerHTML = `
        <span class="info-badge" style="background:${c.seasonColor}18;color:${c.seasonColor};border:1px solid ${c.seasonColor}40">
          ${c.season}
        </span>
        <span class="info-badge" style="background:rgba(90,110,190,0.18);color:#90a8e8;border:1px solid rgba(90,110,190,0.3)">
          ${c.stars.length} stars
        </span>
      `;

      document.getElementById('info-star-list').innerHTML = c.stars
        .slice().sort((a, b) => a.mag - b.mag).slice(0, 5)
        .map(s => `
          <div class="star-row">
            <span class="star-dot" style="background:${s.color};box-shadow:0 0 5px ${s.color}99"></span>
            <span class="star-name">${s.name}</span>
            <span class="star-mag">mag ${s.mag >= 0 ? '+' : ''}${s.mag.toFixed(1)}</span>
          </div>
        `).join('');

      panel.classList.add('open');

      if (!hinted) {
        hinted = true;
        document.getElementById('hint').classList.add('hidden');
      }
    }

    // ─── Events ────────────────────────────────────────────────────────────
    canvas.addEventListener('click', e => {
      selectConstellation(hitTest(e.clientX, e.clientY));
    });

    canvas.addEventListener('touchend', e => {
      e.preventDefault();
      const t = e.changedTouches[0];
      selectConstellation(hitTest(t.clientX, t.clientY));
    }, { passive: false });

    canvas.addEventListener('mousemove', e => {
      canvas.style.cursor = hitTest(e.clientX, e.clientY) ? 'pointer' : 'crosshair';
    });

    document.getElementById('info-close').addEventListener('click', () => selectConstellation(null));

    document.getElementById('toggle-lines').addEventListener('click', function() {
      showLines = !showLines;
      this.textContent = showLines ? 'Hide Lines' : 'Show Lines';
      this.classList.toggle('active', showLines);
      this.setAttribute('aria-pressed', showLines);
    });

    document.getElementById('toggle-labels').addEventListener('click', function() {
      showLabels = !showLabels;
      this.textContent = showLabels ? 'Hide Labels' : 'Show Labels';
      this.classList.toggle('active', showLabels);
      this.setAttribute('aria-pressed', showLabels);
    });

    window.addEventListener('resize', resize);

    // ─── Build picker ──────────────────────────────────────────────────────
    const list = document.getElementById('picker-list');
    CONSTELLATIONS.forEach(c => {
      const li = document.createElement('li');
      li.className = 'picker-item';
      li.dataset.id = c.id;
      li.textContent = `${c.emoji} ${c.name}`;
      li.setAttribute('role', 'button');
      li.setAttribute('tabindex', '0');
      li.addEventListener('click', () => selectConstellation(selected?.id === c.id ? null : c));
      li.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); li.click(); }
      });
      list.appendChild(li);
    });

    // Hide hint after 6 s
    setTimeout(() => document.getElementById('hint').classList.add('hidden'), 6000);

    // ─── Init ──────────────────────────────────────────────────────────────
    resize();
    render();
  })();
  </script>
</body>
</html>
