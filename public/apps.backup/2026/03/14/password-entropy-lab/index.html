  <style>
    :root {
      --bg:#0f172a;
      --text:#f9fafb;
      --surface:#1e293b;
      --muted:#94a3b8;
      --accent:#38bdf8;
      --good:#22c55e;
      --warn:#f59e0b;
      --bad:#ef4444;
      --ring: rgba(56,189,248,0.5);
    }
    [data-theme="light"] {
      --bg:#ffffff;
      --text:#1f2937;
      --surface:#f3f4f6;
      --muted:#6b7280;
      --accent:#0284c7;
      --good:#16a34a;
      --warn:#d97706;
      --bad:#dc2626;
      --ring: rgba(2,132,199,0.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at 10% 0%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 35%), var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    main {
      width: min(100%, 960px);
      margin: 0 auto;
      padding: 1rem 1rem 2rem;
    }
    .card {
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      border: 1px solid color-mix(in srgb, var(--muted) 20%, transparent);
      border-radius: 16px;
      padding: 1rem;
      backdrop-filter: blur(6px);
      box-shadow: 0 10px 35px rgba(0,0,0,.2);
    }
    h1 { font-size: clamp(1.35rem, 3vw, 2rem); margin: .2rem 0 .3rem; }
    p { color: var(--muted); margin-top: 0; }
    .stack { display: grid; gap: .9rem; }
    .input-row { display: grid; gap: .5rem; }
    label { font-weight: 600; font-size: .95rem; }
    input[type="password"], input[type="text"], input[type="number"], select {
      width: 100%; padding: .8rem .9rem; border-radius: 12px;
      border: 1px solid color-mix(in srgb, var(--muted) 40%, transparent);
      background: color-mix(in srgb, var(--surface) 80%, transparent);
      color: var(--text); font-size: 1rem;
    }
    input:focus, select:focus, button:focus {
      outline: 2px solid var(--ring);
      outline-offset: 1px;
    }
    .controls { display: flex; gap: .5rem; flex-wrap: wrap; }
    button {
      border: none; border-radius: 10px; padding: .65rem .85rem; cursor: pointer;
      background: var(--accent); color: #fff; font-weight: 700;
    }
    button.secondary { background: color-mix(in srgb, var(--surface) 50%, #64748b); }
    .meter {
      height: 12px; width: 100%; border-radius: 999px; overflow: hidden;
      background: color-mix(in srgb, var(--surface) 85%, #000);
      border: 1px solid color-mix(in srgb, var(--muted) 22%, transparent);
    }
    .meter-fill { height: 100%; width: 0%; transition: width .25s ease, background .25s ease; }
    .grid { display: grid; gap: .8rem; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stat {
      background: color-mix(in srgb, var(--surface) 80%, transparent);
      border-radius: 12px; padding: .75rem;
      border: 1px solid color-mix(in srgb, var(--muted) 18%, transparent);
      min-width: 0; overflow: hidden;
    }
    .stat small { color: var(--muted); display:block; }
    .stat strong { font-size: 1.15rem; display: block; overflow-wrap: anywhere; word-break: break-word; }
    .checks { list-style: none; margin: 0; padding: 0; display:grid; gap:.45rem; }
    .checks li { font-size: .95rem; }
    .ok { color: var(--good); }
    .no { color: var(--bad); }
    /* Info button */
    .info-btn {
      all: unset; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
      width: 18px; height: 18px; border-radius: 50%;
      background: color-mix(in srgb, var(--accent) 22%, transparent);
      color: var(--accent); font-size: .7rem; font-weight: 700; line-height: 1;
      border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
      transition: background .15s;
      flex-shrink: 0;
    }
    .info-btn:hover, .info-btn:focus-visible {
      background: color-mix(in srgb, var(--accent) 40%, transparent);
    }
    .stat small { display: flex; align-items: center; gap: .3rem; }
    .input-row label { display: flex; align-items: center; gap: .35rem; }

    /* Modal overlay */
    .info-overlay {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: flex-end; justify-content: center;
      background: rgba(0,0,0,.45);
      opacity: 0; visibility: hidden;
      transition: opacity .2s ease, visibility .2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .info-overlay.open { opacity: 1; visibility: visible; }

    /* Slide-up panel */
    .info-panel {
      width: 100%; max-width: 480px;
      max-height: 70vh; overflow-y: auto;
      background: var(--surface); color: var(--text);
      border-radius: 20px 20px 0 0;
      border: 1px solid color-mix(in srgb, var(--muted) 25%, transparent);
      border-bottom: none;
      box-shadow: 0 -8px 50px rgba(0,0,0,.35);
      padding: 0 1.25rem 1.5rem;
      transform: translateY(100%);
      transition: transform .28s cubic-bezier(.22,1,.36,1);
    }
    .info-overlay.open .info-panel { transform: translateY(0); }

    /* Drag handle */
    .info-handle {
      display: flex; justify-content: center; padding: .65rem 0 .3rem;
      cursor: grab; position: sticky; top: 0; background: var(--surface); z-index: 1;
    }
    .info-handle::before {
      content: ''; width: 36px; height: 4px; border-radius: 99px;
      background: color-mix(in srgb, var(--muted) 50%, transparent);
    }

    /* Close button */
    .info-close {
      all: unset; cursor: pointer; position: absolute; top: .65rem; right: 1rem;
      display: flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; border-radius: 50%;
      background: color-mix(in srgb, var(--muted) 18%, transparent);
      color: var(--muted); font-size: 1.1rem; font-weight: 700;
      transition: background .15s, color .15s;
    }
    .info-close:hover, .info-close:focus-visible {
      background: color-mix(in srgb, var(--bad) 20%, transparent); color: var(--bad);
    }

    .info-panel h4 { margin: .4rem 0 .5rem; font-size: 1.05rem; color: var(--accent); padding-right: 2rem; }
    .info-panel p { margin: 0 0 .5rem; color: var(--muted); font-size: .88rem; line-height: 1.55; }
    .info-panel .example {
      margin: .5rem 0; padding: .5rem .7rem; border-radius: 8px;
      background: color-mix(in srgb, var(--bg) 60%, transparent);
      font-family: monospace; font-size: .82rem; color: var(--text);
    }

    /* On wider screens, center as a card instead of bottom sheet */
    @media (min-width: 600px) {
      .info-overlay { align-items: center; }
      .info-panel {
        border-radius: 16px; border-bottom: 1px solid color-mix(in srgb, var(--muted) 25%, transparent);
        max-height: 60vh;
        transform: translateY(30px); opacity: 0;
        transition: transform .25s cubic-bezier(.22,1,.36,1), opacity .25s ease;
      }
      .info-overlay.open .info-panel { transform: translateY(0); opacity: 1; }
      .info-handle { display: none; }
    }

    /* Generator options */
    .gen-options {
      display: flex; flex-wrap: wrap; gap: .4rem .8rem;
      padding: .55rem .7rem; border-radius: 10px;
      background: color-mix(in srgb, var(--surface) 70%, transparent);
      border: 1px solid color-mix(in srgb, var(--muted) 15%, transparent);
    }
    .gen-options label {
      display: inline-flex; align-items: center; gap: .35rem;
      font-size: .85rem; font-weight: 500; cursor: pointer;
      user-select: none; white-space: nowrap;
    }
    .gen-options input[type="checkbox"] {
      width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer;
      border-radius: 4px; margin: 0;
    }
    .gen-options .len-group {
      display: inline-flex; align-items: center; gap: .3rem;
    }
    .gen-options .len-group input[type="number"] {
      width: 56px; padding: .3rem .4rem; font-size: .85rem;
      border-radius: 8px; text-align: center;
    }

    @media (min-width: 760px) {
      .grid.two { grid-template-columns: 1.25fr .9fr; align-items: start; }
    }
  </style>
</head>
<body>
  <!-- Info modal (single reusable panel) -->
  <div class="info-overlay" id="infoOverlay" aria-hidden="true">
    <div class="info-panel" role="dialog" aria-labelledby="infoPanelTitle">
      <div class="info-handle"></div>
      <button class="info-close" id="infoClose" aria-label="Close" type="button">✕</button>
      <div id="infoPanelBody"></div>
    </div>
  </div>

  <main>
    <section class="card stack" aria-label="Password Entropy Lab">
      <header>
        <h1>Password Entropy Lab</h1>
        <p>Test password strength with entropy estimates, rule checks, and configurable crack-rate assumptions.</p>
      </header>

      <div class="grid two">
        <div class="stack">
          <div class="input-row">
            <label for="pwd">Password
              <button class="info-btn" type="button" data-info="pwd" aria-label="What is this?">?</button>
            </label>
            <input id="pwd" type="password" autocomplete="off" placeholder="Type or generate a password" aria-describedby="strengthLabel">
          </div>
          <div class="controls">
            <button id="toggleView" class="secondary" type="button" aria-pressed="false">Show</button>
            <button id="gen" type="button">Generate</button>
            <button id="clear" class="secondary" type="button">Clear</button>
          </div>

          <div class="gen-options" aria-label="Generator options">
            <label><input type="checkbox" id="optLower" checked> a–z</label>
            <label><input type="checkbox" id="optUpper" checked> A–Z</label>
            <label><input type="checkbox" id="optNumbers" checked> 0–9</label>
            <label><input type="checkbox" id="optSymbols" checked> !@#$</label>
            <span class="len-group">
              <label for="optLen" style="font-weight:600">Length</label>
              <input type="number" id="optLen" min="4" max="128" value="16">
            </span>
          </div>

          <div class="input-row">
            <label for="rate">Attacker guesses per second
              <button class="info-btn" type="button" data-info="rate" aria-label="What is this?">?</button>
            </label>
            <input id="rate" type="number" min="1" step="1" value="1000000000">
          </div>

          <div class="input-row" id="strengthLabel">
            <label>Strength meter
              <button class="info-btn" type="button" data-info="meter" aria-label="What is this?">?</button>
            </label>
            <div class="meter" aria-hidden="true"><div id="meter" class="meter-fill"></div></div>
          </div>
        </div>

        <aside class="stack" aria-label="Password analysis">
          <div class="grid stats">
            <div class="stat">
              <small>Score <button class="info-btn" type="button" data-info="score" aria-label="What is score?">?</button></small>
              <strong id="score">0 / 100</strong>
            </div>
            <div class="stat">
              <small>Entropy <button class="info-btn" type="button" data-info="entropy" aria-label="What is entropy?">?</button></small>
              <strong id="entropy">0 bits</strong>
            </div>
            <div class="stat">
              <small>Combinations <button class="info-btn" type="button" data-info="combos" aria-label="What are combinations?">?</button></small>
              <strong id="space">0</strong>
            </div>
            <div class="stat">
              <small>Crack time <button class="info-btn" type="button" data-info="crack" aria-label="What is crack time?">?</button></small>
              <strong id="crack">Instant</strong>
            </div>
          </div>
          <ul class="checks" id="checks"></ul>
        </aside>
      </div>
    </section>
  </main>

  <script>
    const els = {
      pwd: document.getElementById('pwd'),
      rate: document.getElementById('rate'),
      score: document.getElementById('score'),
      entropy: document.getElementById('entropy'),
      space: document.getElementById('space'),
      crack: document.getElementById('crack'),
      meter: document.getElementById('meter'),
      checks: document.getElementById('checks'),
      toggle: document.getElementById('toggleView'),
      gen: document.getElementById('gen'),
      clear: document.getElementById('clear')
    };

    const checks = [
      { id: 'len12', label: 'At least 12 characters', test: p => p.length >= 12 },
      { id: 'lower', label: 'Contains lowercase', test: p => /[a-z]/.test(p) },
      { id: 'upper', label: 'Contains uppercase', test: p => /[A-Z]/.test(p) },
      { id: 'num', label: 'Contains numbers', test: p => /\d/.test(p) },
      { id: 'sym', label: 'Contains symbols', test: p => /[^A-Za-z0-9]/.test(p) },
      { id: 'repeat', label: 'No long repeats (aaa / 111)', test: p => !/(.)\1\1/.test(p) }
    ];

    function charsetSize(pwd) {
      let size = 0;
      if (/[a-z]/.test(pwd)) size += 26;
      if (/[A-Z]/.test(pwd)) size += 26;
      if (/\d/.test(pwd)) size += 10;
      if (/[^A-Za-z0-9]/.test(pwd)) size += 33;
      return size;
    }

    function formatBig(n) {
      if (!isFinite(n) || n <= 0) return '0';
      const units = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No'];
      let idx = 0;
      while (n >= 1000 && idx < units.length - 1) { n /= 1000; idx++; }
      return `${n.toFixed(n >= 100 ? 0 : n >= 10 ? 1 : 2)}${units[idx]}`;
    }

    function formatCompact(n) {
      if (n < 1e6) return n.toLocaleString();
      const tiers = [
        [1e33, 'decillion'], [1e30, 'nonillion'], [1e27, 'octillion'],
        [1e24, 'septillion'], [1e21, 'sextillion'], [1e18, 'quintillion'],
        [1e15, 'quadrillion'], [1e12, 'trillion'], [1e9, 'billion'], [1e6, 'million']
      ];
      for (const [threshold, name] of tiers) {
        if (n >= threshold) {
          const v = n / threshold;
          return `${v < 10 ? v.toFixed(1) : Math.round(v).toLocaleString()} ${name}`;
        }
      }
      return n.toLocaleString();
    }

    function formatDuration(seconds) {
      if (!isFinite(seconds) || seconds <= 1) return 'Instant';
      if (seconds > 1e33 * 31557600) return 'Forever';
      const units = [
        ['year', 31557600], ['month', 2629800], ['day', 86400], ['hour', 3600], ['minute', 60], ['second', 1]
      ];
      for (const [label, s] of units) {
        if (seconds >= s) {
          const v = Math.floor(seconds / s);
          return `${formatCompact(v)} ${label}${v === 1 ? '' : 's'}`;
        }
      }
      return 'Instant';
    }

    function classify(score) {
      if (score < 35) return {label:'Weak', color:'var(--bad)'};
      if (score < 65) return {label:'Fair', color:'var(--warn)'};
      if (score < 85) return {label:'Strong', color:'var(--accent)'};
      return {label:'Excellent', color:'var(--good)'};
    }

    function analyze() {
      const pwd = els.pwd.value;
      const rate = Math.max(1, Number(els.rate.value || 1));
      const size = charsetSize(pwd);
      const entropyBits = pwd.length && size ? pwd.length * Math.log2(size) : 0;
      const combinations = entropyBits ? Math.pow(2, entropyBits) : 0;
      const crackSeconds = combinations / rate;

      const bonus = checks.reduce((acc, c) => acc + (c.test(pwd) ? 8 : 0), 0);
      const score = Math.max(0, Math.min(100, Math.round((entropyBits * 1.2) + bonus - (pwd.length < 8 ? 25 : 0))));
      const grade = classify(score);

      els.score.textContent = `${score} / 100 (${grade.label})`;
      els.entropy.textContent = `${entropyBits.toFixed(1)} bits`;
      els.space.textContent = formatBig(combinations);
      els.crack.textContent = formatDuration(crackSeconds);
      els.meter.style.width = `${score}%`;
      els.meter.style.background = grade.color;

      els.checks.innerHTML = checks.map(c => {
        const pass = c.test(pwd);
        return `<li class="${pass ? 'ok' : 'no'}">${pass ? '✓' : '✗'} ${c.label}</li>`;
      }).join('');
    }

    function genPassword() {
      const useLower   = document.getElementById('optLower').checked;
      const useUpper   = document.getElementById('optUpper').checked;
      const useNumbers = document.getElementById('optNumbers').checked;
      const useSymbols = document.getElementById('optSymbols').checked;
      const length     = Math.max(4, Math.min(128, Number(document.getElementById('optLen').value) || 16));

      let pool = '';
      if (useLower)   pool += 'abcdefghijkmnopqrstuvwxyz';
      if (useUpper)   pool += 'ABCDEFGHJKLMNPQRSTUVWXYZ';
      if (useNumbers) pool += '23456789';
      if (useSymbols) pool += '!@#$%^&*()-_=+[]{};:,.?';

      if (!pool) { pool = 'abcdefghijkmnopqrstuvwxyz'; }

      // Build password, then guarantee at least one char from each selected set
      const arr = new Uint32Array(length);
      crypto.getRandomValues(arr);
      let out = Array.from(arr, v => pool[v % pool.length]).join('');

      // Ensure representation from each selected charset
      const required = [];
      if (useLower)   required.push('abcdefghijkmnopqrstuvwxyz');
      if (useUpper)   required.push('ABCDEFGHJKLMNPQRSTUVWXYZ');
      if (useNumbers) required.push('23456789');
      if (useSymbols) required.push('!@#$%^&*()-_=+[]{};:,.?');
      const rnd = new Uint32Array(required.length);
      crypto.getRandomValues(rnd);
      required.forEach((charset, i) => {
        const pos = rnd[i] % length;
        const cArr = new Uint32Array(1);
        crypto.getRandomValues(cArr);
        out = out.substring(0, pos) + charset[cArr[0] % charset.length] + out.substring(pos + 1);
      });

      els.pwd.value = out;
      analyze();
    }

    els.pwd.addEventListener('input', analyze);
    els.rate.addEventListener('input', analyze);
    els.gen.addEventListener('click', genPassword);
    els.clear.addEventListener('click', () => { els.pwd.value=''; analyze(); els.pwd.focus(); });
    els.toggle.addEventListener('click', () => {
      const show = els.pwd.type === 'password';
      els.pwd.type = show ? 'text' : 'password';
      els.toggle.textContent = show ? 'Hide' : 'Show';
      els.toggle.setAttribute('aria-pressed', String(show));
    });

    analyze();

    // ── Info panel (fly-in modal) ─────────────────────────────────
    const infoContent = {
      pwd: {
        title: 'Password Input',
        body: '<p>Type any password to instantly see how strong it is. <strong>Nothing is sent to a server</strong> — all analysis happens right here in your browser.</p><p>Try different lengths and character types to see how the metrics change.</p>'
      },
      rate: {
        title: 'Attack Rate (guesses/sec)',
        body: '<p>This controls how fast we assume an attacker can try passwords. The default of 1 billion per second models a powerful GPU rig.</p><p>Increase it to simulate a distributed cluster; decrease it for a weaker attacker.</p><div class="example">1B/s = high-end GPU&emsp;|&emsp;10B/s = distributed cluster<br>1M/s = online throttled attack</div>'
      },
      meter: {
        title: 'Strength Meter',
        body: '<p>A visual summary combining entropy, length, and character diversity into a <strong>0–100 score</strong>.</p><p><span style="color:var(--bad)">\u25CF Weak</span> &lt; 35 &emsp; <span style="color:var(--warn)">\u25CF Fair</span> 35–64 &emsp; <span style="color:var(--accent)">\u25CF Strong</span> 65–84 &emsp; <span style="color:var(--good)">\u25CF Excellent</span> 85+</p>'
      },
      score: {
        title: 'Score (0–100)',
        body: '<p>An overall rating combining entropy bits, character variety, and length. Passing more rule checks and using longer passwords with mixed character types raises the score.</p>'
      },
      entropy: {
        title: 'Entropy (bits)',
        body: '<p><strong>Entropy</strong> measures the unpredictability of your password. It answers: “How many yes/no questions would an attacker need to guess it?”</p><div class="example">E = L × log₂(C)</div><p><strong>L</strong> = password length, <strong>C</strong> = size of the character set used (e.g. 26 for lowercase-only, 95 for all printable ASCII).</p><p>Each additional bit <em>doubles</em> the number of possible passwords. Think of it like a combination lock — more bits = exponentially more combinations to try.</p><p><strong>Targets:</strong> 40 bits is the minimum for casual use. <strong>60+ bits</strong> is solid. <strong>80+ bits</strong> is excellent and will resist even well-funded attackers for decades.</p>'
      },
      combos: {
        title: 'Keyspace (Combinations)',
        body: '<p>The total number of possible passwords given your character set and length. Calculated as 2<sup>entropy</sup>.</p><p>A larger keyspace means an attacker must search through vastly more possibilities to find your password.</p><div class="example"><strong>Abbreviations used:</strong><br>K = thousand · M = million · B = billion<br>T = trillion · Qa = quadrillion · Qi = quintillion<br>Sx = sextillion · Sp = septillion · Oc = octillion · No = nonillion</div>'
      },
      crack: {
        title: 'Estimated Crack Time',
        body: '<p>How long a brute-force attack would take at your configured guess rate, assuming the attacker tries every possible combination.</p><p>This is a <em>worst-case average</em> (keyspace ÷ guesses per second). Real attacks may use dictionaries or pattern lists, which can be faster — so treat this as an upper bound.</p><div class="example"><strong>Scale used:</strong><br>million (10⁶) · billion (10⁹) · trillion (10¹²)<br>quadrillion (10¹⁵) · quintillion (10¹⁸) · sextillion (10²¹)<br>septillion (10²⁴) · octillion (10²⁷) · nonillion (10³⁰) · decillion (10³³)<br>Beyond decillion → "Forever"</div>'
      }
    };

    const overlay = document.getElementById('infoOverlay');
    const panelBody = document.getElementById('infoPanelBody');
    const closeBtn = document.getElementById('infoClose');

    function openInfo(key) {
      const data = infoContent[key];
      if (!data) return;
      panelBody.innerHTML = `<h4 id="infoPanelTitle">${data.title}</h4>${data.body}`;
      overlay.classList.add('open');
      overlay.setAttribute('aria-hidden', 'false');
      closeBtn.focus();
    }

    function closeInfo() {
      overlay.classList.remove('open');
      overlay.setAttribute('aria-hidden', 'true');
    }

    document.querySelectorAll('.info-btn[data-info]').forEach(btn => {
      btn.addEventListener('click', e => { e.stopPropagation(); openInfo(btn.dataset.info); });
    });

    closeBtn.addEventListener('click', closeInfo);
    overlay.addEventListener('click', e => { if (e.target === overlay) closeInfo(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeInfo(); });
  </script>
</body>
</html>
